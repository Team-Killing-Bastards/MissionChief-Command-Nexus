name: Publish and verify v1.0.52

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: publish-v1.0.52-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'release/publish-v1052'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Create or verify clean v1.0.52 tag
        env:
          CLEAN_SHA: 09b7bbd4502430c9458dbae42751c741dbcc9385
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          VERSION="$(git show "${CLEAN_SHA}:src/missionchief-command-nexus.user.js" | sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' | head -n1 | xargs)"
          test "$VERSION" = '1.0.52'
          test -z "$(git ls-tree -r --name-only "$CLEAN_SHA" | grep -E '^\.github/workflows/(publish-v1052-once|inspect-auto-patient|build-auto-patient)' || true)"
          if git show-ref --tags --verify --quiet refs/tags/v1.0.52; then
            test "$(git rev-list -n1 v1.0.52)" = "$CLEAN_SHA"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a v1.0.52 "$CLEAN_SHA" -m 'MissionChief Command Nexus 1.0.52'
            git push origin refs/tags/v1.0.52
          fi
      - name: Dispatch permanent publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow create-release.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run create-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=publish-release \
            -f release_tag=v1.0.52 \
            -f release_notes='Restore Auto Mode patient transport clicking for current exact vehicle/patient destination anchors.'
          RUN_ID=''
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow create-release.yml --limit 5 --json databaseId,event,status --jq "map(select(.event == \"workflow_dispatch\" and .databaseId != ${BEFORE})) | .[0].databaseId // empty")"
            test -n "$RUN_ID" && break
            sleep 2
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Verify release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0.52 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,url --jq 'select(.isDraft == false and .isPrerelease == false) | .url'
          gh release view v1.0.52 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'MissionChief-Command-Nexus-1.0.52.user.js'
          gh release view v1.0.52 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'MissionChief-Command-Nexus-1.0.52.user.js.sha256'
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "v1.0.52 publication workflow completed with status: ${JOB_STATUS}."
