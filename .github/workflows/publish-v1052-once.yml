name: Publish and verify v1.0.52

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-v1.0.52-once
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 194 &&
      contains(github.event.comment.body, '/publish-v1052')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve clean immutable release source
        env:
          CLEAN_SHA: 09b7bbd4502430c9458dbae42751c741dbcc9385
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          test "$(git rev-list -n1 v1.0.52)" = "$CLEAN_SHA"
          rm -rf release-source
          git worktree add --force --detach release-source v1.0.52
          test "$(cd release-source && node scripts/validate-userscript.mjs --print-version)" = '1.0.52'
          test -z "$(git -C release-source ls-tree -r --name-only HEAD | grep -E '^\.github/workflows/(publish-v1052-once|inspect-auto-patient|build-auto-patient)' || true)"
      - name: Validate tagged repository
        run: |
          set -euo pipefail
          cd release-source
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-auto-patient-transport-anchor.mjs
          python3 scripts/check_repository.py
      - name: Build release assets and notes
        shell: bash
        run: |
          set -euo pipefail
          ASSET='MissionChief-Command-Nexus-1.0.52.user.js'
          cp release-source/src/missionchief-command-nexus.user.js "$ASSET"
          sha256sum "$ASSET" > "${ASSET}.sha256"
          python3 - <<'PY'
          import re
          from pathlib import Path
          changelog=Path('release-source/CHANGELOG.md').read_text(encoding='utf-8')
          match=re.search(r'^## \[1\.0\.52\].*?$(.*?)(?=^## |\Z)',changelog,re.M|re.S)
          if not match: raise SystemExit('Missing v1.0.52 changelog section')
          checksum=Path('MissionChief-Command-Nexus-1.0.52.user.js.sha256').read_text().split()[0]
          Path('release-notes.md').write_text('## Mission Brief\n\n'+match.group(1).strip()+'\n\n## Build Verification\n\n- Source commit: `09b7bbd4502430c9458dbae42751c741dbcc9385`\n- SHA-256: `'+checksum+'`\n',encoding='utf-8')
          PY
      - name: Reconcile and publish GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-release.mjs \
            --tag v1.0.52 \
            --target 09b7bbd4502430c9458dbae42751c741dbcc9385 \
            --title 'MissionChief Command Nexus 1.0.52' \
            --notes release-notes.md \
            --asset MissionChief-Command-Nexus-1.0.52.user.js \
            --asset MissionChief-Command-Nexus-1.0.52.user.js.sha256
      - name: Independently verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-check && mkdir release-check
          gh release view v1.0.52 --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false) | .url'
          gh release download v1.0.52 --repo "$GITHUB_REPOSITORY" \
            --pattern 'MissionChief-Command-Nexus-1.0.52.user.js' \
            --pattern 'MissionChief-Command-Nexus-1.0.52.user.js.sha256' \
            --dir release-check --clobber
          cmp --silent MissionChief-Command-Nexus-1.0.52.user.js release-check/MissionChief-Command-Nexus-1.0.52.user.js
          cmp --silent MissionChief-Command-Nexus-1.0.52.user.js.sha256 release-check/MissionChief-Command-Nexus-1.0.52.user.js.sha256
          cd release-check && sha256sum -c MissionChief-Command-Nexus-1.0.52.user.js.sha256
      - name: Verify deployment and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          GREASYFORK_PAGE_URL: ${{ vars.GREASYFORK_PAGE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: v1.0.52
          RELEASE_SHA: 09b7bbd4502430c9458dbae42751c741dbcc9385
          SOURCE_PATH: release-source/src/missionchief-command-nexus.user.js
          CHANGELOG_PATH: release-source/CHANGELOG.md
          PRODUCT_NAME: MissionChief Command Nexus
        run: node scripts/release-notify.mjs
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: gh pr comment 194 --repo "$GITHUB_REPOSITORY" --body "v1.0.52 direct publication completed with status: ${JOB_STATUS}."
