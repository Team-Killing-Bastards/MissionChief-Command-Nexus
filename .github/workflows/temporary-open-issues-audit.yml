name: Temporary open issues source audit

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: temporary-open-issues-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    name: Export exact current source
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-open-issues-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out issue-fix branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false

      - name: Package exact source and validation files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/open-issues-audit/src
          mkdir -p /tmp/open-issues-audit/scripts
          mkdir -p /tmp/open-issues-audit/.github/workflows
          cp src/missionchief-command-nexus.user.js /tmp/open-issues-audit/src/
          cp src/README.md /tmp/open-issues-audit/src/
          cp README.md CHANGELOG.md /tmp/open-issues-audit/
          find scripts -maxdepth 1 -type f \( -name '*.mjs' -o -name '*.py' \) -exec cp {} /tmp/open-issues-audit/scripts/ \;
          cp .github/workflows/validate-userscript.yml /tmp/open-issues-audit/.github/workflows/
          head -n 20 src/missionchief-command-nexus.user.js > /tmp/open-issues-audit/source-metadata.txt

      - name: Upload current source audit
        uses: actions/upload-artifact@v4
        with:
          name: open-issues-current-source-audit
          path: /tmp/open-issues-audit
          if-no-files-found: error
          retention-days: 2
