name: Temporary open issues source audit

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: temporary-open-issues-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    name: Export exact current source and focused contexts
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-open-issues-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out issue-fix branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false

      - name: Build focused source report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/open-issues-audit/src
          mkdir -p /tmp/open-issues-audit/scripts
          mkdir -p /tmp/open-issues-audit/.github/workflows
          cp src/missionchief-command-nexus.user.js /tmp/open-issues-audit/src/
          cp README.md CHANGELOG.md src/README.md /tmp/open-issues-audit/
          cp scripts/*.mjs scripts/*.py /tmp/open-issues-audit/scripts/ 2>/dev/null || true
          cp .github/workflows/validate-userscript.yml /tmp/open-issues-audit/.github/workflows/

          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/missionchief-command-nexus.user.js')
          lines = source_path.read_text(encoding='utf-8').splitlines()
          terms = [
              r'PSU', r'Public Support Unit', r'Police Support Unit',
              r'CRV', r'Control Van', r'Search Advisor', r'SARTEC',
              r'Missing Vehicles', r'data-requirement-type',
              r'Police Officers', r'getPoliceOfficerVehicleRequirement',
              r'Critical Care', r'HEMS', r'Air Ambulance',
              r'personnel.*registry', r'registry.*vehicle',
              r'zuweisung', r'Remove binding', r'btn-assigned',
          ]
          regex = re.compile('|'.join(f'(?:{term})' for term in terms), re.I)
          matched = []
          for index, line in enumerate(lines, start=1):
              if regex.search(line):
                  matched.append(index)

          intervals = []
          for line_no in matched:
              start = max(1, line_no - 30)
              end = min(len(lines), line_no + 45)
              if intervals and start <= intervals[-1][1] + 5:
                  intervals[-1] = (intervals[-1][0], max(intervals[-1][1], end))
              else:
                  intervals.append((start, end))

          report = []
          report.append(f'Current source lines: {len(lines)}')
          report.append(f'Matched lines: {len(matched)}')
          report.append(f'Context blocks: {len(intervals)}')
          report.append('')
          for block_no, (start, end) in enumerate(intervals, start=1):
              report.append(f'===== BLOCK {block_no}: lines {start}-{end} =====')
              for number in range(start, end + 1):
                  report.append(f'{number:05d}: {lines[number - 1]}')
              report.append('')

          Path('/tmp/open-issues-audit/focused-contexts.txt').write_text(
              '\n'.join(report) + '\n', encoding='utf-8'
          )
          Path('/tmp/open-issues-audit/source-metadata.txt').write_text(
              '\n'.join(lines[:20]) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload current source audit
        uses: actions/upload-artifact@v4
        with:
          name: open-issues-current-source-audit
          path: /tmp/open-issues-audit
          if-no-files-found: error
          retention-days: 2
