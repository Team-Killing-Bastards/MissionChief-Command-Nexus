name: Temporary dispatch v1.0.3 release

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/trigger-publish-v1.0.3'
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch canonical release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f operation=publish-release \
            -f release_tag=v1.0.3
