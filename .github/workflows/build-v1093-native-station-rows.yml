name: Build v1.0.93 native Dispatch Centre candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and validate v1.0.93
    if: >-
      github.event.pull_request.head.ref == 'fix/dispatch-centre-native-station-rows-v1093' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/dispatch-centre-native-station-rows-v1093
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "5ddcdc2df0dc94c689bf2b94c88cc767a78fc359"

          python3 scripts/build-v1093-native-station-rows.py
          rm -f scripts/build-v1093-native-station-rows.py

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running $check"
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use native station rows for Dispatch Centres in v1.0.93'
          git push origin HEAD:fix/dispatch-centre-native-station-rows-v1093
