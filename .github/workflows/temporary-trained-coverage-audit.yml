name: Temporary trained coverage audit

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  audit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/trained-coverage-optimizer'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Print trained-selection source map
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          print('METADATA')
          for pattern in (r'^// @version.*$', r'^ \* MODULE 2: MISSION FINDER.*$'):
              match = re.search(pattern, source, re.MULTILINE)
              print(match.group(0) if match else f'MISSING {pattern}')

          print('\nFUNCTION MAP')
          for match in re.finditer(r'^    (?:async )?function ([A-Za-z0-9_$]+)\s*\(', source, re.MULTILINE):
              name = match.group(1)
              if re.search(r'(train|public|police|registry|requirement|vehicle|shortfall|dispatch)', name, re.I):
                  line = source.count('\n', 0, match.start()) + 1
                  print(f'{line}: {name}')

          print('\nKEY LINES')
          for index, line in enumerate(source.splitlines(), 1):
              if re.search(r'PSU|Public Order|level_1_public_order|level_2_public_order|police_sergeant|trained_personnel|trainingCounts|eligibleVehicleTypeIds|vehicleCapacity', line, re.I):
                  print(f'{index}: {line}')
          PY

      - name: Print selected trained-selection functions
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')

          def extract(name):
              pattern = re.compile(rf'^    (?P<async>async )?function {re.escape(name)}\s*\(', re.MULTILINE)
              match = pattern.search(source)
              if not match:
                  print(f'\n===== {name}: NOT FOUND =====')
                  return
              brace = source.find('{', match.end())
              if brace < 0:
                  print(f'\n===== {name}: NO BRACE =====')
                  return
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                  elif block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 1
                  elif quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch == '/' and nxt == '/':
                          line_comment = True
                          i += 1
                      elif ch == '/' and nxt == '*':
                          block_comment = True
                          i += 1
                      elif ch in ('\"', "'", '`'):
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              start_line = source.count('\n', 0, match.start()) + 1
                              print(f'\n===== {name} @ {start_line} =====')
                              print(source[match.start():end])
                              return
                  i += 1
              print(f'\n===== {name}: UNTERMINATED =====')

          names = [
              'normalisePublicOrderTrainedRequirements',
              'prepareTrainedPersonnelRegistryForRows',
              'isStrictLiveVerifiedTrainingEntry',
              'getMissionTrainingCombinationKey',
              'getAllMatchingVehicleCheckboxes',
              'getMatchingVehicleCheckboxes',
              'clickRequiredVehicles',
              'selectRequiredVehicles',
              'processRequirementRows',
              'verifySelectedTrainedPersonnelRequirements',
              'getRegistryEntryForMissionCheckbox',
              'readPersonnelTrainingRegistry',
              'getVehicleCapacityForRequirement',
              'logMissingRequirements'
          ]
          for name in names:
              extract(name)
          PY
