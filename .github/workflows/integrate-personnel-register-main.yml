name: Integrate Personnel Register into Command Nexus

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-personnel-register-main.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: integrate-personnel-register-main
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/integrate-personnel-register-main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: agent/integrate-personnel-register-main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply canonical integration when pending
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .diagnostics/apply_personnel_register_integration.py ]]; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python3 .diagnostics/apply_personnel_register_integration.py
          python3 .diagnostics/update_v1036_contract_versions.py
          rm -f src/personnel-register-tools.user.js
          rm -f .github/workflows/apply-personnel-register-integration.yml
          rm -f .github/workflows/integrate-personnel-register-main.yml
          rm -f .diagnostics/apply_personnel_register_integration.py
          rm -f .diagnostics/update_v1036_contract_versions.py
          rm -f .diagnostics/personnel-register-integration.txt
          rm -f .diagnostics/personnel-register-integration-trigger.txt
          echo 'changed=true' >> "${GITHUB_OUTPUT}"

      - name: Validate JavaScript syntax
        run: node --check src/missionchief-command-nexus.user.js

      - name: Validate userscript metadata
        run: node scripts/validate-userscript.mjs

      - name: Validate repository integrity
        run: python3 scripts/check_repository.py

      - name: Validate iOS compatibility
        run: node scripts/check-ios-compatibility.mjs

      - name: Validate runtime hardening
        run: node scripts/check-runtime-hardening.mjs

      - name: Validate Police IRV fallback
        run: node scripts/check-police-irv-fallback.mjs

      - name: Validate iOS Unit Finder selection
        run: node scripts/check-ios-unit-finder-selection.mjs

      - name: Validate iOS mission requirements
        run: node scripts/check-ios-mission-requirements-source.mjs

      - name: Validate iPhone Mission UI
        run: node scripts/check-iphone-mission-ui.mjs

      - name: Validate open issue contracts
        run: node scripts/check-open-issues-batch.mjs

      - name: Validate missing-requirements priority
        run: node scripts/check-missing-requirements-priority.mjs

      - name: Validate Personnel Register integration
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/personnel-register-tools.user.js
          grep -Fq 'id="mc-personnel-export-register"' src/missionchief-command-nexus.user.js
          grep -Fq 'id="mc-personnel-import-register"' src/missionchief-command-nexus.user.js
          git diff --check

      - name: Commit integrated source to branch
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Personnel Register controls into Command Nexus'
          git push origin HEAD:agent/integrate-personnel-register-main
