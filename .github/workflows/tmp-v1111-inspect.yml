name: Temporary v1.1.11 source export

on:
  push:
    branches:
      - release/v1.1.11-sharing-sync
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: v1111-source-export
          path: src/missionchief-command-nexus.user.js
          retention-days: 1
