name: Temporary v1.1.11 working-tree export

on:
  push:
    branches:
      - release/v1.1.11-sharing-sync
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: v1111-working-tree-export
          path: |
            src/missionchief-command-nexus.user.js
            scripts
            README.md
            CHANGELOG.md
            docs
          retention-days: 1
