name: Publish Command Nexus v1.0.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-triggers/v1.0.2'

permissions:
  contents: write

concurrency:
  group: publish-command-nexus-v1.0.2
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and verify v1.0.2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve and create release tag
        id: release_context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main --tags
          git checkout --detach origin/main

          SCRIPT_VERSION="$(
            node scripts/validate-userscript.mjs --print-version
          )"
          RELEASE_TAG="v${SCRIPT_VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"

          if [[ "${SCRIPT_VERSION}" != "1.0.2" ]]; then
            echo "Expected userscript version 1.0.2, found ${SCRIPT_VERSION}."
            exit 1
          fi

          if [[ "${RELEASE_TAG}" != "v1.0.2" ]]; then
            echo "Resolved unexpected release tag ${RELEASE_TAG}."
            exit 1
          fi

          if ! git merge-base --is-ancestor \
            "${RELEASE_SHA}" origin/main; then
            echo "Release commit ${RELEASE_SHA} is not contained in main."
            exit 1
          fi

          if git show-ref --tags --verify --quiet \
            "refs/tags/${RELEASE_TAG}"; then

            TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"

            if [[ "${TAG_SHA}" != "${RELEASE_SHA}" ]]; then
              echo "Existing tag ${RELEASE_TAG} points to ${TAG_SHA}."
              echo "Current main is ${RELEASE_SHA}; refusing to move the tag."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" \
              -m "MissionChief Command Nexus ${SCRIPT_VERSION}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          echo "RELEASE_SHA=${RELEASE_SHA}" >> "${GITHUB_ENV}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Release context"
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Version: \`${SCRIPT_VERSION}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate repository and userscript
        run: |
          python3 scripts/check_repository.py
          node --check src/missionchief-command-nexus.user.js
          node --check scripts/prepare-release.mjs
          node --check scripts/release-notify.mjs
          node scripts/validate-userscript.mjs
          git diff --check

      - name: Confirm release configuration
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          GREASYFORK_PAGE_URL: ${{ vars.GREASYFORK_PAGE_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "Missing DISCORD_RELEASE_WEBHOOK repository secret."
            exit 1
          fi

          if [[ -z "${GREASYFORK_INSTALL_URL}" ]]; then
            echo "Missing GREASYFORK_INSTALL_URL repository variable."
            exit 1
          fi

          if [[ -z "${GREASYFORK_PAGE_URL}" ]]; then
            echo "Missing GREASYFORK_PAGE_URL repository variable."
            exit 1
          fi

      - name: Prepare release assets and notes
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_VERSION="$(
            node scripts/validate-userscript.mjs --print-version
          )"
          ASSET="MissionChief-Command-Nexus-${SCRIPT_VERSION}.user.js"

          cp src/missionchief-command-nexus.user.js "${ASSET}"
          sha256sum "${ASSET}" > "${ASSET}.sha256"

          python3 - \
            "${SCRIPT_VERSION}" \
            "${RELEASE_SHA}" \
            "${ASSET}.sha256" <<'PY'
          import re
          import sys
          from pathlib import Path

          version, commit_sha, checksum_path = sys.argv[1:]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")

          heading = re.search(
              rf"^## \[{re.escape(version)}\](?:\s+-.*)?\s*$",
              changelog,
              re.MULTILINE,
          )
          if not heading:
              raise SystemExit(
                  f"CHANGELOG.md has no release section for {version}"
              )

          remaining = changelog[heading.end():]
          next_heading = re.search(r"^##\s+", remaining, re.MULTILINE)
          section = (
              remaining[:next_heading.start()]
              if next_heading
              else remaining
          ).strip()
          if not section:
              raise SystemExit(
                  f"CHANGELOG.md release section for {version} is empty"
              )

          checksum = Path(checksum_path).read_text(
              encoding="utf-8"
          ).split()[0]

          notes = (
              f"## Mission Brief\n\n{section}\n\n"
              f"## Build Verification\n\n"
              f"- Source commit: `{commit_sha}`\n"
              f"- SHA-256: `{checksum}`\n"
          )

          Path("release-notes.md").write_text(
              notes,
              encoding="utf-8",
          )
          PY

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_VERSION="$(
            node scripts/validate-userscript.mjs --print-version
          )"
          ASSET="MissionChief-Command-Nexus-${SCRIPT_VERSION}.user.js"
          TITLE="MissionChief Command Nexus ${SCRIPT_VERSION}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "${ASSET}" \
              "${ASSET}.sha256" \
              --clobber

            gh release edit "${RELEASE_TAG}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "${RELEASE_TAG}" \
              "${ASSET}" \
              "${ASSET}.sha256" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Verify published GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_VERSION="$(
            node scripts/validate-userscript.mjs --print-version
          )"
          ASSET="MissionChief-Command-Nexus-${SCRIPT_VERSION}.user.js"
          mkdir -p release-check

          gh release view "${RELEASE_TAG}" \
            --json url \
            --jq '.url'

          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${ASSET}.sha256" \
            --dir release-check \
            --clobber

          cmp --silent "${ASSET}" "release-check/${ASSET}"
          cmp --silent \
            "${ASSET}.sha256" \
            "release-check/${ASSET}.sha256"

      - name: Verify deployment and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          GREASYFORK_PAGE_URL: ${{ vars.GREASYFORK_PAGE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_context.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.release_context.outputs.release_sha }}
          SOURCE_PATH: src/missionchief-command-nexus.user.js
          CHANGELOG_PATH: CHANGELOG.md
          PRODUCT_NAME: MissionChief Command Nexus
        run: |
          node scripts/release-notify.mjs
