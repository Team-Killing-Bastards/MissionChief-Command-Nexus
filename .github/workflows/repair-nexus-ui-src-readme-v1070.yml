name: Repair Nexus UI source README newline V1.0.70

on:
  push:
    branches:
      - feature/nexus-ui-system-v1070
    paths:
      - '.github/workflows/repair-nexus-ui-src-readme-v1070.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/nexus-ui-system-v1070
      - name: Normalise generated source README EOF
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/nexus-ui-v1070-patch.py')
          text = path.read_text(encoding='utf-8')
          old = '''if '### Nexus visual system' not in src_readme:
              src_readme = src_readme.rstrip() + source_note + '\\n'
          src_readme_path.write_text(src_readme, encoding='utf-8', newline='\\n')'''
          new = '''if '### Nexus visual system' not in src_readme:
              src_readme = (
                  src_readme.rstrip()
                  + source_note.rstrip()
                  + '\\n'
              )
          else:
              src_readme = src_readme.rstrip() + '\\n'
          src_readme_path.write_text(src_readme, encoding='utf-8', newline='\\n')'''
          if text.count(old) != 1:
              raise SystemExit('Unable to find generated source README EOF block')
          path.write_text(
              text.replace(old, new, 1),
              encoding='utf-8',
              newline='\n',
          )
          PY
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-nexus-ui-src-readme-v1070.yml
          git add .github/nexus-ui-v1070-patch.py
          git commit -m 'Normalise Nexus UI source README EOF'
          git push origin HEAD:feature/nexus-ui-system-v1070
