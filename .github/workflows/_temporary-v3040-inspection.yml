name: Temporary v3.0.40 transport-clearance inspection

on:
  push:
    branches:
      - fix/v3040-role-aware-wake-recovery

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip v3040 clearance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact transport clearance functions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')

          def span(name, start_at=0):
              start = source.find(f'function {name}(', start_at)
              if start < 0: return None
              paren = source.find('(', start)
              pdepth = 0; quote = ''; escaped = False; i = paren
              while i < len(source):
                  c = source[i]
                  if quote:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == quote: quote = ''
                      i += 1; continue
                  if c in ("'", '"', '`'): quote = c; i += 1; continue
                  if c == '(': pdepth += 1
                  elif c == ')':
                      pdepth -= 1
                      if pdepth == 0: i += 1; break
                  i += 1
              brace = source.find('{', i)
              depth = 0; quote = ''; escaped = False; line_comment = False; block_comment = False; i = brace
              while i < len(source):
                  c = source[i]; n = source[i+1] if i+1 < len(source) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == quote: quote = ''
                      i += 1; continue
                  if c == '/' and n == '/': line_comment = True; i += 2; continue
                  if c == '/' and n == '*': block_comment = True; i += 2; continue
                  if c in ("'", '"', '`'): quote = c; i += 1; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return start, i + 1
                  i += 1
              return None

          names = [
              'refreshRadioTransportRequests',
              'schedulePostTransportRehook',
              'transportServiceRequest',
              'recordTransportService',
              'maybeHandleTransportServiceTimeout',
              'restoreAfterResolvedRadioTransportWarning',
          ]
          for name in names:
              result = span(name)
              text = 'NOT FOUND\n' if not result else source[result[0]:result[1]]
              Path(f'.tmp-v3040-clearance-{name}.txt').write_text(text, encoding='utf-8')
          PY

      - name: Commit transport clearance extracts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-v3040-clearance-*.txt
          git commit -m "Add v3.0.40 transport clearance extracts [skip v3040 clearance]"
          git push origin HEAD:fix/v3040-role-aware-wake-recovery
