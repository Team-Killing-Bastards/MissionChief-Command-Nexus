name: Temporary v3.0.40 wake-recovery build

on:
  push:
    branches:
      - fix/v3040-role-aware-wake-recovery

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v3.0.40 candidate
        shell: bash
        run: |
          python3 scripts/_temporary-build-v3040-wake-recovery.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-v3-active-bootstrap-recovery.mjs')
          text = path.read_text(encoding='utf-8')
          marker = "    log: () => {},\n    pausePipelineController: () => {},\n    compactControllerEphemeralMemory: () => {},"
          replacement = "    log: () => {},\n    pausePipelineController: () => {},\n    clearSharedV2QueueGuard: () => true,\n    clearSharedV2AutoRunning: () => {},\n    compactControllerEphemeralMemory: () => {},"
          if marker not in text:
              raise SystemExit('Active-bootstrap harness insertion marker not found.')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          path = Path('scripts/check-v3-transport-context-recovery.mjs')
          text = path.read_text(encoding='utf-8')
          old = "const wakeRecovery = extractFunction('recoverFromSuspendedTimerGap');\nfor (const token of [\n  'removeWorker(false)',\n  'state.radioRequestFirstSeenAt = new Map()',\n  'state.transportServiceDeferredUntil = new Map()',\n  \"startTransportOnlyWorker(preferredRequest, 'wake-recovery-oldest-personal-transport')\",\n]) assert.ok(wakeRecovery.includes(token), `sleep recovery lost ${token}`);\nassert.ok(\n  wakeRecovery.indexOf('removeWorker(false)') < wakeRecovery.indexOf('window.setTimeout'),\n  'wake recovery must end stale Worker A before scheduling replacement work'\n);"
          new = "const wakeRecovery = extractFunction('recoverFromSuspendedTimerGap');\nfor (const token of [\n  'removeWorker(false)',\n  'refreshRadioTransportRequests(true)',\n  \"state.workerRole === 'TRANSPORT_B'\",\n  \"returnToTopMissionAfterTransport('wake-recovery-request-cleared'\",\n  \"'wake-recovery-exact-transport-b'\",\n  \"'wake-recovery-oldest-personal-transport'\",\n]) assert.ok(wakeRecovery.includes(token), `sleep recovery lost ${token}`);\nassert.doesNotMatch(wakeRecovery, /radioRequestFirstSeenAt\\s*=\\s*new Map\\(/,\n  'wake recovery must preserve oldest-first Radio timing');\nassert.doesNotMatch(wakeRecovery, /transportServiceDeferredUntil\\s*=\\s*new Map\\(/,\n  'wake recovery must preserve bounded transport retry cooldowns');"
          if old not in text:
              raise SystemExit('Transport-context wake-recovery assertion block not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make wake recovery role-aware and harden Worker A admission"
          git push origin HEAD:fix/v3040-role-aware-wake-recovery
