name: Temporary v3.0.40 wake-recovery inspection

on:
  push:
    branches:
      - fix/v3040-role-aware-wake-recovery

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip v3040 inspection]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact lifecycle functions and contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/missionchief-command-nexus.user.js')
          source = source_path.read_text(encoding='utf-8')
          lines = source.splitlines()

          def span(name, start_at=0):
              marker = f'function {name}('
              start = source.find(marker, start_at)
              if start < 0:
                  return None
              brace = source.find('{', start)
              depth = 0
              quote = ''
              escaped = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == quote: quote = ''
                      i += 1; continue
                  if c == '/' and n == '/': line_comment = True; i += 2; continue
                  if c == '/' and n == '*': block_comment = True; i += 2; continue
                  if c in ("'", '"', '`'): quote = c; i += 1; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return start, i + 1
                  i += 1
              return None

          names = [
              'recoverFromSuspendedTimerGap',
              'startControllerHeartbeat',
              'startSleepGapWatcher',
              'watchForSuspendedTimerGap',
              'returnToTopMissionAfterTransport',
              'startTransportOnlyWorker',
              'redirectWorkerToTransportService',
              'clearTransportServiceState',
              'clearSharedV2AutoRunning',
              'clearSharedV2QueueGuard',
              'resetAutoStartTracking',
              'removeWorker',
              'createWorker',
              'onWorkerLoad',
              'watchWorker',
              'currentWorkerAutoConfirmed',
              'ensureActiveWorkerStorageOwnership',
              'setFrameOwnership',
              'installActiveOwnershipBootstrap',
              'shouldKeepMissionFinderObserverForCurrentFrame',
              'startMissionFinderObserver',
              'isMfV3ManagedActiveFrame',
              'isMfV3ManagedActiveWorker',
              'isMfV3ManagedTransportWorker',
              'claimCurrentMissionExecutionOwnership',
              'reconcileMissionFinderFrameRuntime',
          ]
          mission_module = source.find('MODULE 2: MISSION FINDER')
          out = []
          for name in names:
              candidates = []
              for start_at in (0, mission_module if mission_module > 0 else 0):
                  result = span(name, start_at)
                  if result and result not in candidates:
                      candidates.append(result)
              out.append(f'===== {name} =====')
              if not candidates:
                  out.append('NOT FOUND')
              else:
                  for index, (start, end) in enumerate(candidates, 1):
                      line_no = source.count('\n', 0, start) + 1
                      out.append(f'--- occurrence {index}, line {line_no} ---')
                      out.append(source[start:end])
              out.append('')
          Path('.tmp-v3040-functions.txt').write_text('\n'.join(out), encoding='utf-8')

          terms = [
              'SLEEP_GAP',
              'WAKE',
              'suspended timer',
              'sleepGap',
              'wakeRecovery',
              'mission-observer-managed-active-owner',
              'mission-observer-inactive-owner',
              'managed-active-owner',
              'inactive-owner',
              'transport-worker-b-complete',
              'service-cleared',
              'TRANSPORT_RETURN',
              'activeOwnershipBootstrap',
          ]
          ranges = []
          for number, line in enumerate(lines, 1):
              if any(term.lower() in line.lower() for term in terms):
                  ranges.append((max(1, number - 20), min(len(lines), number + 45)))
          merged = []
          for start, end in ranges:
              if merged and start <= merged[-1][1] + 3:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], end))
              else:
                  merged.append((start, end))
          contexts = []
          for index, (start, end) in enumerate(merged[:160], 1):
              contexts.append(f'===== context-{index} [{start}-{end}] =====')
              contexts.extend(f'{i:06d}: {lines[i - 1]}' for i in range(start, end + 1))
              contexts.append('')
          Path('.tmp-v3040-contexts.txt').write_text('\n'.join(contexts), encoding='utf-8')

          decl = re.compile(r'^\s*(?:async\s+)?function\s+([A-Za-z0-9_$]+)|^\s*(?:const|let|var)\s+([A-Za-z0-9_$]+)\s*=')
          keywords = ('sleep', 'wake', 'timer', 'worker', 'owner', 'transport', 'heartbeat', 'suspend', 'resume', 'bootstrap')
          declarations = []
          for number, line in enumerate(lines, 1):
              match = decl.search(line)
              if not match:
                  continue
              name = next((g for g in match.groups() if g), '')
              if name and any(k in name.lower() for k in keywords):
                  declarations.append(f'{number:06d}: {line}')
          Path('.tmp-v3040-declarations.txt').write_text('\n'.join(declarations) + '\n', encoding='utf-8')
          PY

      - name: Commit inspection maps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-v3040-*.txt
          git commit -m "Add v3.0.40 lifecycle source maps [skip v3040 inspection]"
          git push origin HEAD:fix/v3040-role-aware-wake-recovery
