name: Temporary v3.0.40 wake-recovery build

on:
  push:
    branches:
      - fix/v3040-role-aware-wake-recovery

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v3.0.40 candidate
        shell: bash
        run: |
          python3 scripts/_temporary-build-v3040-wake-recovery.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-v3-active-bootstrap-recovery.mjs')
          text = path.read_text(encoding='utf-8')
          marker = """    log: () => {},
    pausePipelineController: () => {},
    compactControllerEphemeralMemory: () => {},"""
          replacement = """    log: () => {},
    pausePipelineController: () => {},
    clearSharedV2QueueGuard: () => true,
    clearSharedV2AutoRunning: () => {},
    compactControllerEphemeralMemory: () => {},"""
          if marker not in text:
              raise SystemExit('Active-bootstrap harness insertion marker not found.')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make wake recovery role-aware and harden Worker A admission"
          git push origin HEAD:fix/v3040-role-aware-wake-recovery
