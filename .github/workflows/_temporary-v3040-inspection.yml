name: Temporary v3.0.40 exact wake-recovery inspection

on:
  push:
    branches:
      - fix/v3040-role-aware-wake-recovery

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip v3040 exact]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract small exact functions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')

          def span(name, start_at=0):
              start = source.find(f'function {name}(', start_at)
              if start < 0:
                  return None
              brace = source.find('{', start)
              depth = 0
              quote = ''
              escaped = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == quote: quote = ''
                      i += 1; continue
                  if c == '/' and n == '/': line_comment = True; i += 2; continue
                  if c == '/' and n == '*': block_comment = True; i += 2; continue
                  if c in ("'", '"', '`'): quote = c; i += 1; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return start, i + 1
                  i += 1
              return None

          mission = source.find('MODULE 2: MISSION FINDER')
          names = [
              'sleepRecoveryMissionUrl',
              'checkForSuspendedTimerGap',
              'recoverFromSuspendedTimerGap',
              'returnToTopMissionAfterTransport',
              'clearSharedV2QueueGuard',
              'readSharedV2QueueGuardState',
              'ensureActiveWorkerOwnership',
              'installMissionFinderFrameRuntimeReconciliation',
              'suspendMissionFinderRuntimeForInactiveFrame',
              'shouldKeepMissionFinderObserverForCurrentFrame',
              'startMissionFinderObserver',
              'reconcileMissionFinderFrameRuntime',
              'clearAllTransportAutomationFlags',
          ]
          for name in names:
              candidates = []
              for start_at in (0, mission if mission > 0 else 0):
                  result = span(name, start_at)
                  if result and result not in candidates:
                      candidates.append(result)
              text = []
              for index, (start, end) in enumerate(candidates, 1):
                  text.append(f'// occurrence {index}; source line {source.count(chr(10), 0, start) + 1}')
                  text.append(source[start:end])
              Path(f'.tmp-v3040-{name}.txt').write_text('\n\n'.join(text) if text else 'NOT FOUND\n', encoding='utf-8')

          start = max(0, source.find('const SLEEP_GAP_RECOVERY_THRESHOLD_MS') - 1000)
          end = source.find('const SLEEP_GAP_HISTORY_LIMIT', start)
          end = min(len(source), end + 500)
          Path('.tmp-v3040-sleep-constants.txt').write_text(source[start:end], encoding='utf-8')

          terms = [
              'checkForSuspendedTimerGap(',
              'recoverFromSuspendedTimerGap(',
              'mission-observer-managed-active-owner',
              'mission-observer-inactive-owner',
              'clearSharedV2QueueGuard(',
          ]
          lines = source.splitlines()
          out = []
          for number, line in enumerate(lines, 1):
              if any(term in line for term in terms):
                  start_line = max(1, number - 8)
                  end_line = min(len(lines), number + 18)
                  out.append(f'===== line {number} [{start_line}-{end_line}] =====')
                  out.extend(f'{i:06d}: {lines[i - 1]}' for i in range(start_line, end_line + 1))
                  out.append('')
          Path('.tmp-v3040-call-sites.txt').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit exact files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-v3040-*.txt
          git commit -m "Add exact v3.0.40 function extracts [skip v3040 exact]"
          git push origin HEAD:fix/v3040-role-aware-wake-recovery
