name: Repair Nexus UI README anchor V1.0.70

on:
  push:
    branches:
      - feature/nexus-ui-system-v1070
    paths:
      - '.github/workflows/repair-nexus-ui-readme-anchor-v1070.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/nexus-ui-system-v1070
      - name: Remove stale optional README terminology replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/nexus-ui-v1070-patch.py')
          text = path.read_text(encoding='utf-8')
          start_token = '''readme = replace_once(
              readme,
              'MissionChief Nexus dashboard',
              'MissionChief Nexus adaptive command surface',
              'README dashboard terminology',
          )'''
          if text.count(start_token) != 1:
              raise SystemExit('Unable to find stale README terminology replacement')
          text = text.replace(start_token, '', 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-nexus-ui-readme-anchor-v1070.yml
          git add .github/nexus-ui-v1070-patch.py
          git commit -m 'Remove stale Nexus UI README terminology anchor'
          git push origin HEAD:feature/nexus-ui-system-v1070
