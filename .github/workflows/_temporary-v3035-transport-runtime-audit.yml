name: Temporary v3.0.35 transport-only runtime correction

on:
  push:
    branches:
      - feature/v3035-worker-b-transport

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build corrected Worker B runtime
        run: python3 scripts/_temporary-v3035-transport-runtime-patch.py

      - name: Validate exact corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean corrected candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enable transport-only runtime in Worker B"
          git push origin HEAD:feature/v3035-worker-b-transport
