name: Validate extension candidates
on:
  pull_request:
    paths: ['extension-candidates/**', 'docs/extension-changelog.md', '.github/workflows/extension-candidates.yml']
  push:
    branches: [main]
    paths: ['extension-candidates/**', 'docs/extension-changelog.md', '.github/workflows/extension-candidates.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact source bytes and package
        run: python extension-candidates/3.0.43.205/package.py
      - name: Check JavaScript and changelog targets
        run: node extension-candidates/3.0.43.205/validate.mjs
      - name: Test update notification state and tab races
        run: node extension-candidates/3.0.43.205/check-update-notes.mjs
        env:
          NEXUS_SKIP_BROWSER: '1'
      - name: Verify Nexus 206 exact source and package
        run: python extension-candidates/3.0.43.206/package.py
      - name: Validate Nexus 206 source and changelog
        run: node extension-candidates/3.0.43.206/validate.mjs
      - name: Check priority, memory lifecycle and vehicle claims
        run: |
          node extension-candidates/3.0.43.206/check-upgrade-priority.mjs
          node extension-candidates/3.0.43.206/check-memory.mjs
          node extension-candidates/3.0.43.206/check-vehicle-claims.mjs
      - name: Install browser fixture dependencies
        run: npm install --prefix browser-extension --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install fixture browser
        working-directory: browser-extension
        run: npx playwright install --with-deps chromium
      - name: Verify background alliance queue and Settings toggle
        run: node extension-candidates/3.0.43.206/check-alliance-auto.mjs
      - name: Verify durable dispatch checkpoint failures
        run: node extension-candidates/3.0.43.206/check-alliance-storage-failure.mjs
      - name: Verify Nexus 206 update notice
        run: node extension-candidates/3.0.43.206/check-update-notes.mjs
      - name: Verify Nexus 207 package, manifest, changelog and checkpoint isolation
        run: |
          python extension-candidates/3.0.43.207/package.py
          node extension-candidates/3.0.43.207/validate.mjs
          node extension-candidates/3.0.43.207/check-upgrade-audit.mjs
      - name: Verify building upgrades and update notice
        run: |
          node extension-candidates/3.0.43.207/check-building-upgrades.mjs
          node extension-candidates/3.0.43.207/check-update-notes.mjs
      - name: Preserve Nexus 206 behavior in 207
        env:
          NEXUS_CANDIDATE_ROOT: extension-candidates/3.0.43.207/extension
        run: |
          node extension-candidates/3.0.43.206/check-upgrade-priority.mjs
          node extension-candidates/3.0.43.206/check-memory.mjs
          node extension-candidates/3.0.43.206/check-vehicle-claims.mjs
          node extension-candidates/3.0.43.206/check-alliance-auto.mjs
          node extension-candidates/3.0.43.206/check-alliance-storage-failure.mjs
      - name: Verify Nexus 208 package, manifest and upgrade checkpoint isolation
        run: |
          python extension-candidates/3.0.43.208/package.py
          node extension-candidates/3.0.43.208/validate.mjs
          node extension-candidates/3.0.43.208/check-upgrade-audit.mjs
      - name: Verify native level quotes, scan failures, bulk review and update notice
        run: |
          node extension-candidates/3.0.43.208/check-building-upgrades.mjs
          node extension-candidates/3.0.43.208/check-update-notes.mjs
      - name: Preserve Auto Mode and Alliance Auto behavior in 208
        env:
          NEXUS_CANDIDATE_ROOT: extension-candidates/3.0.43.208/extension
        run: |
          node extension-candidates/3.0.43.206/check-upgrade-priority.mjs
          node extension-candidates/3.0.43.206/check-memory.mjs
          node extension-candidates/3.0.43.206/check-vehicle-claims.mjs
          node extension-candidates/3.0.43.206/check-alliance-auto.mjs
          node extension-candidates/3.0.43.206/check-alliance-storage-failure.mjs
      - name: Verify Nexus 209 package, manifest and upgrade checkpoint isolation
        run: |
          python extension-candidates/3.0.43.209/package.py
          node extension-candidates/3.0.43.209/validate.mjs
          node extension-candidates/3.0.43.209/check-upgrade-audit.mjs
      - name: Verify changing specialisation prices, budgets, safe resumption and update notice
        run: |
          node extension-candidates/3.0.43.209/check-building-upgrades.mjs
          node extension-candidates/3.0.43.209/check-update-notes.mjs
      - name: Preserve Auto Mode and Alliance Auto behavior in 209
        env:
          NEXUS_CANDIDATE_ROOT: extension-candidates/3.0.43.209/extension
        run: |
          node extension-candidates/3.0.43.206/check-upgrade-priority.mjs
          node extension-candidates/3.0.43.206/check-memory.mjs
          node extension-candidates/3.0.43.206/check-vehicle-claims.mjs
          node extension-candidates/3.0.43.206/check-alliance-auto.mjs
          node extension-candidates/3.0.43.206/check-alliance-storage-failure.mjs
      - name: Verify Nexus 210 package, manifest and upgrade checkpoint isolation
        run: |
          python extension-candidates/3.0.43.210/package.py
          node extension-candidates/3.0.43.210/validate.mjs
          node extension-candidates/3.0.43.210/check-upgrade-audit.mjs
      - name: Verify purchase results, unrelated page warnings and update notice
        run: |
          node extension-candidates/3.0.43.210/check-building-upgrades.mjs
          node extension-candidates/3.0.43.210/check-update-notes.mjs
      - name: Preserve Auto Mode and Alliance Auto behavior in 210
        env:
          NEXUS_CANDIDATE_ROOT: extension-candidates/3.0.43.210/extension
        run: |
          node extension-candidates/3.0.43.206/check-upgrade-priority.mjs
          node extension-candidates/3.0.43.206/check-memory.mjs
          node extension-candidates/3.0.43.206/check-vehicle-claims.mjs
          node extension-candidates/3.0.43.206/check-alliance-auto.mjs
          node extension-candidates/3.0.43.206/check-alliance-storage-failure.mjs
      - name: Verify Nexus 211 package, manifest and upgrade checkpoint isolation
        run: |
          python extension-candidates/3.0.43.211/package.py
          node extension-candidates/3.0.43.211/validate.mjs
          node extension-candidates/3.0.43.211/check-upgrade-audit.mjs
      - name: Verify choose-first scan selection and update notice
        run: |
          node extension-candidates/3.0.43.211/check-building-upgrades.mjs
          node extension-candidates/3.0.43.211/check-update-notes.mjs
      - name: Preserve Auto Mode and Alliance Auto behavior in 211
        env:
          NEXUS_CANDIDATE_ROOT: extension-candidates/3.0.43.211/extension
        run: |
          node extension-candidates/3.0.43.206/check-upgrade-priority.mjs
          node extension-candidates/3.0.43.206/check-memory.mjs
          node extension-candidates/3.0.43.206/check-vehicle-claims.mjs
          node extension-candidates/3.0.43.206/check-alliance-auto.mjs
          node extension-candidates/3.0.43.206/check-alliance-storage-failure.mjs
      - name: Verify Nexus 212 package, manifest and Any vehicle ready-state correction
        run: |
          python extension-candidates/3.0.43.212/package.py
          node extension-candidates/3.0.43.212/validate.mjs
          node extension-candidates/3.0.43.212/check-any-vehicle.mjs
          node extension-candidates/3.0.43.212/check-update-notes.mjs
          node extension-candidates/3.0.43.212/check-upgrade-audit.mjs
      - name: Preserve Auto Mode and Alliance Auto behavior in 212
        env:
          NEXUS_CANDIDATE_ROOT: extension-candidates/3.0.43.212/extension
        run: |
          node extension-candidates/3.0.43.206/check-upgrade-priority.mjs
          node extension-candidates/3.0.43.206/check-memory.mjs
          node extension-candidates/3.0.43.206/check-vehicle-claims.mjs
          node extension-candidates/3.0.43.206/check-alliance-auto.mjs
          node extension-candidates/3.0.43.206/check-alliance-storage-failure.mjs
      - name: Verify Nexus 213 patient mission recovery
        run: |
          python extension-candidates/3.0.43.213/package.py
          node extension-candidates/3.0.43.213/validate.mjs
          node extension-candidates/3.0.43.213/check-patient-tail.mjs
          node extension-candidates/3.0.43.213/check-any-vehicle.mjs
          node extension-candidates/3.0.43.213/check-update-notes.mjs
          node extension-candidates/3.0.43.213/check-upgrade-audit.mjs
      - name: Preserve personal and Alliance behavior in 213
        env:
          NEXUS_CANDIDATE_ROOT: extension-candidates/3.0.43.213/extension
        run: |
          node extension-candidates/3.0.43.206/check-upgrade-priority.mjs
          node extension-candidates/3.0.43.206/check-memory.mjs
          node extension-candidates/3.0.43.206/check-vehicle-claims.mjs
          node extension-candidates/3.0.43.206/check-alliance-auto.mjs
          node extension-candidates/3.0.43.206/check-alliance-storage-failure.mjs
      - name: Verify Nexus 214 immediate patient transport handoff
        run: |
          python extension-candidates/3.0.43.214/package.py
          node extension-candidates/3.0.43.214/validate.mjs
          node extension-candidates/3.0.43.214/check-startup-handoff.mjs
          node extension-candidates/3.0.43.214/check-patient-tail.mjs
          node extension-candidates/3.0.43.214/check-any-vehicle.mjs
          node extension-candidates/3.0.43.214/check-update-notes.mjs
          node extension-candidates/3.0.43.214/check-upgrade-audit.mjs
      - name: Preserve personal and Alliance behavior in 214
        env:
          NEXUS_CANDIDATE_ROOT: extension-candidates/3.0.43.214/extension
        run: |
          node extension-candidates/3.0.43.206/check-upgrade-priority.mjs
          node extension-candidates/3.0.43.206/check-memory.mjs
          node extension-candidates/3.0.43.206/check-vehicle-claims.mjs
          node extension-candidates/3.0.43.206/check-alliance-auto.mjs
          node extension-candidates/3.0.43.206/check-alliance-storage-failure.mjs
