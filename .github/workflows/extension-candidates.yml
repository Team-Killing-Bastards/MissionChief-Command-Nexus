name: Validate extension candidates
on:
  pull_request:
    paths: ['extension-candidates/**', 'docs/extension-changelog.md', '.github/workflows/extension-candidates.yml']
  push:
    branches: [main]
    paths: ['extension-candidates/**', 'docs/extension-changelog.md', '.github/workflows/extension-candidates.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify exact source bytes and package
        run: python extension-candidates/3.0.43.205/package.py
      - name: Check JavaScript and changelog targets
        run: node extension-candidates/3.0.43.205/validate.mjs
      - name: Test update notification state and tab races
        run: node extension-candidates/3.0.43.205/check-update-notes.mjs
        env:
          NEXUS_SKIP_BROWSER: '1'
      - name: Verify Nexus 206 exact source and package
        run: python extension-candidates/3.0.43.206/package.py
      - name: Validate Nexus 206 source and changelog
        run: node extension-candidates/3.0.43.206/validate.mjs
      - name: Check priority, memory lifecycle and vehicle claims
        run: |
          node extension-candidates/3.0.43.206/check-upgrade-priority.mjs
          node extension-candidates/3.0.43.206/check-memory.mjs
          node extension-candidates/3.0.43.206/check-vehicle-claims.mjs
      - name: Install browser fixture dependencies
        run: npm install --prefix browser-extension --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install fixture browser
        working-directory: browser-extension
        run: npx playwright install --with-deps chromium
      - name: Verify background alliance queue and Settings toggle
        run: node extension-candidates/3.0.43.206/check-alliance-auto.mjs
      - name: Verify durable dispatch checkpoint failures
        run: node extension-candidates/3.0.43.206/check-alliance-storage-failure.mjs
      - name: Verify Nexus 206 update notice
        run: node extension-candidates/3.0.43.206/check-update-notes.mjs
