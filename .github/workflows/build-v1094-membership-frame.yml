name: Build v1.0.94 Dispatch Centre membership candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and validate v1.0.94
    if: >-
      github.event.pull_request.head.ref == 'fix/dispatch-centre-membership-frame-scope-v1094' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/dispatch-centre-membership-frame-scope-v1094
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/build-v1094-membership-frame.py ]]; then
            echo 'Candidate already built; no one-use builder remains.'
            exit 0
          fi

          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "61cbc2ba25aa3dc75a0599371327eca6ca24e9b2"

          # The GitHub Actions token may not update workflow definitions. Build and
          # validate production code here; the permanent regression workflow entry is
          # added separately through the repository connector after this push.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-v1094-membership-frame.py')
          text = path.read_text(encoding='utf-8')
          marker = "\nworkflow_path = ROOT / '.github/workflows/validate-userscript.yml'\n"
          if marker not in text:
              raise SystemExit('Unable to isolate workflow registration from builder')
          text = text.split(marker, 1)[0] + "\nprint('Built Command Nexus 1.0.94 frame-scoped Dispatch Centre membership candidate.')\n"
          path.write_text(text, encoding='utf-8')
          PY

          python3 scripts/build-v1094-membership-frame.py
          rm -f scripts/build-v1094-membership-frame.py

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-naming-dispatch-centre-membership-frame-v1094.mjs
          for check in scripts/check-*.mjs; do
            echo "Running $check"
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix frame-scoped Dispatch Centre membership in v1.0.94'
          git push origin HEAD:fix/dispatch-centre-membership-frame-scope-v1094
