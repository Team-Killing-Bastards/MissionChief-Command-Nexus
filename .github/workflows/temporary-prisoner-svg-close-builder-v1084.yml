name: Trusted prisoner SVG close builder v1.0.84

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.release/prisoner-svg-close-v1084.trigger'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trusted-prisoner-svg-close-v1084
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.pull_request.number == 257 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/prisoner-svg-close-v1084'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build, validate and push clean candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -uo pipefail
          BUILD_LOG="$(mktemp)"

          (
            set -euo pipefail
            python3 scripts/temporary-build-prisoner-svg-close-v1084.py

            git rm -f --ignore-unmatch \
              .release/prisoner-svg-close-v1084.trigger \
              .github/workflows/temporary-prisoner-svg-close-v1084.yml \
              .github/workflows/temporary-prisoner-svg-close-v1084-run2.yml \
              .github/workflows/temporary-debug-prisoner-svg-v1084.yml \
              scripts/temporary-build-prisoner-svg-close-v1084.mjs \
              scripts/temporary-build-prisoner-svg-close-v1084.py \
              diagnostics/prisoner-close-current.txt \
              diagnostics/prisoner-svg-builder-result.log \
              diagnostics/branch-create-request.txt

            node --check src/missionchief-command-nexus.user.js
            node scripts/validate-userscript.mjs
            for check in scripts/check-*.mjs; do
              node "$check"
            done
            python3 scripts/check_repository.py
            git diff --check

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Fix prisoner result SVG close control'
            git push --force-with-lease origin "HEAD:refs/heads/${HEAD_BRANCH}"
          ) >"${BUILD_LOG}" 2>&1
          STATUS=$?

          if [[ "${STATUS}" -ne 0 ]]; then
            {
              echo 'The trusted v1.0.84 prisoner SVG close builder stopped before changing the PR head.'
              echo
              echo '```text'
              tail -c 12000 "${BUILD_LOG}"
              echo
              echo '```'
              echo
              echo 'PR #257 remains draft and production source is unchanged.'
            } > builder-result.md
            gh pr comment 257 --body-file builder-result.md || true
            cat "${BUILD_LOG}"
            exit "${STATUS}"
          fi

          cat "${BUILD_LOG}"
          gh pr comment 257 --body 'Trusted v1.0.84 candidate built successfully. The Vue/Font Awesome xmark marker is resolved to its live interactive parent, every retry reacquires current DOM nodes, all permanent userscript checks passed, repository integrity passed, and all branch-only builder/diagnostic files were removed.' || true
