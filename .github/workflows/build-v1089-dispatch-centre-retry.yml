name: Build v1.0.89 Dispatch Centre Retry

on:
  push:
    branches:
      - fix/dispatch-centre-retry-v1089
    paths:
      - '.github/build-v1089-dispatch-centre-retry.trigger'

permissions:
  contents: write

concurrency:
  group: build-v1089-dispatch-centre-retry
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out v1.0.89 feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/dispatch-centre-retry-v1089
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build resilient Retry Dispatch Centres candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-v1089-dispatch-centre-retry.py
          rm -f scripts/build-v1089-dispatch-centre-retry.py
          rm -f .github/build-v1089-dispatch-centre-retry.trigger
          rm -f .github/workflows/build-v1089-dispatch-centre-retry.yml

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running $check"
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Retry Dispatch Centres interaction in v1.0.89'
          git push origin HEAD:fix/dispatch-centre-retry-v1089
