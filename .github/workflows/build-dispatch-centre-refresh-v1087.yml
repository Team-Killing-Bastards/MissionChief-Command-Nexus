name: Build v1.0.87 Dispatch Centre refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/build-dispatch-centre-refresh-v1087.trigger'

permissions:
  contents: write

concurrency:
  group: build-dispatch-centre-refresh-v1087
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/dispatch-centre-refresh-v1087
          fetch-depth: 0

      - name: Build and validate exact candidate
        id: validate
        shell: bash
        run: |
          set +e
          {
            set -x
            python3 scripts/build-dispatch-centre-refresh-v1087.py
            node --check src/missionchief-command-nexus.user.js
            node scripts/validate-userscript.mjs
            for check in scripts/check-*.mjs; do
              echo "Running $check"
              node "$check" || exit $?
            done
            test ! -e scripts/build-dispatch-centre-refresh-v1087.py
            git diff --check
          } > /tmp/v1087-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 180 /tmp/v1087-build.log > /tmp/v1087-tail.log
          exit 0

      - name: Commit diagnostic on failure
        if: steps.validate.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          cp /tmp/v1087-tail.log scripts/v1087-build-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v1087-build-failure.txt
          git commit -m 'Record v1.0.87 builder failure'
          git push origin HEAD:fix/dispatch-centre-refresh-v1087
          exit 1

      - name: Commit clean v1.0.87 candidate
        if: steps.validate.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Dispatch Centre refresh for v1.0.87'
          git push origin HEAD:fix/dispatch-centre-refresh-v1087
