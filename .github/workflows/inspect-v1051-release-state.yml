name: Inspect v1.0.51 release state

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'release/publish-v1051'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false
      - name: Report tag and release state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_SHA: 9d92e2028dc228ab58251f84a294f15c41a7a0b9
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          TAG_SHA='missing'
          if git show-ref --tags --verify --quiet refs/tags/v1.0.51; then
            TAG_SHA="$(git rev-list -n 1 v1.0.51)"
          fi
          VERSION="$(git show "${RELEASE_SHA}:src/missionchief-command-nexus.user.js" | sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' | head -n1 | xargs)"
          PERSONNEL_MATCH='false'
          if git show "${RELEASE_SHA}:src/missionchief-command-nexus.user.js" | grep -Fq "const PERSONNEL_VERSION = '1.3.7';"; then
            PERSONNEL_MATCH='true'
          fi
          BUILD_ONLY="$({
            git ls-tree -r --name-only "${RELEASE_SHA}" .github/workflows | grep -E '^\.github/workflows/(temporary-|publish-v1051-once).*\.ya?ml$' || true
            git ls-tree -r --name-only "${RELEASE_SHA}" .github/builders | grep -E '^\.github/builders/fast-register' || true
          } | sed '/^$/d')"
          if gh release view v1.0.51 --json url,isDraft,isPrerelease,assets > /tmp/release.json 2>/tmp/release.err; then
            RELEASE_STATE="exists: $(jq -c '{url,isDraft,isPrerelease,assets:[.assets[].name]}' /tmp/release.json)"
          else
            RELEASE_STATE="missing: $(tr '\n' ' ' < /tmp/release.err)"
          fi
          {
            echo '## v1.0.51 release-state inspection'
            echo
            echo "- Requested clean SHA: \`${RELEASE_SHA}\`"
            echo "- Current tag SHA: \`${TAG_SHA}\`"
            echo "- Source version: \`${VERSION}\`"
            echo "- Personnel 1.3.7 present: \`${PERSONNEL_MATCH}\`"
            echo "- Build-only files at requested SHA: \`${BUILD_ONLY:-none}\`"
            echo "- GitHub release: ${RELEASE_STATE}"
          } > /tmp/comment.md
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
