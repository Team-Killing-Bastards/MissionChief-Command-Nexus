name: Publish clean v1.0.30 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1030-launcher.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-clean-v1.0.30
  cancel-in-progress: false

jobs:
  tag:
    name: Tag clean v1.0.30 source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Create immutable release tag from clean parent
        shell: bash
        run: |
          set -euo pipefail

          LAUNCHER_SHA="$(git rev-parse HEAD)"
          RELEASE_SHA="$(git rev-parse HEAD^)"
          CHANGED_FILES="$(git diff --name-only "${RELEASE_SHA}" "${LAUNCHER_SHA}")"

          if [[ "${CHANGED_FILES}" != '.github/workflows/release-v1030-launcher.yml' ]]; then
            echo 'The launcher commit is not isolated from the clean release source.'
            echo "Changed files: ${CHANGED_FILES}"
            exit 1
          fi

          RELEASE_VERSION="$(
            git show "${RELEASE_SHA}:src/missionchief-command-nexus.user.js" |
              sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' |
              head -n 1 |
              xargs
          )"

          if [[ "${RELEASE_VERSION}" != '1.0.30' ]]; then
            echo "Expected clean parent version 1.0.30; found ${RELEASE_VERSION}."
            exit 1
          fi

          if git show-ref --tags --verify --quiet refs/tags/v1.0.30; then
            EXISTING_SHA="$(git rev-list -n 1 v1.0.30)"
            if [[ "${EXISTING_SHA}" != "${RELEASE_SHA}" ]]; then
              echo "Existing v1.0.30 tag points to ${EXISTING_SHA}, expected ${RELEASE_SHA}."
              exit 1
            fi
          else
            git config user.name MartyBlyth
            git config user.email 32400596+Martyblyth@users.noreply.github.com
            git tag -a v1.0.30 "${RELEASE_SHA}" \
              -m 'MissionChief Command Nexus 1.0.30'
            git push origin refs/tags/v1.0.30
          fi

  publish:
    name: Publish verify and announce v1.0.30
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.30
      release_notes: Fixes PSU personnel-registry detection, exact CRV and Control Van mappings, changed Missing Vehicles parsing, Police Officer conversion, and nearest eligible HEMS or trained Critical Care ambulance selection.
    secrets: inherit

  receipt:
    name: Record v1.0.30 publication
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm result
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_RESULT}" != 'success' ]]; then
            echo "v1.0.30 publication result: ${PUBLISH_RESULT}"
            exit 1
          fi
          echo 'v1.0.30 GitHub, Greasy Fork and Discord publication succeeded.'
