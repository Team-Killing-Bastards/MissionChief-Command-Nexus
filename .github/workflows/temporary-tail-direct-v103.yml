name: Temporary tail direct v1.0.3 publisher

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  actions: read
  contents: read

jobs:
  tail:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/trigger-publish-v1.0.3'
    runs-on: ubuntu-latest
    steps:
      - name: Tail publisher log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/jobs/88251494742/logs" > /tmp/publisher.log; then
              tail -n 50 /tmp/publisher.log
              exit 0
            fi
            sleep 10
          done
          exit 1
