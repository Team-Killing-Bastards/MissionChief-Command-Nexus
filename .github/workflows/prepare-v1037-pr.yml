name: Prepare v1.0.37 release candidate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: prepare-v1037-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/release-personnel-register-v1037'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: agent/release-personnel-register-v1037
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare release candidate when pending
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .diagnostics/prepare-v1037.sh ]]; then
            bash .diagnostics/prepare-v1037.sh
            rm -f .diagnostics/prepare-v1037.sh
            rm -f .diagnostics/v1037-release-trigger.txt
          fi

      - name: Validate complete Command Nexus source
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          test ! -e src/personnel-register-tools.user.js
          grep -Fq '// @version      1.0.37' src/missionchief-command-nexus.user.js
          grep -Fq 'Build All Register' src/missionchief-command-nexus.user.js
          grep -Fq 'id="mc-personnel-export-register"' src/missionchief-command-nexus.user.js
          grep -Fq 'id="mc-personnel-import-register"' src/missionchief-command-nexus.user.js
          grep -Fq ' * MODULE 2: MISSION FINDER V10.6.101' src/missionchief-command-nexus.user.js
          git diff --check

      - name: Commit prepared release candidate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Release candidate already prepared and validated.'
            exit 0
          fi
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Restore Personnel Register controls on latest main'
          git push origin HEAD:agent/release-personnel-register-v1037
