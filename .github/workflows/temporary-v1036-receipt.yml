name: Record v1.0.36 validated commit receipt

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  receipt:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/training-coverage-optimizer'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Record exact validated commit on issue 43
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            BODY="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" |
                jq -s -r \
                  'add | map(select(.body | contains("v1.0.36 passed the complete validation suite"))) | last.body // empty'
            )"
            SHA="$(grep -oE '[0-9a-f]{40}' <<< "${BODY}" | tail -n 1 || true)"
            if [[ -n "${SHA}" ]]; then
              gh issue comment 43 \
                --repo "${GITHUB_REPOSITORY}" \
                --body "v1.0.36 dispatch-side trained-coverage optimiser passed the complete validation suite. Unattached validated source commit: \`${SHA}\`. Issue #43 remains open for its separate Personnel Assignment preview/live-assignment scope."
              exit 0
            fi
            sleep 5
          done
          echo 'Validated v1.0.36 commit comment was not found.'
          exit 1
