name: Dispatch Command Nexus v1.0.84

on:
  push:
    branches:
      - main
    paths:
      - '.release-v1084-dispatch'

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-command-nexus-v1084
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch canonical v1.0.84 publisher
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Allow one-use workflow cleanup
        run: sleep 60

      - name: Dispatch permanent release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view v1.0.84 >/dev/null 2>&1; then
            echo 'v1.0.84 is already published.'
            exit 0
          fi

          gh workflow run release.yml \
            --ref main \
            -f operation=publish-release \
            -f release_tag=v1.0.84 \
            -f release_notes='Restore complete iOS Safari Personnel Assignment controls and mobile feature parity.'

          echo 'Canonical v1.0.84 release workflow dispatched.'
