name: Temporary v3.0.38 parent route handoff build

on:
  push:
    branches:
      - fix/v3038-a-route-transport-handoff

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build parent-owned A-route handoff candidate
        run: python3 scripts/_temporary-build-v3038-a-route-handoff.py

      - name: Validate exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean production candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce Worker A transport-route handoff to Worker B"
          git push origin HEAD:fix/v3038-a-route-transport-handoff
