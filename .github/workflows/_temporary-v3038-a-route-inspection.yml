name: Temporary v3.0.38 A-route transport inspection

on:
  push:
    branches:
      - fix/v3038-a-route-transport-handoff

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip v3038 inspection]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact transport lifecycle functions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/missionchief-command-nexus.user.js')
          source = source_path.read_text(encoding='utf-8')

          def function_span(name, start_at=0):
              start = source.find(f'function {name}(', start_at)
              if start < 0:
                  return None
              brace = source.find('{', start)
              depth = 0
              quote = ''
              escaped = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(source):
                  c = source[i]
                  n = source[i+1] if i + 1 < len(source) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == quote: quote = ''
                      i += 1; continue
                  if c == '/' and n == '/': line_comment = True; i += 2; continue
                  if c == '/' and n == '*': block_comment = True; i += 2; continue
                  if c in ("'", '"', '`'): quote = c; i += 1; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return start, i + 1
                  i += 1
              return None

          names = [
              'watchWorker',
              'onWorkerLoad',
              'redirectWorkerToTransportService',
              'startTransportOnlyWorker',
              'returnToTopMissionAfterTransport',
              'removeWorker',
              'createWorker',
              'refreshRadioTransportRequests',
              'radioRequestForVehicle',
              'detectTransportContext',
              'maybeAssistPatientTransport',
              'maybeAssistPrisonerTransport',
              'maybeHandleTransportServiceTimeout',
              'clearTransportServiceState',
              'correlateTransportMissionFromRadio',
              'maybeEnforcePriority',
              'maybeRecoverStalledNonMissionRedirect',
          ]
          for name in names:
              span = function_span(name)
              body = source[span[0]:span[1]] if span else f'NOT FOUND: {name}\n'
              Path(f'.tmp-v3038-fn-{name}.txt').write_text(body + '\n', encoding='utf-8')

          lines = source.splitlines()
          terms = [
              "workerRole: ''",
              'transportServiceActive:',
              'transportServiceKey:',
              'transportServiceDeferredUntil',
              'transportRecoveryAttempts:',
              'radioRequestFirstSeenAt:',
          ]
          contexts = []
          for number, line in enumerate(lines, 1):
              if any(term in line for term in terms):
                  start = max(1, number - 20)
                  end = min(len(lines), number + 55)
                  contexts.append(f'===== [{start}-{end}] =====')
                  contexts.extend(f'{i:06d}: {lines[i-1]}' for i in range(start, end+1))
                  contexts.append('')
          Path('.tmp-v3038-state-context.txt').write_text('\n'.join(contexts), encoding='utf-8')

          tests = []
          for path in sorted(Path('scripts').glob('check-*.mjs')):
              text = path.read_text(encoding='utf-8')
              if any(term in text for term in [
                  'Worker B', 'TRANSPORT_B', 'MISSION_A',
                  'redirectWorkerToTransportService',
                  'startTransportOnlyWorker',
                  'transportServiceActive',
              ]):
                  tests.append(f'===== {path} =====\n{text}')
          Path('.tmp-v3038-tests.txt').write_text('\n\n'.join(tests), encoding='utf-8')
          PY

      - name: Commit exact function maps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-v3038-*.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add exact v3.0.38 function maps [skip v3038 inspection]"
          git push origin HEAD:fix/v3038-a-route-transport-handoff
