name: Apply iOS Safari release documentation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/ios-safari-stations-menu'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply, validate and commit documentation
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD='automation/ios-safari-stations-docs.patch.gz.b64'
          PATCH='/tmp/ios-safari-stations-docs.patch'

          if [[ ! -f "${PAYLOAD}" ]]; then
            echo 'Documentation patch payload already consumed.'
            exit 0
          fi

          base64 --decode "${PAYLOAD}" | gzip --decompress > "${PATCH}"
          git apply --check "${PATCH}"
          git apply "${PATCH}"
          git rm -f "${PAYLOAD}"

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-ios-stations-menu.mjs
          python3 scripts/check_repository.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/README.md CHANGELOG.md
          git commit -m 'Document iOS Safari stations menu release'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
