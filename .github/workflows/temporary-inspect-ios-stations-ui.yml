name: Inspect iOS stations UI integration points

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'feature/ios-safari-stations-menu'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Extract exact menu patch context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js')
          lines = source.read_text(encoding='utf-8').splitlines()
          ranges = (
              (1, 80),
              (1040, 1135),
              (1330, 1450),
              (1770, 1880),
              (2350, 2410),
              (6840, 6960),
              (31920, 31983),
          )

          with Path('ios-ui-inspection.txt').open('w', encoding='utf-8') as output:
              output.write(f'Source lines: {len(lines)}\n\n')
              for start, end in ranges:
                  output.write(f'===== LINES {start}-{end} =====\n')
                  for number in range(start, min(end, len(lines)) + 1):
                      output.write(f'{number:05d}: {lines[number - 1]}\n')
                  output.write('\n')
          PY

      - name: Upload inspection report and source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-stations-ui-inspection
          path: |
            ios-ui-inspection.txt
            src/missionchief-command-nexus.user.js
          if-no-files-found: error
          retention-days: 1
