name: Apply iOS Safari stations menu patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/ios-safari-stations-menu'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply and validate source patch
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD='automation/ios-safari-stations-menu.patch.gz.b64'
          PATCH='/tmp/ios-safari-stations-menu.patch'

          if [[ ! -f "${PAYLOAD}" ]]; then
            echo 'Patch payload already consumed.'
            exit 0
          fi

          base64 --decode "${PAYLOAD}" | gzip --decompress > "${PATCH}"
          git apply --check "${PATCH}"
          git apply "${PATCH}"
          git rm -f "${PAYLOAD}"

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          git diff --check

          grep -Fq 'function isIosSafariBrowser()' src/missionchief-command-nexus.user.js
          grep -Fq 'function isIosStationsListScreen()' src/missionchief-command-nexus.user.js
          grep -Fq "panel.classList.add('mc-namer-ios-safari')" src/missionchief-command-nexus.user.js
          grep -Fq 'function makeIosPanelDraggable(panel, handle)' src/missionchief-command-nexus.user.js
          grep -Fq "if (isIosSafariBrowser()) return isIosStationsListScreen();" src/missionchief-command-nexus.user.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/missionchief-command-nexus.user.js
          git commit -m 'Add iOS Safari stations menu support'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
