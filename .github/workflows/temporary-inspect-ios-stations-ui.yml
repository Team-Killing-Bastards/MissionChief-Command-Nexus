name: Inspect iOS stations UI integration points

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'feature/ios-safari-stations-menu'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Extract existing menu and injection context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js')
          lines = source.read_text(encoding='utf-8').splitlines()
          needles = (
              'COLLAPSED_STORAGE_KEY',
              'mcNamingTools',
              'naming-tools',
              'Unit Tools',
              'Station Tools',
              'Personnel Assignment',
              'createElement',
              'appendChild',
              'insertBefore',
              'building_list',
              '/buildings',
              'position: fixed',
              "position = 'fixed'",
              'touchstart',
              'pointerdown',
              'drag',
              'collapsed',
          )

          matches = []
          for number, line in enumerate(lines, start=1):
              if any(needle.lower() in line.lower() for needle in needles):
                  matches.append(number)

          groups = []
          for number in matches:
              start = max(1, number - 10)
              end = min(len(lines), number + 24)
              if groups and start <= groups[-1][1] + 8:
                  groups[-1] = (groups[-1][0], max(groups[-1][1], end))
              else:
                  groups.append((start, end))

          with Path('ios-ui-inspection.txt').open('w', encoding='utf-8') as output:
              output.write(f'Source lines: {len(lines)}\n')
              output.write(f'Matched lines: {len(matches)}\n')
              output.write(f'Context groups: {len(groups)}\n\n')
              for start, end in groups:
                  output.write(f'===== LINES {start}-{end} =====\n')
                  for number in range(start, end + 1):
                      output.write(f'{number:05d}: {lines[number - 1]}\n')
                  output.write('\n')
          PY

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: ios-stations-ui-inspection
          path: ios-ui-inspection.txt
          if-no-files-found: error
          retention-days: 1
