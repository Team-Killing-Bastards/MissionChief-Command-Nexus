name: Test canonical Discord release layout

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.discord-release-layout-test-trigger'
      - '.github/workflows/temporary-test-canonical-discord-layout.yml'

permissions:
  contents: read

concurrency:
  group: test-canonical-discord-release-layout
  cancel-in-progress: true

jobs:
  test:
    name: Controlled canonical layout test already completed
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Canonical layout test completed successfully in run 30854270298.'
