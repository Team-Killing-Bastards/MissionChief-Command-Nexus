name: Diagnose naming Dispatch Centre filter

on:
  push:
    branches:
      - feature/naming-dispatch-centre-filter-v1085
    paths:
      - '.github/workflows/diagnose-naming-dispatch-centre-v1085.yml'
      - '.github/diagnose-naming-dispatch-centre-v1085-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_REPO: Team-Killing-Bastards/MissionChief-Command-Nexus

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/naming-dispatch-centre-filter-v1085
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Inspect recent main workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/actions/runs?branch=main&per_page=30" \
            --jq '.workflow_runs | map(select(.name | test("naming Dispatch Centre|Repository quality|Validate userscript"; "i"))) | map({id,name,event,status,conclusion,head_sha,created_at,updated_at,jobs_url,html_url})' \
            > .diagnostic-naming-dispatch-centre-v1085.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .diagnostic-naming-dispatch-centre-v1085.txt
          git commit -m 'Capture trusted naming builder run status'
          git push origin HEAD:refs/heads/feature/naming-dispatch-centre-filter-v1085
