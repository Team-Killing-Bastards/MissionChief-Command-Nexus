name: Harden fast Personnel Register once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harden-fast-personnel-register-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'agent/fast-personnel-register-v1051'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Apply fail-closed hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/missionchief-command-nexus.user.js')
          source = source_path.read_text(encoding='utf-8')
          if 'personnel-register-refresh-failed-v1' in source:
              print('Hardening already applied.')
          else:
              replacements = [
                  (
                      """    async function buildPersonnelTrainingRegisterOneClick(options = {}) {
                  if (PERSONNEL_STATE.running || PERSONNEL_STATE.registerBuilding) {
          """,
                      """    async function buildPersonnelTrainingRegisterOneClick(options = {}) {
                  if (STATE.running || STATION_STATE.running) {
                      personnelLog(
                          'A naming tool is currently running. Stop it before refreshing the Personnel Register.',
                          'error'
                      );
                      setPersonnelUiValue('status', 'Blocked by naming tool');
                      return;
                  }

                  if (PERSONNEL_STATE.running || PERSONNEL_STATE.registerBuilding) {
          """,
                      'naming-tool guard',
                  ),
                  (
                      """        let exactPagesRead = 0;
                  let failedVehicles = 0;
                  let cursor = 0;
          """,
                      """        let exactPagesRead = 0;
                  let failedVehicles = 0;
                  const failedVehicleIds = [];
                  let cursor = 0;
          """,
                      'failed vehicle tracking',
                  ),
                  (
                      """                if (!parsed) {
                      failedVehicles += 1;
                      personnelLog(
          """,
                      """                if (!parsed) {
                      failedVehicles += 1;
                      failedVehicleIds.push(String(vehicle.vehicleId || ''));
                      personnelLog(
          """,
                      'failed vehicle ID capture',
                  ),
                  (
                      """            exactPagesRead,
                  failedVehicles
              };
          """,
                      """            exactPagesRead,
                  failedVehicles,
                  failedVehicleIds
              };
          """,
                      'failed vehicle result',
                  ),
                  (
                      """                    const stationPage = await personnelFetchDocument(
                          station.href,
                          14000
                      );
                      const vehicles = getPersonnelVehicleQueue(
          """,
                      """                    const stationPage = await personnelFetchDocument(
                          station.href,
                          14000
                      );
                      if (!stationPage.doc.querySelector('#vehicle_table')) {
                          throw new Error(
                              'Vehicle table was not present on the station page.'
                          );
                      }
                      const vehicles = getPersonnelVehicleQueue(
          """,
                      'station vehicle-table gate',
                  ),
                  (
                      """                    exactPagesRead += verification.exactPagesRead;
                      failedVehicles += verification.failedVehicles;

                      if (verification.verifiedVehicles.length) {
          """,
                      """                    exactPagesRead += verification.exactPagesRead;
                      failedVehicles += verification.failedVehicles;
                      verification.failedVehicleIds.forEach(vehicleId => {
                          const existingEntry = registry.vehicles?.[vehicleId];
                          if (!existingEntry) return;
                          existingEntry.assignmentScanComplete = false;
                          existingEntry.trainingProfilesComplete = false;
                          existingEntry.source =
                              'personnel-register-refresh-failed-v1';
                          existingEntry.refreshFailedAt = Date.now();
                          PERSONNEL_TRAINING_REGISTRY_DIRTY = true;
                      });

                      if (verification.verifiedVehicles.length) {
          """,
                      'failed exact record invalidation',
                  ),
              ]
              for old, new, label in replacements:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f'Expected one {label} anchor, found {count}')
                  source = source.replace(old, new, 1)
              source_path.write_text(source, encoding='utf-8')

          check_path = Path('scripts/check-fast-personnel-register.mjs')
          check = check_path.read_text(encoding='utf-8')
          if 'failed exact records become untrusted' not in check:
              anchor = "  ['Vehicle pages remain authoritative', 'authority report'],\n"
              addition = (
                  "  ['STATE.running || STATION_STATE.running', 'naming tools block concurrent register work'],\n"
                  "  [\"querySelector('#vehicle_table')\", 'station table required before pruning'],\n"
                  "  ['failedVehicleIds', 'failed exact page tracking'],\n"
                  "  ['personnel-register-refresh-failed-v1', 'failed exact records become untrusted'],\n"
              )
              if anchor not in check:
                  raise SystemExit('Unable to extend fast register regression tokens')
              check = check.replace(anchor, anchor + addition, 1)
              check_path.write_text(check, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          if 'known-changed vehicle cannot remain authoritative' not in changelog:
              anchor = '- Deleted vehicles are removed only after their station page is read successfully, and stopped or failed work preserves older exact records that were not safely replaced.\n'
              addition = (
                  '- Unit or Station Naming runs now block a register refresh, preserving the existing single-tool safety boundary.\n'
                  '- Station records are pruned only when the authoritative `#vehicle_table` is present; an incomplete or unexpected station page fails closed.\n'
                  '- When a changed vehicle exact page fails, its previous record is retained for diagnosis but marked incomplete and non-exact, so a known-changed vehicle cannot remain authoritative.\n'
              )
              if anchor not in changelog:
                  raise SystemExit('Unable to extend v1.0.51 changelog')
              changelog = changelog.replace(anchor, anchor + addition, 1)
              changelog_path.write_text(changelog, encoding='utf-8')
          PY
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate complete candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-police-irv-fallback.mjs
          node scripts/check-ios-unit-finder-selection.mjs
          node scripts/check-ios-mission-requirements-source.mjs
          node scripts/check-iphone-mission-ui.mjs
          node scripts/check-open-issues-batch.mjs
          node scripts/check-missing-requirements-priority.mjs
          node scripts/check-trained-coverage-optimizer.mjs
          node scripts/check-road-rail-rru-mapping.mjs
          node scripts/check-auto-prisoner-cell-gate.mjs
          node scripts/check-fire-engine-update-mapping.mjs
          node scripts/check-saved-position-helper-copy.mjs
          node scripts/check-bulk-trained-register-update.mjs
          node scripts/check-hems-ambulance-eta-priority.mjs
          node scripts/check-police-search-advisor-register.mjs
          node scripts/check-personnel-register-transfer.mjs
          node scripts/check-fast-personnel-register.mjs
          node scripts/check-release-notification-single-delivery.mjs
          python3 scripts/check_repository.py
          git diff --check

      - name: Publish hardened candidate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add src/missionchief-command-nexus.user.js scripts/check-fast-personnel-register.mjs CHANGELOG.md
          git commit -m 'Harden fast Personnel Register refresh safety'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
          SHA="$(git rev-parse HEAD)"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "Fast Personnel Register safety hardening passed the full validation suite. Hardened candidate: \`${SHA}\`."
