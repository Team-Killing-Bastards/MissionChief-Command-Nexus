name: Recover and verify v1.0.19 release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  recover:
    if: github.event.pull_request.head.ref == 'agent/recover-v1019-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Reconcile GitHub release and verify Greasy Fork
        env:
          GH_TOKEN: ${{ github.token }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIGGER_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          TAG='v1.0.19'
          VERSION='1.0.19'
          SOURCE='src/missionchief-command-nexus.user.js'
          ASSET="MissionChief-Command-Nexus-${VERSION}.user.js"
          CHECKSUM="${ASSET}.sha256"
          REPO="${GITHUB_REPOSITORY}"

          git fetch origin main --tags --force
          CURRENT_VERSION="$(node scripts/validate-userscript.mjs --print-version)"
          [[ "${CURRENT_VERSION}" == "${VERSION}" ]]
          node --check "${SOURCE}"
          node scripts/validate-userscript.mjs
          node scripts/check-ios-compatibility.mjs
          python3 scripts/check_repository.py

          if ! git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "${TAG}" "$(git rev-parse origin/main)" -m "MissionChief Command Nexus ${VERSION}"
            git push origin "refs/tags/${TAG}"
          fi

          RELEASE_SHA="$(git rev-list -n 1 "${TAG}")"
          cp "${SOURCE}" "${ASSET}"
          sha256sum "${ASSET}" > "${CHECKSUM}"

          python3 - "${VERSION}" "${RELEASE_SHA}" CHANGELOG.md <<'PY'
          import re
          import sys
          from pathlib import Path

          version, sha, changelog_path = sys.argv[1:]
          text = Path(changelog_path).read_text(encoding='utf-8')
          match = re.search(rf'^## \[{re.escape(version)}\].*$', text, re.M)
          if not match:
              raise SystemExit(f'No changelog section for {version}')
          rest = text[match.end():]
          next_heading = re.search(r'^##\s+', rest, re.M)
          section = rest[:next_heading.start()] if next_heading else rest
          notes = (
              f'## Mission Brief\n\n{section.strip()}\n\n'
              f'## Build Verification\n\n- Source commit: `{sha}`\n'
          )
          Path('release-notes.md').write_text(notes, encoding='utf-8')
          PY

          # Let any tag-triggered publisher finish before reconciling independently.
          sleep 20

          RELEASE_JSON="$(gh api "repos/${REPO}/releases?per_page=100" --jq ".[] | select(.tag_name == \"${TAG}\")" | head -n 1 || true)"

          if [[ -z "${RELEASE_JSON}" ]]; then
            gh release create "${TAG}" "${ASSET}" "${CHECKSUM}" \
              --repo "${REPO}" \
              --verify-tag \
              --target "${RELEASE_SHA}" \
              --title "MissionChief Command Nexus ${VERSION}" \
              --notes-file release-notes.md
          else
            IS_DRAFT="$(jq -r '.draft' <<<"${RELEASE_JSON}")"
            IS_IMMUTABLE="$(jq -r '.immutable // false' <<<"${RELEASE_JSON}")"
            ASSET_COUNT="$(jq --arg a "${ASSET}" --arg c "${CHECKSUM}" '[.assets[] | select(.name == $a or .name == $c)] | length' <<<"${RELEASE_JSON}")"

            if [[ "${IS_DRAFT}" == 'true' ]]; then
              gh release upload "${TAG}" "${ASSET}" "${CHECKSUM}" --repo "${REPO}" --clobber
              gh release edit "${TAG}" --repo "${REPO}" \
                --title "MissionChief Command Nexus ${VERSION}" \
                --notes-file release-notes.md \
                --draft=false \
                --prerelease=false
            elif [[ "${ASSET_COUNT}" -lt 2 ]]; then
              if [[ "${IS_IMMUTABLE}" == 'true' ]]; then
                echo 'Published release is immutable but required assets are incomplete.'
                exit 1
              fi
              gh release upload "${TAG}" "${ASSET}" "${CHECKSUM}" --repo "${REPO}" --clobber
            fi
          fi

          rm -rf release-verification
          mkdir release-verification
          gh release view "${TAG}" --repo "${REPO}" \
            --json url,isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == false) | .url' \
            | tee release-verification/release-url.txt
          gh release download "${TAG}" --repo "${REPO}" \
            --pattern "${ASSET}" \
            --pattern "${CHECKSUM}" \
            --dir release-verification \
            --clobber
          cmp --silent "${ASSET}" "release-verification/${ASSET}"
          cmp --silent "${CHECKSUM}" "release-verification/${CHECKSUM}"
          (cd release-verification && sha256sum -c "${CHECKSUM}")

          python3 - "${GREASYFORK_INSTALL_URL}" "${SOURCE}" "${VERSION}" <<'PY'
          import re
          import sys
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          install_url, source_path, version = sys.argv[1:]
          expected = Path(source_path).read_text(encoding='utf-8')

          def normalise(text):
              text = text.lstrip('\ufeff').replace('\r\n', '\n').replace('\r', '\n')
              text = re.sub(r'^\s*//\s*@(downloadURL|updateURL|installURL)\s+.*\n?', '', text, flags=re.I | re.M)
              text = re.sub(r'[ \t]+$', '', text, flags=re.M)
              return text.rstrip() + '\n'

          expected_normalised = normalise(expected)
          last = 'no response'
          for attempt in range(1, 61):
              parsed = urllib.parse.urlsplit(install_url)
              query = urllib.parse.parse_qsl(parsed.query, keep_blank_values=True)
              query.append(('release_check', str(int(time.time() * 1000))))
              url = urllib.parse.urlunsplit((parsed.scheme, parsed.netloc, parsed.path, urllib.parse.urlencode(query), parsed.fragment))
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'MissionChief-Command-Nexus-Release-Recovery/1.0'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      served = response.read().decode('utf-8-sig')
                  match = re.search(r'^\s*//\s*@version\s+([^\s]+)\s*$', served, re.M)
                  served_version = match.group(1) if match else 'missing'
                  if served_version == version and normalise(served) == expected_normalised:
                      print(f'Greasy Fork verified on attempt {attempt}: version {version}')
                      break
                  last = f'served version {served_version}'
              except Exception as exc:
                  last = str(exc)
              if attempt == 60:
                  raise SystemExit(f'Greasy Fork verification failed: {last}')
              time.sleep(5)
          PY

          CHECKSUM_VALUE="$(cut -d' ' -f1 "${CHECKSUM}")"
          RELEASE_URL="$(cat release-verification/release-url.txt)"
          cat > release-verification/receipt.md <<EOF
          v1.0.19 release independently verified.

          - GitHub release: ${RELEASE_URL}
          - Tag: ${TAG}
          - Source commit: ${RELEASE_SHA}
          - Asset: ${ASSET}
          - SHA-256: ${CHECKSUM_VALUE}
          - Greasy Fork: version ${VERSION} and exact source parity verified
          EOF
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file release-verification/receipt.md

          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git rm -f .github/workflows/recover-v1019-release.yml
          git commit -m 'Remove completed v1.0.19 release recovery'
          git push origin HEAD:main
          gh pr close "${PR_NUMBER}" --repo "${REPO}" --comment 'v1.0.19 GitHub and Greasy Fork release independently verified.' || true
          git push origin --delete "${TRIGGER_BRANCH}" || true
