name: Run Auto Mode patient transport v1.0.53 builder

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/fix-auto-patient-transport-v1053'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply fix
        run: python3 scripts/apply-auto-patient-transport-v1053.py
      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-auto-patient-transport-anchor.mjs
          node scripts/check-auto-patient-transport-iframe.mjs
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-auto-prisoner-cell-gate.mjs
          node scripts/check-missing-requirements-priority.mjs
          node scripts/check-trained-coverage-optimizer.mjs
          node scripts/check-police-search-advisor-register.mjs
          node scripts/check-fast-personnel-register.mjs
          python3 scripts/check_repository.py
          git diff --check
      - name: Push candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Fix Auto Mode patient transport iframe search'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
          SHA="$(git rev-parse HEAD)"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title 'Fix Auto Mode patient transport iframe search' --body "## Fix\n\n- Searches the top-level page, active transport scopes and recursively accessible same-origin iframe documents.\n- Finds current green **Transport Patient** anchors by the exact numeric \`/vehicles/{vehicle}/patient/{hospital}\` route.\n- Keeps prisoner routes, mission links and unrelated green controls excluded.\n\n## Release\n\n- Command Nexus \`1.0.53\`\n- Mission Finder \`V10.6.116\`\n- Personnel Assignment \`1.3.7\`\n\nThe supplied route and nested iframe path have permanent regression coverage. Validation passed.\n\nValidated commit: \`${SHA}\`."
