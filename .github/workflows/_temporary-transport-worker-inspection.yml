name: Temporary v3.0.35 Worker B transport build

on:
  push:
    branches:
      - feature/v3035-worker-b-transport

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build mission-A and transport-B candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_temporary-build-v3035-worker-b.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'Released mission Worker A before starting transport Worker B.': 'Released A before starting transport B.',
              'Created on-demand transport Worker B with mission Worker A absent.': 'Created transport B with A absent.',
              'Released transport Worker B before starting a fresh mission Worker A.': 'Released B before starting fresh A.',
              'Transport Worker B reached mission ${missionIdFromUrl(href) || state.transportServiceMissionId} and cannot run Auto Mode.': 'Transport B reached a mission route; Auto Mode remains blocked.',
              'Worker B will clear ${request.vehicleLabel || `vehicle ${request.vehicleId}`} before a fresh mission Worker A starts.': 'Worker B will clear ${request.vehicleLabel || `vehicle ${request.vehicleId}`} before A restarts.',
              'if (isMfV3ManagedTransportWorker()) return;': "if (typeof window !== 'undefined' && String(window.name || '').startsWith('mcn-v3-active-worker-transport-b-')) return;",
              "assert.match(initialise, /if \\(isMfV3ManagedTransportWorker\\(\\)\\) return;/,": "assert.match(initialise, /mcn-v3-active-worker-transport-b-/,",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Build patch marker not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/_temporary-build-v3035-worker-b.py

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean production candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split mission Worker A from transport Worker B"
          git push origin HEAD:feature/v3035-worker-b-transport
