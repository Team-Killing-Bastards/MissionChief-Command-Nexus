name: Temporary transport-worker inspection

on:
  push:
    branches:
      - feature/v3035-worker-b-transport

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip transport inspection]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact transport watcher functions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')

          def extract_function(name):
              start = source.find(f'function {name}(')
              if start < 0:
                  return f'NOT FOUND: {name}\n'
              brace = source.find('{', start)
              depth = 0
              quote = ''
              escaped = False
              line_comment = False
              block_comment = False
              for index in range(brace, len(source)):
                  c = source[index]
                  n = source[index+1] if index+1 < len(source) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                      continue
                  if block_comment:
                      if c == '*' and n == '/':
                          block_comment = False
                      continue
                  if quote:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == quote: quote = ''
                      continue
                  if c == '/' and n == '/': line_comment = True; continue
                  if c == '/' and n == '*': block_comment = True; continue
                  if c in ('\'', '"', '`'): quote = c; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return source[start:index+1] + '\n'
              return f'UNTERMINATED: {name}\n'

          names = [
              'syncBackgroundAutomationWatchers',
              'startGlobalTransportWatcher',
              'stopGlobalTransportWatcher',
              'startBruteApproachWatcher',
              'stopBruteApproachWatcher',
              'shouldKeepMissionFinderObserverForCurrentFrame',
              'reconcileMissionFinderFrameRuntime',
          ]
          output = []
          for name in names:
              output.append(f'===== {name} =====\n{extract_function(name)}')
          Path('.tmp-exact-transport-watcher-functions.txt').write_text('\n'.join(output), encoding='utf-8')
          PY

      - name: Commit extracted functions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-exact-transport-watcher-functions.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add exact transport watcher functions [skip transport inspection]"
          git push origin HEAD:feature/v3035-worker-b-transport
