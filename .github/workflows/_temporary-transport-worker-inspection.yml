name: Temporary transport-worker inspection

on:
  push:
    branches:
      - feature/v3035-worker-b-transport

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip transport inspection]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture final transport runtime contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/missionchief-command-nexus.user.js')
          lines = source_path.read_text(encoding='utf-8').splitlines()
          terms = [
              'function syncBackgroundAutomationWatchers',
              'function startGlobalTransport',
              'function stopGlobalTransport',
              'mfGlobalTransportWatcherTimer',
              'function shouldKeepMissionFinderObserverForCurrentFrame',
              'function reconcileMissionFinderFrameRuntime',
              'autoModeRunning =',
              'if (isMissionPage()) initialize()',
              'PIPELINE_PRELOAD_COUNT',
          ]
          ranges = []
          for number, line in enumerate(lines, 1):
              if any(term.lower() in line.lower() for term in terms):
                  ranges.append((max(1, number-25), min(len(lines), number+100)))
          merged = []
          for start, end in ranges:
              if merged and start <= merged[-1][1]+4:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], end))
              else:
                  merged.append((start, end))
          out = []
          for index, (start, end) in enumerate(merged, 1):
              out.append(f'\n===== context-{index} [{start}-{end}] =====')
              out.extend(f'{i:06d}: {lines[i-1]}' for i in range(start, end+1))
          Path('.tmp-final-transport-runtime-contexts.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')

          scripts = []
          for path in sorted(Path('scripts').glob('check-*.mjs')):
              text = path.read_text(encoding='utf-8')
              if any(term in text for term in ['PIPELINE_PRELOAD_COUNT', 'transport-only Worker A', 'Balanced queue', 'pipelinePreloadLimit', 'Worker B', 'pipeline-preload']):
                  scripts.append(f'===== {path} =====\n{text}')
          Path('.tmp-relevant-regressions.txt').write_text('\n\n'.join(scripts)+'\n', encoding='utf-8')
          PY

      - name: Commit final contexts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-final-transport-runtime-contexts.txt .tmp-relevant-regressions.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add final transport runtime contexts [skip transport inspection]"
          git push origin HEAD:feature/v3035-worker-b-transport
