name: Temporary v3.0.37 naming inventory inspection

on:
  push:
    branches:
      - fix/v3037-naming-cascade-rollback

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip v3037 focus]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract focused station inventory functions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')

          def span(name):
              starts = [
                  source.find(f'async function {name}('),
                  source.find(f'function {name}('),
              ]
              starts = [value for value in starts if value >= 0]
              if not starts:
                  return 'NOT FOUND'
              start = min(starts)
              brace = source.find('{', start)
              depth = 0
              quote = ''
              escaped = False
              line_comment = False
              block_comment = False
              index = brace
              while index < len(source):
                  char = source[index]
                  nxt = source[index + 1] if index + 1 < len(source) else ''
                  if line_comment:
                      if char == '\n': line_comment = False
                      index += 1
                      continue
                  if block_comment:
                      if char == '*' and nxt == '/':
                          block_comment = False
                          index += 2
                          continue
                      index += 1
                      continue
                  if quote:
                      if escaped: escaped = False
                      elif char == '\\': escaped = True
                      elif char == quote: quote = ''
                      index += 1
                      continue
                  if char == '/' and nxt == '/':
                      line_comment = True
                      index += 2
                      continue
                  if char == '/' and nxt == '*':
                      block_comment = True
                      index += 2
                      continue
                  if char in ("'", '"', '`'):
                      quote = char
                      index += 1
                      continue
                  if char == '{': depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return source[start:index + 1]
                  index += 1
              raise RuntimeError(f'Unterminated {name}')

          names = [
              'getStationOverviewEntries',
              'hydrateNamingInventoriesFromCurrentOverview',
              'syncNamingStationDispatchCentreAssignments',
              'getNamingDispatchCentreStationRowDocuments',
              'refreshStations',
              'refreshStationNamingStations',
              'handleUnitDispatchCentreChange',
              'handleStationDispatchCentreChange',
          ]
          content = '\n\n'.join(
              f'===== {name} =====\n{span(name)}'
              for name in names
          ) + '\n'
          Path('.tmp-v3037-naming-focus.txt').write_text(content, encoding='utf-8')
          PY

      - name: Commit focused map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-v3037-naming-focus.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add focused naming inventory map [skip v3037 focus]"
          git push origin HEAD:fix/v3037-naming-cascade-rollback
