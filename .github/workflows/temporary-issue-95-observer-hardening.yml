name: Apply issue 95 observer hardening

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/temporary-issue-95-observer-hardening.yml'
      - 'automation/issue-95-hardening.py'

permissions:
  contents: write

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ios-stations-only-tools-menu'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact issue branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply targeted observer hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/issue-95-hardening.py
          git rm automation/issue-95-hardening.py
          git rm .github/workflows/temporary-issue-95-observer-hardening.yml

      - name: Validate hardened candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          node --check src/missionchief-command-nexus.user.js
          node --check scripts/check-ios-compatibility.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          python3 scripts/check_repository.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          broad = 'return record.addedNodes.length > 0 || record.removedNodes.length > 0;'
          if broad in source:
              raise SystemExit('Broad all-page mutation observation remains')
          required = [
              "node.matches?.('.building_list, .building_list_li')",
              "node.querySelector?.('.building_list, .building_list_li')",
              "document.addEventListener('click', handleNavigationClick, true);",
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit('Missing targeted lifecycle contracts: ' + ', '.join(missing))
          print('Targeted issue #95 observer checks passed.')
          PY

      - name: Commit hardened candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Limit iOS panel lifecycle checks to Stations changes'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
