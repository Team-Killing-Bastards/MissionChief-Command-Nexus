name: Repair Nexus UI V1.0.70 patcher anchor

on:
  push:
    branches:
      - feature/nexus-ui-system-v1070
    paths:
      - '.github/workflows/repair-nexus-ui-patcher-v1070.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/nexus-ui-system-v1070
      - name: Remove stale optional history-note replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/nexus-ui-v1070-patch.py')
          text = path.read_text(encoding='utf-8')
          start_token = '''source = replace_once(
              source,
              "    // V10.6.132: Mission Control now uses one integrated MissionChief Nexus",'''
          start = text.find(start_token)
          if start < 0:
              raise SystemExit('Unable to find stale history-note replacement')
          end_token = '\n\n# ---------------------------------------------------------------------------\n# Unit / Station / Personnel workspace DOM'
          end = text.find(end_token, start)
          if end < 0:
              raise SystemExit('Unable to find end of stale history-note replacement')
          text = text[:start] + text[end:]
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-nexus-ui-patcher-v1070.yml
          git add .github/nexus-ui-v1070-patch.py
          git commit -m 'Remove stale Nexus UI history-note anchor'
          git push origin HEAD:feature/nexus-ui-system-v1070
