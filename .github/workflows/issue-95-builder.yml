name: Build issue 95 iOS Stations lifecycle fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/issue-95-builder.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out issue branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/fix-issue-95-stations-panel-lifecycle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply structural lifecycle correction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/issue-95-patch.py
          python3 .github/issue-95-patch.py

      - name: Remove temporary inspection and builder files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .issue-95-context .issue-95-cache-context
          rm -f .github/workflows/issue-95-cache-inspect.yml
          git rm -f .github/workflows/issue-95-builder.yml .github/issue-95-patch.py

      - name: Validate JavaScript syntax
        run: node --check src/missionchief-command-nexus.user.js

      - name: Validate userscript metadata
        run: node scripts/validate-userscript.mjs

      - name: Validate version increase
        run: node scripts/validate-userscript.mjs --base-ref origin/main

      - name: Validate permanent iOS compatibility contracts
        run: node scripts/check-ios-compatibility.mjs

      - name: Validate repository integrity
        run: python3 scripts/check_repository.py

      - name: Validate whitespace
        run: git diff --check

      - name: Validate focused issue 95 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          checks = Path('scripts/check-ios-compatibility.mjs').read_text(encoding='utf-8')
          expected = {
              'version': '// @version      1.0.21',
              'Unit Naming': "const UNIT_VERSION = '3.3.8';",
              'lifecycle decision': 'function decideNamingToolsPanelLifecycle(',
              'rendered Stations gate': 'function isRenderedStationOverviewEntry(',
              'off-page removal': 'function removeNamingToolsPanelFromOffPage(',
              'persistent reconciliation': 'function reconcileNamingToolsPanelLifecycle(',
              'Mission Finder isolation': ' * MODULE 2: MISSION FINDER V10.6.85',
          }
          missing = [name for name, token in expected.items() if token not in source]
          if missing:
              raise SystemExit('Missing issue #95 contracts: ' + ', '.join(missing))
          if source.count('function decideNamingToolsPanelLifecycle(') != 1:
              raise SystemExit('Lifecycle decision function must exist exactly once')
          if 'installSingleNamingToolsPanelGuard(panel)' in source:
              raise SystemExit('Per-panel global guard installation remains present')
          if "label: 'iOS Stations without panel'" not in checks:
              raise SystemExit('Lifecycle creation regression case is missing')
          if "expected: 'create'" not in checks:
              raise SystemExit('Lifecycle creation expectation is missing')
          temporary_paths = [
              Path('.issue-95-context'),
              Path('.issue-95-cache-context'),
              Path('.github/workflows/issue-95-builder.yml'),
              Path('.github/workflows/issue-95-cache-inspect.yml'),
              Path('.github/issue-95-patch.py'),
          ]
          leftovers = [str(path) for path in temporary_paths if path.exists()]
          if leftovers:
              raise SystemExit('Temporary issue #95 files remain: ' + ', '.join(leftovers))
          print('Focused issue #95 lifecycle contracts passed.')
          PY

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Conroy1988
          git config user.email 27301455+Conroy1988@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Fix iOS Stations panel lifecycle'
          git push origin HEAD:agent/fix-issue-95-stations-panel-lifecycle
