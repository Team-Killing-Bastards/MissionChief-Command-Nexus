name: Recover Command Nexus v1.0.3 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-triggers/recover-v1.0.3'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  publish:
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.3
    secrets: inherit

  report:
    name: Record v1.0.3 recovery result
    if: always()
    needs:
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out v1.0.3 source
        if: needs.publish.result == 'success'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: v1.0.3

      - name: Independently verify release assets
        if: needs.publish.result == 'success'
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
        shell: bash
        run: |
          set -euo pipefail

          ASSET='MissionChief-Command-Nexus-1.0.3.user.js'
          rm -rf release-check
          mkdir release-check

          RELEASE_URL="$(
            gh release view v1.0.3 \
              --json url,isDraft,isPrerelease \
              --jq 'select(.isDraft == false and .isPrerelease == false) | .url'
          )"

          gh release download v1.0.3 \
            --pattern "${ASSET}" \
            --pattern "${ASSET}.sha256" \
            --dir release-check \
            --clobber

          cmp --silent \
            src/missionchief-command-nexus.user.js \
            "release-check/${ASSET}"

          (
            cd release-check
            sha256sum -c "${ASSET}.sha256"
          )

          CHECKSUM="$(awk 'NR == 1 {print $1}' "release-check/${ASSET}.sha256")"

          export GREASYFORK_INSTALL_URL
          node <<'NODE'
          import { readFile } from 'node:fs/promises';

          function normalise(text) {
            return text
              .replace(/^\uFEFF/, '')
              .replace(/\r\n?/g, '\n')
              .replace(
                /^\s*\/\/\s*@(downloadURL|updateURL|installURL)\s+.*\n?/gim,
                ''
              )
              .replace(/[ \t]+$/gm, '')
              .trimEnd()
              .concat('\n');
          }

          const local = await readFile(
            'src/missionchief-command-nexus.user.js',
            'utf8'
          );
          const url = new URL(process.env.GREASYFORK_INSTALL_URL);
          url.searchParams.set('issue_33_verification', Date.now().toString());

          const response = await fetch(url, {
            redirect: 'follow',
            headers: {
              Accept: 'text/plain, application/javascript, */*',
              'User-Agent': 'Command-Nexus-Issue-33-Verifier/1.0',
            },
          });

          if (!response.ok) {
            throw new Error(`Greasy Fork returned HTTP ${response.status}`);
          }

          const served = await response.text();
          const version = served.match(
            /^\s*\/\/\s*@version\s+([^\s]+)\s*$/m
          )?.[1];

          if (version !== '1.0.3') {
            throw new Error(`Greasy Fork serves ${version}, expected 1.0.3`);
          }

          if (normalise(served) !== normalise(local)) {
            throw new Error('Greasy Fork source does not match tagged source');
          }
          NODE

          echo "release_url=${RELEASE_URL}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${CHECKSUM}" >> "${GITHUB_OUTPUT}"
          echo "tag_sha=$(git rev-list -n 1 v1.0.3)" >> "${GITHUB_OUTPUT}"

      - name: Comment on Issue #33
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          RELEASE_URL: ${{ steps.verify.outputs.release_url }}
          CHECKSUM: ${{ steps.verify.outputs.checksum }}
          TAG_SHA: ${{ steps.verify.outputs.tag_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${PUBLISH_RESULT}" == 'success' && "${VERIFY_RESULT}" == 'success' ]]; then
            cat > issue-comment.md <<EOF
          ## v1.0.3 recovery verification passed

          The repaired permanent release workflow completed successfully.

          - GitHub Release: ${RELEASE_URL}
          - Tag commit: \`${TAG_SHA}\`
          - SHA-256: \`${CHECKSUM}\`
          - Release asset matches the tagged canonical userscript.
          - Published checksum asset verifies successfully.
          - Greasy Fork serves version \`1.0.3\` with exact normalized source parity.
          - The permanent workflow completed its Discord notification stage successfully.
          - Actions evidence: ${RUN_URL}
          EOF
          else
            cat > issue-comment.md <<EOF
          ## v1.0.3 recovery attempt did not complete

          - Permanent release workflow result: \`${PUBLISH_RESULT}\`
          - Independent verification result: \`${VERIFY_RESULT}\`
          - Actions evidence: ${RUN_URL}

          The release remains safely recoverable. Review the failed step before retrying.
          EOF
          fi

          gh issue comment 33 --body-file issue-comment.md

      - name: Fail when publication or verification failed
        if: needs.publish.result != 'success' || steps.verify.outcome != 'success'
        run: exit 1
