name: Dispatch v1.0.21 Fire cross-reference

on:
  issue_comment:
    types:
      - created
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.body == '/run-v1021-fire-crossref') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'release/run-v1021-fire-crossref')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch registered v1.0.21 builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run apply-v1.0.21-fire-crossref.yml
          --repo "${GITHUB_REPOSITORY}"
          --ref main
