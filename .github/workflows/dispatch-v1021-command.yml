name: Dispatch v1.0.21 Fire cross-reference

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/run-v1021-fire-crossref'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch registered v1.0.21 builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run apply-v1.0.21-fire-crossref.yml
          --repo "${GITHUB_REPOSITORY}"
          --ref main
