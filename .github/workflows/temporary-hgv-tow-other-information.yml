name: Temporary HGV tow mission-definition build

on:
  push:
    branches:
      - agent/hgv-tow-other-information
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/hgv-tow-other-information

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check temporary builder syntax
        run: node --check scripts/temporary-hgv-tow-other-information-builder.mjs

      - name: Apply feature patch
        run: node scripts/temporary-hgv-tow-other-information-builder.mjs

      - name: Update current operational documentation baselines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/DEVELOPER_HANDOFF.md': [
                  ('| Command Nexus version | `1.1.7` |', '| Command Nexus version | `1.1.8` |'),
                  ('| Mission Finder baseline | `V10.7.5` |', '| Mission Finder baseline | `V10.7.6` |'),
              ],
              'docs/ARCHITECTURE.md': [
                  ('Command Nexus v1.1.7', 'Command Nexus v1.1.8'),
                  ('Mission Finder `V10.7.5`', 'Mission Finder `V10.7.6`'),
              ],
              'docs/ROADMAP.md': [
                  ('Current production baseline — v1.1.7', 'Current production baseline — v1.1.8'),
                  ('Release Command Nexus `1.1.7` with Mission Finder `V10.7.5`.', 'Release Command Nexus `1.1.8` with Mission Finder `V10.7.6`.'),
              ],
              'docs/MIGRATION.md': [
                  ('The current Command Nexus `1.1.7` source', 'The current Command Nexus `1.1.8` source'),
              ],
              'docs/README.md': [
                  ('The current production baseline is Command Nexus `1.1.7` with Mission Finder `V10.7.6`.', 'The current production baseline is Command Nexus `1.1.8` with Mission Finder `V10.7.6`.'),
                  ('Version `1.1.7` adds a live attached Patient Transfers drawer for the default-off background patient transport worker, including pending/completed/failed run counters and bounded per-attempt failure diagnostics, while retaining the private Apps Script URL logger profile and loss-resistant multi-batch drain. **Sync now** hands a manual drain request to the authoritative top-window logger owner, queues it behind an active upload when required and reports queued/per-batch progress instead of silently doing nothing.', 'Version `1.1.8` extends fresh mission-definition parsing so Other information Maximum amount of trucks to tow feeds the existing strict HGV Recovery type-106 path. Minimum amount of trucks to tow is fallback only when Maximum is absent or invalid, and the values are never summed. Existing Flatbed Recovery car towing, Patient Transfers visibility, the private Apps Script URL logger profile and loss-resistant multi-batch drain remain unchanged.'),
              ],
          }

          for relative, pairs in replacements.items():
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{relative}: expected one current marker {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Prepare release version
        run: |
          node scripts/prepare-release.mjs \
            --version 1.1.8 \
            --notes "Read Maximum amount of trucks to tow from mission-definition Other information and feed the value into the existing strict HGV Recovery type-106 path. Use Minimum amount of trucks to tow only as a fallback when Maximum is absent or invalid, never add both values together, and preserve the existing Flatbed Recovery car-towing rule. Add permanent regression coverage based on the supplied MissionChief mission HTML."

      - name: Remove temporary build controls
        run: |
          rm -f scripts/temporary-hgv-tow-other-information-builder.mjs
          rm -f .github/workflows/temporary-hgv-tow-other-information.yml

      - name: Validate exact candidate
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/check-hgv-tow-other-information-v118.mjs
          node scripts/check-hgv-recovery-v1097.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          for check in scripts/check-*.mjs; do
            echo "==> ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          if [[ -f scripts/check_workflow_yaml.py ]]; then
            python3 scripts/check_workflow_yaml.py
          fi
          git diff --check

      - name: Commit clean candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v1.1.8 HGV tow mission details"
          git push origin HEAD:agent/hgv-tow-other-information
