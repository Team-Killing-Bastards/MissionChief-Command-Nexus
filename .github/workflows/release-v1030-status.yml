name: Diagnose exact v1.0.30 release error

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1030-status.yml'

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: Report exact release error
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comment exact error lines
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: '131'
          RUN_ID: '30166689627'
        shell: bash
        run: |
          set -euo pipefail
          gh run view "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --log-failed > /tmp/v1030-failed.log 2>&1 || true

          grep -Eai \
            '(^|[^a-z])(error|fatal|failed|refusing|missing tag|not contained|does not match|could not be resolved|temporary workflows|release commit|tag .* points)([^a-z]|$)' \
            /tmp/v1030-failed.log |
            grep -Ev 'echo |if \[\[|UNKNOWN STEP.*(error|fatal|failed|refusing|missing tag|not contained|does not match|could not be resolved|temporary workflows|release commit)' |
            tail -n 40 > /tmp/v1030-exact.log || true

          {
            echo '## v1.0.30 exact release error'
            echo
            echo '```text'
            cat /tmp/v1030-exact.log
            echo '```'
          } > /tmp/v1030-exact.md

          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/v1030-exact.md
