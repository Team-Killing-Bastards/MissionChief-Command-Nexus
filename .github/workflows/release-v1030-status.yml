name: Diagnose final v1.0.30 release lines

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1030-status.yml'

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: Report final release lines
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comment final failed lines
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: '131'
          RUN_ID: '30166689627'
        shell: bash
        run: |
          set -euo pipefail
          gh run view "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --log-failed > /tmp/v1030-failed.log 2>&1 || true

          {
            echo '## v1.0.30 final failed lines'
            echo
            echo '```text'
            tail -n 30 /tmp/v1030-failed.log
            echo '```'
          } > /tmp/v1030-final.md

          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/v1030-final.md
