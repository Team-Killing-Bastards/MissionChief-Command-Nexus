name: Audit runtime memory v1.0.82

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize
    paths:
      - '.github/workflows/audit-runtime-memory-v1082.yml'
      - '.github/builders/extract-ally-steal-v1082.py'
      - '.v1082-memory-audit-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out trusted audit tools
        uses: actions/checkout@v6
        with:
          ref: diagnostic/deep-memory-audit-v1082
          path: audit-tools
          fetch-depth: 1
      - name: Check out exact v1.0.82 candidate
        uses: actions/checkout@v6
        with:
          ref: fix/runtime-memory-deep-dive-v1082
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract Ally Steal timing contracts
        working-directory: candidate
        run: python3 ../audit-tools/.github/builders/extract-ally-steal-v1082.py
      - name: Validate exact v1.0.82 candidate
        working-directory: candidate
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for test in scripts/check-*.mjs; do
            echo "Running ${test}"
            node "$test"
          done
          python3 scripts/check_repository.py
          git diff --check
