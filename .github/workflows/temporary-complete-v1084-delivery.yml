name: Complete Command Nexus v1.0.84 delivery

on:
  push:
    branches:
      - main
    paths:
      - '.complete-v1084-delivery-trigger'

permissions:
  contents: write

concurrency:
  group: complete-command-nexus-v1084-delivery
  cancel-in-progress: false

jobs:
  complete:
    name: Verify Greasy Fork and record Discord delivery
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare immutable release files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          rm -rf release-source
          git worktree add --force --detach release-source v1.0.84

          cp \
            release-source/src/missionchief-command-nexus.user.js \
            MissionChief-Command-Nexus-1.0.84.user.js
          sha256sum \
            MissionChief-Command-Nexus-1.0.84.user.js \
            > MissionChief-Command-Nexus-1.0.84.user.js.sha256

          grep -Fq '6e397236f2c8827a9f3795c54a19603115113b6f92f8027f4ec800c5d08f12bb' \
            MissionChief-Command-Nexus-1.0.84.user.js.sha256

      - name: Verify deployment and record Discord receipt
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          GREASYFORK_PAGE_URL: ${{ vars.GREASYFORK_PAGE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: v1.0.84
          RELEASE_SHA: d0e956fb5df60bbc029fddf17e06c7be7d8dcaf9
          SOURCE_PATH: release-source/src/missionchief-command-nexus.user.js
          CHANGELOG_PATH: release-source/CHANGELOG.md
          PRODUCT_NAME: MissionChief Command Nexus
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-notify.mjs

      - name: Confirm complete public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.84" \
            --jq '
              if .draft or .prerelease then
                error("v1.0.84 is not a normal published release")
              elif ([.assets[].name] | index("MissionChief-Command-Nexus-1.0.84.user.js")) == null then
                error("userscript asset missing")
              elif ([.assets[].name] | index("MissionChief-Command-Nexus-1.0.84.user.js.sha256")) == null then
                error("checksum asset missing")
              elif ([.assets[].name | select(startswith("Command-Nexus-Discord-Receipt-v1.0.84-"))] | length) != 1 then
                error("Discord receipt missing or duplicated")
              else
                {url: .html_url, tag: .tag_name, assets: [.assets[].name]}
              end'
