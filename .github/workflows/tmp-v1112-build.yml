name: Temporary v1.1.12 build and validate

on:
  push:
    branches:
      - hotfix/v1.1.12-multi-device-lag

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/v1.1.12-multi-device-lag
          fetch-depth: 0

      - name: Apply v1.1.12 production patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          ROOT = Path('.')
          source_path = ROOT / 'src/missionchief-command-nexus.user.js'
          backend_path = ROOT / 'integrations/google-apps-script/Code.gs'
          source = source_path.read_text(encoding='utf-8')
          backend = backend_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          def region_replace(text, start_marker, end_marker, transform, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker missing')
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f'{label}: end marker missing')
              region = text[start:end]
              updated = transform(region)
              if updated == region:
                  raise SystemExit(f'{label}: transform made no change')
              return text[:start] + updated + text[end:]

          def insert_after_function_open(text, name, code):
              marker = f'function {name}'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'{name}: function missing')
              if code.strip() in text[start:start + 1200]:
                  return text
              brace = text.find('{', start)
              if brace < 0 or brace > start + 1000:
                  raise SystemExit(f'{name}: opening brace missing')
              return text[:brace + 1] + '\n' + code + text[brace + 1:]

          # Version and new client constants/state.
          source = replace_once(source, '// @version      1.1.11', '// @version      1.1.12', 'metadata version')
          source = replace_once(
              source,
              "    const MF_MISSION_LOGGER_CLIENT_VERSION = '1.1.11';",
              "    const MF_MISSION_LOGGER_CLIENT_VERSION = '1.1.12';",
              'client version'
          )
          busy_anchor = """    const MF_MISSION_LOGGER_BUSY_RETRY_DELAYS_MS =
              Object.freeze([2000, 5000, 15000]);"""
          new_constants = busy_anchor + """
              const MF_MISSION_LOGGER_OBSERVER_LEASE_INTERVAL_MS =
                  45 * 1000;
              const MF_MISSION_LOGGER_OBSERVER_LEASE_FALLBACK_MS =
                  90 * 1000;
              const MF_MISSION_LOGGER_DEVICE_UPLOAD_OFFSET_MAX_MS =
                  45 * 1000;
              const MF_MISSION_LOGGER_RETRY_JITTER_MAX_MS = 2500;
              const MF_MISSION_LOGGER_IDLE_TIMEOUT_MS = 4000;
              const MF_MISSION_ACTIVITY_HEARTBEAT_INTERVAL_MS =
                  5 * 60 * 1000;"""
          source = replace_once(source, busy_anchor, new_constants, 'multi-device constants')
          state_anchor = "    let mfMissionLoggerStartupDrainChecked = false;"
          state_block = state_anchor + """
              let mfMissionLoggerObserverLeaseSupported = null;
              let mfMissionLoggerObserverLeaseOwner = false;
              let mfMissionLoggerObserverLeaseExpiresAt = 0;
              let mfMissionLoggerObserverLeaseTimer = null;
              let mfMissionLoggerObserverLeaseActive = false;"""
          source = replace_once(source, state_anchor, state_block, 'observer state')

          observer_helpers = r'''
              function getMissionLoggerDeviceOffsetMs(
                  value,
                  maximumMs = MF_MISSION_LOGGER_DEVICE_UPLOAD_OFFSET_MAX_MS
              ) {
                  const text = String(value || 'missionchief-device');
                  let hash = 2166136261;
                  for (let index = 0; index < text.length; index += 1) {
                      hash ^= text.charCodeAt(index);
                      hash = Math.imul(hash, 16777619);
                  }
                  const limit = Math.max(1, Math.trunc(Number(maximumMs) || 1));
                  return (hash >>> 0) % limit;
              }

              function runMissionLoggerWhenIdle(
                  callback,
                  timeoutMs = MF_MISSION_LOGGER_IDLE_TIMEOUT_MS
              ) {
                  if (typeof callback !== 'function') return;
                  if (typeof window.requestIdleCallback === 'function') {
                      window.requestIdleCallback(
                          () => callback(),
                          {
                              timeout: Math.max(
                                  250,
                                  Math.trunc(Number(timeoutMs) || 0)
                              )
                          }
                      );
                      return;
                  }
                  setTimeout(callback, 0);
              }

              function isMissionLoggerPassiveObserver() {
                  if (!MF_IS_TOP_WINDOW || !mfMissionLoggerEnabled) {
                      return false;
                  }
                  if (mfMissionLoggerObserverLeaseSupported === false) {
                      return true;
                  }
                  return Boolean(
                      mfMissionLoggerObserverLeaseOwner &&
                      mfMissionLoggerObserverLeaseExpiresAt > Date.now()
                  );
              }

              function setMissionLoggerPassiveObserverOwner(
                  owner,
                  expiresAt = 0
              ) {
                  const wasOwner = isMissionLoggerPassiveObserver();
                  mfMissionLoggerObserverLeaseOwner = owner === true;
                  mfMissionLoggerObserverLeaseExpiresAt = owner
                      ? Math.max(
                          Date.now() + 5000,
                          Number(expiresAt) ||
                              Date.now() +
                                  MF_MISSION_LOGGER_OBSERVER_LEASE_FALLBACK_MS
                      )
                      : 0;
                  const isOwner = isMissionLoggerPassiveObserver();

                  if (isOwner && !wasOwner) {
                      if (mfMissionLoggerGenerationArmTimer) {
                          clearTimeout(mfMissionLoggerGenerationArmTimer);
                          mfMissionLoggerGenerationArmTimer = null;
                      }
                      mfMissionLoggerGenerationArmed = false;
                      scanMissionLoggerMissionList(document, true);
                      installMissionLoggerMissionGenerationCapture();
                      scheduleMissionLoggerGenerationArm();
                      recordMissionLoggerObservedEvent();
                      startMissionLoggerCreditReconciliation();
                  } else if (!isOwner && wasOwner) {
                      if (mfMissionLoggerGenerationArmTimer) {
                          clearTimeout(mfMissionLoggerGenerationArmTimer);
                          mfMissionLoggerGenerationArmTimer = null;
                      }
                      mfMissionLoggerGenerationArmed = false;
                      stopMissionLoggerCreditReconciliation();
                  }
              }

              async function refreshMissionLoggerObserverLease() {
                  if (
                      !MF_IS_TOP_WINDOW ||
                      !mfMissionLoggerEnabled ||
                      mfMissionLoggerObserverLeaseActive
                  ) {
                      return false;
                  }

                  const identity = readMissionLoggerIdentity();
                  if (!identity || !mfMissionLoggerEndpoint) return false;
                  if (mfMissionLoggerObserverLeaseSupported === false) {
                      setMissionLoggerPassiveObserverOwner(
                          true,
                          Date.now() +
                              MF_MISSION_LOGGER_OBSERVER_LEASE_FALLBACK_MS
                      );
                      return true;
                  }

                  mfMissionLoggerObserverLeaseActive = true;
                  try {
                      const response = await submitMissionLoggerRequest(
                          'observer-lease',
                          {
                              profileId: identity.playerId,
                              username: identity.playerName,
                              deviceId: identity.deviceId,
                              deviceLabel: identity.deviceLabel
                          }
                      );
                      mfMissionLoggerObserverLeaseSupported = true;
                      const parsedExpiry = Date.parse(
                          String(response?.expiresAt || '')
                      );
                      setMissionLoggerPassiveObserverOwner(
                          response?.observerOwner === true,
                          Number.isFinite(parsedExpiry)
                              ? parsedExpiry
                              : Date.now() +
                                  MF_MISSION_LOGGER_OBSERVER_LEASE_FALLBACK_MS
                      );
                      return response?.observerOwner === true;
                  } catch (error) {
                      if (String(error?.code || '') === 'UNKNOWN_ACTION') {
                          mfMissionLoggerObserverLeaseSupported = false;
                          if (mfMissionLoggerObserverLeaseTimer) {
                              clearInterval(
                                  mfMissionLoggerObserverLeaseTimer
                              );
                              mfMissionLoggerObserverLeaseTimer = null;
                          }
                          setMissionLoggerPassiveObserverOwner(
                              true,
                              Date.now() +
                                  MF_MISSION_LOGGER_OBSERVER_LEASE_FALLBACK_MS
                          );
                          return true;
                      }
                      if (
                          mfMissionLoggerObserverLeaseExpiresAt <=
                          Date.now()
                      ) {
                          setMissionLoggerPassiveObserverOwner(false, 0);
                      }
                      return false;
                  } finally {
                      mfMissionLoggerObserverLeaseActive = false;
                  }
              }

              function startMissionLoggerObserverLease() {
                  if (!MF_IS_TOP_WINDOW || !mfMissionLoggerEnabled) return;
                  if (mfMissionLoggerObserverLeaseTimer) return;

                  runMissionLoggerWhenIdle(() => {
                      void refreshMissionLoggerObserverLease();
                  }, 1500);
                  mfMissionLoggerObserverLeaseTimer = setInterval(() => {
                      runMissionLoggerWhenIdle(() => {
                          void refreshMissionLoggerObserverLease();
                      });
                  }, MF_MISSION_LOGGER_OBSERVER_LEASE_INTERVAL_MS);
              }

              function stopMissionLoggerObserverLease() {
                  if (mfMissionLoggerObserverLeaseTimer) {
                      clearInterval(mfMissionLoggerObserverLeaseTimer);
                      mfMissionLoggerObserverLeaseTimer = null;
                  }
                  mfMissionLoggerObserverLeaseActive = false;
                  mfMissionLoggerObserverLeaseSupported = null;
                  setMissionLoggerPassiveObserverOwner(false, 0);
              }

          '''
          source = replace_once(
              source,
              '    function normaliseMissionLoggerProfileName(value) {',
              observer_helpers + '    function normaliseMissionLoggerProfileName(value) {',
              'observer helpers'
          )

          # Only the current passive observer performs account-wide mission scanning.
          passive_guard = '        if (!isMissionLoggerPassiveObserver()) return false;'
          for function_name in [
              'recordMissionLoggerGeneratedMission',
              'installMissionLoggerMissionGenerationCapture',
              'recordMissionLoggerObservedEvent'
          ]:
              source = insert_after_function_open(source, function_name, passive_guard)
          passive_void_guard = '        if (!isMissionLoggerPassiveObserver()) return;'
          source = insert_after_function_open(
              source,
              'observeMissionLoggerMissionListMutations',
              passive_void_guard
          )
          passive_zero_guard = '        if (!isMissionLoggerPassiveObserver()) return 0;'
          source = insert_after_function_open(
              source,
              'scanMissionLoggerMissionList',
              passive_zero_guard
          )

          # Passive observations wait for the normal staggered interval; action evidence
          # still requests eager upload.
          eager_queue_old = """        scheduleMissionLoggerEagerSync(
              `queued ${String(event.eventType || 'event')}`
          );"""
          eager_queue_new = """        if (String(event.eventType || '') !== 'mission-observed') {
              scheduleMissionLoggerEagerSync(
                  `queued ${String(event.eventType || 'event')}`
              );
          }"""
          source = replace_once(source, eager_queue_old, eager_queue_new, 'passive eager drain')

          def patch_activity(region):
              old = '        }, 60 * 1000);'
              if region.count(old) != 1:
                  raise SystemExit(f'activity heartbeat: expected one match, found {region.count(old)}')
              return region.replace(
                  old,
                  '        }, MF_MISSION_ACTIVITY_HEARTBEAT_INTERVAL_MS);',
                  1
              )
          source = region_replace(
              source,
              '    function installMissionActivityRecorder()',
              '    function queueMissionLoggerEvent',
              patch_activity,
              'activity heartbeat'
          )

          def patch_eager(region):
              old_call = """                void syncMissionLoggerNow({
                      backlog: true,
                      skipCreditReconcile: true,
                      reason
                  });"""
              new_call = """                runMissionLoggerWhenIdle(() => {
                      void syncMissionLoggerNow({
                          backlog: true,
                          skipCreditReconcile: true,
                          reason
                      });
                  });"""
              if region.count(old_call) != 1:
                  raise SystemExit(f'eager idle call: expected one match, found {region.count(old_call)}')
              region = region.replace(old_call, new_call, 1)
              old_delay = """            force
                  ? 500
                  : MF_MISSION_LOGGER_EAGER_SYNC_DELAY_MS"""
              new_delay = """            (
                  force
                      ? 500
                      : MF_MISSION_LOGGER_EAGER_SYNC_DELAY_MS
              ) + getMissionLoggerDeviceOffsetMs(
                  readMissionLoggerIdentity()?.deviceId || '',
                  MF_MISSION_LOGGER_RETRY_JITTER_MAX_MS
              )"""
              if region.count(old_delay) != 1:
                  raise SystemExit(f'eager jitter: expected one match, found {region.count(old_delay)}')
              return region.replace(old_delay, new_delay, 1)
          source = region_replace(
              source,
              '    function scheduleMissionLoggerEagerSync(',
              '    function scheduleMissionLoggerDeferredDrain(',
              patch_eager,
              'eager sync'
          )

          # Stagger each computer's periodic upload and start the observer lease first.
          def patch_start_timer(region):
              marker = '        startMissionLoggerCreditReconciliation();'
              if region.count(marker) != 1:
                  raise SystemExit(f'start timer credit marker count {region.count(marker)}')
              region = region.replace(
                  marker,
                  '        startMissionLoggerObserverLease();\n' + marker,
                  1
              )
              initial_marker = '        const initialDelay = Math.max('
              if initial_marker not in region:
                  raise SystemExit('start timer initialDelay marker missing')
              region = region.replace(
                  initial_marker,
                  """        const deviceUploadOffset =
              getMissionLoggerDeviceOffsetMs(
                  readMissionLoggerIdentity()?.deviceId || ''
              );
          const initialDelay = Math.max(""",
                  1
              )
              if '}, initialDelay);' not in region:
                  raise SystemExit('start timer delay use missing')
              region = region.replace(
                  '}, initialDelay);',
                  '}, initialDelay + deviceUploadOffset);',
                  1
              )
              return region
          source = region_replace(
              source,
              '    function startMissionLoggerSyncTimer()',
              '    function stopMissionLoggerSyncTimer()',
              patch_start_timer,
              'start timer'
          )
          source = insert_after_function_open(
              source,
              'stopMissionLoggerSyncTimer',
              '        stopMissionLoggerObserverLease();'
          )

          # Periodic credit scans belong only to the passive observer. Completion-triggered
          # exact credit reconciliation remains available on whichever PC completed it.
          def patch_credit_timer(region):
              old = """            !mfMissionLoggerEnabled ||
              !readMissionLoggerIdentity()"""
              new = """            !mfMissionLoggerEnabled ||
              !isMissionLoggerPassiveObserver() ||
              !readMissionLoggerIdentity()"""
              if region.count(old) != 1:
                  raise SystemExit(f'credit owner guard: expected one match, found {region.count(old)}')
              return region.replace(old, new, 1)
          source = region_replace(
              source,
              '    function startMissionLoggerCreditReconciliation()',
              '    function getMissionLoggerNativeCompletionSnapshot',
              patch_credit_timer,
              'credit observer authority'
          )

          # Jitter busy retries so two PCs do not collide repeatedly on identical delays.
          retry_old = """                const retryDelay =
                      MF_MISSION_LOGGER_BUSY_RETRY_DELAYS_MS[
                          busyAttempt
                      ];"""
          retry_new = """                const retryDelay =
                      MF_MISSION_LOGGER_BUSY_RETRY_DELAYS_MS[
                          busyAttempt
                      ] + getMissionLoggerDeviceOffsetMs(
                          `${identity.deviceId}:${busyAttempt}`,
                          MF_MISSION_LOGGER_RETRY_JITTER_MAX_MS
                      );"""
          source = replace_once(source, retry_old, retry_new, 'busy retry jitter')

          initialise_old = """        installMissionLoggerStorageListener();
          installMissionLoggerDispatchCapture();
          recordMissionLoggerObservedEvent();"""
          initialise_new = """        installMissionLoggerStorageListener();
          installMissionLoggerDispatchCapture();
          if (MF_IS_TOP_WINDOW) {
              startMissionLoggerObserverLease();
          }
          recordMissionLoggerObservedEvent();"""
          source = replace_once(source, initialise_old, initialise_new, 'initial observer lease')

          # Backend build, lease action and cross-device observation dedupe.
          backend = replace_once(
              backend,
              "  buildId: '1.1.10-upload-lock-hotfix-1',",
              "  buildId: '1.1.12-multi-device-observer-1',",
              'backend build'
          )
          backend = replace_once(
              backend,
              '  uploadLockWaitMs: 2000,',
              """  uploadLockWaitMs: 2000,
            observerLeaseMs: 90000,
            observerLeaseCachePrefix: 'missionchief-observer-v1-',
            semanticObservationScanRows: 5000,""",
              'backend observer config'
          )
          backend = replace_once(
              backend,
              "        'retryable-upload-lock'",
              """        'retryable-upload-lock',
                  'multi-device-observer-lease',
                  'semantic-observation-dedupe'""",
              'backend features'
          )
          backend = replace_once(
              backend,
              """    if (action === 'upload') {
              response = handleLoggerUpload_(payload);
            } else if (action === 'pair' || action === 'revoke') {""",
              """    if (action === 'upload') {
              response = handleLoggerUpload_(payload);
            } else if (action === 'observer-lease') {
              response = handleLoggerObserverLease_(payload);
            } else if (action === 'pair' || action === 'revoke') {""",
              'observer action route'
          )

          backend_lease = r'''
          function handleLoggerObserverLease_(payload) {
            const profileId = cleanMissionChiefProfileId_(
              payload.profileId || payload.playerId
            );
            const deviceId = cleanIdentifier_(payload.deviceId, 160);
            if (!profileId || !deviceId) {
              throw loggerError_(
                'INVALID_OBSERVER_LEASE',
                'A numeric MissionChief profile ID and browser device ID are required.'
              );
            }

            const cache = CacheService.getScriptCache();
            const cacheKey = MC_LOGGER.observerLeaseCachePrefix + profileId;
            const now = Date.now();
            let current = null;
            try {
              const raw = cache.get(cacheKey);
              current = raw ? JSON.parse(raw) : null;
            } catch (error) {
              current = null;
            }

            const currentDeviceId = cleanIdentifier_(
              current && current.deviceId,
              160
            );
            const currentExpiresAt = Number(
              current && current.expiresAt || 0
            );
            if (
              currentDeviceId &&
              currentDeviceId !== deviceId &&
              currentExpiresAt > now
            ) {
              return {
                ok: true,
                action: 'observer-lease',
                playerId: profileId,
                deviceId: deviceId,
                observerOwner: false,
                ownerDeviceId: currentDeviceId,
                expiresAt: new Date(currentExpiresAt).toISOString(),
                retryAfterMs: Math.max(
                  5000,
                  Math.min(45000, currentExpiresAt - now)
                )
              };
            }

            const expiresAt = now + MC_LOGGER.observerLeaseMs;
            const lease = {
              deviceId: deviceId,
              expiresAt: expiresAt
            };
            cache.put(
              cacheKey,
              JSON.stringify(lease),
              Math.max(1, Math.ceil(MC_LOGGER.observerLeaseMs / 1000))
            );
            return {
              ok: true,
              action: 'observer-lease',
              playerId: profileId,
              deviceId: deviceId,
              observerOwner: true,
              ownerDeviceId: deviceId,
              expiresAt: new Date(expiresAt).toISOString(),
              leaseMs: MC_LOGGER.observerLeaseMs
            };
          }

          '''
          backend = replace_once(
              backend,
              'function handleLoggerPair_(payload) {',
              backend_lease + 'function handleLoggerPair_(payload) {',
              'backend lease helper'
          )

          observation_filter = r'''
          function filterSemanticDuplicateObservationRows_(eventSheet, prepared, batchId) {
            const existingByKey = {};
            const lastRow = eventSheet.getLastRow();
            const firstRow = Math.max(
              2,
              lastRow - MC_LOGGER.semanticObservationScanRows + 1
            );

            if (lastRow >= firstRow) {
              const existingRows = eventSheet.getRange(
                firstRow,
                1,
                lastRow - firstRow + 1,
                MC_LOGGER_SHEETS.events.headers.length
              ).getValues();
              existingRows.forEach(function(row) {
                if (
                  String(row[1] || '') === String(batchId || '') ||
                  String(row[4] || '').toLowerCase() !== 'mission-observed'
                ) return;
                const playerId = String(row[2] || '');
                const missionId = String(row[6] || '');
                if (playerId && missionId) {
                  existingByKey[playerId + '|' + missionId] = true;
                }
              });
            }

            const retainedEventRows = [];
            const retainedEventIds = {};
            let suppressedDuplicateEvents = Number(
              prepared.suppressedDuplicateEvents || 0
            );
            prepared.eventRows.forEach(function(row) {
              let duplicate = false;
              if (
                String(row[4] || '').toLowerCase() === 'mission-observed'
              ) {
                const playerId = String(row[2] || '');
                const missionId = String(row[6] || '');
                const key = playerId && missionId
                  ? playerId + '|' + missionId
                  : '';
                duplicate = Boolean(key && existingByKey[key]);
                if (key && !duplicate) existingByKey[key] = true;
              }
              if (duplicate) {
                suppressedDuplicateEvents += 1;
                return;
              }
              retainedEventRows.push(row);
              retainedEventIds[String(row[0] || '')] = true;
            });

            return {
              eventRows: retainedEventRows,
              unitRows: prepared.unitRows.filter(function(row) {
                return Boolean(retainedEventIds[String(row[0] || '')]);
              }),
              suppressedDuplicateEvents: suppressedDuplicateEvents
            };
          }

          '''
          backend = replace_once(
              backend,
              'function filterSemanticDuplicateDispatchRows_(eventSheet, prepared, batchId) {',
              observation_filter + 'function filterSemanticDuplicateDispatchRows_(eventSheet, prepared, batchId) {',
              'observation dedupe helper'
          )
          filter_call_old = """    const prepared = filterSemanticDuplicateDispatchRows_(
              eventSheet,
              preparedRaw,
              batchId
            );
            prepared.activityRows = preparedRaw.activityRows || [];"""
          filter_call_new = """    const observationPrepared =
              filterSemanticDuplicateObservationRows_(
                eventSheet,
                preparedRaw,
                batchId
              );
            const prepared = filterSemanticDuplicateDispatchRows_(
              eventSheet,
              observationPrepared,
              batchId
            );
            prepared.activityRows = preparedRaw.activityRows || [];
            prepared.suppressedDuplicateEvents =
              Number(observationPrepared.suppressedDuplicateEvents || 0) +
              Number(prepared.suppressedDuplicateEvents || 0);"""
          backend = replace_once(backend, filter_call_old, filter_call_new, 'semantic filter chain')
          backend = replace_once(
              backend,
              """    ['batch_ledger_retention_days', MC_LOGGER.batchLedgerRetentionDays, 'Retains compact accepted-batch identities across weekly rollovers.']""",
              """    ['batch_ledger_retention_days', MC_LOGGER.batchLedgerRetentionDays, 'Retains compact accepted-batch identities across weekly rollovers.'],
                ['observer_lease_ms', MC_LOGGER.observerLeaseMs, 'One browser per MissionChief player owns passive mission observation; all browsers still upload their own dispatch and completion actions.']""",
              'configuration observer seed'
          )

          source_path.write_text(source, encoding='utf-8')
          backend_path.write_text(backend, encoding='utf-8')

          # Permanent regression for the exact multi-device and lag-control contract.
          test_path = ROOT / 'scripts/check-multi-device-logger-v1112.mjs'
          test_path.write_text(textwrap.dedent(r'''
              import fs from 'node:fs';
              import assert from 'node:assert/strict';

              const source = fs.readFileSync('src/missionchief-command-nexus.user.js', 'utf8');
              const backend = fs.readFileSync('integrations/google-apps-script/Code.gs', 'utf8');

              assert.match(source, /@version\s+1\.1\.12/);
              assert.match(source, /MF_MISSION_LOGGER_CLIENT_VERSION\s*=\s*'1\.1\.12'/);
              assert.match(source, /function refreshMissionLoggerObserverLease\(/);
              assert.match(source, /'observer-lease'/);
              assert.match(source, /function isMissionLoggerPassiveObserver\(/);
              assert.match(source, /function recordMissionLoggerGeneratedMission[\s\S]{0,700}!isMissionLoggerPassiveObserver\(\)/);
              assert.match(source, /function scanMissionLoggerMissionList[\s\S]{0,500}!isMissionLoggerPassiveObserver\(\)/);
              assert.match(source, /function recordMissionLoggerObservedEvent[\s\S]{0,500}!isMissionLoggerPassiveObserver\(\)/);
              assert.match(source, /function installMissionLoggerDispatchCapture[\s\S]{0,1800}recordMissionLoggerDispatchFromControl/);
              assert.doesNotMatch(source, /function installMissionLoggerDispatchCapture[\s\S]{0,500}!isMissionLoggerPassiveObserver\(\)/);
              assert.match(source, /String\(event\.eventType \|\| ''\) !== 'mission-observed'/);
              assert.match(source, /requestIdleCallback/);
              assert.match(source, /MF_MISSION_LOGGER_DEVICE_UPLOAD_OFFSET_MAX_MS/);
              assert.match(source, /MF_MISSION_LOGGER_RETRY_JITTER_MAX_MS/);
              assert.match(source, /MF_MISSION_ACTIVITY_HEARTBEAT_INTERVAL_MS\s*=\s*\n\s*5 \* 60 \* 1000/);
              assert.match(source, /Share and sync my MissionChief activity automatically/);
              assert.doesNotMatch(source, /id="mf-mission-logger-sync"/);
              assert.doesNotMatch(source, /id="mf-mission-logger-endpoint"/);

              assert.match(backend, /buildId:\s*'1\.1\.12-multi-device-observer-1'/);
              assert.match(backend, /function handleLoggerObserverLease_\(/);
              assert.match(backend, /CacheService\.getScriptCache\(\)/);
              assert.match(backend, /multi-device-observer-lease/);
              assert.match(backend, /function filterSemanticDuplicateObservationRows_\(/);
              assert.match(backend, /String\(row\[1\] \|\| ''\) === String\(batchId \|\| ''\)/);
              assert.match(backend, /playerId \+ '\|' \+ missionId/);
              assert.match(backend, /filterSemanticDuplicateObservationRows_\([\s\S]{0,500}filterSemanticDuplicateDispatchRows_/);

              console.log('v1.1.12 multi-device logger and lag controls verified.');
          ''').lstrip(), encoding='utf-8')

          # Release notes and current-version documentation.
          changelog = (ROOT / 'CHANGELOG.md').read_text(encoding='utf-8')
          changelog = replace_once(
              changelog,
              "## [Unreleased]\n\nNo changes queued after `1.1.11`.\n",
              """## [Unreleased]

          No changes queued after `1.1.12`.

          ## [1.1.12] - 2026-08-19

          ### Fixed

          - Added a lightweight per-player observer lease so only one active computer records account-wide generated mission observations and runs periodic credit recovery. Every computer still records its own dispatches, selected units, completion, credits, distance, ETA and activity evidence.
          - Added server-side semantic deduplication for `mission-observed` events across different device batches while preserving same-batch idempotency and the existing dispatch-fingerprint repair contract.
          - Staggered periodic uploads by stable device ID and added bounded retry jitter, preventing two computers from repeatedly colliding on the same upload and retry schedule.

          ### Performance

          - Passive mission observations no longer trigger eager uploads, automatic drains are scheduled through browser idle time, and the activity heartbeat interval is reduced from once per minute to once every five minutes.
          - The passive observer lease uses Apps Script cache rather than workbook writes or the upload script lock, keeping coordination independent from mission batch processing.

          ### Deployment

          - Command Nexus is `1.1.12`; Mission Finder remains `V10.7.7` and the one-checkbox Sharing & Sync UI is unchanged.
          - Deploy backend build `1.1.12-multi-device-observer-1` as a new version of the existing Apps Script web app. The existing `/exec` URL remains unchanged. The client falls back to the v1.1.11 behaviour until that backend version is deployed.
          - Added `scripts/check-multi-device-logger-v1112.mjs` and retained all v1.1.10/v1.1.11 queue, ownership and private-endpoint regressions.
          """,
              'changelog release section'
          )
          (ROOT / 'CHANGELOG.md').write_text(changelog, encoding='utf-8')

          doc_replacements = {
              'README.md': [
                  ('**Current version:** `1.1.11`', '**Current version:** `1.1.12`'),
              ],
              'docs/ARCHITECTURE.md': [
                  ('current MissionChief Command Nexus v1.1.11', 'current MissionChief Command Nexus v1.1.12'),
              ],
              'docs/DEVELOPER_HANDOFF.md': [
                  ('| Command Nexus version | `1.1.11` |', '| Command Nexus version | `1.1.12` |'),
              ],
              'docs/README.md': [
                  ('current production baseline is Command Nexus `1.1.11`', 'current production baseline is Command Nexus `1.1.12`'),
              ],
              'src/README.md': [
                  ('Command Nexus `1.1.11`', 'Command Nexus `1.1.12`'),
              ],
              'integrations/google-apps-script/README.md': [
                  ('`1.1.10-upload-lock-hotfix-1`', '`1.1.12-multi-device-observer-1`'),
              ],
          }
          for filename, replacements in doc_replacements.items():
              path = ROOT / filename
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'{filename}: missing documentation marker {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          # Temporary workflow files must never reach the production PR diff.
          for temporary in [
              ROOT / '.github/workflows/tmp-v1112-inspect.yml',
              ROOT / '.github/workflows/tmp-v1112-build.yml',
          ]:
              if temporary.exists():
                  temporary.unlink()
          PY

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
          python3 scripts/check_workflow_yaml.py
          python3 -m py_compile scripts/check_repository.py
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No candidate changes produced"; exit 1; }
          git commit -m "Release v1.1.12 multi-device logger coordination"
          git push origin HEAD:hotfix/v1.1.12-multi-device-lag
