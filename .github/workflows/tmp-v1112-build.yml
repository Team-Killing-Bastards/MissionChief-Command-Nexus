name: Temporary v1.1.12 verified candidate carrier

on:
  push:
    branches:
      - hotfix/v1.1.12-multi-device-lag

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out verified patch carrier
        uses: actions/checkout@v6
        with:
          ref: hotfix/v1.1.12-multi-device-lag
          path: carrier
          fetch-depth: 1

      - name: Check out PR 368 candidate branch
        uses: actions/checkout@v6
        with:
          ref: release/v1.1.12-multi-device-performance
          path: candidate
          fetch-depth: 0

      - name: Apply exact locally verified candidate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "39482953143183376311ccfa59f1f11728a769b3"
          git apply --check ../carrier/scripts/tmp-v1112-verified-candidate.patch
          git apply ../carrier/scripts/tmp-v1112-verified-candidate.patch
          git diff --check

      - name: Run complete permanent validation
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
          python3 scripts/check_workflow_yaml.py
          python3 -m py_compile scripts/check_repository.py
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean v1.1.12 candidate to PR 368
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          if [ -d scripts/__pycache__ ]; then
            find scripts/__pycache__ -maxdepth 1 -type f -name '*.pyc' -delete
            rmdir scripts/__pycache__ 2>/dev/null || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No candidate changes produced"; exit 1; }
          git commit -m "Release v1.1.12 multi-device logger and performance improvements"
          git push origin HEAD:release/v1.1.12-multi-device-performance
