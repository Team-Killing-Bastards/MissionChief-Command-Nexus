name: Build validated v1.0.30 open issues batch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-v1.0.30-open-issues-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    name: Apply and validate all six issue fixes
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-open-issues-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Detect pending patch
        id: detect
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_BRANCH}" --force
          if git show "origin/${HEAD_BRANCH}:.diagnostics/v1.0.30-open-issues.patch.gz.b64" > /tmp/v1030.patch.gz.b64 2>/dev/null; then
            echo 'apply=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'apply=false' >> "${GITHUB_OUTPUT}"
            echo 'Validated source has already replaced the diagnostic branch.'
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.apply == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply exact v1.0.30 patch
        if: steps.detect.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/v1030.patch.gz.b64 | gzip --decompress > /tmp/v1030.patch
          git apply --check /tmp/v1030.patch
          git apply /tmp/v1030.patch
          git diff --check

      - name: Validate complete repository
        if: steps.detect.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node --check scripts/check-open-issues-batch.mjs
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-police-irv-fallback.mjs
          node scripts/check-ios-unit-finder-selection.mjs
          node scripts/check-ios-mission-requirements-source.mjs
          node scripts/check-iphone-mission-ui.mjs
          node scripts/check-open-issues-batch.mjs
          python3 scripts/check_repository.py
          git diff --check

      - name: Verify issue contracts
        if: steps.detect.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          required = {
              'version': '// @version      1.0.30',
              'mission finder': ' * MODULE 2: MISSION FINDER V10.6.95',
              'personnel': "const PERSONNEL_VERSION = '1.3.3';",
              'PSU type': "return '51';",
              'assigned button': "classList.contains('btn-assigned')",
              'remove binding': "Remove binding",
              'CRV exact type': "return typeIds.includes('57');",
              'Control Van exact type': "return typeIds.includes('85');",
              'structured vehicles': "[data-requirement-type=\"vehicles\"]",
              'shortage mode': "dispatchTargetMode: 'shortage'",
              'Police Officers conversion': 'personnelPerVehicle: 2',
              'HEMS type': "return typeIds.includes('9');",
              'trained ambulance type': "String(entry.vehicleTypeId || '') !== '5'",
              'critical care training': "critical_care",
              'iPhone desktop site': 'getMissionFinderPhoneScreenShortSide',
          }
          missing = [label for label, token in required.items() if token not in source]
          if missing:
              raise SystemExit('Missing issue contracts: ' + ', '.join(missing))
          print('All six issue contracts and the newer iPhone correction are present.')
          PY

      - name: Replace diagnostic branch with validated source
        if: steps.detect.outputs.apply == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Fix current MissionChief issues batch'
          git push --force origin "HEAD:refs/heads/${HEAD_BRANCH}"
          COMMIT_SHA="$(git rev-parse HEAD)"
          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "v1.0.30 source commit \`${COMMIT_SHA}\` passed the complete repository validation suite."
