name: V2 Discord title and publish once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v2-discord-publish-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set Long live V2 Discord title
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          edits = [
              (
                  Path('scripts/release-notify.mjs'),
                  "        title: '🧭 Mission Brief',",
                  "        title: version === '2.0.0' ? '🧭 Long live V2' : '🧭 Mission Brief',",
              ),
              (
                  Path('scripts/check-release-notification-single-delivery.mjs'),
                  '    "title: \'🧭 Mission Brief\'",',
                  '    "title: version === \'2.0.0\' ? \'🧭 Long live V2\' : \'🧭 Mission Brief\'",',
              ),
          ]

          for path, old, new in edits:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one target, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-use workflow and validate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v2-discord-publish-once.yml
          node --check scripts/release-notify.mjs
          node scripts/check-release-notification-single-delivery.mjs
          python3 scripts/check_workflow_yaml.py
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean release-control update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/release-notify.mjs scripts/check-release-notification-single-delivery.mjs
          git commit -m 'Set V2 Discord title to Long live V2'
          git push origin HEAD:main

      - name: Dispatch canonical V2 publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --ref main \
            -f operation=publish-release \
            -f release_tag=v2.0.0 \
            -f release_notes='Long live V2'
          echo 'Canonical v2.0.0 publication dispatched.'
