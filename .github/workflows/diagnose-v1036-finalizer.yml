name: Diagnose v1.0.36 finalizer verification

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  actions: read
  pull-requests: write

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/finalize-v1036'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report exact failed verifier lines
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: '30181762963'
        shell: bash
        run: |
          set -euo pipefail
          gh run view "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --log-failed > /tmp/v1036-failed.log 2>&1 || true

          {
            echo '## v1.0.36 verification failure detail'
            echo
            echo '```text'
            tail -n 80 /tmp/v1036-failed.log
            echo '```'
          } > /tmp/v1036-failed.md

          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/v1036-failed.md
