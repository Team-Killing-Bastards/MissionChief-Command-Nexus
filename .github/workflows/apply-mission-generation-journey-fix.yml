name: Apply mission generation and journey capture fix

on:
  push:
    branches:
      - fix/mission-generation-and-journey-capture
    paths:
      - .github/workflows/apply-mission-generation-journey-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: fix/mission-generation-and-journey-capture
          fetch-depth: 0

      - name: Extract and run staged builder
        shell: bash
        run: |
          set +e
          python3 <<'PY' > /tmp/builder-output.txt 2>&1
          from pathlib import Path

          source_path = Path('tmp/mission-generation-journey-builder-source.txt')
          raw = source_path.read_text(encoding='utf-8')

          for label in [
              'top-window logger startup',
              'existing top-window mutation observer integration',
          ]:
              label_token = f"              '{label}',"
              label_at = raw.index(label_token)
              call_at = raw.rfind('          source = replace_once(', 0, label_at)
              if call_at < 0:
                  raise SystemExit(f'Could not locate raw staged call for {label}')
              call_end = raw.index('\n          )', label_at) + len('\n          )')
              if call_end < len(raw) and raw[call_end] == '\n':
                  call_end += 1
              raw = raw[:call_at] + raw[call_end:]

          marker = "          python3 <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index("\n          PY\n", start)
          body = raw[start:end]
          rebuilt = []
          triple = None
          for line in body.splitlines():
              if triple is None:
                  output = line[10:] if line.startswith('          ') else line
                  single_count = output.count("'''")
                  double_count = output.count('"""')
                  if single_count % 2 == 1:
                      triple = "'''"
                  elif double_count % 2 == 1:
                      triple = '"""'
              else:
                  output = line
                  if output.count(triple) % 2 == 1:
                      triple = None
              rebuilt.append(output)
          if triple is not None:
              raise SystemExit(f'Unclosed staged builder string: {triple}')

          userscript_path = Path('src/missionchief-command-nexus.user.js')
          userscript = userscript_path.read_text(encoding='utf-8')
          observer_old = (
              "        if (MF_IS_TOP_WINDOW) {\n"
              "            startMissionLoggerSyncTimer();\n"
              "        }\n"
          )
          observer_new = (
              "        if (MF_IS_TOP_WINDOW) {\n"
              "            installMissionLoggerMissionGenerationCapture();\n"
              "            startMissionLoggerSyncTimer();\n"
              "        }\n"
          )
          mutation_old = (
              "        mfMainMutationObserver = new MutationObserver(records => {\n"
              "            releaseRemovedMissionFinderFrameRuntimes(records);\n"
              "            scheduleMissionFinderMutationWork(records);\n"
              "        });\n"
          )
          mutation_new = (
              "        mfMainMutationObserver = new MutationObserver(records => {\n"
              "            releaseRemovedMissionFinderFrameRuntimes(records);\n"
              "            if (MF_IS_TOP_WINDOW) {\n"
              "                observeMissionLoggerMissionListMutations(records);\n"
              "            }\n"
              "            scheduleMissionFinderMutationWork(records);\n"
              "        });\n"
          )
          if userscript.count(observer_old) != 1:
              raise SystemExit('Could not locate top-window observer startup')
          if userscript.count(mutation_old) != 1:
              raise SystemExit('Could not locate main mutation observer')
          userscript = userscript.replace(observer_old, observer_new, 1)
          userscript = userscript.replace(mutation_old, mutation_new, 1)
          userscript_path.write_text(userscript, encoding='utf-8')

          script_path = Path('/tmp/apply-mission-generation-journey.py')
          script_path.write_text('\n'.join(rebuilt) + '\n', encoding='utf-8')
          PY
          status=$?

          if [ "$status" -eq 0 ]; then
            python3 -m py_compile /tmp/apply-mission-generation-journey.py >> /tmp/builder-output.txt 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python3 /tmp/apply-mission-generation-journey.py >> /tmp/builder-output.txt 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            python3 <<'PY' >> /tmp/builder-output.txt 2>&1
          from pathlib import Path

          path = Path('src/missionchief-command-nexus.user.js')
          source = path.read_text(encoding='utf-8')
          marker = 'function sortVehicleCheckboxesByBestArrival('
          start = source.index(marker)
          brace = source.index('{', start)
          depth = 0
          quote = None
          escaped = False
          line_comment = False
          block_comment = False
          end = None
          index = brace
          while index < len(source):
              character = source[index]
              next_character = source[index + 1] if index + 1 < len(source) else ''
              if line_comment:
                  if character == '\n':
                      line_comment = False
                  index += 1
                  continue
              if block_comment:
                  if character == '*' and next_character == '/':
                      block_comment = False
                      index += 2
                      continue
                  index += 1
                  continue
              if quote:
                  if escaped:
                      escaped = False
                  elif character == '\\':
                      escaped = True
                  elif character == quote:
                      quote = None
                  index += 1
                  continue
              if character == '/' and next_character == '/':
                  line_comment = True
                  index += 2
                  continue
              if character == '/' and next_character == '*':
                  block_comment = True
                  index += 2
                  continue
              if character in ('"', "'", '`'):
                  quote = character
                  index += 1
                  continue
              if character == '{':
                  depth += 1
              elif character == '}':
                  depth -= 1
                  if depth == 0:
                      end = index + 1
                      break
              index += 1
          if end is None:
              raise SystemExit('Unable to bound arrival sorter')

          replacement = r'''function sortVehicleCheckboxesByBestArrival(matches) {
        const getMetrics = input => {
            const now = Date.now();
            const cached = mfVehicleArrivalMetricCache.get(input);

            if (cached && now < cached.expiresAt) {
                return cached;
            }

            const row = input?.closest?.('tr');
            const fallbackMetric = name => {
                const value = Number(
                    row?.getAttribute?.(name)
                );
                return Number.isFinite(value) && value >= 0
                    ? value
                    : null;
            };
            const journey =
                typeof readMissionLoggerUnitJourneyMetrics ===
                    'function'
                    ? readMissionLoggerUnitJourneyMetrics(input)
                    : {
                        estimatedEtaSeconds:
                            fallbackMetric('data-sortvalue') ??
                            fallbackMetric('timevalue'),
                        estimatedDistanceKm:
                            fallbackMetric('data-distance')
                    };
            const metrics = {
                delay:
                    journey.estimatedEtaSeconds ?? 999999,
                distance:
                    journey.estimatedDistanceKm ?? 999999,
                expiresAt: now + 500
            };

            mfVehicleArrivalMetricCache.set(input, metrics);
            return metrics;
        };

        matches.sort((a, b) => {
            const metricsA = getMetrics(a);
            const metricsB = getMetrics(b);
            return (
                metricsA.delay - metricsB.delay ||
                metricsA.distance - metricsB.distance
            );
        });

        return matches;
    }'''
          path.write_text(
              source[:start] + replacement + source[end:],
              encoding='utf-8'
          )
          PY
            status=$?
          fi

          cat /tmp/builder-output.txt
          if [ "$status" -ne 0 ]; then
            mkdir -p tmp
            cp /tmp/builder-output.txt tmp/mission-generation-builder-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tmp/mission-generation-builder-error.txt
            git commit -m "Record mission logger builder failure" || true
            git push origin HEAD:fix/mission-generation-and-journey-capture
            exit "$status"
          fi
          rm -f tmp/mission-generation-journey-builder-source.txt
          rm -f tmp/mission-generation-builder-error.txt

      - name: Validate JavaScript syntax
        shell: bash
        run: node -e "new Function(require('fs').readFileSync('src/missionchief-command-nexus.user.js','utf8'))"

      - name: Run targeted logger regressions
        shell: bash
        run: |
          node scripts/check-mission-generation-logger.mjs
          node scripts/check-mission-journey-metrics.mjs
          node scripts/check-mission-user-logger.mjs
          node scripts/check-logger-dashboard-rebuild-safety.mjs

      - name: Run all permanent regressions
        shell: bash
        run: |
          set +e
          mkdir -p tmp
          : > tmp/mission-generation-regression-error.txt
          status=0
          for test in scripts/check-*.mjs; do
            echo "==> $test" | tee -a tmp/mission-generation-regression-error.txt
            node "$test" 2>&1 | tee -a tmp/mission-generation-regression-error.txt
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              break
            fi
          done
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tmp/mission-generation-regression-error.txt
            git commit -m "Record mission logger regression failure" || true
            git push origin HEAD:fix/mission-generation-and-journey-capture
            exit "$status"
          fi
          rm -f tmp/mission-generation-regression-error.txt

      - name: Validate release and repository
        shell: bash
        run: |
          node scripts/validate-userscript.mjs --base-ref origin/main
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit production change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v1.1.3 mission generation and journey capture"
          git push origin HEAD:fix/mission-generation-and-journey-capture
