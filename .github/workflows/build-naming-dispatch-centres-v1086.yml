name: Build naming Dispatch Centres v1.0.86
on:
  push:
    branches:
      - main
    paths:
      - '.github/v1086-naming-build-trigger.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/naming-dispatch-centres-v1086
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v1.0.86 correction
        run: python3 scripts/build-naming-dispatch-centres-v1086.py
      - name: Validate JavaScript syntax
        run: node --check src/missionchief-command-nexus.user.js
      - name: Run permanent regressions
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/check-*.mjs; do
            echo "==> $f"
            node "$f"
          done
      - name: Ensure no whitespace errors
        run: git diff --check
      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/missionchief-command-nexus.user.js README.md CHANGELOG.md src/README.md scripts/check-*.mjs
          if git diff --cached --quiet; then
            echo 'No candidate changes produced'
            exit 1
          fi
          git commit -m 'Fix Dispatch Centre-first naming filters for v1.0.86'
          git push origin HEAD:fix/naming-dispatch-centres-v1086
