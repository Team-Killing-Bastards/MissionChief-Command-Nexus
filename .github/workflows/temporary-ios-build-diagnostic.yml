name: Diagnose iOS compatibility build failure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - '.github/workflows/temporary-ios-build-diagnostic.yml'

permissions:
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print final compatibility build lines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/88812796265/logs" \
            > /tmp/ios-build.log

          echo '===== FINAL COMPATIBILITY COMMIT FAILURE ====='
          tail -n 100 /tmp/ios-build.log
