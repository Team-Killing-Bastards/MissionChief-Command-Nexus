name: Diagnose iOS compatibility build failure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - '.github/workflows/temporary-ios-build-diagnostic.yml'

permissions:
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print exact git failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/88812965548/logs" \
            > /tmp/ios-build.log

          echo '===== EXACT GIT FAILURE ====='
          grep -n -E -i \
            'fatal:|error:|pathspec|rejected|failed to push|nothing added|did not match|git commit|git push|Process completed' \
            /tmp/ios-build.log \
            | tail -n 60 || true
