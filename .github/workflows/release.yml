name: Create GitHub release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: create-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package userscript release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm tagged commit is contained in main
        shell: bash
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not contained in origin/main."
            exit 1
          fi

      - name: Validate repository and userscript
        run: |
          python3 scripts/check_repository.py
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs

      - name: Confirm tag matches userscript version
        shell: bash
        run: |
          SCRIPT_VERSION="$(node scripts/validate-userscript.mjs --print-version)"
          EXPECTED_TAG="v${SCRIPT_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match @version ${SCRIPT_VERSION}. Expected ${EXPECTED_TAG}."
            exit 1
          fi

      - name: Prepare release asset and checksum
        shell: bash
        run: |
          SCRIPT_VERSION="$(node scripts/validate-userscript.mjs --print-version)"
          ASSET="MissionChief-Command-Nexus-${SCRIPT_VERSION}.user.js"
          cp src/missionchief-command-nexus.user.js "${ASSET}"
          sha256sum "${ASSET}" > "${ASSET}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SCRIPT_VERSION="$(node scripts/validate-userscript.mjs --print-version)"
          ASSET="MissionChief-Command-Nexus-${SCRIPT_VERSION}.user.js"
          gh release create "${GITHUB_REF_NAME}" \
            "${ASSET}" \
            "${ASSET}.sha256" \
            --title "MissionChief Command Nexus ${SCRIPT_VERSION}" \
            --generate-notes \
            --verify-tag
