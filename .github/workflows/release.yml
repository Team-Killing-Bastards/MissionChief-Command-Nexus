name: Create GitHub release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose prepare-version first, then publish-release after the version PR is merged.'
        required: true
        default: prepare-version
        type: choice
        options:
          - prepare-version
          - publish-release
      release_tag:
        description: 'Release tag, for example v1.0.2. Publish may be left blank to use the current @version on main.'
        required: false
        type: string
      release_notes:
        description: 'Short changelog summary used when preparing a new version.'
        required: false
        default: 'Release preparation and verified deployment notification updates.'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: create-release-${{ github.event_name }}-${{ inputs.operation || 'tag' }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version pull request
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-version'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare version branch and pull request
        id: prepare_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          git fetch origin main --tags
          git checkout -B main origin/main

          RELEASE_TAG="${REQUESTED_TAG#refs/tags/}"

          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "A release tag is required in prepare-version mode."
            echo "Example: v1.0.2"
            exit 1
          fi

          if [[ "${RELEASE_TAG}" != v* ]]; then
            RELEASE_TAG="v${RELEASE_TAG}"
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"

          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${RELEASE_VERSION}"
            exit 1
          fi

          CURRENT_VERSION="$(
            node scripts/validate-userscript.mjs --print-version
          )"

          if [[ "${CURRENT_VERSION}" == "${RELEASE_VERSION}" ]]; then
            {
              echo "### Release version already prepared"
              echo "- Current version: \`${CURRENT_VERSION}\`"
              echo "- Next action: run this workflow using \`publish-release\`."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if git show-ref --tags --verify --quiet \
            "refs/tags/${RELEASE_TAG}"; then

            TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
            TAG_VERSION="$(
              git show "${TAG_SHA}:src/missionchief-command-nexus.user.js" |
                sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' |
                head -n 1 |
                xargs
            )"

            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Tag ${RELEASE_TAG} already has a GitHub Release; refusing to delete it."
              exit 1
            fi

            if [[ "${TAG_VERSION}" == "${RELEASE_VERSION}" ]]; then
              echo "Tag ${RELEASE_TAG} already points to matching version ${TAG_VERSION}."
              echo "Prepare the version from that tagged commit or choose a new version."
              exit 1
            fi

            echo "Removing stale tag ${RELEASE_TAG}, which points to source version ${TAG_VERSION}."
            git tag -d "${RELEASE_TAG}"
            git push origin ":refs/tags/${RELEASE_TAG}"
          fi

          export RELEASE_VERSION CURRENT_VERSION RELEASE_NOTES

          python3 <<'PY'
          from __future__ import annotations

          import datetime as dt
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"].strip()
          current = os.environ["CURRENT_VERSION"].strip()
          notes = os.environ.get("RELEASE_NOTES", "").strip()
          if not notes:
              notes = "Release preparation and verified deployment updates."

          source_path = Path("src/missionchief-command-nexus.user.js")
          source = source_path.read_text(encoding="utf-8")
          source, count = re.subn(
              r"^(//\s*@version\s+)\S+(\s*)$",
              rf"\g<1>{version}\g<2>",
              source,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not update canonical userscript @version")
          source_path.write_text(source, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme, count = re.subn(
              r"(\*\*Current version:\*\*\s*`)[^`]+(`)",
              rf"\g<1>{version}\g<2>",
              readme,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update README current version")
          readme = re.sub(
              r"Command Nexus v\S+ is a single userscript",
              f"Command Nexus v{version} is a single userscript",
              readme,
              count=1,
          )
          readme_path.write_text(readme, encoding="utf-8")

          source_readme_path = Path("src/README.md")
          source_readme = source_readme_path.read_text(encoding="utf-8")
          source_readme, count = re.subn(
              r"(\|\s*Command Nexus version\s*\|\s*`)[^`]+(`\s*\|)",
              rf"\g<1>{version}\g<2>",
              source_readme,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update src/README.md version")
          source_readme_path.write_text(source_readme, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          release_heading = re.compile(
              rf"^## \[{re.escape(version)}\](?:\s+-.*)?\s*$",
              re.MULTILINE,
          )

          if not release_heading.search(changelog):
              current_heading = re.search(
                  rf"^## \[{re.escape(current)}\](?:\s+-.*)?\s*$",
                  changelog,
                  re.MULTILINE,
              )
              if not current_heading:
                  raise SystemExit(
                      f"Could not find changelog section for current version {current}"
                  )

              bullet_lines = []
              for line in notes.splitlines():
                  cleaned = line.strip().removeprefix("-").strip()
                  if cleaned:
                      bullet_lines.append(f"- {cleaned}")
              if not bullet_lines:
                  bullet_lines = ["- Release preparation and verified deployment updates."]

              section = (
                  f"## [{version}] - {dt.date.today().isoformat()}\n\n"
                  "### Changed\n\n"
                  + "\n".join(bullet_lines)
                  + "\n"
                  + f"- Increased the unified userscript version from `{current}` to `{version}`.\n\n"
              )
              changelog = (
                  changelog[: current_heading.start()]
                  + section
                  + changelog[current_heading.start() :]
              )
              changelog_path.write_text(changelog, encoding="utf-8")
          PY

          node --check src/missionchief-command-nexus.user.js
          node --check scripts/release-notify.mjs
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          git diff --check

          RELEASE_BRANCH="release/${RELEASE_TAG}"
          git checkout -B "${RELEASE_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/missionchief-command-nexus.user.js \
            README.md \
            src/README.md \
            CHANGELOG.md

          git commit -m "Prepare ${RELEASE_TAG}"
          git push --force origin \
            "HEAD:refs/heads/${RELEASE_BRANCH}"

          PR_URL="$(
            gh pr list \
              --head "${RELEASE_BRANCH}" \
              --base main \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -z "${PR_URL}" ]]; then
            cat > release-pr-body.md <<EOF
          ## Release preparation

          - Updates the canonical userscript and documentation to \`${RELEASE_VERSION}\`.
          - Adds the matching changelog section.
          - Runs userscript syntax, metadata and repository integrity checks before opening this PR.

          After merging, run **Create GitHub release** again using **publish-release** and \`${RELEASE_TAG}\`.
          EOF

            PR_URL="$(
              gh pr create \
                --base main \
                --head "${RELEASE_BRANCH}" \
                --title "Prepare ${RELEASE_TAG}" \
                --body-file release-pr-body.md
            )"
          fi

          {
            echo "### Release preparation complete"
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Tag reserved for publication: \`${RELEASE_TAG}\`"
            echo "- Pull request: ${PR_URL}"
            echo "- Next action: merge the PR, then run \`publish-release\`."
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    name: Package, verify and announce userscript release
    if: github.event_name == 'push' || inputs.operation == 'publish-release'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve and verify release context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          git fetch origin main --tags

          SCRIPT_VERSION="$(
            node scripts/validate-userscript.mjs --print-version
          )"
          EXPECTED_TAG="v${SCRIPT_VERSION}"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${REQUESTED_TAG#refs/tags/}"

            if [[ -z "${RELEASE_TAG}" ]]; then
              RELEASE_TAG="${EXPECTED_TAG}"
            elif [[ "${RELEASE_TAG}" != v* ]]; then
              RELEASE_TAG="v${RELEASE_TAG}"
            fi

            RELEASE_SHA="$(git rev-parse origin/main)"
            git checkout --detach "${RELEASE_SHA}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_SHA="${GITHUB_SHA}"
          fi

          if [[ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match @version ${SCRIPT_VERSION}."
            echo "Expected tag: ${EXPECTED_TAG}"
            echo "Use prepare-version first when publishing a new version."
            exit 1
          fi

          if ! git merge-base --is-ancestor \
            "${RELEASE_SHA}" origin/main; then

            echo "Release commit ${RELEASE_SHA} is not contained in origin/main."
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if git show-ref --tags --verify --quiet \
              "refs/tags/${RELEASE_TAG}"; then

              TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"

              if [[ "${TAG_SHA}" != "${RELEASE_SHA}" ]]; then
                echo "Existing tag ${RELEASE_TAG} points to ${TAG_SHA}."
                echo "Current main is ${RELEASE_SHA}; refusing to move the tag."
                exit 1
              fi
            else
              git config user.name "github-actions[bot]"
              git config user.email \
                "41898282+github-actions[bot]@users.noreply.github.com"

              git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" \
                -m "MissionChief Command Nexus ${SCRIPT_VERSION}"

              git push origin "refs/tags/${RELEASE_TAG}"
            fi
          fi

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          echo "RELEASE_SHA=${RELEASE_SHA}" >> "${GITHUB_ENV}"

          {
            echo "### Release context"
            echo "- Event: ${EVENT_NAME}"
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Version: \`${SCRIPT_VERSION}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate repository and userscript
        run: |
          python3 scripts/check_repository.py
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node --check scripts/release-notify.mjs

      - name: Confirm changelog contains mission brief
        shell: bash
        run: |
          SCRIPT_VERSION="$(
            node scripts/validate-userscript.mjs --print-version
          )"

          if ! grep -Fq "## [${SCRIPT_VERSION}]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a release section for ${SCRIPT_VERSION}."
            exit 1
          fi

      - name: Confirm deployment configuration
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          GREASYFORK_PAGE_URL: ${{ vars.GREASYFORK_PAGE_URL }}
        run: |
          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "Missing DISCORD_RELEASE_WEBHOOK repository secret."
            exit 1
          fi

          if [[ -z "${GREASYFORK_INSTALL_URL}" ]]; then
            echo "Missing GREASYFORK_INSTALL_URL repository variable."
            exit 1
          fi

          if [[ -z "${GREASYFORK_PAGE_URL}" ]]; then
            echo "Missing GREASYFORK_PAGE_URL repository variable."
            exit 1
          fi

      - name: Prepare release asset, checksum and patch log
        shell: bash
        run: |
          SCRIPT_VERSION="$(
            node scripts/validate-userscript.mjs --print-version
          )"

          ASSET="MissionChief-Command-Nexus-${SCRIPT_VERSION}.user.js"

          cp src/missionchief-command-nexus.user.js "${ASSET}"
          sha256sum "${ASSET}" > "${ASSET}.sha256"

          python3 - \
            "${SCRIPT_VERSION}" \
            "${RELEASE_SHA}" \
            "${ASSET}.sha256" <<'PY'
          import re
          import sys
          from pathlib import Path

          version, commit_sha, checksum_path = sys.argv[1:]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")

          heading = re.search(
              rf"^## \[{re.escape(version)}\](?:\s+-.*)?\s*$",
              changelog,
              re.MULTILINE,
          )
          if not heading:
              raise SystemExit(
                  f"CHANGELOG.md has no release section for {version}"
              )

          remaining = changelog[heading.end():]
          next_heading = re.search(r"^##\s+", remaining, re.MULTILINE)
          section = (
              remaining[:next_heading.start()]
              if next_heading
              else remaining
          ).strip()
          if not section:
              raise SystemExit(
                  f"CHANGELOG.md release section for {version} is empty"
              )

          checksum = Path(checksum_path).read_text(
              encoding="utf-8"
          ).split()[0]

          notes = (
              f"## Mission Brief\n\n{section}\n\n"
              f"## Build Verification\n\n"
              f"- Source commit: `{commit_sha}`\n"
              f"- SHA-256: `{checksum}`\n"
          )

          Path("release-notes.md").write_text(
              notes,
              encoding="utf-8",
          )
          PY

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SCRIPT_VERSION="$(
            node scripts/validate-userscript.mjs --print-version
          )"

          ASSET="MissionChief-Command-Nexus-${SCRIPT_VERSION}.user.js"
          TITLE="MissionChief Command Nexus ${SCRIPT_VERSION}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "${ASSET}" \
              "${ASSET}.sha256" \
              --clobber

            gh release edit "${RELEASE_TAG}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "${RELEASE_TAG}" \
              "${ASSET}" \
              "${ASSET}.sha256" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Verify published GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          SCRIPT_VERSION="$(
            node scripts/validate-userscript.mjs --print-version
          )"

          ASSET="MissionChief-Command-Nexus-${SCRIPT_VERSION}.user.js"
          mkdir -p release-check

          gh release view "${RELEASE_TAG}" \
            --json url \
            --jq '.url'

          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${ASSET}.sha256" \
            --dir release-check \
            --clobber

          cmp --silent "${ASSET}" "release-check/${ASSET}"
          cmp --silent "${ASSET}.sha256" "release-check/${ASSET}.sha256"

      - name: Verify deployment and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          GREASYFORK_PAGE_URL: ${{ vars.GREASYFORK_PAGE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_PATH: src/missionchief-command-nexus.user.js
          CHANGELOG_PATH: CHANGELOG.md
          PRODUCT_NAME: MissionChief Command Nexus
        run: |
          node scripts/release-notify.mjs
