name: Publish v1.0.24 to GitHub Greasy Fork and Discord

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-v1.0.24-direct
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verify and announce v1.0.24
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/normal-irv-selection'
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.24
      release_notes: Restores normal Police Car and type-8 IRV selection in manual Unit Finder and Auto Mode, uses specialist-trained IRVs only as a final fallback, and restores Police Officer Missing Personnel conversion at two officers per car.
    secrets: inherit

  receipt:
    name: Record v1.0.24 publication result
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comment publication result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_RESULT}" == 'success' ]]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body 'v1.0.24 published successfully: GitHub assets verified, Greasy Fork exact source parity confirmed and Discord notified.'
          else
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "v1.0.24 publication finished with result: ${PUBLISH_RESULT}."
            exit 1
          fi
