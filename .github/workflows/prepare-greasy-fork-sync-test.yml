name: Prepare Greasy Fork sync test

on:
  push:
    branches:
      - agent/greasy-fork-sync-test-v1.0.1
    paths:
      - .github/workflows/prepare-greasy-fork-sync-test.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release-test branch
        uses: actions/checkout@v4
        with:
          ref: agent/greasy-fork-sync-test-v1.0.1
          fetch-depth: 0

      - name: Prepare version 1.0.1 sync test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('src/missionchief-command-nexus.user.js')
          script = script_path.read_text(encoding='utf-8')
          old_version = '// @version      1.0.0'
          new_version = '// @version      1.0.1'

          if script.count(old_version) != 1:
              raise SystemExit(f'Expected exactly one {old_version!r} line')

          script_path.write_text(
              script.replace(old_version, new_version, 1),
              encoding='utf-8'
          )

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n'
          entry = (
              '## [Unreleased]\n\n'
              '### Changed\n\n'
              '- Published version `1.0.1` as a no-functional-change Greasy Fork synchronization test.\n'
              '- Confirmed the canonical update path from approved `main` to the Greasy Fork listing.\n'
          )

          if marker not in changelog:
              raise SystemExit('Unreleased changelog heading was not found')

          changelog_path.write_text(
              changelog.replace(marker, entry, 1),
              encoding='utf-8'
          )
          PY

      - name: Validate prepared release
        shell: bash
        run: |
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py

      - name: Commit prepared release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/missionchief-command-nexus.user.js CHANGELOG.md
          git commit -m "Prepare Greasy Fork sync test v1.0.1"
          git push origin HEAD:agent/greasy-fork-sync-test-v1.0.1
