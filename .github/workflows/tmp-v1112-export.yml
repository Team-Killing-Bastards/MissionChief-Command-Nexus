name: Temporary v1.1.12 source export

on:
  push:
    branches:
      - hotfix/v1.1.12-multi-device-lag
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: v1112-source-export
          path: |
            src/missionchief-command-nexus.user.js
            integrations/google-apps-script/Code.gs
            scripts
            README.md
            CHANGELOG.md
            docs
          retention-days: 1
