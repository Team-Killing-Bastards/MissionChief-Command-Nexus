name: Run mission-definition trained personnel v1.0.54 builder

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: run-mission-definition-trained-personnel-v1054-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/mission-definition-trained-personnel-v1054'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: agent/mission-definition-trained-personnel-v1054
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Extract and apply candidate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/build-mission-definition-trained-personnel-v1054.yml')
          text = workflow.read_text(encoding='utf-8')
          match = re.search(r'^\s*PATCH_B64:\s*(\S+)\s*$', text, re.MULTILINE)
          if not match:
              raise SystemExit('PATCH_B64 was not found in the candidate workflow')
          payload = gzip.decompress(base64.b64decode(match.group(1)))
          patcher = Path('scripts/apply-mission-definition-trained-personnel-v1054.py')
          patcher.write_bytes(payload)
          PY
          python3 scripts/apply-mission-definition-trained-personnel-v1054.py
          git diff --check

      - name: Validate complete candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          for test in scripts/check-*.mjs; do
            echo "Running ${test}"
            node "$test"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit and push validated candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Use mission definition trained personnel in Unit Finder'
          git push origin HEAD:refs/heads/agent/mission-definition-trained-personnel-v1054
          SHA="$(git rev-parse HEAD)"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "## Purpose\n\nUse the mission-definition **Required Personnel** row during initial manual Unit Finder and Automatic Unit Finder selection.\n\n## Supplied fixture\n\n- 22x Level 2 Public Order Officer\n- 4x Police Medic\n- 5x Police Sergeant\n- 2x Police Inspector\n\n## Behaviour\n\n- Parses the combined cell into the existing trained-profile optimiser.\n- Uses the authoritative Personnel Register and actual assigned training profiles.\n- Counts multi-trained staff toward every matching course.\n- Keeps later upgrades governed by current live Missing Personnel/Vehicle rows, preventing the static totals being applied twice.\n\n## Release\n\n- Command Nexus `1.0.54`\n- Mission Finder `V10.6.117`\n- Personnel Assignment `1.3.7`\n\nThe supplied HTML fixture and shared manual/automatic path have permanent regression coverage. Full repository validation passed.\n\nValidated commit: `${SHA}`."
