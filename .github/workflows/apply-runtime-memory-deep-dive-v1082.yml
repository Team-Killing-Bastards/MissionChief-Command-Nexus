name: Apply runtime memory deep-dive v1.0.82

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.runtime-memory-fix-v1082-trigger'
      - '.github/builders/apply-runtime-memory-deep-dive-v1082.py'
      - '.github/builders/run-runtime-memory-deep-dive-v1082.py'
      - '.github/workflows/apply-runtime-memory-deep-dive-v1082.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-memory-deep-dive-v1082
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply runtime memory hardening
        run: python3 .github/builders/run-runtime-memory-deep-dive-v1082.py

      - name: Validate complete candidate
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for test in scripts/check-*.mjs; do
            echo "Running ${test}"
            node "$test"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit validated permanent changes
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add \
            src/missionchief-command-nexus.user.js \
            src/README.md \
            README.md \
            CHANGELOG.md \
            scripts \
            .github/workflows/validate-userscript.yml
          git commit -m 'Harden idle and Auto Mode runtime memory paths'
          git push origin HEAD:fix/runtime-memory-deep-dive-v1082
