name: Prepare v1.0.37 Personnel Register release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-personnel-register-v1037.yml'

permissions:
  contents: write

concurrency:
  group: prepare-v1037-personnel-register
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: agent/release-personnel-register-v1037
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore Personnel Register integration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          PR156_BASE='7c00109945f4968ce02501069cc8b479f419a838'
          PR156_MERGE='7f0a7c279849f034f39c7fc1d47efcce5d650987'
          SOURCE='src/missionchief-command-nexus.user.js'

          git cat-file -e "${PR156_BASE}^{commit}"
          git cat-file -e "${PR156_MERGE}^{commit}"
          git diff --binary "${PR156_BASE}" "${PR156_MERGE}" -- "${SOURCE}" > /tmp/pr156-source.patch
          test -s /tmp/pr156-source.patch
          git apply --3way /tmp/pr156-source.patch

          python3 <<'PY'
          from pathlib import Path

          source_path = Path('src/missionchief-command-nexus.user.js')
          source = source_path.read_text(encoding='utf-8')

          latest_tokens = [
              ' * MODULE 2: MISSION FINDER V10.6.101',
              'const MF_PSU_COMPATIBLE_TRAINING_CODES =',
              'function applyTrainingCandidateCoverage(',
              'runSelectionPhase(true);',
              'runSelectionPhase(false);',
              'compatible units were still selected and can be sent',
          ]
          for token in latest_tokens:
              if token not in source:
                  raise SystemExit(f'Latest trained-coverage contract missing: {token}')

          register_tokens = [
              "const PERSONNEL_VERSION = '1.3.4';",
              'Build All Register',
              'mc-personnel-export-register',
              'mc-personnel-import-register',
              'mc-personnel-register-status',
              'function exportPersonnelTrainingRegistry()',
              'async function importPersonnelTrainingRegistry(file)',
              'const registryRetained = getPersonnelTrainingRegistryStats().count;',
          ]
          for token in register_tokens:
              if token not in source:
                  raise SystemExit(f'Personnel Register contract missing: {token}')

          if '// @version      1.0.36' not in source:
              raise SystemExit('Expected current canonical version 1.0.36')
          source = source.replace('// @version      1.0.36', '// @version      1.0.37', 1)
          source_path.write_text(source, encoding='utf-8')

          for path in Path('scripts').glob('*.mjs'):
              text = path.read_text(encoding='utf-8')
              text = text.replace("requireText('// @version      1.0.36'", "requireText('// @version      1.0.37'")
              text = text.replace("'v1.0.36 metadata'", "'v1.0.37 metadata'")
              if path.name == 'check-open-issues-batch.mjs':
                  text = text.replace("const PERSONNEL_VERSION = '1.3.3';", "const PERSONNEL_VERSION = '1.3.4';")
                  text = text.replace("'Personnel v1.3.3'", "'Personnel v1.3.4'")
              path.write_text(text, encoding='utf-8')

          Path('scripts/check-personnel-register-transfer.mjs').write_text(r'''#!/usr/bin/env node

import { readFile } from 'node:fs/promises';

const source = await readFile('src/missionchief-command-nexus.user.js', 'utf8');

function fail(message) {
  console.error(`ERROR: ${message}`);
  process.exit(1);
}

for (const [token, label] of [
  ['// @version      1.0.37', 'v1.0.37 metadata'],
  ["const PERSONNEL_VERSION = '1.3.4';", 'Personnel v1.3.4'],
  [' * MODULE 2: MISSION FINDER V10.6.101', 'latest Mission Finder baseline'],
  ['Build All Register', 'readable all-station register action'],
  ['id="mc-personnel-export-register"', 'register export control'],
  ['id="mc-personnel-import-register"', 'register import control'],
  ['id="mc-personnel-register-status"', 'register status display'],
  ['function exportPersonnelTrainingRegistry()', 'register export implementation'],
  ['async function importPersonnelTrainingRegistry(file)', 'register import implementation'],
  ['PERSONNEL_TRAINING_REGISTRY_IMPORT_MAX_BYTES', 'import file-size limit'],
  ['PERSONNEL_TRAINING_REGISTRY_MAX_VEHICLES', 'vehicle-count limit'],
  ['isUnsafePersonnelTrainingRegistryKey', 'unsafe-key rejection'],
  ['const registryRetained = getPersonnelTrainingRegistryStats().count;', 'accurate retained count'],
  ['const MF_PSU_COMPATIBLE_TRAINING_CODES =', 'trained coverage optimiser'],
  ['function applyTrainingCandidateCoverage(', 'trained coverage allocation'],
]) {
  if (!source.includes(token)) fail(`Missing Personnel Register release contract: ${label}`);
}

console.log('Personnel Register transfer and latest trained-coverage contracts passed.');
''', encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          if '**Current version:** `1.0.36`' not in text:
              raise SystemExit('README current version 1.0.36 not found')
          readme.write_text(text.replace('**Current version:** `1.0.36`', '**Current version:** `1.0.37`', 1), encoding='utf-8')

          source_readme = Path('src/README.md')
          text = source_readme.read_text(encoding='utf-8')
          if '| Command Nexus version | `1.0.36` |' not in text:
              raise SystemExit('Source README current version 1.0.36 not found')
          source_readme.write_text(text.replace('| Command Nexus version | `1.0.36` |', '| Command Nexus version | `1.0.37` |', 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## [1.0.36] - 2026-07-26'
          if marker not in text:
              raise SystemExit('Unable to find v1.0.36 changelog marker')
          entry = '''## [1.0.37] - 2026-07-26

### Restored

- Restored Personnel Assignment `1.3.4` on top of the latest `main` source.
- Restored the readable **Build All Register** action, JSON register export/import, saved-register status, and accurate retained-register reporting.

### Preserved

- Preserved Mission Finder `V10.6.101`, the trained-personnel coverage optimiser, PSU/IRV multi-trained allocation, compatible fallback selection, and non-blocking training-shortfall handling.

### Safety and compatibility

- Register imports validate schema and object keys, enforce the existing 5,000-vehicle limit, cap files at 10 MB, and require confirmation before replacing browser data.
- Export and import remain blocked while Personnel Assignment or a register build is active.
- Added a permanent regression check requiring the Personnel Register controls and the latest trained-coverage optimiser to remain present together.

'''
          changelog.write_text(text.replace(marker, entry + marker, 1), encoding='utf-8')
          PY

      - name: Validate complete release candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          test ! -e src/personnel-register-tools.user.js
          git diff --check

      - name: Commit release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add src/missionchief-command-nexus.user.js README.md src/README.md CHANGELOG.md scripts
          git commit -m 'Restore Personnel Register controls on latest main'
          git push origin HEAD:agent/release-personnel-register-v1037

# Explicit second push trigger after workflow registration.
