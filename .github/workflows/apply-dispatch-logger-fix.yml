name: Apply logger dispatch path fix

on:
  push:
    branches:
      - fix/logger-dispatch-path-audit
    paths:
      - .github/workflows/apply-dispatch-logger-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/logger-dispatch-path-audit
          fetch-depth: 0

      - name: Decode and apply production patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import zlib

          encoded = Path(
              'tmp/dispatch-logger-fix.patch.zlib.b64'
          ).read_text(encoding='utf-8').strip()
          Path('/tmp/dispatch-logger-fix.patch').write_bytes(
              zlib.decompress(base64.b64decode(encoded))
          )
          PY
          git apply /tmp/dispatch-logger-fix.patch
          rm -f tmp/dispatch-logger-fix.patch.zlib.b64
          rmdir tmp 2>/dev/null || true
          rm -f dispatch-audit-snapshot.txt
          rm -f .github/workflows/export-dispatch-audit-source.yml
          rm -f .github/workflows/apply-dispatch-logger-fix.yml

      - name: Validate JavaScript syntax
        run: node -e "new Function(require('fs').readFileSync('src/missionchief-command-nexus.user.js','utf8'))"

      - name: Run targeted logger regressions
        shell: bash
        run: |
          node scripts/check-mission-dispatch-path-logger.mjs
          node scripts/check-mission-user-logger.mjs
          node scripts/check-mission-generation-logger.mjs
          node scripts/check-mission-journey-metrics.mjs
          node scripts/check-ally-steal-response-v1082.mjs
          node scripts/check-auto-memory-recycle.mjs

      - name: Run every permanent regression
        shell: bash
        run: |
          for test in scripts/check-*.mjs; do
            echo "==> $test"
            node "$test"
          done

      - name: Validate release and repository
        shell: bash
        run: |
          node scripts/validate-userscript.mjs --base-ref origin/main
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean production branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v1.1.4 logger dispatch path fix"
          git push origin HEAD:fix/logger-dispatch-path-audit
