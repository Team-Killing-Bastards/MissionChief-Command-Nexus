name: Temporary repair and verify v1.0.3 release

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  repair-release:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/trigger-publish-v1.0.3'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Allow main cleanup to complete
        run: sleep 120

      - name: Remove partial release and dispatch clean publication
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags --force
          CLEAN_SHA="$(git rev-parse origin/main)"
          echo "clean_sha=${CLEAN_SHA}" >> "${GITHUB_OUTPUT}"

          gh release delete v1.0.3 \
            --repo "${GITHUB_REPOSITORY}" \
            --yes \
            --cleanup-tag || true

          git push origin ':refs/tags/v1.0.3' || true

          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f operation=publish-release \
            -f release_tag=v1.0.3

      - name: Wait for clean release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: ${{ steps.publish.outputs.clean_sha }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID=""
          for attempt in $(seq 1 90); do
            RUN_ID="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow release.yml \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha,status,conclusion \
              --jq '[.[] | select(.headSha == env.CLEAN_SHA)][0].databaseId // empty')"

            if [[ -n "${RUN_ID}" ]]; then
              STATUS="$(gh run view "${RUN_ID}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json status \
                --jq '.status')"

              if [[ "${STATUS}" == "completed" ]]; then
                break
              fi
            fi

            sleep 10
          done

          if [[ -z "${RUN_ID}" ]]; then
            echo "No release workflow run was found for clean main ${CLEAN_SHA}."
            exit 1
          fi

          gh run view "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json databaseId,name,event,status,conclusion,url,headSha,createdAt,updatedAt

          CONCLUSION="$(gh run view "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json conclusion \
            --jq '.conclusion')"

          if [[ "${CONCLUSION}" != "success" ]]; then
            gh run view "${RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" \
              --log-failed || true
            exit 1
          fi

      - name: Verify final release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: ${{ steps.publish.outputs.clean_sha }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_JSON="$(gh release view v1.0.3 \
            --repo "${GITHUB_REPOSITORY}" \
            --json url,name,tagName,isDraft,isPrerelease,publishedAt,assets,targetCommitish)"
          echo "${RELEASE_JSON}"

          ASSETS="$(jq -r '.assets[].name' <<<"${RELEASE_JSON}")"
          grep -Fxq 'MissionChief-Command-Nexus-1.0.3.user.js' <<<"${ASSETS}"
          grep -Fxq 'MissionChief-Command-Nexus-1.0.3.user.js.sha256' <<<"${ASSETS}"

          TAG_SHA="$(git ls-remote origin 'refs/tags/v1.0.3^{}' | awk '{print $1}')"
          if [[ -z "${TAG_SHA}" ]]; then
            TAG_SHA="$(git ls-remote origin 'refs/tags/v1.0.3' | awk '{print $1}')"
          fi

          if [[ "${TAG_SHA}" != "${CLEAN_SHA}" ]]; then
            echo "v1.0.3 tag ${TAG_SHA} does not match clean main ${CLEAN_SHA}."
            exit 1
          fi
