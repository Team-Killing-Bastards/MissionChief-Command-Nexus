name: Export simple private logger source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-simple-private-logger.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/simple-private-url-logger
          fetch-depth: 0
      - name: Stage complete repository
        shell: bash
        run: |
          mkdir -p export
          tar --exclude=.git --exclude=export -cf - . | tar -xf - -C export
      - uses: actions/upload-artifact@v4
        with:
          name: simple-private-logger-source
          path: export
          retention-days: 1
