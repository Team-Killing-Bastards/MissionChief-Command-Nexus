name: Temporary v3.0.39 prisoner release terminal build

on:
  push:
    branches:
      - fix/v3039-prisoner-release-terminal

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build prisoner release terminal candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_temporary-build-v3039-prisoner-terminal.py')
          text = path.read_text(encoding='utf-8')
          old = """source = replace_once(
              source,
              'const rescueUrl = href;',
              'const rescueUrl = canonicalMissionWorkerUrl(href);',
              'canonical clean retry URL',
          )"""
          new = """discovery_start, discovery_end = function_span(source, 'waitForNexusAndStart')
          discovery = source[discovery_start:discovery_end]
          discovery = replace_once(
              discovery,
              'const rescueUrl = href;',
              \"const rescueUrl = typeof canonicalMissionWorkerUrl === 'function' ? canonicalMissionWorkerUrl(href) : href;\",
              'canonical clean retry URL',
          )
          source = source[:discovery_start] + discovery + source[discovery_end:]"""
          if old not in text:
              raise SystemExit('Canonical retry builder patch marker was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/_temporary-build-v3039-prisoner-terminal.py
          python3 - <<'PY'
          from pathlib import Path
          source_path = Path('src/missionchief-command-nexus.user.js')
          source = source_path.read_text(encoding='utf-8')
          inline_guard = "/^\\/missions\\/\\d+\\/gefangene\\/entlassen\\/?$/i.test(String(globalThis.location?.pathname || ''))"
          href_guard = "/\\/missions\\/\\d+\\/gefangene\\/entlassen(?:[\\/?#]|$)/i.test(String(href || ''))"
          pathname_guard = "/^\\/missions\\/\\d+\\/gefangene\\/entlassen\\/?$/i.test(url.pathname)"

          old = """function shouldKeepMissionFinderObserverForCurrentFrame() {
                  if (isMfV3PrisonerReleaseTerminalPage()) return false;
                  if (MF_IS_TOP_WINDOW) return true;"""
          new = f"""function shouldKeepMissionFinderObserverForCurrentFrame() {{
                  if ({inline_guard}) return false;
                  if (MF_IS_TOP_WINDOW) return true;"""
          if old not in source:
              raise SystemExit('Terminal observer self-contained guard marker was not found.')
          source = source.replace(old, new, 1)

          old = """        if (isMfV3PrisonerReleaseTerminalPage()) {
                      globalThis.__MCN_BOOT_MARK__?.('prisoner-release-terminal-result');
                      return;
                  }"""
          new = f"""        if ({inline_guard}) {{
                      globalThis.__MCN_BOOT_MARK__?.('prisoner-release-terminal-result');
                      return;
                  }}"""
          if old not in source:
              raise SystemExit('Mission observer terminal guard marker was not found.')
          source = source.replace(old, new, 1)

          old = f"""function startMissionFinderObserver() {{
                  if ({inline_guard}) {{
                      globalThis.__MCN_BOOT_MARK__?.('prisoner-release-terminal-result');
                      return;
                  }}
                  if (mfV3DormantPreload) return;"""
          new = f"""function startMissionFinderObserver() {{
                  if (mfV3DormantPreload) return;
                  if ({inline_guard}) {{
                      globalThis.__MCN_BOOT_MARK__?.('prisoner-release-terminal-result');
                      return;
                  }}"""
          if old not in source:
              raise SystemExit('Dormant preload ordering marker was not found.')
          source = source.replace(old, new, 1)

          old = "        if (isMfV3PrisonerReleaseTerminalPage()) return;"
          new = f"        if ({inline_guard}) return;"
          if old not in source:
              raise SystemExit('Mission initialize terminal guard marker was not found.')
          source = source.replace(old, new, 1)

          helper = """    function isMfV3PrisonerReleaseTerminalPage() {
                  try {
                      return /^\\/missions\\/\\d+\\/gefangene\\/entlassen\\/?$/i.test(
                          String(window.location.pathname || '')
                      );
                  } catch (_error) {
                      return false;
                  }
              }
          """
          if helper not in source:
              raise SystemExit('Unused embedded terminal helper marker was not found.')
          source = source.replace(helper, '', 1)

          guarded_calls = [
              (
                  "if (maybeFinishPrisonerReleaseTerminal(doc, href, 'worker-load')) {",
                  f"if ({href_guard} && typeof maybeFinishPrisonerReleaseTerminal === 'function' &&\nmaybeFinishPrisonerReleaseTerminal(doc, href, 'worker-load')) {{",
                  'worker-load terminal call',
              ),
              (
                  "if (maybeFinishPrisonerReleaseTerminal(doc, href, 'watcher')) {",
                  f"if ({href_guard} && typeof maybeFinishPrisonerReleaseTerminal === 'function' &&\nmaybeFinishPrisonerReleaseTerminal(doc, href, 'watcher')) {{",
                  'watcher terminal call',
              ),
              (
                  "if (maybeFinishPrisonerReleaseTerminal(terminalDoc, href, 'nexus-discovery')) return;",
                  f"if ({href_guard} && typeof maybeFinishPrisonerReleaseTerminal === 'function' &&\nmaybeFinishPrisonerReleaseTerminal(terminalDoc, href, 'nexus-discovery')) return;",
                  'discovery terminal call',
              ),
              (
                  "if (role === 'MISSION_A') url = canonicalMissionWorkerUrl(url);",
                  "if (role === 'MISSION_A' && typeof canonicalMissionWorkerUrl === 'function') url = canonicalMissionWorkerUrl(url);",
                  'createWorker canonicalizer guard',
              ),
          ]
          for old, new, label in guarded_calls:
              if old not in source:
                  raise SystemExit(f'{label} marker was not found.')
              source = source.replace(old, new, 1)

          old = "!isPrisonerReleaseTerminalUrl(url.href) &&"
          new = f"!{pathname_guard} &&"
          if old not in source:
              raise SystemExit('Persisted resume terminal guard marker was not found.')
          source = source.replace(old, new, 1)

          old = "isPrisonerReleaseTerminalUrl(url.href)) {"
          new = f"{pathname_guard}) {{"
          if old not in source:
              raise SystemExit('Stored resume terminal guard marker was not found.')
          source = source.replace(old, new, 1)

          source_path.write_text(source, encoding='utf-8')

          test_path = Path('scripts/check-v3-prisoner-release-terminal-v3039.mjs')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              "observer.indexOf('isMfV3PrisonerReleaseTerminalPage()')",
              "observer.indexOf('gefangene\\/entlassen')",
              1,
          )
          test = test.replace(
              "assert.match(initialize, /isMfV3PrisonerReleaseTerminalPage\\(\\)/,",
              "assert.match(initialize, /gefangene\\\\\\/entlassen/ ,",
              1,
          )
          test = test.replace(
              "assert.match(discover, /const rescueUrl = canonicalMissionWorkerUrl\\(href\\)/,",
              "assert.match(discover, /canonicalMissionWorkerUrl\\(href\\)/,",
              1,
          )
          test = test.replace(
              "assert.match(persist, /!isPrisonerReleaseTerminalUrl\\(url\\.href\\)/);",
              "assert.match(persist, /gefangene/);",
              1,
          )
          test = test.replace(
              "assert.match(stored, /isPrisonerReleaseTerminalUrl\\(url\\.href\\)/);",
              "assert.match(stored, /gefangene/);",
              1,
          )
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean production candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Handle prisoner release terminal results safely"
          git push origin HEAD:fix/v3039-prisoner-release-terminal
