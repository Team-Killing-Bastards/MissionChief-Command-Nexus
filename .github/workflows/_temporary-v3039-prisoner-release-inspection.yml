name: Temporary v3.0.39 prisoner release inspection

on:
  push:
    branches:
      - fix/v3039-prisoner-release-terminal

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip prisoner inspection]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact prisoner terminal runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')

          def span(name, start_at=0):
              start = source.find(f'function {name}(', start_at)
              async_start = source.find(f'async function {name}(', start_at)
              if async_start >= 0 and (start < 0 or async_start < start): start = async_start
              if start < 0: return None
              brace = source.find('{', start)
              depth = 0; quote = ''; escaped = False; line_comment = False; block_comment = False
              i = brace
              while i < len(source):
                  c = source[i]; n = source[i+1] if i+1 < len(source) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == quote: quote = ''
                      i += 1; continue
                  if c == '/' and n == '/': line_comment = True; i += 2; continue
                  if c == '/' and n == '*': block_comment = True; i += 2; continue
                  if c in ("'", '"', '`'): quote = c; i += 1; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return start, i+1
                  i += 1
              return None

          names = [
              'detectTransportContext',
              'collectTransportDocuments',
              'maybeHandoffMissionATransportRoute',
              'recoverUnownedMissionATransportRoute',
              'resetMissionATransportRouteTracking',
              'handleAutoPrisonerCellBeforeUnitFinder',
              'handleAutoPrisonerReleaseAfterActions',
              'captureAutoPrisonerReleaseOwnerContext',
              'getAutoPrisonerReleaseSuccessContext',
              'getTopmostAutoPrisonerReleaseDismissContext',
              'closeAutoPrisonerReleaseDismissAfterClick',
              'getAutoPrisonerReleaseOwnerContainer',
              'resolveAutoPrisonerReleaseDismissContext',
              'getVisibleAutoPrisonerReleaseDismissContexts',
              'isAutoPrisonerReleaseDismissContextVisible',
              'getExactAutoReleasePrisonersLink',
              'readAutoPrisonerReleaseState',
              'writeAutoPrisonerReleaseState',
              'clearAutoPrisonerReleaseState',
              'runAutoModeLoop',
              'startMissionFinderObserver',
              'isMfV3ManagedTransportWorker',
              'isMfV3ManagedActiveWorker',
              'shouldKeepMissionFinderObserverForCurrentFrame',
              'reconcileMissionFinderFrameRuntime',
              'waitForNexusAndStart',
              'onWorkerLoad',
              'watchWorker',
              'persistResumeMission',
              'storedResumeMissionUrl',
              'createWorker',
          ]
          report = []
          for name in names:
              found=[]; pos=0
              while True:
                  item=span(name,pos)
                  if not item: break
                  found.append(source[item[0]:item[1]])
                  pos=item[1]
              report.append(f'===== {name} ({len(found)}) =====')
              report.extend(found or ['NOT FOUND'])
              report.append('')
          Path('.tmp-v3039-exact-functions.txt').write_text('\n'.join(report), encoding='utf-8')

          declarations=[]
          pattern=re.compile(r'^\s*(?:async\s+)?function\s+([A-Za-z0-9_$]+)', re.M)
          for match in pattern.finditer(source):
              name=match.group(1)
              if any(k in name.lower() for k in ('prison','release','terminal','transport','resume','bootstrap','worker')):
                  line=source.count('\n',0,match.start())+1
                  declarations.append(f'{line:06d}: {match.group(0).strip()}')
          Path('.tmp-v3039-relevant-declarations.txt').write_text('\n'.join(declarations)+'\n', encoding='utf-8')

          # Exact call-site contexts for terminal release and recovery URL creation.
          lines=source.splitlines(); terms=[
              '/gefangene/entlassen', 'release-success-alerts', 'createWorker(rescueUrl)',
              'state.currentMissionUrl = href', 'persistResumeMission(href)',
              'maybeHandoffMissionATransportRoute', 'maybeHandleConfirmedPrisonerReleaseSuccess',
              'handleAutoPrisonerReleaseAfterActions', 'closeAutoPrisonerReleaseDismissAfterClick',
          ]
          ranges=[]
          for no,line in enumerate(lines,1):
              if any(term in line for term in terms): ranges.append((max(1,no-15),min(len(lines),no+35)))
          merged=[]
          for start,end in ranges:
              if merged and start<=merged[-1][1]+2: merged[-1]=(merged[-1][0],max(merged[-1][1],end))
              else: merged.append((start,end))
          out=[]
          for idx,(start,end) in enumerate(merged,1):
              out.append(f'===== callsite-{idx} [{start}-{end}] =====')
              out.extend(f'{i:06d}: {lines[i-1]}' for i in range(start,end+1)); out.append('')
          Path('.tmp-v3039-exact-callsites.txt').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit exact maps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-v3039-*.txt
          git commit -m "Refine prisoner release runtime inspection [skip prisoner inspection]"
          git push origin HEAD:fix/v3039-prisoner-release-terminal
