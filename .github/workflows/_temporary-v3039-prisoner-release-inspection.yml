name: Temporary v3.0.39 prisoner release inspection

on:
  push:
    branches:
      - fix/v3039-prisoner-release-terminal

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip prisoner inspection]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract prisoner-release and recovery runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/missionchief-command-nexus.user.js')
          source = source_path.read_text(encoding='utf-8')
          lines = source.splitlines()

          def span(name, start_at=0):
              start = source.find(f'function {name}(', start_at)
              if start < 0:
                  return None
              brace = source.find('{', start)
              depth = 0
              quote = ''
              escaped = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(source):
                  c = source[i]
                  n = source[i+1] if i+1 < len(source) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == quote: quote = ''
                      i += 1; continue
                  if c == '/' and n == '/': line_comment = True; i += 2; continue
                  if c == '/' and n == '*': block_comment = True; i += 2; continue
                  if c in ("'", '"', '`'): quote = c; i += 1; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return start, i+1
                  i += 1
              return None

          names = [
              'maybeHandleConfirmedPrisonerReleaseSuccess',
              'maybeReturnFromCompletedPrisonerDestination',
              'maybeAssistPrisonerTransport',
              'maybeAssistPatientTransport',
              'maybeRecoverStalledTransportContext',
              'captureTransportContext',
              'collectTransportContext',
              'waitForNexusAndStart',
              'createWorker',
              'removeWorker',
              'recoverMissionWorkerFromTransportRoute',
              'maybeHandoffMissionWorkerTransportRoute',
              'redirectWorkerToTransportService',
              'returnToTopMissionAfterTransport',
              'persistResumeMission',
              'isMissionUrl',
              'missionIdFromUrl',
              'onWorkerLoad',
              'watchWorker',
          ]
          report = []
          for name in names:
              found = []
              pos = 0
              while True:
                  item = span(name, pos)
                  if not item: break
                  found.append(source[item[0]:item[1]])
                  pos = item[1]
              report.append(f'===== {name} ({len(found)}) =====')
              report.extend(found or ['NOT FOUND'])
              report.append('')
          Path('.tmp-v3039-prisoner-functions.txt').write_text('\n'.join(report), encoding='utf-8')

          terms = [
              'gefangene/entlassen',
              'gefangener/',
              'release-success-alerts',
              'prisonerReleaseSuccess',
              'return-existing-worker-after-completed-prisoner-destination',
              'No usable cell',
              'explicit prisoner release',
              'clean A-only retry',
              'clean-active-only-retry',
              'bootstrapMissionUrl',
              'currentMissionUrl',
              'storedResumeMissionUrl',
              'persistResumeMission',
              'NEXUS_DISCOVERY_TIMEOUT_MS',
              'Auto Mode was not found',
              'terminal',
          ]
          ranges = []
          for number, line in enumerate(lines, 1):
              if any(term.lower() in line.lower() for term in terms):
                  ranges.append((max(1, number-20), min(len(lines), number+45)))
          merged = []
          for start, end in ranges:
              if merged and start <= merged[-1][1] + 3:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], end))
              else:
                  merged.append((start, end))
          out = []
          for idx, (start, end) in enumerate(merged, 1):
              out.append(f'===== context-{idx} [{start}-{end}] =====')
              out.extend(f'{i:06d}: {lines[i-1]}' for i in range(start, end+1))
              out.append('')
          Path('.tmp-v3039-prisoner-contexts.txt').write_text('\n'.join(out), encoding='utf-8')

          tests = []
          for path in sorted(Path('scripts').glob('check-*.mjs')):
              text = path.read_text(encoding='utf-8')
              if any(term.lower() in text.lower() for term in ['gefangene/entlassen', 'prisoner release', 'completed-prisoner', 'transport route handoff']):
                  tests.append(f'===== {path} =====\n{text}')
          Path('.tmp-v3039-prisoner-tests.txt').write_text('\n\n'.join(tests), encoding='utf-8')
          PY

      - name: Commit inspection maps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-v3039-*.txt
          git commit -m "Add prisoner release runtime inspection [skip prisoner inspection]"
          git push origin HEAD:fix/v3039-prisoner-release-terminal
