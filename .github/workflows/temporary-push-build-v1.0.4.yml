name: Temporary push build v1.0.4

on:
  push:
    branches:
      - main
    paths:
      - '.automation-trigger-v1.0.4.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: agent/v1.0.4-auto-load-limited-vehicles
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build and validate candidate
        shell: bash
        run: |
          set -euo pipefail

          node scripts/prepare-release.mjs \
            --version 1.0.4 \
            --notes "Auto Mode now activates every MissionChief limited-vehicle loader and waits for all additional vehicle pages and the final vehicle list to stabilise before selecting units."

          python3 .automation/build_v1_0_4.py
          rm -rf .automation

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load all limited vehicle pages before selection"

      - name: Remove one-time automation from main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout -B __v1_0_4_cleanup origin/main
          git rm \
            .github/workflows/temporary-push-build-v1.0.4.yml \
            .automation-trigger-v1.0.4.txt
          git commit -m "Remove one-time v1.0.4 build automation"
          git push origin HEAD:main

      - name: Rebase and publish candidate branch
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout agent/v1.0.4-auto-load-limited-vehicles
          git rebase origin/main
          git push --force-with-lease origin HEAD:refs/heads/agent/v1.0.4-auto-load-limited-vehicles
