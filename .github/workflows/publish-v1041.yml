name: Publish v1.0.41 through normal release workflow

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  tag-clean-source:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/publish-v1041'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false

      - name: Create clean v1.0.41 tag
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG='v1.0.41'
          RELEASE_SHA='95b2ecf2cdcb6b7590e23d47fd0882c352c5d1eb'
          git fetch origin main --tags --force
          git cat-file -e "${RELEASE_SHA}^{commit}"
          test "$(git show "${RELEASE_SHA}:src/missionchief-command-nexus.user.js" | sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' | head -n 1 | xargs)" = '1.0.41'
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            EXISTING_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
            test "${EXISTING_SHA}" = "${RELEASE_SHA}"
            echo "${RELEASE_TAG} already targets the clean release commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" -m 'MissionChief Command Nexus 1.0.41'
          git push origin "refs/tags/${RELEASE_TAG}"

  publish:
    needs: tag-clean-source
    if: needs.tag-clean-source.result == 'success'
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.41
      release_notes: Auto Mode now completes the first active prisoner-cell handoff before Mission Update, vehicle loading and Unit Finder, and never releases prisoners.
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
