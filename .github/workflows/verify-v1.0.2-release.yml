name: Verify Command Nexus v1.0.2 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-triggers/verify-v1.0.2'

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-command-nexus-v1.0.2
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release, deployment and Discord
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify v1.0.2 end to end
        id: verify_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          GREASYFORK_PAGE_URL: ${{ vars.GREASYFORK_PAGE_URL }}
        run: |
          set -euo pipefail

          REPORT="verification-report.md"
          RELEASE_TAG="v1.0.2"
          RELEASE_VERSION="1.0.2"
          ASSET="MissionChief-Command-Nexus-${RELEASE_VERSION}.user.js"

          cat > "${REPORT}" <<'EOF'
          ## Issue #26 — v1.0.2 acceptance verification

          EOF

          trap 'status=$?; trap - EXIT; if [[ ${status} -ne 0 ]]; then printf "\n❌ Verification stopped with exit code %s. Review the linked Actions run for the failing command.\n" "${status}" >> "${REPORT}"; fi; exit ${status}' EXIT

          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "Missing DISCORD_RELEASE_WEBHOOK repository secret."
            exit 1
          fi

          if [[ -z "${GREASYFORK_INSTALL_URL}" ]]; then
            echo "Missing GREASYFORK_INSTALL_URL repository variable."
            exit 1
          fi

          if [[ -z "${GREASYFORK_PAGE_URL}" ]]; then
            echo "Missing GREASYFORK_PAGE_URL repository variable."
            exit 1
          fi

          RELEASE_READY=false
          for attempt in $(seq 1 24); do
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              RELEASE_READY=true
              break
            fi

            echo "GitHub Release not ready (${attempt}/24); waiting 15 seconds."
            sleep 15
          done

          if [[ "${RELEASE_READY}" != "true" ]]; then
            echo "GitHub Release ${RELEASE_TAG} did not become available."
            exit 1
          fi

          RELEASE_URL="$(
            gh release view "${RELEASE_TAG}" \
              --json url \
              --jq '.url'
          )"

          git fetch origin main --tags
          TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          git checkout --detach "${TAG_SHA}"

          SCRIPT_VERSION="$(
            node scripts/validate-userscript.mjs --print-version
          )"

          if [[ "${SCRIPT_VERSION}" != "${RELEASE_VERSION}" ]]; then
            echo "Tagged source reports ${SCRIPT_VERSION}, expected ${RELEASE_VERSION}."
            exit 1
          fi

          printf '%s\n' \
            "- ✅ Tag \`${RELEASE_TAG}\` resolves to \`${TAG_SHA}\`." \
            "- ✅ Tagged userscript metadata reports \`${SCRIPT_VERSION}\`." \
            "- ✅ GitHub Release is available: ${RELEASE_URL}" \
            >> "${REPORT}"

          mkdir -p release-check
          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${ASSET}.sha256" \
            --dir release-check \
            --clobber

          test -s "release-check/${ASSET}"
          test -s "release-check/${ASSET}.sha256"

          cmp --silent \
            src/missionchief-command-nexus.user.js \
            "release-check/${ASSET}"

          (
            cd release-check
            sha256sum -c "${ASSET}.sha256"
          )

          RECORDED_CHECKSUM="$(
            awk 'NR == 1 {print $1}' \
              "release-check/${ASSET}.sha256"
          )"

          printf '%s\n' \
            "- ✅ Release asset \`${ASSET}\` exactly matches the tagged source." \
            "- ✅ SHA-256 asset verified: \`${RECORDED_CHECKSUM}\`." \
            >> "${REPORT}"

          export GREASYFORK_INSTALL_URL
          export SOURCE_PATH="src/missionchief-command-nexus.user.js"
          export EXPECTED_VERSION="${RELEASE_VERSION}"

          node <<'NODE'
          import { readFile } from 'node:fs/promises';

          const installUrl = process.env.GREASYFORK_INSTALL_URL;
          const sourcePath = process.env.SOURCE_PATH;
          const expectedVersion = process.env.EXPECTED_VERSION;

          function normaliseUserscript(text) {
            return text
              .replace(/^\uFEFF/, '')
              .replace(/\r\n?/g, '\n')
              .replace(
                /^\s*\/\/\s*@(downloadURL|updateURL|installURL)\s+.*\n?/gim,
                ''
              )
              .replace(/[ \t]+$/gm, '')
              .trimEnd()
              .concat('\n');
          }

          function extractVersion(text, label) {
            const match = text.match(
              /^\s*\/\/\s*@version\s+([^\s]+)\s*$/m
            );

            if (!match) {
              throw new Error(`Could not find @version in ${label}`);
            }

            return match[1];
          }

          const expectedSource = await readFile(sourcePath, 'utf8');
          const expectedNormalised = normaliseUserscript(expectedSource);
          let lastStatus = 'No response received';

          for (let attempt = 1; attempt <= 24; attempt += 1) {
            try {
              const url = new URL(installUrl);
              url.searchParams.set(
                'release_verification',
                `${Date.now()}-${attempt}`
              );

              const response = await fetch(url, {
                redirect: 'follow',
                headers: {
                  Accept:
                    'text/plain, application/javascript, */*',
                  'User-Agent':
                    'Command-Nexus-v1.0.2-Release-Verifier/1.0',
                },
              });

              if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
              }

              const servedSource = await response.text();
              const servedVersion = extractVersion(
                servedSource,
                'Greasy Fork source'
              );

              if (servedVersion !== expectedVersion) {
                lastStatus =
                  `served ${servedVersion}; waiting for ${expectedVersion}`;
              } else if (
                normaliseUserscript(servedSource) !== expectedNormalised
              ) {
                throw new Error(
                  `Greasy Fork version ${expectedVersion} does not match ` +
                  'the tagged GitHub source'
                );
              } else {
                console.log(
                  `Greasy Fork verified on attempt ${attempt}: ` +
                  `version ${servedVersion}`
                );
                process.exit(0);
              }
            } catch (error) {
              lastStatus =
                error instanceof Error
                  ? error.message
                  : String(error);

              if (lastStatus.includes('does not match')) {
                throw error;
              }
            }

            console.log(
              `Greasy Fork not ready (${attempt}/24): ${lastStatus}`
            );

            if (attempt < 24) {
              await new Promise((resolve) =>
                setTimeout(resolve, 15_000)
              );
            }
          }

          throw new Error(
            `Greasy Fork verification timed out: ${lastStatus}`
          );
          NODE

          printf '%s\n' \
            "- ✅ Greasy Fork serves version \`${RELEASE_VERSION}\` and its normalized code matches the tagged GitHub source." \
            "- ✅ Greasy Fork page configured: ${GREASYFORK_PAGE_URL}" \
            >> "${REPORT}"

          export DISCORD_WEBHOOK_URL
          export RELEASE_URL
          export RECORDED_CHECKSUM

          node <<'NODE'
          const webhookUrl = new URL(process.env.DISCORD_WEBHOOK_URL);
          webhookUrl.searchParams.set('wait', 'true');

          const payload = {
            username: 'Command Nexus Release Control',
            allowed_mentions: { parse: [] },
            embeds: [
              {
                title: 'Command Nexus v1.0.2 verification passed',
                url: process.env.RELEASE_URL,
                description:
                  'Issue #26 end-to-end acceptance testing completed successfully.',
                color: 0x2ecc71,
                fields: [
                  {
                    name: 'Verified',
                    value:
                      '✅ GitHub tag and Release\n' +
                      '✅ Release asset and SHA-256\n' +
                      '✅ Greasy Fork source parity\n' +
                      '✅ Discord webhook delivery',
                    inline: false,
                  },
                  {
                    name: 'SHA-256',
                    value: `\`${process.env.RECORDED_CHECKSUM}\``,
                    inline: false,
                  },
                ],
              },
            ],
          };

          const response = await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            const body = await response.text();
            throw new Error(
              `Discord webhook returned HTTP ${response.status}: ` +
              body.slice(0, 500)
            );
          }

          console.log('Discord verification message delivered.');
          NODE

          printf '%s\n' \
            "- ✅ Discord accepted the verification message." \
            "" \
            "**Result: all Issue #26 release acceptance checks passed.**" \
            >> "${REPORT}"

      - name: Record verification on Issue #26
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify_release.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT="verification-report.md"

          if [[ ! -f "${REPORT}" ]]; then
            cat > "${REPORT}" <<'EOF'
          ## Issue #26 — v1.0.2 acceptance verification

          ❌ The verification step did not produce its report file.
          EOF
          fi

          {
            echo
            echo "- Workflow outcome: \`${VERIFY_OUTCOME}\`"
            echo "- Actions evidence: ${RUN_URL}"
          } >> "${REPORT}"

          gh issue comment 26 --body-file "${REPORT}"

      - name: Fail workflow when verification failed
        if: steps.verify_release.outcome != 'success'
        run: exit 1
