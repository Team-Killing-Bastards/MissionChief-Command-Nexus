name: Build v1.0.24 normal Police IRV corrective branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-normal-police-irv-v1024
  cancel-in-progress: false

jobs:
  build:
    name: Build, validate and stage v1.0.24
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/normal-irv-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply normal Police IRV corrective build
        run: python3 scripts/apply_v1024_police_irv.py

      - name: Remove one-use diagnostic and builder files
        run: |
          git rm -f scripts/apply_v1024_police_irv.py
          git rm -f .github/workflows/temporary-diagnose-irv-selection.yml

      - name: Validate complete repository
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node --check scripts/check-police-irv-fallback.mjs
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-police-irv-fallback.mjs
          python3 scripts/check_repository.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          required = {
              'version': '// @version      1.0.24',
              'Mission Finder': ' * MODULE 2: MISSION FINDER V10.6.89',
              'ordinary first': '...verifiedOrdinary,\n            ...unknownOrStale,\n            ...protectedFallback',
              'unknown fallback': 'allowUnknown: true',
              'specialist fallback': 'allowProtected: true',
              'selected type-8 count': 'matches = isPoliceCarVehicleCheckbox(input);',
              'live personnel alerts': 'const personnelTextBlocks =',
              'strict trained IRV': "requirementType:\n                        'police_trained_irv_vehicle'",
          }
          missing = [name for name, token in required.items() if token not in source]
          if missing:
              raise SystemExit('Missing v1.0.24 contracts: ' + ', '.join(missing))

          refresh_start = source.index(
              '    async function refreshOrdinaryPoliceRegistryFromLiveVehicles('
          )
          refresh_end = source.index(
              '    async function prepareTrainedPersonnelRegistryForRows(',
              refresh_start,
          )
          if 'await fetch(' in source[refresh_start:refresh_end]:
              raise SystemExit('Generic Police attendance still performs assignment-page fetches')

          print('Focused v1.0.24 Police IRV and Missing Personnel contracts passed.')
          PY

      - name: Push validated corrective branch
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_PR: ${{ github.event.pull_request.number }}
          RELEASE_BRANCH: release/v1.0.24-police-irv
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Restore normal Police IRV selection'
          git push --force origin "HEAD:refs/heads/${RELEASE_BRANCH}"

          cat > /tmp/v1024-pr-body.md <<'PRBODY'
          ## Normal Police IRV corrective release

          - Restores type-8 Incident Response Vehicle / Police Car selection in manual Unit Finder and Auto Mode.
          - Prefers verified ordinary IRVs, then unknown/stale IRVs, with specialist-trained IRVs as a final fallback.
          - Counts every selected exact type-8 IRV toward generic Police attendance.
          - Restores `Missing Personnel: Police Officers` conversion at two officers per Police Car, including while the Live Mission Requirements panel is present.
          - Keeps Inspector, Police Medic, Public Order, Railway Police and other named trained requirements strict and live-verified.
          - Adds a permanent Police IRV regression check and passes complete userscript, iOS, lifecycle and repository validation.
          PRBODY

          PR_URL="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${RELEASE_BRANCH}" \
              --base main \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -z "${PR_URL}" ]]; then
            PR_URL="$(
              gh pr create \
                --repo "${GITHUB_REPOSITORY}" \
                --base main \
                --head "${RELEASE_BRANCH}" \
                --title 'Restore normal Police IRV selection' \
                --body-file /tmp/v1024-pr-body.md 2>/dev/null || true
            )"
          fi

          gh pr comment "${DIAGNOSTIC_PR}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "v1.0.24 passed all validation and was pushed to \`${RELEASE_BRANCH}\`. Corrective PR: ${PR_URL:-https://github.com/${GITHUB_REPOSITORY}/compare/main...${RELEASE_BRANCH}?expand=1}"
