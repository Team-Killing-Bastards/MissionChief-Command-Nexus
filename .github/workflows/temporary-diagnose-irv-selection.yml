name: Export validated v1.0.24 Police IRV correction

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: export-normal-police-irv-v1024
  cancel-in-progress: false

jobs:
  export:
    name: Build, validate and export v1.0.24
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/normal-irv-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply normal Police IRV corrective build
        run: python3 scripts/apply_v1024_police_irv.py

      - name: Remove one-use diagnostic and builder files
        run: |
          git rm -f scripts/apply_v1024_police_irv.py
          git rm -f .github/workflows/temporary-diagnose-irv-selection.yml

      - name: Validate complete repository
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node --check scripts/check-police-irv-fallback.mjs
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-police-irv-fallback.mjs
          python3 scripts/check_repository.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          required = {
              'version': '// @version      1.0.24',
              'Mission Finder': ' * MODULE 2: MISSION FINDER V10.6.89',
              'ordinary first': '...verifiedOrdinary,\n            ...unknownOrStale,\n            ...protectedFallback',
              'unknown fallback': 'allowUnknown: true',
              'specialist fallback': 'allowProtected: true',
              'selected type-8 count': 'matches = isPoliceCarVehicleCheckbox(input);',
              'live personnel alerts': 'const personnelTextBlocks =',
              'strict trained IRV': "requirementType:\n                        'police_trained_irv_vehicle'",
          }
          missing = [name for name, token in required.items() if token not in source]
          if missing:
              raise SystemExit('Missing v1.0.24 contracts: ' + ', '.join(missing))

          refresh_start = source.index(
              '    async function refreshOrdinaryPoliceRegistryFromLiveVehicles('
          )
          refresh_end = source.index(
              '    async function prepareTrainedPersonnelRegistryForRows(',
              refresh_start,
          )
          if 'await fetch(' in source[refresh_start:refresh_end]:
              raise SystemExit('Generic Police attendance still performs assignment-page fetches')

          print('Focused v1.0.24 Police IRV and Missing Personnel contracts passed.')
          PY

      - name: Package exact validated files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v1024-validated/src
          mkdir -p /tmp/v1024-validated/scripts
          mkdir -p /tmp/v1024-validated/.github/workflows
          cp src/missionchief-command-nexus.user.js /tmp/v1024-validated/src/
          cp src/README.md /tmp/v1024-validated/src/
          cp README.md CHANGELOG.md /tmp/v1024-validated/
          cp scripts/check-police-irv-fallback.mjs /tmp/v1024-validated/scripts/
          cp .github/workflows/validate-userscript.yml /tmp/v1024-validated/.github/workflows/
          git diff --binary > /tmp/v1024-validated/v1.0.24.patch
          printf '%s\n' 'scripts/apply_v1024_police_irv.py' > /tmp/v1024-validated/delete-paths.txt
          printf '%s\n' '.github/workflows/temporary-diagnose-irv-selection.yml' >> /tmp/v1024-validated/delete-paths.txt

      - name: Upload exact validated v1.0.24 files
        uses: actions/upload-artifact@v4
        with:
          name: validated-v1.0.24-police-irv
          path: /tmp/v1024-validated
          if-no-files-found: error
          retention-days: 2

      - name: Record export on diagnostic PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body 'v1.0.24 passed complete validation. The exact validated source, documentation, regression test and workflow update were exported for connector-controlled commit to protected `main`.'
