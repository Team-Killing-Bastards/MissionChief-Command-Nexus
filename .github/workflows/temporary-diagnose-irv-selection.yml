name: Restore normal Police IRV selection and publish v1.0.24

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: restore-normal-police-irv-v1024
  cancel-in-progress: false

jobs:
  apply:
    name: Build and validate v1.0.24
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/normal-irv-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply normal Police IRV corrective build
        run: python3 scripts/apply_v1024_police_irv.py

      - name: Remove one-use diagnostic and builder files
        run: |
          git rm -f scripts/apply_v1024_police_irv.py
          git rm -f .github/workflows/temporary-diagnose-irv-selection.yml

      - name: Validate complete repository
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node --check scripts/check-police-irv-fallback.mjs
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-police-irv-fallback.mjs
          python3 scripts/check_repository.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          required = {
              'version': '// @version      1.0.24',
              'Mission Finder': ' * MODULE 2: MISSION FINDER V10.6.89',
              'ordinary first': '...verifiedOrdinary,\n            ...unknownOrStale,\n            ...protectedFallback',
              'unknown fallback': 'allowUnknown: true',
              'specialist fallback': 'allowProtected: true',
              'selected type-8 count': 'matches = isPoliceCarVehicleCheckbox(input);',
              'live personnel alerts': 'const personnelTextBlocks =',
              'Police Officer conversion': 'personnelPerVehicle: 2',
              'strict trained IRV': "requirementType:\n                        'police_trained_irv_vehicle'",
          }
          missing = [name for name, token in required.items() if token not in source]
          if missing:
              raise SystemExit('Missing v1.0.24 contracts: ' + ', '.join(missing))

          refresh_start = source.index(
              '    async function refreshOrdinaryPoliceRegistryFromLiveVehicles('
          )
          refresh_end = source.index(
              '    async function prepareTrainedPersonnelRegistryForRows(',
              refresh_start,
          )
          ordinary_refresh = source[refresh_start:refresh_end]
          if 'await fetch(' in ordinary_refresh:
              raise SystemExit('Generic Police attendance still performs assignment-page fetches')

          print('Focused v1.0.24 Police IRV and Missing Personnel contracts passed.')
          PY

      - name: Push validated v1.0.24 source
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Restore normal Police IRV selection'
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish, verify and announce v1.0.24
    needs: apply
    if: needs.apply.result == 'success'
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.24
      release_notes: Restores normal Police Car and type-8 IRV selection in manual Unit Finder and Auto Mode, uses specialist-trained IRVs only as a final fallback, and restores Police Officer Missing Personnel conversion at two officers per car.
    secrets: inherit

  finish:
    name: Close corrective work
    needs:
      - apply
      - publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Close PR, issue and diagnostic branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIGGER_BRANCH: ${{ github.event.pull_request.head.ref }}
          APPLY_RESULT: ${{ needs.apply.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${APPLY_RESULT}" == "success" && "${PUBLISH_RESULT}" == "success" ]]; then
            gh pr close "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment 'v1.0.24 validated and pushed to main. GitHub release published, Greasy Fork source parity verified and Discord notified.'

            gh issue close 115 \
              --repo "${GITHUB_REPOSITORY}" \
              --comment 'Fixed in v1.0.24: Missing Personnel Police Officers converts at two officers per Police Car, including with the live requirements panel present. Generic type-8 IRV selection is also restored with ordinary-first and specialist-fallback ordering.' || true

            git ls-remote --exit-code --heads \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/heads/${TRIGGER_BRANCH}" >/dev/null 2>&1 && \
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TRIGGER_BRANCH}" || true
          else
            gh pr comment "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "v1.0.24 pipeline stopped. Build result: ${APPLY_RESULT}; publication result: ${PUBLISH_RESULT}."
            exit 1
          fi
