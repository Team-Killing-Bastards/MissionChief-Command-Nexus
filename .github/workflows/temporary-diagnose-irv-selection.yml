name: Diagnose normal IRV selection

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/normal-irv-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          show-progress: false

      - name: Extract IRV selection paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/missionchief-command-nexus.user.js')
          lines = source_path.read_text(encoding='utf-8').splitlines()

          patterns = [
              re.compile(r'Incident Response Vehicle', re.I),
              re.compile(r'Police Car', re.I),
              re.compile(r'\bIRV\b', re.I),
              re.compile(r'police_inspector', re.I),
              re.compile(r'police_medic', re.I),
              re.compile(r'public.?order', re.I),
              re.compile(r'(vehicle|type).{0,40}["\']8["\']', re.I),
              re.compile(r'["\']8["\'].{0,40}(vehicle|type)', re.I),
              re.compile(r'trained.{0,30}irv', re.I),
              re.compile(r'irv.{0,30}trained', re.I),
              re.compile(r'exact.{0,30}(training|registry|vehicle)', re.I),
          ]

          hits = []
          for idx, line in enumerate(lines):
              if any(pattern.search(line) for pattern in patterns):
                  hits.append(idx)

          # Merge nearby hits into readable context blocks.
          spans = []
          for idx in hits:
              start = max(0, idx - 18)
              end = min(len(lines), idx + 23)
              if spans and start <= spans[-1][1] + 8:
                  spans[-1] = (spans[-1][0], max(spans[-1][1], end))
              else:
                  spans.append((start, end))

          # Keep the report under GitHub's comment limit while preferring Mission Finder code.
          rendered = []
          total_chars = 0
          for start, end in spans:
              block_lines = [f'{line_no + 1:05d}: {lines[line_no]}' for line_no in range(start, end)]
              block = '\n'.join(block_lines)
              if total_chars + len(block) > 54000:
                  break
              rendered.append(block)
              total_chars += len(block)

          report = [
              '## Current main: normal IRV / Police Car diagnostic',
              '',
              f'- Source version line: `{lines[3] if len(lines) > 3 else "unknown"}`',
              f'- Matching source lines: `{len(hits)}`',
              f'- Context blocks included: `{len(rendered)}`',
              '',
              '```javascript',
              '\n\n// ---- NEXT MATCH BLOCK ----\n\n'.join(rendered) or 'No matching source lines found.',
              '```',
          ]
          Path('/tmp/irv-diagnostic.md').write_text('\n'.join(report), encoding='utf-8')
          PY

          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/irv-diagnostic.md
