name: Create validated v1.0.24 Police IRV source commit

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: create-normal-police-irv-v1024-source-commit
  cancel-in-progress: false

jobs:
  create:
    name: Build, validate and create v1.0.24 source commit
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/normal-irv-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply normal Police IRV corrective build
        run: python3 scripts/apply_v1024_police_irv.py

      - name: Validate complete repository
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node --check scripts/check-police-irv-fallback.mjs
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-police-irv-fallback.mjs
          python3 scripts/check_repository.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          required = {
              'version': '// @version      1.0.24',
              'Mission Finder': ' * MODULE 2: MISSION FINDER V10.6.89',
              'ordinary first': '...verifiedOrdinary,\n            ...unknownOrStale,\n            ...protectedFallback',
              'unknown fallback': 'allowUnknown: true',
              'specialist fallback': 'allowProtected: true',
              'selected type-8 count': 'matches = isPoliceCarVehicleCheckbox(input);',
              'live personnel alerts': 'const personnelTextBlocks =',
              'strict trained IRV': "requirementType:\n                        'police_trained_irv_vehicle'",
          }
          missing = [name for name, token in required.items() if token not in source]
          if missing:
              raise SystemExit('Missing v1.0.24 contracts: ' + ', '.join(missing))

          refresh_start = source.index(
              '    async function refreshOrdinaryPoliceRegistryFromLiveVehicles('
          )
          refresh_end = source.index(
              '    async function prepareTrainedPersonnelRegistryForRows(',
              refresh_start,
          )
          if 'await fetch(' in source[refresh_start:refresh_end]:
              raise SystemExit('Generic Police attendance still performs assignment-page fetches')

          print('Focused v1.0.24 Police IRV and Missing Personnel contracts passed.')
          PY

      - name: Create unattached validated source commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          create_blob() {
            local file_path="$1"
            python3 - "${file_path}" <<'PY' > /tmp/v1024-blob.json
          import base64
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          print(json.dumps({
              'content': base64.b64encode(path.read_bytes()).decode('ascii'),
              'encoding': 'base64',
          }))
          PY
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/blobs" \
              --input /tmp/v1024-blob.json \
              --jq '.sha'
          }

          PARENT_SHA="$(git rev-parse origin/main)"
          BASE_TREE_SHA="$(git rev-parse "${PARENT_SHA}^{tree}")"

          SOURCE_BLOB="$(create_blob src/missionchief-command-nexus.user.js)"
          README_BLOB="$(create_blob README.md)"
          CHANGELOG_BLOB="$(create_blob CHANGELOG.md)"
          SOURCE_README_BLOB="$(create_blob src/README.md)"
          REGRESSION_BLOB="$(create_blob scripts/check-police-irv-fallback.mjs)"

          export BASE_TREE_SHA SOURCE_BLOB README_BLOB CHANGELOG_BLOB
          export SOURCE_README_BLOB REGRESSION_BLOB

          python3 - <<'PY' > /tmp/v1024-tree.json
          import json
          import os

          def blob(path, sha):
              return {
                  'path': path,
                  'mode': '100644',
                  'type': 'blob',
                  'sha': sha,
              }

          print(json.dumps({
              'base_tree': os.environ['BASE_TREE_SHA'],
              'tree': [
                  blob('src/missionchief-command-nexus.user.js', os.environ['SOURCE_BLOB']),
                  blob('README.md', os.environ['README_BLOB']),
                  blob('CHANGELOG.md', os.environ['CHANGELOG_BLOB']),
                  blob('src/README.md', os.environ['SOURCE_README_BLOB']),
                  blob('scripts/check-police-irv-fallback.mjs', os.environ['REGRESSION_BLOB']),
              ],
          }))
          PY

          TREE_SHA="$(
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/trees" \
              --input /tmp/v1024-tree.json \
              --jq '.sha'
          )"

          export PARENT_SHA TREE_SHA
          python3 - <<'PY' > /tmp/v1024-commit.json
          import json
          import os

          identity = {
              'name': 'MartyBlyth',
              'email': '32400596+Martyblyth@users.noreply.github.com',
          }

          print(json.dumps({
              'message': 'Restore normal Police IRV selection',
              'tree': os.environ['TREE_SHA'],
              'parents': [os.environ['PARENT_SHA']],
              'author': identity,
              'committer': identity,
          }))
          PY

          COMMIT_SHA="$(
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/commits" \
              --input /tmp/v1024-commit.json \
              --jq '.sha'
          )"

          mkdir -p /tmp/v1024-validated
          printf '%s\n' "${COMMIT_SHA}" > /tmp/v1024-validated/commit-sha.txt
          printf '%s\n' "${PARENT_SHA}" > /tmp/v1024-validated/parent-sha.txt
          printf '%s\n' "${TREE_SHA}" > /tmp/v1024-validated/tree-sha.txt
          echo "commit_sha=${COMMIT_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Upload validated commit receipt
        uses: actions/upload-artifact@v4
        with:
          name: validated-v1.0.24-source-commit-receipt
          path: /tmp/v1024-validated
          if-no-files-found: error
          retention-days: 2

      - name: Record commit receipt on diagnostic PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "v1.0.24 passed complete validation. Unattached validated source commit created: \`${COMMIT_SHA}\`."
