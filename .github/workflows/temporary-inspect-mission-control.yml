name: Apply Mission Control iOS Safari optimisation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/temporary-inspect-mission-control.yml'
      - 'automation/mission-control-ios/**'

permissions:
  contents: write

concurrency:
  group: mission-control-ios-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/add-fire-iccu-osu-profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Marty's exact PR branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply source and documentation changes
        shell: bash
        run: |
          set -euo pipefail

          cat automation/mission-control-ios/patch.part* | tr -d '\r\n' > /tmp/mission-control.patch.gz.b64
          test "$(sha256sum /tmp/mission-control.patch.gz.b64 | awk '{print $1}')" = '67dce5a4766d22296b85a6c72f3aa1c672d82b1c1eab13439b389dcc93e60567'
          base64 --decode < /tmp/mission-control.patch.gz.b64 > /tmp/mission-control.patch.gz
          gzip --decompress --stdout /tmp/mission-control.patch.gz > /tmp/mission-control.patch
          test "$(sha256sum /tmp/mission-control.patch | awk '{print $1}')" = 'a2120efa26200358d1413157eb63b44b193b46aec7cfe44386273f10f29d72de'

          git apply --check /tmp/mission-control.patch
          git apply /tmp/mission-control.patch
          python3 automation/mission-control-ios/apply.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-ios-compatibility.mjs')
          text = path.read_text(encoding='utf-8')
          old = '!/(CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo)/i.test(userAgent)'
          new = '!/(?:CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo)/i.test(userAgent)'
          if text.count(old) != 1:
              raise SystemExit('Mission Control Safari exclusion assertion was not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm -r automation/mission-control-ios
          git rm .github/workflows/temporary-inspect-mission-control.yml
          git rm .github/workflows/temporary-apply-mission-control-ios.yml

      - name: Validate combined v1.0.18 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          node --check src/missionchief-command-nexus.user.js
          node --check scripts/check-ios-compatibility.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          python3 scripts/check_repository.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          required = {
              'Safari detector': 'function isMissionFinderIosSafariWebsite(',
              'mobile wrapper class': 'mf2026-ios-safari',
              'viewport bounds': 'function getMissionFinderViewportBounds(',
              'safe-area reset': 'function resetMissionFinderIosPosition(',
              'control collapse key': 'MF_CONTROL_COLLAPSED_KEY',
              'load-list collapse key': 'MF_VEHICLE_LOAD_COLLAPSED_KEY',
              'pointer drag': "dragHandle.addEventListener(\n                'pointerdown'",
              'chevron collapse': 'controlMinimizeBtn.textContent = missionFinderIosSafari',
          }
          missing = [label for label, token in required.items() if token not in source]
          if missing:
              raise SystemExit('Missing Mission Control iOS contracts: ' + ', '.join(missing))
          if '#control-panel {\n                width: 260px;' not in source:
              raise SystemExit('Desktop Mission Control width changed unexpectedly')
          if '#vehicle-load-list-box {\n                width: 300px;' not in source:
              raise SystemExit('Desktop Vehicle Load List width changed unexpectedly')
          if not re.search(
              r'if \(missionFinderIosSafari\)\s*\{[\s\S]{0,500}resetMissionFinderIosPosition\([\s\S]{0,500}\}\s*else if \([\s\S]{0,500}applySavedMissionFinderWindowPosition',
              source,
          ):
              raise SystemExit('iOS top placement and desktop saved-position paths are not isolated')
          print('Mission Control iOS Safari focused checks passed.')
          PY

      - name: Commit finished changes to PR 82
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/missionchief-command-nexus.user.js \
            README.md \
            CHANGELOG.md \
            src/README.md \
            scripts/check-ios-compatibility.mjs
          git commit -m 'Optimise Mission Control for iOS Safari'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
