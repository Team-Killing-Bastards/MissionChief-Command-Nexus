name: Diagnose Mission Control iOS validation failure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/temporary-inspect-mission-control.yml'

permissions:
  actions: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/add-fire-iccu-osu-profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print failed validation tail
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/89031766550/logs" \
            > /tmp/mission-control-ios.log
          echo '===== MISSION CONTROL IOS VALIDATION FAILURE ====='
          tail -n 100 /tmp/mission-control-ios.log
