name: Diagnose Mission Control iOS validation failure

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/temporary-inspect-mission-control.yml'

permissions:
  actions: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/add-fire-iccu-osu-profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print exact validation error
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/89031766550/logs" \
            > /tmp/mission-control-ios.log
          echo '===== EXACT ERROR LINES ====='
          grep -n -E 'ERROR:|Missing Mission|unexpectedly|no longer isolated|failed|Process completed|expected at least|compatibility contract' /tmp/mission-control-ios.log || true
          echo '===== FINAL 30 LINES ====='
          tail -n 30 /tmp/mission-control-ios.log
