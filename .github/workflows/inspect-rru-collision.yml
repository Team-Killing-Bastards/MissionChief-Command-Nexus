name: Prepare exact Fire Road Rail RRU correction

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/separate-fire-road-rail-rru'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/separate-fire-road-rail-rru
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact Fire Road Rail matcher
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .diagnostics/apply-fire-road-rail-rru.py ]]; then
            python3 .diagnostics/apply-fire-road-rail-rru.py
          fi
          rm -f .diagnostics/apply-fire-road-rail-rru.py
          rm -f .diagnostics/rru-collision-trigger.txt
          rm -f .diagnostics/rru-collision-context.txt
          rm -f .diagnostics/rru-dispatch-functions.txt
          rm -f .diagnostics/rru-generic-match-functions.txt

      - name: Validate complete Command Nexus candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          test ! -e src/personnel-register-tools.user.js
          grep -Fq '// @version      1.0.39' src/missionchief-command-nexus.user.js
          grep -Fq ' * MODULE 2: MISSION FINDER V10.6.103' src/missionchief-command-nexus.user.js
          grep -Fq "typeIdentifiers.includes('107')" src/missionchief-command-nexus.user.js
          grep -Fq '"59": "Coastguard Rope Rescue Unit"' src/missionchief-command-nexus.user.js
          git diff --check

      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Exact Fire Road Rail correction already prepared.'
            exit 0
          fi
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Separate Fire Road Rail RRU from Coastguard CRRU'
          git push origin HEAD:agent/separate-fire-road-rail-rru
