name: Diagnose HEMS ambulance ETA priority

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ambulance-hems-eta-priority'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/ambulance-hems-eta-priority
          fetch-depth: 0
          show-progress: false

      - name: Collect HEMS ambulance context
        run: |
          python3 .diagnostics/collect-hems-ambulance-context.py
          python3 .diagnostics/collect-hems-ambulance-context-extra.py

      - name: Commit diagnostic context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add .diagnostics/hems-ambulance-context.txt .diagnostics/hems-ambulance-context-extra.txt
          if git diff --cached --quiet; then
            echo 'Diagnostic context already current.'
            exit 0
          fi
          git commit -m 'Capture HEMS ambulance ETA context'
          git push origin HEAD:agent/ambulance-hems-eta-priority
