name: Extract mission dashboard v1.0.69

on:
  push:
    branches:
      - feature/mission-command-dashboard-v1069
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: extract-mission-dashboard-v1069-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Extract live dashboard construction
        run: python3 .github/builders/extract-mission-dashboard-v1069.py
      - name: Upload dashboard extraction and source
        uses: actions/upload-artifact@v4
        with:
          name: mission-dashboard-v1069
          path: |
            .github/diagnostics/mission-dashboard-v1069.txt
            src/missionchief-command-nexus.user.js
          if-no-files-found: error
          retention-days: 1
      - name: Commit diagnostics
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git add .github/diagnostics/mission-dashboard-v1069.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Extract live mission dashboard construction'
          git push origin HEAD:feature/mission-command-dashboard-v1069
