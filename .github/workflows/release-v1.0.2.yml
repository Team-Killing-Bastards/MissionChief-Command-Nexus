name: Publish Command Nexus v1.0.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.0.2.yml'
      - 'src/missionchief-command-nexus.user.js'
      - 'README.md'
      - 'src/README.md'
      - 'CHANGELOG.md'

permissions:
  contents: write

concurrency:
  group: publish-command-nexus-v1.0.2
  cancel-in-progress: true

jobs:
  release:
    name: Prepare or publish v1.0.2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine release mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node scripts/validate-userscript.mjs --print-version)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          case "${VERSION}" in
            1.0.1)
              echo "mode=prepare" >> "${GITHUB_OUTPUT}"
              ;;
            1.0.2)
              echo "mode=publish" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unexpected userscript version ${VERSION}; expected 1.0.1 or 1.0.2."
              exit 1
              ;;
          esac

      - name: Prepare the v1.0.2 release branch
        if: steps.mode.outputs.mode == 'prepare'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags
          git checkout -B automation/release-v1.0.2 origin/main

          python3 <<'PY'
          from pathlib import Path
          import re

          version = "1.0.2"
          release_date = "2026-07-19"

          source_path = Path("src/missionchief-command-nexus.user.js")
          source = source_path.read_text(encoding="utf-8")
          match = re.search(r"^//\s*@version\s+(\S+)\s*$", source, re.MULTILINE)
          if not match or match.group(1) != "1.0.1":
              raise SystemExit("Expected canonical userscript version 1.0.1")
          source = re.sub(
              r"^(//\s*@version\s+)\S+(\s*)$",
              rf"\g<1>{version}\g<2>",
              source,
              count=1,
              flags=re.MULTILINE,
          )
          source_path.write_text(source, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "**Current version:** `1.0.1`",
              f"**Current version:** `{version}`",
          )
          readme = readme.replace(
              "Command Nexus v1.0.1 is a single userscript",
              f"Command Nexus v{version} is a single userscript",
          )
          readme_path.write_text(readme, encoding="utf-8")

          source_readme_path = Path("src/README.md")
          source_readme = source_readme_path.read_text(encoding="utf-8")
          source_readme = source_readme.replace(
              "| Command Nexus version | `1.0.1` |",
              f"| Command Nexus version | `{version}` |",
          )
          source_readme_path.write_text(source_readme, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "## [1.0.1] - 2026-07-19"
          heading = f"## [{version}] - {release_date}"
          if heading not in changelog:
              if marker not in changelog:
                  raise SystemExit("Could not find the 1.0.1 changelog marker")
              section = f"""## [{version}] - {release_date}

### Added

- Verified Discord deployment notifications after GitHub Release and Greasy Fork publication checks.
- Release embeds showing the deployment version, platform verification, concise Mission Brief, SHA-256 checksum and direct install/release links.

### Changed

- The release pipeline now verifies published GitHub assets and waits for Greasy Fork to serve the matching version and source before announcing deployment.
- Increased the unified userscript version to `{version}` for the first end-to-end deployment notification test; MissionChief runtime behaviour is unchanged.

"""
              changelog = changelog.replace(marker, section + marker, 1)
              changelog_path.write_text(changelog, encoding="utf-8")
          PY

          node --check src/missionchief-command-nexus.user.js
          node --check scripts/release-notify.mjs
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/missionchief-command-nexus.user.js \
            README.md \
            src/README.md \
            CHANGELOG.md
          git commit -m "Release v1.0.2"
          git push --force-with-lease origin HEAD:automation/release-v1.0.2

      - name: Validate v1.0.2 publication source
        if: steps.mode.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail

          node --check src/missionchief-command-nexus.user.js
          node --check scripts/release-notify.mjs
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          git diff --check

          if [[ "${{ steps.mode.outputs.version }}" != "1.0.2" ]]; then
            echo "Publication source is not version 1.0.2."
            exit 1
          fi

      - name: Create and push tag v1.0.2
        if: steps.mode.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin --tags
          if git rev-parse -q --verify "refs/tags/v1.0.2" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 v1.0.2)"
            if [[ "${TAG_SHA}" != "${GITHUB_SHA}" ]]; then
              echo "Existing tag v1.0.2 points to ${TAG_SHA}, expected ${GITHUB_SHA}."
              exit 1
            fi
          else
            git tag -a v1.0.2 "${GITHUB_SHA}" \
              -m "MissionChief Command Nexus 1.0.2"
            git push origin v1.0.2
          fi

      - name: Prepare release asset, checksum and patch log
        if: steps.mode.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail

          ASSET="MissionChief-Command-Nexus-1.0.2.user.js"
          cp src/missionchief-command-nexus.user.js "${ASSET}"
          sha256sum "${ASSET}" > "${ASSET}.sha256"

          python3 - "${GITHUB_SHA}" "${ASSET}.sha256" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = "1.0.2"
          commit_sha, checksum_path = sys.argv[1:]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.search(
              rf"^## \[{re.escape(version)}\](?:\s+-.*)?\s*$",
              changelog,
              re.MULTILINE,
          )
          if not heading:
              raise SystemExit(f"CHANGELOG.md has no release section for {version}")

          remaining = changelog[heading.end():]
          next_heading = re.search(r"^##\s+", remaining, re.MULTILINE)
          section = (
              remaining[:next_heading.start()]
              if next_heading
              else remaining
          ).strip()
          if not section:
              raise SystemExit(f"CHANGELOG.md release section for {version} is empty")

          checksum = Path(checksum_path).read_text(encoding="utf-8").split()[0]
          notes = (
              f"## Mission Brief\n\n{section}\n\n"
              f"## Build Verification\n\n"
              f"- Source commit: `{commit_sha}`\n"
              f"- SHA-256: `{checksum}`\n"
          )
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Create or refresh GitHub release
        if: steps.mode.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ASSET="MissionChief-Command-Nexus-1.0.2.user.js"
          TITLE="MissionChief Command Nexus 1.0.2"

          if gh release view v1.0.2 >/dev/null 2>&1; then
            gh release upload v1.0.2 \
              "${ASSET}" \
              "${ASSET}.sha256" \
              --clobber
            gh release edit v1.0.2 \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create v1.0.2 \
              "${ASSET}" \
              "${ASSET}.sha256" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Verify published GitHub release assets
        if: steps.mode.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ASSET="MissionChief-Command-Nexus-1.0.2.user.js"
          mkdir -p release-check
          gh release view v1.0.2 --json url --jq '.url'
          gh release download v1.0.2 \
            --pattern "${ASSET}" \
            --pattern "${ASSET}.sha256" \
            --dir release-check \
            --clobber
          cmp --silent "${ASSET}" "release-check/${ASSET}"
          cmp --silent "${ASSET}.sha256" "release-check/${ASSET}.sha256"

      - name: Verify Greasy Fork and notify Discord
        if: steps.mode.outputs.mode == 'publish'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          GREASYFORK_PAGE_URL: ${{ vars.GREASYFORK_PAGE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: v1.0.2
          RELEASE_SHA: ${{ github.sha }}
          SOURCE_PATH: src/missionchief-command-nexus.user.js
          CHANGELOG_PATH: CHANGELOG.md
          PRODUCT_NAME: MissionChief Command Nexus
        run: |
          node scripts/release-notify.mjs
