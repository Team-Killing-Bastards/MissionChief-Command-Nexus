name: Repair PR 258 v1.0.84 assertions from main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-v1084-assertions-from-main.yml'
      - '.github/repair-v1084-assertions-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: repair-pr258-v1084-assertions-from-main
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v6
        with:
          ref: fix/ios-personnel-assignment-completeness-v1084
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Refresh all current-release assertions and validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin fix/ios-personnel-assignment-completeness-v1084 --force
          git checkout -B fix/ios-personnel-assignment-completeness-v1084 origin/fix/ios-personnel-assignment-completeness-v1084

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '// @version      1.0.83': '// @version      1.0.84',
              'MISSION FINDER V10.6.143': 'MISSION FINDER V10.6.144',
              "const PERSONNEL_VERSION = '1.3.8';": "const PERSONNEL_VERSION = '1.3.9';",
          }

          changed = []
          for path in sorted(Path('scripts').glob('check-*.mjs')):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated files:')
          print('\n'.join(changed) if changed else '(none)')
          PY

          git rm -f --ignore-unmatch \
            .github/workflows/repair-v1084-current-assertions.yml \
            .repair-v1084-current-assertions-trigger

          if grep -RIl --include='check-*.mjs' -- '// @version      1.0.83' scripts | grep -q .; then
            echo 'Stale Command Nexus 1.0.83 assertion remains.'
            exit 1
          fi
          if grep -RIl --include='check-*.mjs' -- 'MISSION FINDER V10.6.143' scripts | grep -q .; then
            echo 'Stale Mission Finder V10.6.143 assertion remains.'
            exit 1
          fi
          if grep -RIl --include='check-*.mjs' -- "const PERSONNEL_VERSION = '1.3.8';" scripts | grep -q .; then
            echo 'Stale Personnel Assignment 1.3.8 assertion remains.'
            exit 1
          fi

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

          if git diff --quiet && git diff --cached --quiet; then
            echo 'No repair changes were required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh v1.0.84 current-release assertions'
          git push origin HEAD:refs/heads/fix/ios-personnel-assignment-completeness-v1084

          gh pr comment 258 --body 'All permanent current-release assertions were refreshed for Command Nexus 1.0.84 / Mission Finder V10.6.144 / Personnel Assignment 1.3.9. Every permanent userscript regression and repository integrity check passed before the repaired head was pushed.' || true
