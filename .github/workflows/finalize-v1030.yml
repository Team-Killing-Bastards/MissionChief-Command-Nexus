name: Finalize and publish clean v1.0.30

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: finalize-clean-v1.0.30
  cancel-in-progress: false

jobs:
  retag:
    name: Recreate clean v1.0.30 tag
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/finalize-v1030'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.retag.outputs.release_sha }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Verify clean source and recreate tag
        id: retag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: c6917e84fc022b11f4c02658a2d6c668df75819a
          RELEASE_TAG: v1.0.30
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags --force

          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main; then
            echo "Release source ${RELEASE_SHA} is not contained in current main."
            exit 1
          fi

          RELEASE_VERSION="$(
            git show "${RELEASE_SHA}:src/missionchief-command-nexus.user.js" |
              sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' |
              head -n 1 |
              xargs
          )"

          if [[ "${RELEASE_VERSION}" != '1.0.30' ]]; then
            echo "Expected source version 1.0.30; found ${RELEASE_VERSION}."
            exit 1
          fi

          TEMPORARY_WORKFLOWS="$(
            git ls-tree -r --name-only "${RELEASE_SHA}" .github/workflows |
              grep -E '^\.github/workflows/temporary-.*\.ya?ml$' || true
          )"

          if [[ -n "${TEMPORARY_WORKFLOWS}" ]]; then
            echo 'Clean release source still contains temporary workflows:'
            echo "${TEMPORARY_WORKFLOWS}"
            exit 1
          fi

          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com

          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            CURRENT_TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          else
            CURRENT_TAG_SHA=''
          fi

          if [[ "${CURRENT_TAG_SHA}" != "${RELEASE_SHA}" ]]; then
            if [[ -n "${CURRENT_TAG_SHA}" ]]; then
              git tag -d "${RELEASE_TAG}"
              git push origin ":refs/tags/${RELEASE_TAG}" || true
            fi
            git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" \
              -m 'MissionChief Command Nexus 1.0.30'
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          echo "release_sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish verify and announce v1.0.30
    needs: retag
    if: needs.retag.result == 'success'
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.30
      release_notes: Fixes PSU personnel-registry detection, exact CRV and Control Van mappings, changed Missing Vehicles parsing, Police Officer conversion, and nearest eligible HEMS or trained Critical Care ambulance selection.
    secrets: inherit

  close-issues:
    name: Close resolved issue batch
    needs:
      - retag
      - publish
    if: needs.retag.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Close and document resolved issues
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.retag.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail

          COMMENT="Fixed and released in v1.0.30 from source commit ${RELEASE_SHA}. GitHub release assets passed checksum verification, Greasy Fork reached exact source parity, and Discord was notified."

          for issue in 123 121 117 115 86; do
            gh issue close "${issue}" \
              --repo "${GITHUB_REPOSITORY}" \
              --reason completed \
              --comment "${COMMENT}"
          done

          gh issue comment 126 \
            --repo "${GITHUB_REPOSITORY}" \
            --body "${COMMENT}" || true

          {
            echo '### v1.0.30 batch complete'
            echo "- Clean source commit: \`${RELEASE_SHA}\`"
            echo '- Issues closed: #123, #121, #117, #115 and #86'
            echo '- Previously closed issue confirmed: #126'
            echo '- GitHub assets verified'
            echo '- Greasy Fork exact source parity verified'
            echo '- Discord release notification sent'
          } >> "${GITHUB_STEP_SUMMARY}"
