name: Export current Code.gs

on:
  push:
    branches:
      - fix/mission-generation-and-journey-capture
    paths:
      - .github/workflows/export-current-codegs.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Stage Code.gs
        run: cp integrations/google-apps-script/Code.gs Code.gs

      - name: Upload Code.gs
        uses: actions/upload-artifact@v4
        with:
          name: current-codegs
          path: Code.gs
          if-no-files-found: error
          retention-days: 1
