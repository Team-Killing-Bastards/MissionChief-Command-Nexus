name: Build v1.0.101 Ambulance Officer threshold candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and validate v1.0.101 Ambulance Officer threshold
    if: >-
      github.event.pull_request.head.ref == 'feature/ambulance-officer-threshold-v10101' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/ambulance-officer-threshold-v10101
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build, validate and push exact candidate
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' src/missionchief-command-nexus.user.js | head -n1 | xargs)"
          if [ "$current_version" = "1.0.101" ]; then
            echo "Candidate already built; no second mutation required."
            exit 0
          fi
          test "$current_version" = "1.0.100"

          git fetch origin main --force
          test "$(git show origin/main:src/missionchief-command-nexus.user.js | sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' | head -n1 | xargs)" = "1.0.100"
          git show origin/main:scripts/build-v10101-ambulance-officer-threshold.py > scripts/build-v10101-ambulance-officer-threshold.py
          python3 scripts/build-v10101-ambulance-officer-threshold.py
          rm -f scripts/build-v10101-ambulance-officer-threshold.py

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-ambulance-officer-threshold-v10101.mjs
          node scripts/check-high-risk-missing-person-ambulance-v1076.mjs
          node scripts/check-police-drone-requirement-v10100.mjs
          node scripts/check-rescue-dog-search-dog-v1098.mjs
          node scripts/check-hgv-recovery-v1097.mjs
          python3 scripts/check_repository.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add user-set Ambulance Officer threshold in v1.0.101'
          git push origin HEAD:feature/ambulance-officer-threshold-v10101
