name: Build v1.0.101 Ambulance Officer threshold candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and validate v1.0.101 Ambulance Officer threshold
    if: >-
      github.event.pull_request.head.ref == 'feature/ambulance-officer-threshold-v10101' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/ambulance-officer-threshold-v10101
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build, validate and push exact candidate
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' src/missionchief-command-nexus.user.js | head -n1 | xargs)"
          if [ "$current_version" = "1.0.101" ]; then
            echo "Candidate already built; no second mutation required."
            exit 0
          fi
          test "$current_version" = "1.0.100"

          git fetch origin main --force
          test "$(git show origin/main:src/missionchief-command-nexus.user.js | sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' | head -n1 | xargs)" = "1.0.100"
          git show origin/main:scripts/build-v10101-ambulance-officer-threshold.py > scripts/build-v10101-ambulance-officer-threshold.py

          # The production high-risk helper has two operational call sites:
          # preloaded Vehicle Load display and the fresh Unit Finder gate. Patch
          # the trusted builder to replace those exact call sites while keeping
          # the original helper declaration and the new combined wrapper intact.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-v10101-ambulance-officer-threshold.py')
          text = path.read_text(encoding='utf-8')
          old = """source = replace_call_name_in_function(
              source,
              'getPreloadedMissionVehicleRequirementsForDisplay',
              'addConfiguredHighRiskMissingPersonAmbulanceRequirement',
              'applyConfiguredFreshMissionVehicleRequirements',
          )
          source = replace_call_name_in_function(
              source,
              'processRequirementRows',
              'addConfiguredHighRiskMissingPersonAmbulanceRequirement',
              'applyConfiguredFreshMissionVehicleRequirements',
          )
          """
          new = """def replace_configured_high_risk_call_sites(text: str) -> str:
              old_name = 'addConfiguredHighRiskMissingPersonAmbulanceRequirement'
              new_name = 'applyConfiguredFreshMissionVehicleRequirements'
              protected_ranges = [
                  find_js_function_range(text, old_name),
                  find_js_function_range(text, new_name),
              ]
              positions: list[int] = []
              cursor = 0
              while True:
                  index = text.find(old_name, cursor)
                  if index < 0:
                      break
                  if not any(start <= index < end for start, end in protected_ranges):
                      positions.append(index)
                  cursor = index + len(old_name)

              if len(positions) != 2:
                  raise SystemExit(
                      'Configured high-risk call sites: expected exactly two, got '
                      f'{len(positions)}'
                  )

              for index in reversed(positions):
                  text = (
                      text[:index]
                      + new_name
                      + text[index + len(old_name):]
                  )
              return text


          source = replace_configured_high_risk_call_sites(source)
          """
          if text.count(old) != 1:
              raise SystemExit(
                  f'Builder call-site patch expected one match, got {text.count(old)}'
              )
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 scripts/build-v10101-ambulance-officer-threshold.py
          rm -f scripts/build-v10101-ambulance-officer-threshold.py

          # Keep the existing high-risk diagnostics truthful after both fresh
          # settings rules share one wrapper, and update regressions to target
          # the real source-level fresh Unit Finder gate rather than a stale
          # historical function name.
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/missionchief-command-nexus.user.js')
          source = source_path.read_text(encoding='utf-8')
          start_marker = """        if (
                      options
                          .includeConfiguredHighRiskMissingPersonAmbulance === true
                  ) {"""
          end_marker = '\n\n        mfSetUnitFinderDiagnosticContext('
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = """        if (
                      options
                          .includeConfiguredHighRiskMissingPersonAmbulance === true
                  ) {
                      requirementRows =
                          applyConfiguredFreshMissionVehicleRequirements(
                              requirementRows
                          );

                      if (mfDebugEnabled) {
                          if (
                              requirementRows.some(
                                  row =>
                                      row?.configuredHighRiskMissingPersonAmbulance ===
                                      true
                              )
                          ) {
                              debugLog(
                                  'HIGH-RISK MISSING PERSON AMBULANCE',
                                  'Settings rule added Ambulance x1 to the fresh Unit Finder requirement set.'
                              );
                          }

                          if (
                              requirementRows.some(
                                  row =>
                                      row?.configuredAmbulanceOfficerThreshold ===
                                      true
                              )
                          ) {
                              debugLog(
                                  'AMBULANCE OFFICER THRESHOLD',
                                  `Settings rule added Ambulance Officer x1 because ordinary Ambulance demand exceeded ${normaliseConfiguredAmbulanceOfficerThreshold(mfAmbulanceOfficerThreshold)}.`
                              );
                          }
                      }
                  }"""
          source_path.write_text(
              source[:start] + replacement + source[end:],
              encoding='utf-8'
          )

          source_gate_checks = """const freshRuleMatch =
            /requirementRows\\s*=\\s*applyConfiguredFreshMissionVehicleRequirements\\(\\s*requirementRows\\s*\\);/.exec(source);
          expect(
            source.includes('includeConfiguredHighRiskMissingPersonAmbulance === true'),
            'Fresh Unit Finder configured-rule gate missing'
          );
          expect(
            freshRuleMatch,
            'Selection pipeline must apply the combined fresh-mission settings rules'
          );
          const freshRuleCallIndex = freshRuleMatch.index;
          const normaliseIndex = source.lastIndexOf(
            'requirementRows = normaliseOperationalRequirementRows(',
            freshRuleCallIndex
          );
          expect(
            normaliseIndex >= 0 && normaliseIndex < freshRuleCallIndex,
            'Configured rules must run after requirement authority normalisation'
          );
          """

          high_risk_path = Path('scripts/check-high-risk-missing-person-ambulance-v1076.mjs')
          high_risk = high_risk_path.read_text(encoding='utf-8')
          block_start = high_risk.index(
              "const processRows = extractFunction('processRequirementRows');"
          )
          block_end = high_risk.index(
              "\n\nconst combined = extractFunction('handleCombinedLogic');",
              block_start
          )
          high_risk = (
              high_risk[:block_start]
              + source_gate_checks
              + high_risk[block_end:]
          )
          high_risk_path.write_text(high_risk, encoding='utf-8')

          threshold_path = Path('scripts/check-ambulance-officer-threshold-v10101.mjs')
          threshold = threshold_path.read_text(encoding='utf-8')
          block_start = threshold.index(
              "const processRows = extractFunction('processRequirementRows');"
          )
          block_end = threshold.index(
              "\n\nconst combined = extractFunction('handleCombinedLogic');",
              block_start
          )
          threshold = (
              threshold[:block_start]
              + source_gate_checks
              + "expect(source.includes(\"'HIGH-RISK MISSING PERSON AMBULANCE'\"), 'High-risk debug contract missing');\n"
              + "expect(source.includes(\"'AMBULANCE OFFICER THRESHOLD'\"), 'Ambulance Officer debug contract missing');\n"
              + threshold[block_end:]
          )
          threshold_path.write_text(threshold, encoding='utf-8')
          PY

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-ambulance-officer-threshold-v10101.mjs
          node scripts/check-high-risk-missing-person-ambulance-v1076.mjs
          node scripts/check-police-drone-requirement-v10100.mjs
          node scripts/check-rescue-dog-search-dog-v1098.mjs
          node scripts/check-hgv-recovery-v1097.mjs
          python3 scripts/check_repository.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add user-set Ambulance Officer threshold in v1.0.101'
          git push origin HEAD:feature/ambulance-officer-threshold-v10101
