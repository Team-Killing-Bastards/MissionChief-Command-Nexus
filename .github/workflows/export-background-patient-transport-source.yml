name: Apply background patient transport release

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-background-patient-transport-source.yml

permissions:
  contents: write
  issues: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/background-patient-transports
          fetch-depth: 0

      - name: Rebuild and verify production patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          : > /tmp/background-patient-transport.patch.zlib.b64
          for issue in 346 347 348 349 350; do
            body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" --jq .body)"
            printf '%s' "$body" >> /tmp/background-patient-transport.patch.zlib.b64
          done
          python3 <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import zlib

          encoded_path = Path('/tmp/background-patient-transport.patch.zlib.b64')
          encoded = encoded_path.read_bytes()
          if len(encoded) != 24640:
              raise SystemExit(f'Encoded patch length mismatch: {len(encoded)}')
          encoded_sha = hashlib.sha256(encoded).hexdigest()
          if encoded_sha != 'c383042f5615fb1f80b017108e85cb903544d7a447820a95b43489f91f5499c0':
              raise SystemExit(f'Encoded patch SHA mismatch: {encoded_sha}')

          patch = zlib.decompress(base64.b64decode(encoded))
          patch_sha = hashlib.sha256(patch).hexdigest()
          if patch_sha != '6cbe471ffa87872c670cba9b0e76dc659b735975713ce0a8be93eed300c95232':
              raise SystemExit(f'Decoded patch SHA mismatch: {patch_sha}')

          Path('/tmp/background-patient-transport.patch').write_bytes(patch)
          PY
          git apply --check /tmp/background-patient-transport.patch
          git apply /tmp/background-patient-transport.patch
          rm -f .github/workflows/export-background-patient-transport-source.yml

      - name: Validate JavaScript syntax
        run: node -e "new Function(require('fs').readFileSync('src/missionchief-command-nexus.user.js','utf8'))"

      - name: Run targeted transport regressions
        shell: bash
        run: |
          node scripts/check-background-patient-transport-v1073.mjs
          node scripts/check-auto-patient-transport-anchor.mjs
          node scripts/check-auto-patient-transport-iframe.mjs
          node scripts/check-auto-transport-response-v1083.mjs
          node scripts/check-auto-prisoner-cell-gate.mjs
          node scripts/check-auto-prison-cell-success-v10113.mjs
          node scripts/check-auto-prisoner-release-close-v10114.mjs
          node scripts/check-auto-memory-recycle.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-version-agnostic-regressions.mjs

      - name: Run every permanent regression
        shell: bash
        run: |
          for test in scripts/check-*.mjs; do
            echo "==> $test"
            node "$test"
          done

      - name: Validate release and repository
        shell: bash
        run: |
          node scripts/validate-userscript.mjs --base-ref origin/main
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean release branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v1.1.5 background patient transport"
          git push origin HEAD:agent/background-patient-transports
