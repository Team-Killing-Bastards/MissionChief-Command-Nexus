name: Build naming Dispatch Centre filter v1.0.85

on:
  push:
    branches:
      - feature/naming-dispatch-centre-filter-v1085
    paths:
      - '.github/workflows/build-naming-dispatch-centre-v1085.yml'
      - '.github/build-naming-dispatch-centre-v1085-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/naming-dispatch-centre-filter-v1085
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build v1.0.85 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/missionchief-command-nexus.user.js')
          source = source_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          source = replace_once(source, '// @version      1.0.84', '// @version      1.0.85', 'Command Nexus version')
          source = replace_once(source, "const UNIT_VERSION = '3.3.9';", "const UNIT_VERSION = '3.3.10';", 'Unit Naming version')
          source = replace_once(source, "const STATION_VERSION = '1.3.3';", "const STATION_VERSION = '1.3.4';", 'Station Naming version')

          state_anchor = """        activeControllers: new Set()\n    };\n\n    const PERSONNEL_STATE = {"""
          state_replacement = """        activeControllers: new Set()\n    };\n\n    const NAMING_DISPATCH_CENTRE_ALL = 'ALL';\n    const NAMING_DISPATCH_CENTRE_UNASSIGNED = '__UNASSIGNED__';\n    const NAMING_DISPATCH_CENTRE_STATE = {\n        loadPromise: null,\n        loaded: false,\n        byBuildingId: new Map(),\n        labelsById: new Map()\n    };\n\n    const PERSONNEL_STATE = {"""
          source = replace_once(source, state_anchor, state_replacement, 'Dispatch Centre shared state')

          cleanup_anchor = """        STATION_STATE.buildingCoordinateCache.clear();\n        STATION_STATE.buildingDataPromise = null;\n        PERSONNEL_STATE.reports = [];"""
          cleanup_replacement = """        STATION_STATE.buildingCoordinateCache.clear();\n        STATION_STATE.buildingDataPromise = null;\n        NAMING_DISPATCH_CENTRE_STATE.byBuildingId.clear();\n        NAMING_DISPATCH_CENTRE_STATE.labelsById.clear();\n        NAMING_DISPATCH_CENTRE_STATE.loadPromise = null;\n        NAMING_DISPATCH_CENTRE_STATE.loaded = false;\n        PERSONNEL_STATE.reports = [];"""
          source = replace_once(source, cleanup_anchor, cleanup_replacement, 'Dispatch Centre lifecycle cleanup')

          helper_anchor = """    function findStationOverviewEntry(href) {"""
          helper_block = r'''    function getNamingBuildingRecordId(building) {
        const raw = building?.id ?? building?.building_id ?? building?.buildingId ?? '';
        if (raw === '' || raw == null) return '';
        return String(raw);
    }

    function getNamingDispatchCentreIdFromRecord(building) {
        const raw =
            building?.leitstelle_building_id ??
            building?.leitstelleBuildingId ??
            building?.dispatch_center_id ??
            building?.dispatchCenterId ??
            building?.dispatch_centre_id ??
            building?.dispatchCentreId ??
            '';
        if (raw === '' || raw == null) return '';
        const numeric = Number(raw);
        if (Number.isFinite(numeric) && numeric <= 0) return '';
        return String(raw);
    }

    function getNamingBuildingRecordLabel(building, fallbackId = '') {
        return cleanText(
            building?.caption ??
            building?.name ??
            building?.building_name ??
            building?.buildingName ??
            ''
        ) || `Dispatch Centre ${fallbackId}`.trim();
    }

    async function loadNamingDispatchCentreData() {
        if (NAMING_DISPATCH_CENTRE_STATE.loaded) return true;
        if (NAMING_DISPATCH_CENTRE_STATE.loadPromise) {
            return NAMING_DISPATCH_CENTRE_STATE.loadPromise;
        }

        NAMING_DISPATCH_CENTRE_STATE.loadPromise = (async () => {
            try {
                const response = await stationFetchWithTimeout('/building/buildings_json', {
                    credentials: 'same-origin',
                    cache: 'no-store'
                }, 15000);

                if (!response.ok) {
                    throw new Error(`Buildings data returned HTTP ${response.status}`);
                }

                const records = extractBuildingRecords(await response.json());
                const recordsById = new Map();
                const requestedCentreIds = new Set();

                records.forEach(building => {
                    const buildingId = getNamingBuildingRecordId(building);
                    if (!buildingId) return;
                    recordsById.set(buildingId, building);

                    const dispatchCentreId = getNamingDispatchCentreIdFromRecord(building);
                    if (!dispatchCentreId) return;
                    NAMING_DISPATCH_CENTRE_STATE.byBuildingId.set(
                        buildingId,
                        dispatchCentreId
                    );
                    requestedCentreIds.add(dispatchCentreId);
                });

                requestedCentreIds.forEach(dispatchCentreId => {
                    const centre = recordsById.get(dispatchCentreId);
                    NAMING_DISPATCH_CENTRE_STATE.labelsById.set(
                        dispatchCentreId,
                        getNamingBuildingRecordLabel(centre, dispatchCentreId)
                    );
                });

                NAMING_DISPATCH_CENTRE_STATE.loaded = true;
                return true;
            } catch (error) {
                NAMING_DISPATCH_CENTRE_STATE.byBuildingId.clear();
                NAMING_DISPATCH_CENTRE_STATE.labelsById.clear();
                NAMING_DISPATCH_CENTRE_STATE.loaded = false;
                console.warn(
                    '[Command Nexus] Dispatch Centre filter data unavailable:',
                    error
                );
                return false;
            }
        })();

        const loaded = await NAMING_DISPATCH_CENTRE_STATE.loadPromise;
        if (!loaded) NAMING_DISPATCH_CENTRE_STATE.loadPromise = null;
        return loaded;
    }

    function getNamingDispatchCentreId(buildingId) {
        const key = String(buildingId || '');
        return key
            ? NAMING_DISPATCH_CENTRE_STATE.byBuildingId.get(key) || ''
            : '';
    }

    function stationMatchesNamingDispatchCentre(station, selectedDispatchCentre) {
        const selected = String(
            selectedDispatchCentre || NAMING_DISPATCH_CENTRE_ALL
        );
        if (selected === NAMING_DISPATCH_CENTRE_ALL) return true;
        if (selected === NAMING_DISPATCH_CENTRE_UNASSIGNED) {
            return !station?.dispatchCentreId;
        }
        return String(station?.dispatchCentreId || '') === selected;
    }

    function populateNamingDispatchCentreFilter(selectId, stations) {
        const select = document.getElementById(selectId);
        if (!select) return;

        const previous = select.value || NAMING_DISPATCH_CENTRE_ALL;
        const centreIds = [...new Set(
            (stations || [])
                .map(station => String(station?.dispatchCentreId || ''))
                .filter(Boolean)
        )].sort((a, b) => {
            const labelA = NAMING_DISPATCH_CENTRE_STATE.labelsById.get(a) || a;
            const labelB = NAMING_DISPATCH_CENTRE_STATE.labelsById.get(b) || b;
            return labelA.localeCompare(labelB, undefined, { numeric: true });
        });
        const hasUnassigned =
            NAMING_DISPATCH_CENTRE_STATE.loaded &&
            (stations || []).some(station => !station?.dispatchCentreId);

        select.replaceChildren();
        const addOption = (value, label) => {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = label;
            select.appendChild(option);
        };

        addOption(NAMING_DISPATCH_CENTRE_ALL, 'All dispatch centres');
        centreIds.forEach(dispatchCentreId => {
            addOption(
                dispatchCentreId,
                NAMING_DISPATCH_CENTRE_STATE.labelsById.get(dispatchCentreId) ||
                    `Dispatch Centre ${dispatchCentreId}`
            );
        });
        if (hasUnassigned) {
            addOption(
                NAMING_DISPATCH_CENTRE_UNASSIGNED,
                'Unassigned / default'
            );
        }

        const values = new Set([...select.options].map(option => option.value));
        select.value = values.has(previous)
            ? previous
            : NAMING_DISPATCH_CENTRE_ALL;
        select.disabled = !NAMING_DISPATCH_CENTRE_STATE.loaded;
        select.title = NAMING_DISPATCH_CENTRE_STATE.loaded
            ? 'Filter stations by their MissionChief Dispatch Centre assignment.'
            : 'Dispatch Centre data unavailable; using all stations.';
    }

'''
          source = replace_once(source, helper_anchor, helper_block + helper_anchor, 'Dispatch Centre helper functions')

          unit_ui_anchor = """                    <select id=\"mc-namer-station-type\">\n                        ${Object.entries(STATION_TYPES).map(([key, label]) => `<option value=\"${key}\">${label}</option>`).join('')}\n                    </select>\n\n                    <label style=\"margin-top:6px; display:block;\"><b>Unit Class:</b></label>"""
          unit_ui_new = """                    <select id=\"mc-namer-station-type\">\n                        ${Object.entries(STATION_TYPES).map(([key, label]) => `<option value=\"${key}\">${label}</option>`).join('')}\n                    </select>\n\n                    <label style=\"margin-top:6px; display:block;\"><b>Dispatch Centre:</b></label>\n                    <select id=\"mc-namer-dispatch-centre\" disabled>\n                        <option value=\"ALL\">All dispatch centres</option>\n                    </select>\n\n                    <label style=\"margin-top:6px; display:block;\"><b>Unit Class:</b></label>"""
          source = replace_once(source, unit_ui_anchor, unit_ui_new, 'Unit Naming Dispatch Centre control')

          station_ui_anchor = """                    <select id=\"mc-station-type\">\n                        ${Object.entries(STATION_TYPES).map(([key, label]) => `<option value=\"${key}\">${label}</option>`).join('')}\n                    </select>\n\n                    <label style=\"margin-top:6px; display:block;\"><b>Mode:</b></label>"""
          station_ui_new = """                    <select id=\"mc-station-type\">\n                        ${Object.entries(STATION_TYPES).map(([key, label]) => `<option value=\"${key}\">${label}</option>`).join('')}\n                    </select>\n\n                    <label style=\"margin-top:6px; display:block;\"><b>Dispatch Centre:</b></label>\n                    <select id=\"mc-station-dispatch-centre\" disabled>\n                        <option value=\"ALL\">All dispatch centres</option>\n                    </select>\n\n                    <label style=\"margin-top:6px; display:block;\"><b>Mode:</b></label>"""
          source = replace_once(source, station_ui_anchor, station_ui_new, 'Station Naming Dispatch Centre control')

          css_anchor = """            #mc-namer-startfrom,\n            #mc-namer-station-type,\n            #mc-namer-unit-class,"""
          css_new = """            #mc-namer-startfrom,\n            #mc-namer-station-type,\n            #mc-namer-dispatch-centre,\n            #mc-namer-unit-class,"""
          source = replace_once(source, css_anchor, css_new, 'Unit Naming select styling')
          css_station_anchor = """            #mc-station-startfrom,\n            #mc-station-type,\n            #mc-station-mode,"""
          css_station_new = """            #mc-station-startfrom,\n            #mc-station-type,\n            #mc-station-dispatch-centre,\n            #mc-station-mode,"""
          source = replace_once(source, css_station_anchor, css_station_new, 'Station Naming select styling')

          event_anchor = """        document.querySelector('#mc-namer-station-type').onchange = handleUnitStationTypeChange;"""
          event_new = event_anchor + "\n        document.querySelector('#mc-namer-dispatch-centre').onchange = populateStartDropdown;"
          source = replace_once(source, event_anchor, event_new, 'Unit Dispatch Centre change handler')
          station_event_anchor = """        document.querySelector('#mc-station-type').onchange = populateStationNamingStartDropdown;"""
          station_event_new = station_event_anchor + "\n        document.querySelector('#mc-station-dispatch-centre').onchange = populateStationNamingStartDropdown;"
          source = replace_once(source, station_event_anchor, station_event_new, 'Station Dispatch Centre change handler')

          source = replace_once(source, '    function refreshStationNamingStations() {', '    async function refreshStationNamingStations() {', 'Async Station Naming refresh')
          station_refresh_anchor = """        const stationEntries = getStationOverviewEntries();\n\n        STATION_STATE.stations = stationEntries"""
          station_refresh_new = """        const stationEntries = getStationOverviewEntries();\n        await loadNamingDispatchCentreData();\n\n        STATION_STATE.stations = stationEntries"""
          source = replace_once(source, station_refresh_anchor, station_refresh_new, 'Load Dispatch Centre data for Station Naming')
          station_map_anchor = """                    buildingTypeId: entry.buildingTypeId,\n                    stationType: typeInfo.stationType,"""
          station_map_new = """                    buildingTypeId: entry.buildingTypeId,\n                    dispatchCentreId: getNamingDispatchCentreId(entry.buildingId),\n                    stationType: typeInfo.stationType,"""
          source = replace_once(source, station_map_anchor, station_map_new, 'Station Naming Dispatch Centre relationship')
          station_populate_anchor = """        populateStationNamingStartDropdown();\n        setStationUiValue('status', 'Ready');"""
          station_populate_new = """        populateNamingDispatchCentreFilter(\n            'mc-station-dispatch-centre',\n            STATION_STATE.stations\n        );\n        populateStationNamingStartDropdown();\n        setStationUiValue('status', 'Ready');"""
          source = replace_once(source, station_populate_anchor, station_populate_new, 'Populate Station Naming Dispatch Centre filter')

          station_filter_anchor = """        const selectedType = document.querySelector('#mc-station-type')?.value || 'ALL';\n\n        STATION_STATE.filteredStations = STATION_STATE.stations.filter(station => {\n            return selectedType === 'ALL' || station.stationType === selectedType;\n        });"""
          station_filter_new = """        const selectedType = document.querySelector('#mc-station-type')?.value || 'ALL';\n        const selectedDispatchCentre =\n            document.querySelector('#mc-station-dispatch-centre')?.value ||\n            NAMING_DISPATCH_CENTRE_ALL;\n\n        STATION_STATE.filteredStations = STATION_STATE.stations.filter(station => {\n            const stationTypeMatches =\n                selectedType === 'ALL' || station.stationType === selectedType;\n            return stationTypeMatches && stationMatchesNamingDispatchCentre(\n                station,\n                selectedDispatchCentre\n            );\n        });"""
          source = replace_once(source, station_filter_anchor, station_filter_new, 'Station Naming combined filters')

          source = replace_once(source, '    function refreshStations() {', '    async function refreshStations() {', 'Async Unit Naming refresh')
          unit_refresh_anchor = """        const stationEntries = getStationOverviewEntries();\n\n        STATE.stations = stationEntries.map((entry, index) => ({"""
          unit_refresh_new = """        const stationEntries = getStationOverviewEntries();\n        await loadNamingDispatchCentreData();\n\n        STATE.stations = stationEntries.map((entry, index) => ({"""
          source = replace_once(source, unit_refresh_anchor, unit_refresh_new, 'Load Dispatch Centre data for Unit Naming')
          unit_map_anchor = """            href: entry.href,\n            displayName: entry.displayName,\n            callsignBase: createCallsignBase(entry.displayName),"""
          unit_map_new = """            href: entry.href,\n            buildingId: entry.buildingId,\n            displayName: entry.displayName,\n            dispatchCentreId: getNamingDispatchCentreId(entry.buildingId),\n            callsignBase: createCallsignBase(entry.displayName),"""
          source = replace_once(source, unit_map_anchor, unit_map_new, 'Unit Naming Dispatch Centre relationship')
          unit_populate_anchor = """        populateStartDropdown();\n\n        setStatus('Ready');"""
          unit_populate_new = """        populateNamingDispatchCentreFilter(\n            'mc-namer-dispatch-centre',\n            STATE.stations\n        );\n        populateStartDropdown();\n\n        setStatus('Ready');"""
          source = replace_once(source, unit_populate_anchor, unit_populate_new, 'Populate Unit Naming Dispatch Centre filter')

          unit_filter_anchor = """        const selectedType = document.querySelector('#mc-namer-station-type')?.value || 'ALL';\n\n        STATE.filteredStations = STATE.stations.filter(station => {\n            return selectedType === 'ALL' || station.stationType === selectedType;\n        });"""
          unit_filter_new = """        const selectedType = document.querySelector('#mc-namer-station-type')?.value || 'ALL';\n        const selectedDispatchCentre =\n            document.querySelector('#mc-namer-dispatch-centre')?.value ||\n            NAMING_DISPATCH_CENTRE_ALL;\n\n        STATE.filteredStations = STATE.stations.filter(station => {\n            const stationTypeMatches =\n                selectedType === 'ALL' || station.stationType === selectedType;\n            return stationTypeMatches && stationMatchesNamingDispatchCentre(\n                station,\n                selectedDispatchCentre\n            );\n        });"""
          source = replace_once(source, unit_filter_anchor, unit_filter_new, 'Unit Naming combined filters')

          source_path.write_text(source, encoding='utf-8')

          # Refresh all permanent current-version assertions while retaining the Mission Finder baseline.
          for path in sorted(Path('scripts').glob('check-*.mjs')):
              text = path.read_text(encoding='utf-8')
              text = text.replace('// @version      1.0.84', '// @version      1.0.85')
              text = text.replace("const UNIT_VERSION = '3.3.9';", "const UNIT_VERSION = '3.3.10';")
              text = text.replace("const STATION_VERSION = '1.3.3';", "const STATION_VERSION = '1.3.4';")
              path.write_text(text, encoding='utf-8')

          regression = r'''#!/usr/bin/env node
import { readFile } from 'node:fs/promises';

const source = await readFile('src/missionchief-command-nexus.user.js', 'utf8');
const workflow = await readFile('.github/workflows/validate-userscript.yml', 'utf8');

function fail(message) {
  console.error(`ERROR: ${message}`);
  process.exit(1);
}

function requireText(text, label = text) {
  if (!source.includes(text)) fail(`Missing naming Dispatch Centre contract: ${label}`);
}

for (const [text, label] of [
  ['// @version      1.0.85', 'Command Nexus 1.0.85 metadata'],
  ["const UNIT_VERSION = '3.3.10';", 'Unit Naming 3.3.10'],
  ["const STATION_VERSION = '1.3.4';", 'Station Naming 1.3.4'],
  ['id="mc-namer-dispatch-centre" disabled', 'Unit Naming Dispatch Centre select'],
  ['id="mc-station-dispatch-centre" disabled', 'Station Naming Dispatch Centre select'],
  ["const NAMING_DISPATCH_CENTRE_ALL = 'ALL';", 'All Dispatch Centres default'],
  ["const NAMING_DISPATCH_CENTRE_UNASSIGNED = '__UNASSIGNED__';", 'unassigned Dispatch Centre option'],
  ["stationFetchWithTimeout('/building/buildings_json'", 'authoritative MissionChief building dataset'],
  ['building?.leitstelle_building_id', 'authoritative Dispatch Centre relationship'],
  ['function stationMatchesNamingDispatchCentre(', 'shared Dispatch Centre predicate'],
  ['function populateNamingDispatchCentreFilter(', 'shared Dispatch Centre selector population'],
  ["dispatchCentreId: getNamingDispatchCentreId(entry.buildingId)", 'station Dispatch Centre mapping'],
  ["document.querySelector('#mc-namer-dispatch-centre').onchange = populateStartDropdown;", 'Unit Naming filter change handler'],
  ["document.querySelector('#mc-station-dispatch-centre').onchange = populateStationNamingStartDropdown;", 'Station Naming filter change handler'],
  ["document.querySelector('#mc-namer-dispatch-centre')?.value", 'Unit Naming selected Dispatch Centre'],
  ["document.querySelector('#mc-station-dispatch-centre')?.value", 'Station Naming selected Dispatch Centre'],
  ["'All dispatch centres'", 'All Dispatch Centres option label'],
  ["'Unassigned / default'", 'unassigned option label'],
]) requireText(text, label);

if ((source.match(/dispatchCentreId: getNamingDispatchCentreId\(entry\.buildingId\)/g) || []).length < 2) {
  fail('Both Unit Naming and Station Naming must retain the authoritative Dispatch Centre relationship.');
}

if (!source.includes('async function refreshStations()') ||
    !source.includes('async function refreshStationNamingStations()')) {
  fail('Both naming refresh paths must wait for Dispatch Centre data before filtering.');
}

if ((source.match(/await loadNamingDispatchCentreData\(\);/g) || []).length < 2) {
  fail('Both naming tools must load Dispatch Centre data on Refresh Stations.');
}

if (source.includes('mc-personnel-dispatch-centre')) {
  fail('Dispatch Centre filtering must not leak into Personnel Assignment.');
}

if (!workflow.includes('scripts/check-naming-dispatch-centre-filter-v1085.mjs')) {
  fail('Naming Dispatch Centre regression is not registered in Validate userscript.');
}

console.log('Unit Naming and Station Naming Dispatch Centre filter contracts passed.');
'''
          Path('scripts/check-naming-dispatch-centre-filter-v1085.mjs').write_text(regression, encoding='utf-8')

          workflow_path = Path('.github/workflows/validate-userscript.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          marker = "      - 'scripts/check-personnel-assignment-ios-completeness-v1084.mjs'\n"
          if workflow.count(marker) != 2:
              raise SystemExit(f'Validate workflow path marker count was {workflow.count(marker)}, expected 2')
          workflow = workflow.replace(
              marker,
              marker + "      - 'scripts/check-naming-dispatch-centre-filter-v1085.mjs'\n"
          )
          step_marker = "      - name: Validate complete iOS Safari Personnel Assignment controls\n        run: node scripts/check-personnel-assignment-ios-completeness-v1084.mjs\n"
          if workflow.count(step_marker) != 1:
              raise SystemExit('Unable to locate v1.0.84 validation step')
          workflow = workflow.replace(
              step_marker,
              step_marker + "\n      - name: Validate Unit and Station Naming Dispatch Centre filters\n        run: node scripts/check-naming-dispatch-centre-filter-v1085.mjs\n",
              1
          )
          workflow = workflow.replace(
              'complete iOS Personnel Assignment controls,',
              'complete iOS Personnel Assignment controls, Unit/Station Naming Dispatch Centre filters,'
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          heading = '## [1.0.84] - 2026-08-05\n'
          if heading not in changelog:
              raise SystemExit('Unable to locate v1.0.84 changelog heading')
          section = '''## [1.0.85] - 2026-08-08

### Added

- Unit Naming and Station Naming now include a **Dispatch Centre** filter alongside the existing station-type filter.
- Dispatch Centre options come from MissionChief's authoritative `/building/buildings_json` building data and each station's `leitstelle_building_id` relationship rather than station-name guessing.
- **All dispatch centres** remains the default, preserving the existing naming scope. When MissionChief reports stations with no Dispatch Centre assignment, **Unassigned / default** is available as an explicit filter.

### Safety and scope

- The filter only changes which stations enter the Unit Naming or Station Naming queue; the established callsign/name generation and save logic are unchanged.
- Personnel Assignment is not filtered by this control.
- If Dispatch Centre data cannot be loaded, the selector stays disabled and naming safely falls back to the existing all-stations behaviour.

### Changed resource baselines

- Unit Naming increased from `3.3.9` to `3.3.10`.
- Station Naming increased from `1.3.3` to `1.3.4`.
- Mission Finder remains `V10.6.144`.
- Personnel Assignment remains `1.3.9`.
- Command Nexus increased from `1.0.84` to `1.0.85`.

'''
          changelog_path.write_text(changelog.replace(heading, section + heading, 1), encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('**Current version:** `1.0.84` · **Mission Finder engine:** `V10.6.144`', '**Current version:** `1.0.85` · **Mission Finder engine:** `V10.6.144`', 1)
          bullet = '- Station and vehicle naming\n'
          if bullet not in readme:
              raise SystemExit('README resource administration bullet not found')
          readme = readme.replace(bullet, bullet + '- Dispatch Centre scoping for Unit Naming and Station Naming\n', 1)
          readme_path.write_text(readme, encoding='utf-8')

          src_readme_path = Path('src/README.md')
          src_readme = src_readme_path.read_text(encoding='utf-8')
          src_readme = src_readme.replace('| Command Nexus version | `1.0.84` |', '| Command Nexus version | `1.0.85` |', 1)
          src_readme = src_readme.replace('| Mission Finder baseline | `V10.6.143` |', '| Mission Finder baseline | `V10.6.144` |', 1)
          model_sentence = 'Resource Administration uses one filtered lifecycle controller,'
          if model_sentence in src_readme:
              src_readme = src_readme.replace(
                  model_sentence,
                  'Resource Administration includes authoritative Dispatch Centre scoping for Unit and Station Naming and uses one filtered lifecycle controller,',
                  1
              )
          src_readme_path.write_text(src_readme, encoding='utf-8')
          PY

          # Remove all one-use diagnostics/build controls before validating the candidate.
          git rm -f --ignore-unmatch \
            .github/workflows/diagnose-naming-dispatch-centre-v1085.yml \
            .github/diagnose-naming-dispatch-centre-v1085-trigger.txt \
            .diagnostic-naming-dispatch-centre-v1085.txt \
            .github/workflows/build-naming-dispatch-centre-v1085.yml \
            .github/build-naming-dispatch-centre-v1085-trigger.txt

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Dispatch Centre filters to naming tools'
          git push origin HEAD:refs/heads/feature/naming-dispatch-centre-filter-v1085
