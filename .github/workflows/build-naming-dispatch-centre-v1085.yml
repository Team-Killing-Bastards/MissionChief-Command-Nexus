name: Build naming Dispatch Centre filter v1.0.85

on:
  push:
    branches:
      - feature/naming-dispatch-centre-filter-v1085
    paths:
      - '.github/workflows/build-naming-dispatch-centre-v1085.yml'
      - '.github/build-naming-dispatch-centre-v1085-trigger.txt'
      - 'scripts/temporary-build-naming-dispatch-centre-v1085.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/naming-dispatch-centre-filter-v1085
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply candidate patch
        run: python3 scripts/temporary-build-naming-dispatch-centre-v1085.py

      - name: Remove one-use build and diagnostic controls
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/diagnose-naming-dispatch-centre-v1085.yml \
            .github/diagnose-naming-dispatch-centre-v1085-trigger.txt \
            .diagnostic-naming-dispatch-centre-v1085.txt \
            .github/workflows/build-naming-dispatch-centre-v1085.yml \
            .github/build-naming-dispatch-centre-v1085-trigger.txt \
            scripts/temporary-build-naming-dispatch-centre-v1085.py

      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Push clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Dispatch Centre filters to naming tools'
          git push origin HEAD:refs/heads/feature/naming-dispatch-centre-filter-v1085
