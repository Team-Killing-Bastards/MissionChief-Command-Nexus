name: Extract mission coverage context

on:
  push:
    branches:
      - inspect/mission-coverage-v1075
    paths:
      - .github/workflows/extract-mission-coverage-context.yml
      - .github/builders/extract-mission-coverage-context.py

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inspect/mission-coverage-v1075
      - name: Extract source contexts
        run: python .github/builders/extract-mission-coverage-context.py
      - name: Commit source contexts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/mission-coverage-context
          git commit -m "Refresh temporary mission coverage source contexts"
          git push
