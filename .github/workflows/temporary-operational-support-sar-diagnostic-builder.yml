name: Temporary Operational Support SAR diagnostic builder

# Diagnostic v2: isolate the patcher result before validation or publishing.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-operational-support-sar-diagnostic-builder.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out target branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/fix-operational-support-sar-vehicle

      - name: Run patcher and report exact result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          git fetch origin main --force
          git show origin/main:scripts/temporary-operational-support-sar-patch.py > /tmp/operational-support-sar-patch.py
          python3 /tmp/operational-support-sar-patch.py > /tmp/patch-result.log 2>&1
          status=$?
          {
            echo "Operational Support SAR patcher diagnostic status: ${status}."
            echo
            echo '```text'
            cat /tmp/patch-result.log
            echo '```'
          } > /tmp/patch-result.md
          gh pr comment 80 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/patch-result.md
          exit "${status}"
