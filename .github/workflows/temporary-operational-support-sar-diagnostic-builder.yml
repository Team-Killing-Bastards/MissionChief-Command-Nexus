name: Temporary Operational Support SAR final builder

# Final builder v8: execute the standalone trusted build script.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-operational-support-sar-diagnostic-builder.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out target branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/fix-operational-support-sar-vehicle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Execute standalone trusted build and report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          git fetch origin main --force
          git show origin/main:scripts/temporary-operational-support-sar-final-build.sh > /tmp/operational-support-sar-final-build.sh
          bash /tmp/operational-support-sar-final-build.sh > /tmp/operational-support-sar-final.log 2>&1
          status=$?

          if [[ "${status}" -eq 0 ]]; then
            gh pr comment 80 --repo "${GITHUB_REPOSITORY}" --body "Operational Support SAR final build passed. The PR branch now contains one validated v1.0.17 release commit with Mission Finder V10.6.81."
            exit 0
          fi

          {
            echo "Operational Support SAR final build failed with status ${status}."
            echo
            echo '```text'
            tail -n 120 /tmp/operational-support-sar-final.log
            echo '```'
          } > /tmp/operational-support-sar-final-failure.md
          gh pr comment 80 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/operational-support-sar-final-failure.md
          exit "${status}"
