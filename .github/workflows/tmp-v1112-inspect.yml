name: Temporary v1.1.12 logger inspection
# Trigger the trusted v1.1.12 builder after both temporary workflows exist.

on:
  push:
    branches:
      - hotfix/v1.1.12-multi-device-lag
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact logger helper contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              'src/missionchief-command-nexus.user.js': [
                  'function filterSemanticDuplicateDispatchRows_',
                  'function startMissionLoggerCreditReconciliation',
                  'function stopMissionLoggerCreditReconciliation',
                  'function scheduleMissionLoggerCreditReconciliation',
                  'function readMissionLoggerQueue',
                  'function writeMissionLoggerQueue',
                  'function acquireMissionLoggerSyncLock',
                  'function recordPreparedMissionLoggerDispatch',
                  'function recordMissionLoggerNativeCompletion',
                  'function installMissionActivityRecorder',
              ],
              'integrations/google-apps-script/Code.gs': [
                  'function filterSemanticDuplicateDispatchRows_',
                  'function createLoggerBatchChecksum_',
                  'function upsertLoggerProfileDevice_',
                  'function seedLoggerConfiguration_',
                  'function doPost',
              ],
          }

          for filename, needles in targets.items():
              path = Path(filename)
              lines = path.read_text(encoding='utf-8').splitlines()
              print(f'######## {filename} ({len(lines)} lines) ########')
              for needle in needles:
                  matches = [i for i, line in enumerate(lines) if needle in line]
                  print(f'---- {needle}: {matches} ----')
                  for i in matches:
                      start = max(0, i - 20)
                      end = min(len(lines), i + 180)
                      for j in range(start, end):
                          print(f'{j+1:06d}: {lines[j]}')
                      print()
          PY
