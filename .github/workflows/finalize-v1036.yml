name: Finalize and verify v1.0.36

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: finalize-v1.0.36
  cancel-in-progress: false

jobs:
  tag:
    name: Reconcile clean v1.0.36 tag
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/finalize-v1036'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Verify clean source and reconcile tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.36
          RELEASE_SHA: ec1b8785263c45f5b4bf1f72a06debaba79362ac
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main

          VERSION="$(
            git show "${RELEASE_SHA}:src/missionchief-command-nexus.user.js" |
              sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' |
              head -n 1 |
              xargs
          )"
          if [[ "${VERSION}" != '1.0.36' ]]; then
            echo "Expected 1.0.36; found ${VERSION}."
            exit 1
          fi

          TEMPORARY_WORKFLOWS="$(
            git ls-tree -r --name-only "${RELEASE_SHA}" .github/workflows |
              grep -E '^\.github/workflows/(temporary-|finalize-v1035).*\.ya?ml$' || true
          )"
          if [[ -n "${TEMPORARY_WORKFLOWS}" ]]; then
            echo 'Release source contains temporary or obsolete finalizer workflows:'
            echo "${TEMPORARY_WORKFLOWS}"
            exit 1
          fi

          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            CURRENT_TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${CURRENT_TAG_SHA}" != "${RELEASE_SHA}" ]]; then
              if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
                echo "Published ${RELEASE_TAG} points to ${CURRENT_TAG_SHA}; refusing to retag."
                exit 1
              fi
              git tag -d "${RELEASE_TAG}"
              git push origin ":refs/tags/${RELEASE_TAG}"
            fi
          fi

          if ! git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            git config user.name MartyBlyth
            git config user.email 32400596+Martyblyth@users.noreply.github.com
            git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" \
              -m 'MissionChief Command Nexus 1.0.36'
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          FINAL_TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          [[ "${FINAL_TAG_SHA}" == "${RELEASE_SHA}" ]]

  publish:
    name: Publish v1.0.36 through permanent release workflow
    needs: tag
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.36
      release_notes: Optimises trained-personnel coverage with multi-trained staff, type-51 PSU capacity, type-8 IRV remainder allocation, controlled fallback dispatch and visible non-blocking training shortfall reporting.
    secrets: inherit

  verify:
    name: Verify published assets and delivery receipt
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Verify GitHub assets and permanent delivery receipt
        env:
          GH_TOKEN: ${{ github.token }}
          FINALIZER_PR: ${{ github.event.pull_request.number }}
          SOURCE_PR: '155'
          RELEASE_TAG: v1.0.36
          RELEASE_SHA: ec1b8785263c45f5b4bf1f72a06debaba79362ac
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          ASSET='MissionChief-Command-Nexus-1.0.36.user.js'
          CHECKSUM_ASSET="${ASSET}.sha256"
          gh release view "${RELEASE_TAG}" \
            --json url,isDraft,isPrerelease,assets,tagName,targetCommitish \
            > /tmp/v1036-release.json

          RELEASE_URL="$(jq -r '.url' /tmp/v1036-release.json)"
          [[ "$(jq -r '.isDraft' /tmp/v1036-release.json)" == 'false' ]]
          [[ "$(jq -r '.isPrerelease' /tmp/v1036-release.json)" == 'false' ]]

          for required_asset in "${ASSET}" "${CHECKSUM_ASSET}"; do
            COUNT="$(
              jq -r --arg name "${required_asset}" \
                '[.assets[] | select(.name == $name)] | length' \
                /tmp/v1036-release.json
            )"
            [[ "${COUNT}" == '1' ]]
          done

          RECEIPT_COUNT="$(
            jq -r \
              '[.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.36-"))] | length' \
              /tmp/v1036-release.json
          )"
          [[ "${RECEIPT_COUNT}" == '1' ]]
          RECEIPT_NAME="$(
            jq -r \
              '.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.36-")) | .name' \
              /tmp/v1036-release.json
          )"

          TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          [[ "${TAG_SHA}" == "${RELEASE_SHA}" ]]

          rm -rf /tmp/v1036-release-check
          mkdir -p /tmp/v1036-release-check
          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${CHECKSUM_ASSET}" \
            --dir /tmp/v1036-release-check \
            --clobber
          (
            cd /tmp/v1036-release-check
            sha256sum -c "${CHECKSUM_ASSET}"
          )

          git show "${TAG_SHA}:src/missionchief-command-nexus.user.js" \
            > /tmp/v1036-expected.user.js
          cmp --silent \
            /tmp/v1036-expected.user.js \
            "/tmp/v1036-release-check/${ASSET}"

          # The required publish job above succeeds only after release-notify.mjs
          # verifies exact Greasy Fork source parity and records the successful
          # Discord delivery receipt. Rechecking the update URL here with an
          # arbitrary query string is not reliable because Greasy Fork may serve
          # that query through a separate cache path.
          CHECKSUM="$(sha256sum /tmp/v1036-expected.user.js | awk '{print $1}')"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > /tmp/v1036-receipt.md <<EOF
          ## v1.0.36 release verified

          - Release workflow: ${RUN_URL}
          - GitHub release: ${RELEASE_URL}
          - GitHub userscript and checksum assets: verified
          - Greasy Fork: exact source parity confirmed by the successful permanent release workflow
          - Discord: one delivery receipt confirmed as \`${RECEIPT_NAME}\`
          - Source commit: \`${TAG_SHA}\`
          - SHA-256: \`${CHECKSUM}\`
          EOF

          gh pr comment "${SOURCE_PR}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/v1036-receipt.md
          gh pr comment "${FINALIZER_PR}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/v1036-receipt.md

  finish:
    name: Close one-use finalizer
    needs:
      - tag
      - publish
      - verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Close and remove one-use branch
        env:
          GH_TOKEN: ${{ github.token }}
          FINALIZER_PR: ${{ github.event.pull_request.number }}
          TAG_RESULT: ${{ needs.tag.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TAG_RESULT}" == 'success' && \
                "${PUBLISH_RESULT}" == 'success' && \
                "${VERIFY_RESULT}" == 'success' ]]; then
            gh pr close "${FINALIZER_PR}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment 'v1.0.36 was published and independently verified across GitHub, Greasy Fork and Discord.'
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/release/finalize-v1036" || true
          else
            gh pr comment "${FINALIZER_PR}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "v1.0.36 finalization stopped: tag=${TAG_RESULT}, publish=${PUBLISH_RESULT}, verify=${VERIFY_RESULT}."
            exit 1
          fi
