name: Prepare Road Rail type-107-only correction

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/remove-road-rail-text-fallback'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/remove-road-rail-text-fallback
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact type-107-only matcher
        shell: bash
        run: |
          set -euo pipefail
          python3 .diagnostics/apply-road-rail-type107-only.py
          rm -f .diagnostics/apply-road-rail-type107-only.py
          rm -f .diagnostics/road-rail-type107-only.txt

      - name: Validate complete Command Nexus candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          grep -Fq '// @version      1.0.40' src/missionchief-command-nexus.user.js
          grep -Fq ' * MODULE 2: MISSION FINDER V10.6.104' src/missionchief-command-nexus.user.js
          grep -Fq "return getVehicleTypeIdentifiers(input).includes('107');" src/missionchief-command-nexus.user.js
          git diff --check

      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Remove ambiguous Road Rail RRU text fallback'
          git push origin HEAD:agent/remove-road-rail-text-fallback
