name: Build validated v1.0.35 missing-requirements priority fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-v1.0.35-missing-requirements-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    name: Apply and validate missing-requirements-first fix
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/missing-requirements-source'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Fetch and verify exact v1.0.35 patch chunks
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_BRANCH}" --force

          declare -A expected=(
            [00]='eaf7d51bf253d09ac0c21d57fd1402e28ed213fe95fe9893626a7c96985bb58f'
            [01]='f40bf34e5b90c2a5ea1a6f9c3ef17873b3df636861c8032a0a4a0f59c618466a'
            [02]='2108a8117469fdbb02695215875bcd271b3cbbaf9fa8407d755b5187e48396bd'
            [03]='a4db8d05c58acc34c6ad7f42ee5f83b92767792a182ac50844bddec478ba342e'
            [04]='47e5aadcd2bfe2f0466e8601ec1176682a8076c36662c38881f2d85035ddb065'
            [05]='d54206139c059743c311e7d880cdee168c6cb92aa00a9d56840c2fad98bae6fe'
          )

          : > /tmp/v1035.patch.normalized.b64
          for suffix in 00 01 02 03 04 05; do
            part="/tmp/v1035.part-${suffix}"
            git show "origin/${HEAD_BRANCH}:.diagnostics/v1.0.35-missing-requirements-priority.part-${suffix}" > "${part}"
            tr -d '\r\n\t ' < "${part}" > "${part}.normalized"
            echo "${expected[${suffix}]}  ${part}.normalized" | sha256sum --check
            cat "${part}.normalized" >> /tmp/v1035.patch.normalized.b64
          done

          echo '1b99a3ce0f91fd38926fa2eba021edb01bb320cacd983e60d533e3a52bce7847  /tmp/v1035.patch.normalized.b64' | sha256sum --check
          wc -c /tmp/v1035.patch.normalized.b64

      - name: Decode exact patch payload
        run: base64 --decode /tmp/v1035.patch.normalized.b64 | gzip --decompress > /tmp/v1035.patch

      - name: Verify exact raw patch checksum
        run: echo '0bd0e8fb4617a8f8ecca1d3140af529ea5f43fdb327eb43479c18393b065b230  /tmp/v1035.patch' | sha256sum --check

      - name: Verify patch applies to latest main
        run: git apply --check /tmp/v1035.patch

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply exact patch and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/v1035.patch
          git rm -f .github/workflows/temporary-export-current-source.yml
          git diff --check

      - name: Validate userscript JavaScript syntax
        run: node --check src/missionchief-command-nexus.user.js

      - name: Validate new regression-test JavaScript syntax
        run: node --check scripts/check-missing-requirements-priority.mjs

      - name: Validate release-notification test JavaScript syntax
        run: node --check scripts/check-release-notification-single-delivery.mjs

      - name: Validate userscript metadata and limits
        run: node scripts/validate-userscript.mjs

      - name: Validate required version increase
        run: node scripts/validate-userscript.mjs --base-ref origin/main

      - name: Validate iOS compatibility contracts
        run: node scripts/check-ios-compatibility.mjs

      - name: Validate runtime hardening contracts
        run: node scripts/check-runtime-hardening.mjs

      - name: Validate Police IRV fallback contracts
        run: node scripts/check-police-irv-fallback.mjs

      - name: Validate iOS Unit Finder contracts
        run: node scripts/check-ios-unit-finder-selection.mjs

      - name: Validate iOS mission source contracts
        run: node scripts/check-ios-mission-requirements-source.mjs

      - name: Validate iPhone Mission Finder UI contracts
        run: node scripts/check-iphone-mission-ui.mjs

      - name: Validate prior open-issue fixes
        run: node scripts/check-open-issues-batch.mjs

      - name: Validate missing-requirements priority contracts
        run: node scripts/check-missing-requirements-priority.mjs

      - name: Validate single-delivery Discord release contracts
        run: node scripts/check-release-notification-single-delivery.mjs

      - name: Validate repository integrity
        run: python3 scripts/check_repository.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Verify focused v1.0.35 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          required = {
              'version': '// @version      1.0.35',
              'engine': ' * MODULE 2: MISSION FINDER V10.6.100',
              'explicit vehicles': 'explicitMissingVehicles: true',
              'explicit personnel': 'explicitMissingPersonnel: true',
              'authority filter': 'const explicitMissingRequirementsPresent =',
              'current rows': "currentUpdateRows,\n                    'CURRENT MISSING REQUIREMENTS'",
              'late recheck': 'const refreshedUpdateRows =',
              'auto priority': 'const hasEarlyExplicitMissingRequirements =',
              'total target': "dispatchTargetMode: 'total'",
          }
          missing = [label for label, token in required.items() if token not in source]
          if missing:
              raise SystemExit('Missing focused v1.0.35 contracts: ' + ', '.join(missing))
          print('Focused v1.0.35 contracts passed.')
          PY

      - name: Create unattached validated v1.0.35 source commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          create_blob() {
            local file_path="$1"
            python3 - "${file_path}" <<'PY' > /tmp/v1035-blob.json
          import base64
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          print(json.dumps({
              'content': base64.b64encode(path.read_bytes()).decode('ascii'),
              'encoding': 'base64',
          }))
          PY
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/blobs" \
              --input /tmp/v1035-blob.json \
              --jq '.sha'
          }

          PARENT_SHA="$(git rev-parse origin/main)"
          BASE_TREE_SHA="$(git rev-parse "${PARENT_SHA}^{tree}")"

          SOURCE_BLOB="$(create_blob src/missionchief-command-nexus.user.js)"
          README_BLOB="$(create_blob README.md)"
          CHANGELOG_BLOB="$(create_blob CHANGELOG.md)"
          SOURCE_README_BLOB="$(create_blob src/README.md)"
          IOS_SOURCE_TEST_BLOB="$(create_blob scripts/check-ios-mission-requirements-source.mjs)"
          IPHONE_UI_TEST_BLOB="$(create_blob scripts/check-iphone-mission-ui.mjs)"
          OPEN_ISSUES_TEST_BLOB="$(create_blob scripts/check-open-issues-batch.mjs)"
          POLICE_TEST_BLOB="$(create_blob scripts/check-police-irv-fallback.mjs)"
          MISSING_REQUIREMENTS_TEST_BLOB="$(create_blob scripts/check-missing-requirements-priority.mjs)"

          export BASE_TREE_SHA SOURCE_BLOB README_BLOB CHANGELOG_BLOB SOURCE_README_BLOB
          export IOS_SOURCE_TEST_BLOB IPHONE_UI_TEST_BLOB OPEN_ISSUES_TEST_BLOB POLICE_TEST_BLOB
          export MISSING_REQUIREMENTS_TEST_BLOB PARENT_SHA

          python3 - <<'PY' > /tmp/v1035-tree.json
          import json
          import os

          def blob(path, env_name):
              return {
                  'path': path,
                  'mode': '100644',
                  'type': 'blob',
                  'sha': os.environ[env_name],
              }

          print(json.dumps({
              'base_tree': os.environ['BASE_TREE_SHA'],
              'tree': [
                  blob('src/missionchief-command-nexus.user.js', 'SOURCE_BLOB'),
                  blob('README.md', 'README_BLOB'),
                  blob('CHANGELOG.md', 'CHANGELOG_BLOB'),
                  blob('src/README.md', 'SOURCE_README_BLOB'),
                  blob('scripts/check-ios-mission-requirements-source.mjs', 'IOS_SOURCE_TEST_BLOB'),
                  blob('scripts/check-iphone-mission-ui.mjs', 'IPHONE_UI_TEST_BLOB'),
                  blob('scripts/check-open-issues-batch.mjs', 'OPEN_ISSUES_TEST_BLOB'),
                  blob('scripts/check-police-irv-fallback.mjs', 'POLICE_TEST_BLOB'),
                  blob('scripts/check-missing-requirements-priority.mjs', 'MISSING_REQUIREMENTS_TEST_BLOB'),
              ],
          }))
          PY

          TREE_SHA="$(
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/trees" \
              --input /tmp/v1035-tree.json \
              --jq '.sha'
          )"

          export TREE_SHA
          python3 - <<'PY' > /tmp/v1035-commit.json
          import json
          import os

          identity = {
              'name': 'MartyBlyth',
              'email': '32400596+Martyblyth@users.noreply.github.com',
          }

          print(json.dumps({
              'message': 'Prioritise current missing requirements before full mission totals',
              'tree': os.environ['TREE_SHA'],
              'parents': [os.environ['PARENT_SHA']],
              'author': identity,
              'committer': identity,
          }))
          PY

          COMMIT_SHA="$(
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/commits" \
              --input /tmp/v1035-commit.json \
              --jq '.sha'
          )"

          echo "commit_sha=${COMMIT_SHA}" >> "${GITHUB_OUTPUT}"
          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "v1.0.35 passed the complete validation suite. Unattached validated source commit: \`${COMMIT_SHA}\`."
