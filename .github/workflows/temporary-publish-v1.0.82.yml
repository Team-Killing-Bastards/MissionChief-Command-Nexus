name: Publish Command Nexus v1.0.82 externally

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.external-publish-v1.0.82-trigger'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-publish-v1.0.82.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.82
      release_notes: 'Runtime memory hardening and slightly faster Ally Steal response handling.'
    secrets: inherit
