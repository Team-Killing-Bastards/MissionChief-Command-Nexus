name: Publish Command Nexus v1.0.82 externally

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.external-publish-v1.0.82-trigger'

permissions:
  contents: write

jobs:
  discord:
    name: Post verified v1.0.82 Discord notice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository tooling
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check for an existing interim Discord receipt
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PREFIX='Command-Nexus-Discord-Pending-GreasyFork-Receipt-v1.0.82-'
          EXISTING="$(
            gh release view v1.0.82 --json assets --jq '.assets[].name' |
              grep -m1 "^${PREFIX}" || true
          )"
          if [[ -n "${EXISTING}" ]]; then
            echo "already=true" >> "${GITHUB_OUTPUT}"
            echo "receipt=${EXISTING}" >> "${GITHUB_OUTPUT}"
          else
            echo "already=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Post Discord release status and create receipt
        id: discord
        if: steps.existing.outputs.already != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_TAG: v1.0.82
          RELEASE_SHA: cbe4840dda93f0d1d4e73cc201930a782b06c3f6
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            appendFileSync,
            writeFileSync
          } from 'node:fs';

          const webhookUrl = String(process.env.DISCORD_WEBHOOK_URL || '').trim();
          if (!webhookUrl) throw new Error('Missing DISCORD_RELEASE_WEBHOOK');

          const releaseTag = process.env.RELEASE_TAG;
          const releaseSha = process.env.RELEASE_SHA;
          const releaseUrl = 'https://github.com/Team-Killing-Bastards/MissionChief-Command-Nexus/releases/tag/v1.0.82';

          const inspectResponse = await fetch(webhookUrl, {
            headers: { Accept: 'application/json' }
          });
          if (!inspectResponse.ok) {
            throw new Error(`Discord webhook inspection failed: HTTP ${inspectResponse.status}`);
          }
          const webhook = await inspectResponse.json();
          if (!webhook?.id || !webhook?.channel_id) {
            throw new Error('Discord webhook inspection returned no webhook/channel identity');
          }

          const target = new URL(webhookUrl);
          target.searchParams.set('wait', 'true');

          const payload = {
            username: 'Command Nexus Release Control',
            allowed_mentions: { parse: [] },
            embeds: [
              {
                color: 0x22d3ee,
                title: '🚨 MissionChief Command Nexus v1.0.82 released',
                url: releaseUrl,
                description:
                  'The verified GitHub release is live. Greasy Fork external synchronization is still serving `1.0.81`, so the public installer update remains pending while its webhook is repaired.',
                fields: [
                  { name: 'Release', value: '`1.0.82`', inline: true },
                  { name: 'GitHub', value: '✅ Live and verified', inline: true },
                  { name: 'Greasy Fork', value: '🟠 Sync pending', inline: true }
                ]
              },
              {
                color: 0x8b5cf6,
                title: '🧭 Mission Brief',
                description:
                  '• Deep idle and Auto Mode memory-pressure hardening\n' +
                  '• Background scanners and transport watchers now run only when required\n' +
                  '• Trained Personnel rendering is coalesced and cached\n' +
                  '• Ally Steal has shorter bounded response delays without weakening confirmation safeguards'
              },
              {
                color: 0xf59e0b,
                title: 'External delivery status',
                description:
                  'GitHub assets and checksum have passed independent verification. A second notice may be sent after Greasy Fork serves the exact `1.0.82` source.',
                fields: [
                  {
                    name: 'Release notes and download',
                    value: `[Open GitHub release](${releaseUrl})`,
                    inline: false
                  },
                  {
                    name: 'Immutable source',
                    value: `\`${releaseSha}\``,
                    inline: false
                  }
                ],
                timestamp: new Date().toISOString()
              }
            ]
          };

          const postResponse = await fetch(target, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const responseText = await postResponse.text();
          if (!postResponse.ok) {
            throw new Error(`Discord webhook post failed: HTTP ${postResponse.status}: ${responseText.slice(0, 500)}`);
          }

          const message = JSON.parse(responseText);
          if (!message?.id || !message?.channel_id) {
            throw new Error('Discord accepted the post but returned no message/channel receipt');
          }
          if (String(message.channel_id) !== String(webhook.channel_id)) {
            throw new Error('Discord message channel does not match webhook channel');
          }

          const receiptName =
            `Command-Nexus-Discord-Pending-GreasyFork-Receipt-${releaseTag}-${message.id}.json`;
          const receipt = {
            schema: 1,
            type: 'release_notice_greasy_fork_pending',
            product: 'MissionChief Command Nexus',
            release_tag: releaseTag,
            release_sha: releaseSha,
            webhook_id: String(webhook.id),
            guild_id: webhook.guild_id ? String(webhook.guild_id) : null,
            channel_id: String(message.channel_id),
            message_id: String(message.id),
            posted_at: new Date().toISOString(),
            greasy_fork_status: 'served 1.0.81; 1.0.82 synchronization pending'
          };
          writeFileSync(
            receiptName,
            JSON.stringify(receipt, null, 2) + '\n'
          );
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `receipt=${receiptName}\nmessage_id=${message.id}\nchannel_id=${message.channel_id}\n`
          );
          console.log(
            `Discord v1.0.82 release notice posted: message_id=${message.id} channel_id=${message.channel_id}`
          );
          NODE

      - name: Upload Discord delivery receipt
        if: steps.existing.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT: ${{ steps.discord.outputs.receipt }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v1.0.82 "${RECEIPT}"

      - name: Record delivery summary
        shell: bash
        env:
          ALREADY: ${{ steps.existing.outputs.already }}
          EXISTING_RECEIPT: ${{ steps.existing.outputs.receipt }}
          NEW_RECEIPT: ${{ steps.discord.outputs.receipt }}
          MESSAGE_ID: ${{ steps.discord.outputs.message_id }}
          CHANNEL_ID: ${{ steps.discord.outputs.channel_id }}
        run: |
          {
            echo '### Discord delivery status'
            if [[ "${ALREADY}" == 'true' ]]; then
              echo "- Existing receipt: \`${EXISTING_RECEIPT}\`"
              echo '- Duplicate Discord post skipped.'
            else
              echo '- Release: `v1.0.82`'
              echo "- Message ID: \`${MESSAGE_ID}\`"
              echo "- Channel ID: \`${CHANNEL_ID}\`"
              echo "- Receipt asset: \`${NEW_RECEIPT}\`"
              echo '- Greasy Fork status in the notice: synchronization pending.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
