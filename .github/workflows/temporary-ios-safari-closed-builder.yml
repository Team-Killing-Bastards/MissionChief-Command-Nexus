name: Temporary closed-PR iOS builder

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    if: github.event.pull_request.number == 76 && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build and validate clean candidate
        run: bash scripts/finalize-ios-menu-release.sh
