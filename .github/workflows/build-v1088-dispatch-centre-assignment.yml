name: Build v1.0.88 Dispatch Centre Assignment Source

on:
  push:
    paths:
      - '.github/build-v1088-dispatch-centre-assignment.trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v1.0.88 feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/dispatch-centre-assignment-source-v1088
          fetch-depth: 0

      - name: Build corrected Dispatch Centre assignment candidate
        run: |
          set -euo pipefail
          python3 scripts/build-v1088-dispatch-centre-assignment.py
          rm -f scripts/build-v1088-dispatch-centre-assignment.py
          rm -f .github/build-v1088-dispatch-centre-assignment.trigger
          rm -f .github/workflows/build-v1088-dispatch-centre-assignment.yml

      - name: Validate userscript syntax
        run: node --check src/missionchief-command-nexus.user.js

      - name: Run every permanent regression
        run: |
          set -euo pipefail
          for check in scripts/check-*.mjs; do
            echo "Running $check"
            node "$check"
          done

      - name: Validate repository whitespace
        run: git diff --check

      - name: Commit clean candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use building assignment source for Dispatch Centres in v1.0.88'
          git push origin HEAD:fix/dispatch-centre-assignment-source-v1088
