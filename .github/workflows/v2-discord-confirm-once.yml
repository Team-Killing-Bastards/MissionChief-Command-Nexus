name: Confirm V2 Discord publication once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v2-discord-confirm-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Wait for canonical V2 publisher and capture receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          sleep 5

          RUN_ID="$(gh run list --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "${RUN_ID}" ]]; then
            RESULT=failed
            DETAIL='no release workflow_dispatch run found'
            WATCH_STATUS=1
          else
            echo "Watching canonical release run ${RUN_ID}"
            gh run watch "${RUN_ID}" --exit-status --interval 5
            WATCH_STATUS=$?

            if [[ "${WATCH_STATUS}" -eq 0 ]]; then
              RECEIPTS="$(gh release view v2.0.0 --json assets --jq '[.assets[].name | select(startswith("Command-Nexus-Discord-Receipt-v2.0.0-"))] | unique | .[]')"
              RECEIPT_COUNT="$(printf '%s\n' "${RECEIPTS}" | sed '/^$/d' | wc -l | tr -d ' ')"
              if [[ "${RECEIPT_COUNT}" == '1' ]]; then
                RESULT=success
                DETAIL="$(printf '%s' "${RECEIPTS}")"
              else
                RESULT=failed
                DETAIL="expected exactly one Discord receipt, found ${RECEIPT_COUNT}"
                WATCH_STATUS=1
              fi
            else
              RESULT=failed
              DETAIL="release workflow run ${RUN_ID} failed"
            fi
          fi

          git rm .github/workflows/v2-discord-confirm-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [[ "${RESULT}" == 'success' ]]; then
            COMMIT_MESSAGE="Confirm V2 Discord delivery: ${DETAIL}"
          else
            COMMIT_MESSAGE="V2 Discord delivery check failed: ${DETAIL}"
          fi

          git commit -m "${COMMIT_MESSAGE}"
          git push origin HEAD:main

          echo "result=${RESULT}"
          echo "detail=${DETAIL}"
          exit "${WATCH_STATUS}"
