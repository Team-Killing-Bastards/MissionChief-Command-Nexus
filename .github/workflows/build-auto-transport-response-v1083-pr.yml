name: Build faster Auto Mode transport v1.0.83 PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.diagnostics/faster-auto-transport-v1083.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'fix/faster-auto-transport-v1083-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Report builder start
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Trusted v1.0.83 transport builder started: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out trusted builder source
        uses: actions/checkout@v6
        with:
          ref: main
          path: builder-source
          fetch-depth: 0

      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: fix/faster-auto-transport-v1083-clean
          path: candidate
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Gate already-built candidate
        id: gate
        shell: bash
        run: |
          if [[ -f candidate/.diagnostics/faster-auto-transport-v1083.md ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Candidate is already built; skipping duplicate patch and push.'
          fi

      - name: Extract and run trusted patcher
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('builder-source/.github/workflows/build-auto-transport-response-v1083.yml').read_text(encoding='utf-8')
          opening = "          python3 - <<'PY'\n"
          start = workflow.index(opening) + len(opening)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          Path('/tmp/apply-auto-transport-v1083.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          cd candidate
          python3 /tmp/apply-auto-transport-v1083.py

          cat > scripts/check-auto-transport-response-v1083.mjs <<'EOF'
          #!/usr/bin/env node
          import { readFile } from 'node:fs/promises';

          const source = await readFile('src/missionchief-command-nexus.user.js', 'utf8');
          const fail = message => { console.error(`ERROR: ${message}`); process.exit(1); };

          function requireText(token, label) {
            if (!source.includes(token)) fail(`Missing faster Auto Mode transport contract: ${label}`);
          }

          function extractFunction(name) {
            const pattern = new RegExp(`^\\s*(?:async\\s+)?function\\s+${name}\\s*\\(`, 'm');
            const match = pattern.exec(source);
            if (!match) fail(`Unable to locate function ${name}`);
            const start = match.index;
            const rest = source.slice(start + match[0].length);
            const next = /^\s*(?:async\s+)?function\s+[A-Za-z0-9_$]+\s*\(/m.exec(rest);
            if (!next) fail(`Unable to locate end of function ${name}`);
            return source.slice(start, start + match[0].length + next.index);
          }

          for (const [token, label] of [
            ['// @version      1.0.83', 'v1.0.83 metadata'],
            ['MISSION FINDER V10.6.143', 'Mission Finder V10.6.143'],
            ['function mfIsExactPatientTransportAnchor(', 'exact patient route guard'],
            ['function mfFindExactPatientTransportAnchorDeep(', 'iframe-aware patient finder'],
            ['const MF_AUTO_PRISONER_CELL_DESTINATION_WAIT_MS = 8000;', 'cell maximum wait retained'],
            ['const MF_AUTO_PRISONER_RELEASE_RESULT_WAIT_MS = 10000;', 'release result maximum wait retained'],
            ['const MF_AUTO_PRISONER_RELEASE_DISMISS_WAIT_MS = 8000;', 'dismiss maximum wait retained'],
            ['const MF_AUTO_PRISONER_RELEASE_DISMISS_CLOSE_WAIT_MS = 8000;', 'dismiss close maximum wait retained'],
            ['const MF_AUTO_PRISONER_CELL_CLICK_RETRY_MS = 4000;', 'cell failed-click retry'],
            ['const MF_AUTO_PRISONER_RELEASE_CLICK_RETRY_MS = 4000;', 'release failed-click retry'],
          ]) requireText(token, label);

          const exactClick = extractFunction('clickExactApproachTransportButton');
          const bruteClick = extractFunction('mfBruteClickFirstApproach');
          for (const [block, label] of [[exactClick, 'exact patient click'], [bruteClick, 'brute patient click']]) {
            if (!block.includes('Date.now() - mfTransportLastClickAt < 2500')) fail(`${label} does not use the 2.5 second shared guard`);
            if (block.includes('mfTransportLastClickAt < 4000')) fail(`${label} retained the old 4 second guard`);
          }
          if (!exactClick.includes('now - mfLastTransportClickAt < 2500')) fail('Patient fingerprint guard was not reduced to 2.5 seconds');

          const retryMessage = source.indexOf('Approach found but click helper did not click yet; waiting for Vue/iframe update.');
          if (retryMessage < 0) fail('Unable to locate patient Vue/iframe retry path');
          const retryWindow = source.slice(retryMessage, retryMessage + 500);
          if (!retryWindow.includes('await wait(900);')) fail('Patient Vue/iframe retry wait is not 900 ms');
          if (retryWindow.includes('await wait(1800);')) fail('Patient Vue/iframe retry retained the old 1800 ms delay');

          const cellGate = extractFunction('handleAutoPrisonerCellBeforeUnitFinder');
          if (!cellGate.includes('await wait(125);')) fail('Prisoner cell destination polling is not 125 ms');
          if (cellGate.includes('await wait(250);')) fail('Prisoner cell destination polling retained 250 ms');

          const dismiss = extractFunction('closeAutoPrisonerReleaseDismissAfterClick');
          const fastPolls = dismiss.match(/await wait\(100\);/g) || [];
          if (fastPolls.length !== 2) fail(`Expected two 100 ms prisoner result polls, found ${fastPolls.length}`);
          if (dismiss.includes('await wait(200);')) fail('Prisoner result polling retained 200 ms');
          if (!dismiss.includes('await wait(250);')) fail('Prisoner close retry is not 250 ms');
          if (dismiss.includes('await wait(480);')) fail('Prisoner close retry retained 480 ms');

          for (const token of [
            'getActivePrisonerCellSelectionContext()',
            'getTopmostAutoPrisonerReleaseDismissContext(',
            'resolveAutoPrisonerReleaseDismissContext(',
            'isAutoPrisonerReleaseDismissContextVisible(',
            'realClickForQueueRestart(current.closeButton);',
          ]) {
            if (!dismiss.includes(token)) fail(`Prisoner dismiss safety contract changed: ${token}`);
          }

          console.log('Auto Mode transport response contracts passed: patient retries and prisoner UI polling are faster while route identity, ownership, duplicate-click guards and fail-closed timeouts remain intact.');
          EOF

          sed -i 's/^          //' scripts/check-auto-transport-response-v1083.mjs
          git diff --check

      - name: Validate candidate
        if: steps.gate.outputs.run == 'true'
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          for check in scripts/check-*.mjs; do
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Push validated product candidate
        if: steps.gate.outputs.run == 'true'
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/validate-userscript.yml
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Speed up Auto Mode patient and prisoner transport'
          git push origin HEAD:refs/heads/fix/faster-auto-transport-v1083-clean
          SHA="$(git rev-parse HEAD)"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title 'Speed up Auto Mode patient and prisoner transport' --body "## Objective\n\nMake Auto Mode react faster when clicking patient and prisoner transport controls without weakening exact destination, ownership or duplicate-click safeguards.\n\n## Changes\n\n- Patient repeat-click guard: 4.0s -> 2.5s.\n- Patient Vue/iframe retry wait: 1.8s -> 0.9s.\n- Prisoner destination/result polling: 200-250ms -> 100-125ms.\n- Prisoner verified close retry: 480ms -> 250ms.\n- Guarded failed prisoner click retry: 6.5s -> 4.0s.\n\n## Safety retained\n\nExact patient/prisoner routes, nearest valid destination selection, pending-state hand-off, result-screen identity, Unit Finder blocking, duplicate-click guards and fail-closed maximum timeouts remain authoritative.\n\n## Release\n\n- Command Nexus \`1.0.83\`\n- Mission Finder \`V10.6.143\`\n- Permanent regression: \`scripts/check-auto-transport-response-v1083.mjs\`\n\nThe trusted builder passed every permanent regression, syntax, userscript validation, repository integrity and whitespace check. Workflow registration is applied separately through the authenticated repository connector.\n\nValidated commit: \`${SHA}\`."
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Trusted v1.0.83 product/test candidate completed successfully at commit ${SHA}."

      - name: Report builder failure
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Trusted v1.0.83 transport builder failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
