name: Build faster Auto Mode transport v1.0.83 PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.diagnostics/faster-auto-transport-v1083.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'fix/faster-auto-transport-v1083-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Report builder start
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Trusted v1.0.83 transport builder started: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out trusted builder source
        uses: actions/checkout@v6
        with:
          ref: main
          path: builder-source
          fetch-depth: 0

      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: fix/faster-auto-transport-v1083-clean
          path: candidate
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Extract and run trusted patcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('builder-source/.github/workflows/build-auto-transport-response-v1083.yml').read_text(encoding='utf-8')
          opening = "          python3 - <<'PY'\n"
          start = workflow.index(opening) + len(opening)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          Path('/tmp/apply-auto-transport-v1083.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cd candidate
          python3 /tmp/apply-auto-transport-v1083.py
          git diff --check

      - name: Validate candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          for check in scripts/check-*.mjs; do
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Push validated candidate
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Speed up Auto Mode patient and prisoner transport'
          git push origin HEAD:refs/heads/fix/faster-auto-transport-v1083-clean
          SHA="$(git rev-parse HEAD)"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title 'Speed up Auto Mode patient and prisoner transport' --body "## Objective\n\nMake Auto Mode react faster when clicking patient and prisoner transport controls without weakening exact destination, ownership or duplicate-click safeguards.\n\n## Changes\n\n- Patient repeat-click guard: 4.0s -> 2.5s.\n- Patient Vue/iframe retry wait: 1.8s -> 0.9s.\n- Prisoner destination/result polling: 200-250ms -> 100-125ms.\n- Prisoner verified close retry: 480ms -> 250ms.\n- Guarded failed prisoner click retry: 6.5s -> 4.0s.\n\n## Safety retained\n\nExact patient/prisoner routes, nearest valid destination selection, pending-state hand-off, result-screen identity, Unit Finder blocking, duplicate-click guards and fail-closed maximum timeouts remain authoritative.\n\n## Release\n\n- Command Nexus \`1.0.83\`\n- Mission Finder \`V10.6.143\`\n- Permanent regression: \`scripts/check-auto-transport-response-v1083.mjs\`\n\nEvery permanent regression, syntax, userscript validation, repository integrity and whitespace check passed.\n\nValidated commit: \`${SHA}\`."
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Trusted v1.0.83 transport builder completed successfully at commit ${SHA}."

      - name: Report builder failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Trusted v1.0.83 transport builder failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
