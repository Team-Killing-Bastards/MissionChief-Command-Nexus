name: Extract Required Personnel load path

on:
  push:
    branches:
      - fix/required-personnel-load-v1068

permissions:
  contents: write

concurrency:
  group: extract-required-personnel-load-v1068
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/required-personnel-load-v1068
          fetch-depth: 0
      - name: Extract load-path functions
        run: python3 .github/builders/extract-required-personnel-load.py
      - name: Commit diagnostics when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/diagnostics/required-personnel-load-path.txt && git ls-files --error-unmatch .github/diagnostics/required-personnel-load-path.txt >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/diagnostics/required-personnel-load-path.txt
          git commit -m 'Extract Required Personnel load path'
          git push origin HEAD:fix/required-personnel-load-v1068
