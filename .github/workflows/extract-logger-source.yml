name: Extract logger source context

on:
  push:
    branches:
      - fix/mission-generation-and-journey-capture
    paths:
      - .github/workflows/extract-logger-source.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mission-generation-and-journey-capture
          fetch-depth: 0

      - name: Extract relevant source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/missionchief-command-nexus.user.js')
          source = source_path.read_text(encoding='utf-8')

          def extract_function(name):
              marker = f'function {name}('
              start = source.find(marker)
              if start < 0:
                  return f'### {name}\nMISSING\n'
              brace = source.find('{', start)
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 2
                      continue
                  if ch == '/' and nxt == '*':
                      block_comment = True
                      i += 2
                      continue
                  if ch in ('\"', "'", '`'):
                      quote = ch
                      i += 1
                      continue
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return f'### {name}\n{source[start:i+1]}\n'
                  i += 1
              return f'### {name}\nUNBOUNDED\n'

          names = [
              'readMissionLoggerUnitJourneyMetrics',
              'getMissionLoggerSelectedUnits',
              'createMissionLoggerEvent',
              'recordMissionLoggerObservedEvent',
              'getMissionLoggerMissionSnapshot',
              'readMissionLoggerObservedRegistry',
              'writeMissionLoggerObservedRegistry',
              'startMissionLoggerSyncTimer',
              'initialiseMissionFinder',
              'resumeMissionFinderRuntime',
              'startMissionFinderObserver',
              'handleMissionFinderMutationBatch',
              'getVehicleCheckboxSnapshot',
              'sortVehicleCheckboxesByBestArrival'
          ]

          out = []
          for name in names:
              out.append(extract_function(name))

          lines = source.splitlines()
          patterns = [
              r'mission_list', r'missionMarker', r'missions_data',
              r'missionNew', r'mission.*add', r'newMission',
              r'data-distance', r'data-sortvalue', r'timevalue'
          ]
          out.append('### MATCH CONTEXTS')
          seen = set()
          for pattern in patterns:
              regex = re.compile(pattern, re.I)
              for index, line in enumerate(lines):
                  if not regex.search(line):
                      continue
                  key = (max(0, index-4), min(len(lines), index+5))
                  if key in seen: continue
                  seen.add(key)
                  out.append(f'--- {pattern} around line {index+1} ---')
                  for line_no in range(key[0], key[1]):
                      out.append(f'{line_no+1:06d}: {lines[line_no]}')

          Path('logger-source-snapshot.txt').write_text(
              '\n\n'.join(out) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Commit snapshot
        shell: bash
        run: |
          rm .github/workflows/extract-logger-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract logger source context"
          git push origin HEAD:fix/mission-generation-and-journey-capture
