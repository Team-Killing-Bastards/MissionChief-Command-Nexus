name: Recover v1.0.17 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recover-v1017-release.yml'

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out clean main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Recover, verify and record v1.0.17
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY="${GITHUB_REPOSITORY}"
          RELEASE_TAG='v1.0.17'
          ASSET='MissionChief-Command-Nexus-1.0.17.user.js'
          CHECKSUM="${ASSET}.sha256"

          git fetch origin main --tags --force
          CURRENT_VERSION="$(node scripts/validate-userscript.mjs --print-version)"
          [[ "${CURRENT_VERSION}" == '1.0.17' ]]

          if find .github/workflows -maxdepth 1 -type f \
              \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) \
              -print -quit | grep -q .; then
            echo 'Temporary workflows remain on main; refusing release recovery.'
            exit 1
          fi

          ASSET_COUNT=0
          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            ASSET_COUNT="$(
              gh release view "${RELEASE_TAG}" \
                --repo "${REPOSITORY}" \
                --json assets \
                --jq ".assets | map(select(.name == \"${ASSET}\" or .name == \"${CHECKSUM}\")) | unique_by(.name) | length"
            )"
          fi

          if [[ "${ASSET_COUNT}" != '2' ]]; then
            gh release delete "${RELEASE_TAG}" \
              --repo "${REPOSITORY}" \
              --yes >/dev/null 2>&1 || true

            git tag -d "${RELEASE_TAG}" >/dev/null 2>&1 || true
            git push origin ":refs/tags/${RELEASE_TAG}" >/dev/null 2>&1 || true
            git fetch origin --prune --tags --force

            BEFORE_ID="$(
              gh run list \
                --repo "${REPOSITORY}" \
                --workflow release.yml \
                --event workflow_dispatch \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // 0'
            )"

            gh workflow run release.yml \
              --repo "${REPOSITORY}" \
              --ref main \
              -f operation=publish-release \
              -f release_tag="${RELEASE_TAG}" \
              -f release_notes='Restore exact Operational Support Van selection for Operational Support or SAR Vehicle requirements.'

            RUN_ID=''
            for _attempt in $(seq 1 45); do
              CANDIDATE_ID="$(
                gh run list \
                  --repo "${REPOSITORY}" \
                  --workflow release.yml \
                  --event workflow_dispatch \
                  --limit 1 \
                  --json databaseId \
                  --jq '.[0].databaseId // 0'
              )"

              if [[ "${CANDIDATE_ID}" != '0' && "${CANDIDATE_ID}" != "${BEFORE_ID}" ]]; then
                RUN_ID="${CANDIDATE_ID}"
                break
              fi
              sleep 2
            done

            if [[ -z "${RUN_ID}" ]]; then
              echo 'Could not identify the dispatched v1.0.17 release run.'
              exit 1
            fi

            gh run watch "${RUN_ID}" \
              --repo "${REPOSITORY}" \
              --exit-status
          else
            RUN_ID="$(
              gh run list \
                --repo "${REPOSITORY}" \
                --workflow release.yml \
                --limit 20 \
                --json databaseId,conclusion \
                --jq '[.[] | select(.conclusion == "success")][0].databaseId // 0'
            )"
          fi

          FINAL_ASSET_COUNT="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${REPOSITORY}" \
              --json assets \
              --jq ".assets | map(select(.name == \"${ASSET}\" or .name == \"${CHECKSUM}\")) | unique_by(.name) | length"
          )"
          [[ "${FINAL_ASSET_COUNT}" == '2' ]]

          rm -rf release-verification
          mkdir release-verification
          gh release download "${RELEASE_TAG}" \
            --repo "${REPOSITORY}" \
            --pattern "${ASSET}" \
            --pattern "${CHECKSUM}" \
            --dir release-verification \
            --clobber
          (
            cd release-verification
            sha256sum -c "${CHECKSUM}"
          )

          if [[ "${RUN_ID}" == '0' || -z "${RUN_ID}" ]]; then
            echo 'No successful release workflow run was available for deployment receipt verification.'
            exit 1
          fi

          gh run view "${RUN_ID}" \
            --repo "${REPOSITORY}" \
            --log > release-verification/release.log

          GREASY_RECEIPT="$(
            grep -E 'Greasy Fork verified on attempt [0-9]+: version 1\.0\.17' \
              release-verification/release.log | tail -n 1 || true
          )"
          DISCORD_RECEIPT="$(
            grep -E 'Discord release notification posted for v1\.0\.17: message_id=[0-9]+ channel_id=[0-9]+' \
              release-verification/release.log | tail -n 1 || true
          )"
          WEBHOOK_RECEIPT="$(
            grep -E 'Discord webhook target verified:.*channel_id=[0-9]+' \
              release-verification/release.log | tail -n 1 || true
          )"

          [[ -n "${GREASY_RECEIPT}" ]]
          [[ -n "${DISCORD_RECEIPT}" ]]
          [[ -n "${WEBHOOK_RECEIPT}" ]]

          cat > release-verification/pr-receipt.md <<EOF
          v1.0.17 release recovery completed successfully.

          - GitHub release assets: verified
          - SHA-256 checksum: passed
          - ${GREASY_RECEIPT}
          - ${WEBHOOK_RECEIPT}
          - ${DISCORD_RECEIPT}
          - Release workflow run: ${RUN_ID}
          EOF

          gh pr comment 81 \
            --repo "${REPOSITORY}" \
            --body-file release-verification/pr-receipt.md
