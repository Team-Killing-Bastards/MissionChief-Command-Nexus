name: Temporary durable project-memory build

on:
  push:
    branches:
      - docs/durable-project-memory

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip durable memory build]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build durable project records
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_temporary-fix-durable-builder.py
          python3 scripts/_temporary-build-durable-project-memory.py
          sed -i 's/the connected Google Memory Bank with/the connected Google Memory Bank and Rules documents with/' docs/RELEASE_PROCESS.md
          rm -f scripts/_temporary-fix-durable-builder.py

      - name: Render human-readable current state
        run: node scripts/render-project-state.mjs

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/render-project-state.mjs
          node --check scripts/check-project-state.mjs
          node scripts/check-project-state.mjs
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
          python3 scripts/check_workflow_yaml.py
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean project-memory system
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add durable project state, decisions and evidence index [skip durable memory build]"
          git push origin HEAD:docs/durable-project-memory
