name: Build validated v1.0.50 trained coverage correction

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-v1.0.50-training-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/training-shortfall-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Inspect audit branch state
        id: state
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_BRANCH}" --force
          VERSION="$(
            git show "origin/${HEAD_BRANCH}:src/missionchief-command-nexus.user.js" 2>/dev/null |
              sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' |
              head -n 1 |
              xargs || true
          )"
          if [[ "${VERSION}" == '1.0.50' ]]; then
            echo 'already_built=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'already_built=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Fetch and verify exact correction patch
        if: steps.state.outputs.already_built != 'true'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/${HEAD_BRANCH}:.diagnostics/v1.0.50-training-coverage.patch.gz.b64" \
            > /tmp/v1050.patch.gz.b64
          tr -d '\r\n\t ' < /tmp/v1050.patch.gz.b64 \
            > /tmp/v1050.patch.normalized.b64
          echo '6da27f6c770fbb5c90aa6e943fa2df43eaefe7d20c164d799c69b5fff6f760e9  /tmp/v1050.patch.normalized.b64' |
            sha256sum --check
          base64 --decode /tmp/v1050.patch.normalized.b64 |
            gzip --decompress > /tmp/v1050.patch
          echo 'b7982b8f0a34df322fe15c623c280f2c48c93a4ea7587e1e9c1f702de174798b  /tmp/v1050.patch' |
            sha256sum --check
          git apply --check /tmp/v1050.patch

      - name: Apply correction and remove one-use workflows
        if: steps.state.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/v1050.patch
          git rm -f .github/workflows/temporary-audit-training-shortfalls.yml
          git rm -f --ignore-unmatch .github/workflows/finalize-v1035.yml
          git rm -f --ignore-unmatch .github/workflows/finalize-v1035-fast.yml
          git diff --check

      - name: Set up Node.js
        if: steps.state.outputs.already_built != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate complete userscript and repository
        if: steps.state.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node --check scripts/check-trained-coverage-optimizer.mjs
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-police-irv-fallback.mjs
          node scripts/check-ios-unit-finder-selection.mjs
          node scripts/check-ios-mission-requirements-source.mjs
          node scripts/check-iphone-mission-ui.mjs
          node scripts/check-open-issues-batch.mjs
          node scripts/check-missing-requirements-priority.mjs
          node scripts/check-trained-coverage-optimizer.mjs
          node scripts/check-road-rail-rru-mapping.mjs
          node scripts/check-auto-prisoner-cell-gate.mjs
          node scripts/check-fire-engine-update-mapping.mjs
          node scripts/check-saved-position-helper-copy.mjs
          node scripts/check-bulk-trained-register-update.mjs
          node scripts/check-hems-ambulance-eta-priority.mjs
          node scripts/check-police-search-advisor-register.mjs
          node scripts/check-personnel-register-transfer.mjs
          node scripts/check-release-notification-single-delivery.mjs
          python3 scripts/check_repository.py
          git diff --check

      - name: Verify focused v1.0.50 contracts
        if: steps.state.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          required = {
              'version': '// @version      1.0.50',
              'engine': ' * MODULE 2: MISSION FINDER V10.6.114',
              'qualification loop': 'trainedPhase\n                        ? requirement.remaining > 0',
              'separate coverage': 'trainedUseful > 0 ||\n                capacityUseful > 0',
              'full ready pool': '...remainingCandidates\n        ];',
              'initial training gate': 'initiallyTrainingCovered',
              'training shortfall': 'formatTrainedPersonnelShortfall(',
              'PSU capacity': "'51': 9",
              'IRV capacity': "'8': 2",
          }
          missing = [name for name, token in required.items() if token not in source]
          if missing:
              raise SystemExit('Missing v1.0.50 contracts: ' + ', '.join(missing))
          if 'MF_LIVE_TRAINING_VERIFY_MAX_PAGES' in source:
              raise SystemExit('The obsolete 48-page trained-vehicle verification cap remains')
          print('Focused v1.0.50 trained-coverage contracts passed.')
          PY

      - name: Replace audit branch with validated source
        if: steps.state.outputs.already_built != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Eliminate false trained-personnel shortfalls'
          git push --force origin "HEAD:refs/heads/${HEAD_BRANCH}"
          COMMIT_SHA="$(git rev-parse HEAD)"
          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "v1.0.50 passed the complete validation suite. Validated source commit: \`${COMMIT_SHA}\`."
