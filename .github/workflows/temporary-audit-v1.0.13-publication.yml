name: Temporary audit v1.0.13 publication

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  actions: read
  contents: write

jobs:
  audit:
    if: ${{ github.head_ref == 'agent/audit-v1.0.13-publication' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/audit-v1.0.13-publication
          fetch-depth: 0

      - name: Extract concise publication receipt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.13
          RELEASE_RUN_ID: '29859843691'
        shell: bash
        run: |
          set -euo pipefail

          OUT=tmp-v1.0.13-publication-audit.txt
          LOG=tmp-v1.0.13-release-run.log
          : > "$OUT"

          {
            echo "Publication audit for ${TAG}"
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "=== GITHUB RELEASE ==="
          } >> "$OUT"

          gh release view "$TAG" \
            --json tagName,name,isDraft,isPrerelease,publishedAt,url,targetCommitish,assets \
            >> "$OUT"

          echo >> "$OUT"
          echo "=== PUBLISHING RUN AND JOB RESULTS ===" >> "$OUT"
          gh run view "$RELEASE_RUN_ID" \
            --json databaseId,name,displayTitle,workflowName,status,conclusion,event,headBranch,headSha,createdAt,updatedAt,url,jobs \
            >> "$OUT"

          gh run view "$RELEASE_RUN_ID" --log > "$LOG"

          echo >> "$OUT"
          echo "=== VERIFY DEPLOYMENT AND NOTIFY DISCORD STEP ===" >> "$OUT"
          grep -F "Verify deployment and notify Discord" "$LOG" >> "$OUT" || true

          echo >> "$OUT"
          echo "=== GREASY FORK / DISCORD / CHECKSUM RECEIPTS ===" >> "$OUT"
          grep -E -i \
            'greasy fork|greasyfork|discord|message id|message_id|sha-256|checksum|deployment verified|verified deployment|release published|release asset' \
            "$LOG" >> "$OUT" || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT"
          git commit -m "Record concise v1.0.13 publication receipt"
          git push origin HEAD:agent/audit-v1.0.13-publication
