name: Temporary v3.0.43 shortage diagnostics build

on:
  push:
    branches:
      - feat/v3043-shortage-diagnostics

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v3.0.43 candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_temporary-build-v3043-shortage-diagnostics.py')
          text = path.read_text(encoding='utf-8')
          old = """if re.search(r'(?<!includeDisabled && )\\binput\\.disabled\\b', matcher):
              # Raw occurrences are allowed only in diagnostic-independent expressions after the transformations above.
              leftovers = sorted(set(re.findall(r'.{0,60}input\\.disabled.{0,60}', matcher)))
              raise SystemExit('Unreviewed input.disabled matcher occurrences remain:\\n' + '\\n'.join(leftovers[:20]))"""
          new = """raw_disabled_patterns = [
              'if (input.disabled) return false;',
              'if (input.disabled) {',
              '!input.disabled &&',
              'input.disabled ||',
          ]
          leftovers = [pattern for pattern in raw_disabled_patterns if pattern in matcher]
          if leftovers:
              raise SystemExit('Unreviewed raw input.disabled matcher patterns remain: ' + ', '.join(leftovers))"""
          if old not in text:
              raise SystemExit('Builder includeDisabled assertion marker not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/_temporary-build-v3043-shortage-diagnostics.py

      - name: Validate exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-project-state.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          git diff --check
          test ! -e .github/workflows/_temporary-v3043-shortage-diagnostics-inspection.yml
          test ! -e scripts/_temporary-build-v3043-shortage-diagnostics.py
          if find . -maxdepth 1 -name '.tmp-v3043-*' -print -quit | grep -q .; then
            echo 'Temporary v3.0.43 inspection files remain.' >&2
            exit 1
          fi

      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add station-level shortage diagnostics"
          git push origin HEAD:feat/v3043-shortage-diagnostics
