name: Repair compact state regression keys V1.0.71

on:
  push:
    branches:
      - feature/compact-nexus-ui-v1071
    paths:
      - '.github/workflows/repair-compact-state-tests-v1071.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/compact-nexus-ui-v1071
      - name: Update versioned collapse keys in permanent checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/compact-nexus-ui-v1071-patch.py')
          text = path.read_text(encoding='utf-8')
          old = '''    text = text.replace('Mission Finder V10.6.133', 'Mission Finder V10.6.134')
              path.write_text(text, encoding='utf-8', newline='\\n')'''
          new = '''    text = text.replace('Mission Finder V10.6.133', 'Mission Finder V10.6.134')
              text = text.replace('mf_control_collapsed_v9', 'mf_control_collapsed_v10')
              text = text.replace('mf_vehicle_load_collapsed_v9', 'mf_vehicle_load_collapsed_v10')
              text = text.replace('mf_trained_personnel_collapsed_v1', 'mf_trained_personnel_collapsed_v2')
              path.write_text(text, encoding='utf-8', newline='\\n')'''
          if text.count(old) != 1:
              raise SystemExit('Unable to find permanent-check version loop')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-compact-state-tests-v1071.yml
          git add .github/compact-nexus-ui-v1071-patch.py
          git commit -m 'Update compact collapse-key regressions'
          git push origin HEAD:feature/compact-nexus-ui-v1071
