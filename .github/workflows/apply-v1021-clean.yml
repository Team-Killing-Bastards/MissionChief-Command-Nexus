name: Apply v1.0.21 Fire cross-reference cleanly

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/v1021-clean-build'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply v1.0.21 patch
        run: python3 scripts/apply_v1021_fire_crossref.py

      - name: Remove one-use build files
        run: |
          git rm scripts/apply_v1021_fire_crossref.py
          git rm .github/workflows/apply-v1021-clean.yml

      - name: Validate complete repository
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          python3 scripts/check_repository.py
          git diff --check

      - name: Push validated update
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIGGER_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Add Fire cross-reference mappings'
          git push origin HEAD:main
          gh pr close "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --comment 'v1.0.21 validated and pushed to main.' || true
          git push origin --delete "${TRIGGER_BRANCH}" || true
