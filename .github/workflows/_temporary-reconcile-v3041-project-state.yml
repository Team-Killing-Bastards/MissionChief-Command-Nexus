name: Temporary reconcile v3.0.41 project state

on:
  push:
    branches:
      - docs/reconcile-v3041-release-state

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile published release state
        run: python3 scripts/_temporary-reconcile-v3041-project-state.py

      - name: Validate reconciled state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-project-state.mjs
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile v3.0.41 published project state"
          git push origin HEAD:docs/reconcile-v3041-release-state
