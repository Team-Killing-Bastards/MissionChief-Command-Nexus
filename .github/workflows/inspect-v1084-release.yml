name: Inspect v1.0.84 release delivery

on:
  push:
    branches:
      - release/reconcile-v1.0.84-discord
    paths:
      - '.github/workflows/inspect-v1084-release.yml'
      - '.inspect-v1084-release-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspect-v1084-release
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v6
        with:
          ref: release/reconcile-v1.0.84-discord
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Inspect GitHub, Greasy Fork and receipt state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main --tags --force

          RELEASE_JSON="$(gh release view v1.0.84 --json tagName,url,isDraft,isPrerelease,targetCommitish,assets)"
          TAG_SHA="$(git rev-list -n 1 v1.0.84)"
          TAG_SOURCE="$(mktemp)"
          git show "v1.0.84:src/missionchief-command-nexus.user.js" > "${TAG_SOURCE}"
          TAG_VERSION="$(sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' "${TAG_SOURCE}" | head -n1 | xargs)"
          TAG_SHA256="$(sha256sum "${TAG_SOURCE}" | awk '{print $1}')"

          GF_SOURCE="$(mktemp)"
          GF_URL='https://update.greasyfork.org/scripts/587702/MissionChief%20Command%20Nexus.user.js'
          GF_HTTP="$(curl --location --silent --show-error --output "${GF_SOURCE}" --write-out '%{http_code}' "${GF_URL}" || true)"
          GF_VERSION="$(sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' "${GF_SOURCE}" | head -n1 | xargs || true)"
          GF_SHA256="$(sha256sum "${GF_SOURCE}" | awk '{print $1}')"

          node - \
            "${RELEASE_JSON}" \
            "${TAG_SHA}" \
            "${TAG_VERSION}" \
            "${TAG_SHA256}" \
            "${GF_HTTP}" \
            "${GF_VERSION}" \
            "${GF_SHA256}" <<'NODE' > .release-v1084-diagnostic.json
          const [releaseJson, tagSha, tagVersion, tagSha256, gfHttp, gfVersion, gfSha256] = process.argv.slice(2);
          const release = JSON.parse(releaseJson);
          const assets = (release.assets || []).map(asset => ({
            name: asset.name,
            size: asset.size,
            state: asset.state,
            downloadCount: asset.downloadCount,
          }));
          const receiptAssets = assets.filter(asset =>
            asset.name.startsWith('Command-Nexus-Discord-Receipt-v1.0.84-')
          );
          const payload = {
            checked_at: new Date().toISOString(),
            release: {
              tag: release.tagName,
              url: release.url,
              target_commitish: release.targetCommitish,
              draft: release.isDraft,
              prerelease: release.isPrerelease,
              assets,
              expected_asset_present: assets.some(asset => asset.name === 'MissionChief-Command-Nexus-1.0.84.user.js'),
              checksum_asset_present: assets.some(asset => asset.name === 'MissionChief-Command-Nexus-1.0.84.user.js.sha256'),
              discord_receipt_assets: receiptAssets,
            },
            tag: {
              sha: tagSha,
              version: tagVersion,
              sha256: tagSha256,
            },
            greasy_fork: {
              http_status: Number(gfHttp || 0),
              version: gfVersion,
              sha256: gfSha256,
              exact_tag_source_match: gfHttp === '200' && gfSha256 === tagSha256,
            },
          };
          process.stdout.write(JSON.stringify(payload, null, 2) + '\n');
          NODE

          git rm -f --ignore-unmatch \
            .github/workflows/inspect-v1084-release.yml \
            .inspect-v1084-release-trigger

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record v1.0.84 release delivery diagnostic'
          git push origin HEAD:refs/heads/release/reconcile-v1.0.84-discord
