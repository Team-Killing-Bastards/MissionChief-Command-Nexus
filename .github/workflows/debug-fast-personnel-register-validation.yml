name: Diagnose fast Personnel Register validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fast-personnel-register-v1051'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Reconstruct and apply candidate
        shell: bash
        run: |
          set -euo pipefail
          awk '/cat > \/tmp\/build-fast-register.py.gz.b64 <<'"'"'EOF'"'"'/{capture=1; next} /^[[:space:]]*EOF$/{capture=0} capture {print}' \
            .github/workflows/build-fast-personnel-register-once.yml |
            tr -d '\r\n\t ' > /tmp/patcher.b64
          base64 --decode /tmp/patcher.b64 > /tmp/patcher.gz
          gzip --decompress --stdout /tmp/patcher.gz > /tmp/patcher.py
          python3 /tmp/patcher.py
          git rm -f .github/workflows/build-fast-personnel-register-once.yml

      - name: Identify failing validation command
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          checks=(
            'node --check src/missionchief-command-nexus.user.js'
            'node scripts/validate-userscript.mjs'
            'node scripts/validate-userscript.mjs --base-ref origin/main'
            'node scripts/check-ios-compatibility.mjs'
            'node scripts/check-runtime-hardening.mjs'
            'node scripts/check-police-irv-fallback.mjs'
            'node scripts/check-ios-unit-finder-selection.mjs'
            'node scripts/check-ios-mission-requirements-source.mjs'
            'node scripts/check-iphone-mission-ui.mjs'
            'node scripts/check-open-issues-batch.mjs'
            'node scripts/check-missing-requirements-priority.mjs'
            'node scripts/check-trained-coverage-optimizer.mjs'
            'node scripts/check-road-rail-rru-mapping.mjs'
            'node scripts/check-auto-prisoner-cell-gate.mjs'
            'node scripts/check-fire-engine-update-mapping.mjs'
            'node scripts/check-saved-position-helper-copy.mjs'
            'node scripts/check-bulk-trained-register-update.mjs'
            'node scripts/check-hems-ambulance-eta-priority.mjs'
            'node scripts/check-police-search-advisor-register.mjs'
            'node scripts/check-personnel-register-transfer.mjs'
            'node scripts/check-fast-personnel-register.mjs'
            'node scripts/check-release-notification-single-delivery.mjs'
            'python3 scripts/check_repository.py'
            'git diff --check'
          )
          for check in "${checks[@]}"; do
            echo "### ${check}"
            if ! bash -lc "${check}" > /tmp/check.log 2>&1; then
              {
                echo '## Fast Personnel Register validation failure'
                echo
                echo "Failed command: \`${check}\`"
                echo
                echo '```text'
                tail -80 /tmp/check.log
                echo '```'
              } > /tmp/failure.md
              gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/failure.md
              cat /tmp/check.log
              exit 1
            fi
          done
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body 'All isolated fast Personnel Register validation commands passed.'
