name: Build v1.0.87 Dispatch Centre candidate

on:
  pull_request_target:
    types: [reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: build-v1087-dispatch-centre-merged
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.number == 267 &&
       github.event.pull_request.head.ref == 'fix/dispatch-centre-refresh-v1087' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.actor == 'Martyblyth' &&
       github.event.issue.number == 267 &&
       github.event.comment.body == '/build-v1087-now')
    runs-on: ubuntu-latest
    steps:
      - name: Report builder start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/267/comments" \
            -f body='v1.0.87 Dispatch Centre builder started.' >/dev/null

      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/dispatch-centre-refresh-v1087
          fetch-depth: 0

      - name: Build and validate exact candidate
        id: validate
        shell: bash
        run: |
          set +e
          {
            set -x
            python3 scripts/build-dispatch-centre-refresh-v1087.py
            node --check src/missionchief-command-nexus.user.js
            node scripts/validate-userscript.mjs
            for check in scripts/check-*.mjs; do
              echo "Running $check"
              node "$check" || exit $?
            done
            test ! -e scripts/build-dispatch-centre-refresh-v1087.py
            git diff --check
          } > /tmp/v1087-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 180 /tmp/v1087-build.log > /tmp/v1087-tail.log
          exit 0

      - name: Report validation result
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.validate.outputs.status }}
        run: |
          if [ "$STATUS" = "0" ]; then
            body='v1.0.87 Dispatch Centre candidate: build, syntax, metadata/size and every permanent regression passed. Committing the clean candidate.'
          else
            body="v1.0.87 Dispatch Centre builder failed with status $STATUS. Last log lines:\n\n\`\`\`text\n$(cat /tmp/v1087-tail.log)\n\`\`\`"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/267/comments" -f body="$body" >/dev/null

      - name: Fail on validation error
        if: steps.validate.outputs.status != '0'
        run: exit 1

      - name: Commit clean v1.0.87 candidate
        if: steps.validate.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Dispatch Centre refresh for v1.0.87'
          git push origin HEAD:fix/dispatch-centre-refresh-v1087

      - name: Report committed candidate
        if: steps.validate.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api "repos/${GITHUB_REPOSITORY}/issues/267/comments" \
            -f body="v1.0.87 clean candidate committed: ${sha}" >/dev/null
