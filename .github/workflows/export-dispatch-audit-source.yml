name: Export dispatch audit source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-dispatch-audit-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage complete trusted main
        shell: bash
        run: |
          mkdir -p audit-source
          tar --exclude=.git --exclude=audit-source -cf - . | tar -xf - -C audit-source
      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-audit-full-repo
          path: audit-source
          retention-days: 1
