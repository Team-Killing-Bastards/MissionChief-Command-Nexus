name: Export dispatch audit source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-dispatch-audit-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage audit source
        shell: bash
        run: |
          mkdir -p audit-source
          cp src/missionchief-command-nexus.user.js audit-source/
          cp integrations/google-apps-script/Code.gs audit-source/
          cp CHANGELOG.md audit-source/
          cp scripts/check-mission-user-logger.mjs audit-source/
          cp scripts/check-mission-generation-logger.mjs audit-source/
          cp scripts/check-mission-journey-metrics.mjs audit-source/
      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-audit-source
          path: audit-source
          retention-days: 1
