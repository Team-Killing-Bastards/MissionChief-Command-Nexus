name: Fix release draft reconciliation

on:
  push:
    branches:
      - main
    paths:
      - '.fix-release-publisher-trigger'

permissions:
  contents: write

concurrency:
  group: fix-release-draft-reconciliation
  cancel-in-progress: false

jobs:
  fix:
    name: Remove immutable tag fields from release PATCH requests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch and validate publisher
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/publish-release.mjs')
          source = path.read_text(encoding='utf-8')
          old = """      tag_name: tag,
                target_commitish: target,
                name: title,"""
          new = """      name: title,"""
          count = source.count(old)
          if count != 2:
              raise SystemExit(f'Expected two release PATCH field blocks, found {count}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

          node --check scripts/publish-release.mjs
          git diff --check

      - name: Commit permanent publisher correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/publish-release.mjs
          git commit -m "Harden release draft reconciliation"
          git push origin HEAD:main
