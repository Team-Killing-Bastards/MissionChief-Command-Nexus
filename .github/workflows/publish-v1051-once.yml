name: Build v1.0.58 Auto Mode memory lifecycle fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-v1058-memory-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    name: Apply and validate memory lifecycle hardening
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/auto-mode-memory-lifecycle-v1058'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply memory lifecycle correction
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '// @version      1.0.58' src/missionchief-command-nexus.user.js; then
            echo 'v1.0.58 product source already present.'
          else
            python3 scripts/apply-auto-memory-v1058.py
          fi
          rm -f scripts/apply-auto-memory-v1058.py

      - name: Validate complete candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for script in scripts/check-*.mjs; do
            echo "Running ${script}"
            node "${script}"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit validated product changes
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git commit -m 'Fix Auto Mode memory lifecycle'
          git push origin "HEAD:refs/heads/${HEAD_REF}"
          echo 'changed=true' >> "${GITHUB_OUTPUT}"

      - name: Report builder state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CHANGED}" == 'true' ]]; then
            BODY='v1.0.58 memory lifecycle patch applied and the complete regression suite passed.'
          else
            BODY='v1.0.58 memory lifecycle product branch remains fully validated.'
          fi
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "${BODY}"
