name: Verify published v1.0.60

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verify-v1.0.60-once
  cancel-in-progress: false

jobs:
  verify:
    name: Verify GitHub Greasy Fork and Discord delivery
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/verify-v1060'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Verify v1.0.60 publication
        env:
          GH_TOKEN: ${{ github.token }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_TAG: v1.0.60
          RELEASE_SHA: 359181c5bb4a1a97a9a5b6982a97dd1e2efdd4c9
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" == "${RELEASE_SHA}" ]]

          ASSET='MissionChief-Command-Nexus-1.0.60.user.js'
          CHECKSUM_ASSET="${ASSET}.sha256"
          RELEASE_JSON=/tmp/v1060-release.json

          RELEASE_READY='false'
          for attempt in $(seq 1 60); do
            if gh release view "${RELEASE_TAG}" \
              --json url,isDraft,isPrerelease,assets > "${RELEASE_JSON}" 2>/dev/null; then
              ASSET_COUNT="$(jq -r --arg name "${ASSET}" '[.assets[] | select(.name == $name)] | length' "${RELEASE_JSON}")"
              CHECKSUM_COUNT="$(jq -r --arg name "${CHECKSUM_ASSET}" '[.assets[] | select(.name == $name)] | length' "${RELEASE_JSON}")"
              RECEIPT_COUNT="$(jq -r '[.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.60-"))] | length' "${RELEASE_JSON}")"
              if [[ "$(jq -r '.isDraft' "${RELEASE_JSON}")" == 'false' && \
                    "$(jq -r '.isPrerelease' "${RELEASE_JSON}")" == 'false' && \
                    "${ASSET_COUNT}" == '1' && \
                    "${CHECKSUM_COUNT}" == '1' && \
                    "${RECEIPT_COUNT}" == '1' ]]; then
                RELEASE_READY='true'
                break
              fi
            fi
            sleep 5
          done
          [[ "${RELEASE_READY}" == 'true' ]]

          RELEASE_URL="$(jq -r '.url' "${RELEASE_JSON}")"
          RECEIPT_NAME="$(jq -r '.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.60-")) | .name' "${RELEASE_JSON}")"

          rm -rf /tmp/v1060-release-check
          mkdir -p /tmp/v1060-release-check
          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${CHECKSUM_ASSET}" \
            --dir /tmp/v1060-release-check \
            --clobber
          (
            cd /tmp/v1060-release-check
            sha256sum -c "${CHECKSUM_ASSET}"
          )

          git show "${RELEASE_SHA}:src/missionchief-command-nexus.user.js" > /tmp/v1060-expected.user.js
          cmp --silent /tmp/v1060-expected.user.js "/tmp/v1060-release-check/${ASSET}"
          grep -Fq '// @version      1.0.60' /tmp/v1060-expected.user.js
          grep -Fq 'MISSION FINDER V10.6.123' /tmp/v1060-expected.user.js

          [[ -n "${GREASYFORK_INSTALL_URL}" ]]
          URL_SEPARATOR='?'
          [[ "${GREASYFORK_INSTALL_URL}" == *'?'* ]] && URL_SEPARATOR='&'
          GREASY_OK='false'
          for attempt in $(seq 1 60); do
            CHECK_URL="${GREASYFORK_INSTALL_URL}${URL_SEPARATOR}mc_release_check=$(date +%s)-${attempt}"
            if curl --fail --location --silent --show-error --retry 2 --max-time 30 \
              -H 'Cache-Control: no-cache' "${CHECK_URL}" -o /tmp/v1060-greasy.user.js; then
              if python3 - /tmp/v1060-expected.user.js /tmp/v1060-greasy.user.js <<'PY'
          import re
          import sys
          from pathlib import Path

          def normalise(path):
              text = Path(path).read_text(encoding='utf-8-sig')
              text = text.replace('\r\n', '\n').replace('\r', '\n')
              text = re.sub(
                  r'^\s*//\s*@(downloadURL|updateURL|installURL)\s+.*\n?',
                  '',
                  text,
                  flags=re.I | re.M,
              )
              text = re.sub(r'[ \t]+$', '', text, flags=re.M)
              return text.rstrip() + '\n'

          raise SystemExit(0 if normalise(sys.argv[1]) == normalise(sys.argv[2]) else 1)
          PY
              then
                GREASY_OK='true'
                break
              fi
            fi
            sleep 5
          done
          [[ "${GREASY_OK}" == 'true' ]]

          CHECKSUM="$(sha256sum /tmp/v1060-expected.user.js | awk '{print $1}')"
          cat > /tmp/v1060-receipt.md <<EOF
          ## v1.0.60 release verified

          - GitHub release: ${RELEASE_URL}
          - Userscript and checksum assets: verified
          - Greasy Fork: version and normalised source parity confirmed
          - Discord: one delivery receipt confirmed as \`${RECEIPT_NAME}\`
          - Published source commit: \`${RELEASE_SHA}\`
          - SHA-256: \`${CHECKSUM}\`
          EOF
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/v1060-receipt.md

  finish:
    name: Close one-use verifier
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Close verification marker
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${VERIFY_RESULT}" == 'success' ]]; then
            gh pr close "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --comment 'v1.0.60 is verified across GitHub, Greasy Fork and Discord.'
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/release/verify-v1060" || true
          else
            gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
              --body "v1.0.60 verification stopped: result=${VERIFY_RESULT}."
            exit 1
          fi
