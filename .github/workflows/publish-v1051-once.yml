name: Build v1.0.65 Required Personnel preload

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-v1065-required-personnel-preload
  cancel-in-progress: false

jobs:
  build:
    name: Apply and validate Required Personnel preload
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/preload-required-personnel-v1065'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply Required Personnel preload
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --force
          git merge --no-edit origin/main

          if ! grep -Fq '// @version      1.0.65' src/missionchief-command-nexus.user.js; then
            cat .github/builders/required-personnel-v1065.part-* |
              tr -d '\r\n ' > /tmp/apply-required-personnel-preload-v1065.py.gz.b64

            echo '5b664b2c4f9f39c9503cb9e6bf1dae70289200a46246ccd85118899a6526dbb2  /tmp/apply-required-personnel-preload-v1065.py.gz.b64' |
              sha256sum -c -

            base64 -d /tmp/apply-required-personnel-preload-v1065.py.gz.b64 |
              gzip -d > scripts/apply-required-personnel-preload-v1065.py

            echo 'a71ab7d745e69e0c4992d492f0542a760ecf4c26c0d9d3850db866e764784ba3  scripts/apply-required-personnel-preload-v1065.py' |
              sha256sum -c -

            python3 -m py_compile scripts/apply-required-personnel-preload-v1065.py
            python3 scripts/apply-required-personnel-preload-v1065.py
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-mission-definition-personnel-preload.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  const bodyStart = source.indexOf('{', start);"
          new = """  const signatureEnd = source.indexOf(') {', start);
            if (signatureEnd < 0) fail(`Unable to find ${name} body`);
            const bodyStart = signatureEnd + 2;"""
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

          git checkout origin/main -- .github/workflows/validate-userscript.yml
          rm -rf scripts/__pycache__
          rm -f scripts/apply-required-personnel-preload-v1065.py
          rm -f .github/builders/apply-required-personnel-preload-v1065.py.gz.b64
          rm -f .github/builders/required-personnel-v1065.part-*
          rm -f .github/builders/preload-required-personnel-v1065.txt

      - name: Validate complete candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-mission-definition-personnel-preload.mjs
          node scripts/check-mission-definition-trained-personnel.mjs
          node scripts/check-trained-personnel-panel.mjs
          node scripts/check-initial-trained-personnel-authority.mjs
          node scripts/check-mission-update-single-pass.mjs
          node scripts/check-auto-dispatch-eod-required-personnel.mjs
          node scripts/check-trained-coverage-optimizer.mjs
          node scripts/check-ios-mission-requirements-source.mjs
          node scripts/check-ios-unit-finder-selection.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-auto-memory-lifecycle.mjs
          node scripts/check-auto-memory-recycle.mjs
          node scripts/check-hazmat-osu-issue-215.mjs
          node scripts/check-hazmat-personnel-osu.mjs
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit validated product changes
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'Candidate is already fully built and validated.'
            exit 0
          fi

          git commit -m 'Preload mission Required Personnel before unit selection'
          git push origin "HEAD:${HEAD_BRANCH}"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body 'v1.0.65 Required Personnel preload applied. The authoritative mission table is cached on load, displayed before selection and reused by Unit Finder; focused parser, UI, single-pass, iOS and lifecycle checks passed.'
