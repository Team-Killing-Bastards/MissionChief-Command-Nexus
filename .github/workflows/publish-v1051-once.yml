name: Verify published v1.0.57

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: verify-v1.0.57-once
  cancel-in-progress: false

jobs:
  verify:
    name: Verify GitHub Greasy Fork and Discord delivery
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/verify-v1057'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Verify v1.0.57 publication
        env:
          GH_TOKEN: ${{ github.token }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_TAG: v1.0.57
          RELEASE_SHA: ba2522183aa13aeb687fb14a5d4c65ec24734052
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          ASSET='MissionChief-Command-Nexus-1.0.57.user.js'
          CHECKSUM_ASSET="${ASSET}.sha256"
          gh release view "${RELEASE_TAG}" \
            --json url,isDraft,isPrerelease,assets > /tmp/v1057-release.json

          [[ "$(jq -r '.isDraft' /tmp/v1057-release.json)" == 'false' ]]
          [[ "$(jq -r '.isPrerelease' /tmp/v1057-release.json)" == 'false' ]]
          RELEASE_URL="$(jq -r '.url' /tmp/v1057-release.json)"

          for name in "${ASSET}" "${CHECKSUM_ASSET}"; do
            [[ "$(jq -r --arg name "${name}" '[.assets[] | select(.name == $name)] | length' /tmp/v1057-release.json)" == '1' ]]
          done

          RECEIPT_COUNT="$(
            jq -r '[.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.57-"))] | length' \
              /tmp/v1057-release.json
          )"
          [[ "${RECEIPT_COUNT}" == '1' ]]
          RECEIPT_NAME="$(
            jq -r '.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.57-")) | .name' \
              /tmp/v1057-release.json
          )"

          TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          [[ "${TAG_SHA}" == "${RELEASE_SHA}" ]]

          rm -rf /tmp/v1057-release-check
          mkdir -p /tmp/v1057-release-check
          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${CHECKSUM_ASSET}" \
            --dir /tmp/v1057-release-check \
            --clobber
          (
            cd /tmp/v1057-release-check
            sha256sum -c "${CHECKSUM_ASSET}"
          )

          git show "${TAG_SHA}:src/missionchief-command-nexus.user.js" > /tmp/v1057-expected.user.js
          cmp --silent /tmp/v1057-expected.user.js "/tmp/v1057-release-check/${ASSET}"
          grep -Fq '// @version      1.0.57' /tmp/v1057-expected.user.js
          grep -Fq 'MISSION FINDER V10.6.120' /tmp/v1057-expected.user.js

          [[ -n "${GREASYFORK_INSTALL_URL}" ]]
          URL_SEPARATOR='?'
          [[ "${GREASYFORK_INSTALL_URL}" == *'?'* ]] && URL_SEPARATOR='&'
          GREASY_OK='false'
          GREASY_STATUS='No response received'
          for attempt in $(seq 1 12); do
            CHECK_URL="${GREASYFORK_INSTALL_URL}${URL_SEPARATOR}mc_release_check=$(date +%s)-${attempt}"
            if curl --fail --location --silent --show-error --retry 2 --max-time 30 \
              -H 'Cache-Control: no-cache' "${CHECK_URL}" -o /tmp/v1057-greasy.user.js; then
              if python3 - /tmp/v1057-expected.user.js /tmp/v1057-greasy.user.js <<'PY'
          import re
          import sys
          from pathlib import Path

          def normalise(text):
              text = text.lstrip('\ufeff').replace('\r\n', '\n').replace('\r', '\n')
              text = re.sub(
                  r'^\s*//\s*@(downloadURL|updateURL|installURL)\s+.*\n?',
                  '',
                  text,
                  flags=re.IGNORECASE | re.MULTILINE,
              )
              text = '\n'.join(line.rstrip(' \t') for line in text.split('\n'))
              return text.rstrip() + '\n'

          expected = Path(sys.argv[1]).read_text(encoding='utf-8')
          actual = Path(sys.argv[2]).read_text(encoding='utf-8')
          version = re.search(r'^\s*//\s*@version\s+([^\s]+)\s*$', actual, re.MULTILINE)
          if not version or version.group(1) != '1.0.57':
              raise SystemExit(2)
          if normalise(actual) != normalise(expected):
              raise SystemExit(3)
          PY
              then
                GREASY_OK='true'
                break
              else
                STATUS=$?
                if [[ "$STATUS" == '2' ]]; then
                  GREASY_STATUS="served version $(sed -n 's#^[[:space:]]*//[[:space:]]*@version[[:space:]]*##p' /tmp/v1057-greasy.user.js | head -n 1 | xargs)"
                else
                  GREASY_STATUS='version 1.0.57 source differed after metadata normalisation'
                fi
              fi
            else
              GREASY_STATUS='download failed'
            fi
            echo "Greasy Fork not ready (${attempt}/12): ${GREASY_STATUS}"
            sleep 5
          done
          [[ "${GREASY_OK}" == 'true' ]]

          CHECKSUM="$(sha256sum /tmp/v1057-expected.user.js | awk '{print $1}')"
          cat > /tmp/v1057-receipt.md <<EOF
          ## v1.0.57 release verified

          - GitHub release: ${RELEASE_URL}
          - Userscript and checksum assets: verified
          - Greasy Fork: version and normalised source parity confirmed
          - Discord: one delivery receipt confirmed as \`${RECEIPT_NAME}\`
          - Published source commit: \`${TAG_SHA}\`
          - SHA-256: \`${CHECKSUM}\`
          EOF
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/v1057-receipt.md
