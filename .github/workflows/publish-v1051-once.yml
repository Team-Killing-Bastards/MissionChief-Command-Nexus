name: Build v1.0.57 dispatch corrections

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-v1.0.57-dispatch-corrections
  cancel-in-progress: false

jobs:
  build:
    name: Apply and validate Auto Mode EOD and personnel fixes
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/auto-duplicate-eod-personnel-v1057'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Inspect build state
        id: state
        shell: bash
        run: |
          if [[ -f scripts/apply-auto-dispatch-eod-personnel-v1057.py ]]; then
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply dispatch corrections
        if: steps.state.outputs.should_build == 'true'
        shell: bash
        run: |
          python3 scripts/apply-auto-dispatch-eod-personnel-v1057.py
          python3 scripts/fix-v1057-regression.py

      - name: Validate complete candidate
        if: steps.state.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for test in scripts/check-*.mjs; do
            echo "Running ${test}"
            node "$test"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit validated product changes
        if: steps.state.outputs.should_build == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-auto-dispatch-eod-personnel-v1057.py
          rm scripts/fix-v1057-regression.py
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Fix Auto Mode duplicate dispatch and EOD separation'
          git push origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Report builder state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHOULD_BUILD: ${{ steps.state.outputs.should_build }}
        shell: bash
        run: |
          if [[ "$SHOULD_BUILD" == 'true' ]]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'v1.0.57 product patch applied and full regression suite passed.'
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'v1.0.57 candidate already contains the validated product patch.'
          fi
