name: Verify published v1.0.63

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: verify-v1.0.63-once
  cancel-in-progress: false

jobs:
  verify:
    name: Verify GitHub Greasy Fork and Discord delivery
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/verify-v1063'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Verify published v1.0.63
        env:
          GH_TOKEN: ${{ github.token }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_TAG: v1.0.63
          RELEASE_SHA: 8aea6b8f058b4ce89a31b71d488a3ece552c0e52
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          [[ "${TAG_SHA}" == "${RELEASE_SHA}" ]]

          git show "${TAG_SHA}:src/missionchief-command-nexus.user.js" > /tmp/expected.user.js
          grep -Fq '// @version      1.0.63' /tmp/expected.user.js
          grep -Fq 'MISSION FINDER V10.6.126' /tmp/expected.user.js
          grep -Fq "const MF_FIRE_OPERATIONAL_SUPPORT_TYPE_ID = '39';" /tmp/expected.user.js
          grep -Fq 'isHazMatOsuRequirement' /tmp/expected.user.js

          ASSET='MissionChief-Command-Nexus-1.0.63.user.js'
          CHECKSUM_ASSET="${ASSET}.sha256"
          gh release view "${RELEASE_TAG}" \
            --json url,isDraft,isPrerelease,assets > /tmp/release.json

          [[ "$(jq -r '.isDraft' /tmp/release.json)" == 'false' ]]
          [[ "$(jq -r '.isPrerelease' /tmp/release.json)" == 'false' ]]
          RELEASE_URL="$(jq -r '.url' /tmp/release.json)"

          for name in "${ASSET}" "${CHECKSUM_ASSET}"; do
            [[ "$(jq -r --arg name "${name}" '[.assets[] | select(.name == $name)] | length' /tmp/release.json)" == '1' ]]
          done

          RECEIPT_COUNT="$(
            jq -r '[.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.63-"))] | length' \
              /tmp/release.json
          )"
          [[ "${RECEIPT_COUNT}" == '1' ]]
          RECEIPT_NAME="$(
            jq -r '.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.63-")) | .name' \
              /tmp/release.json
          )"

          rm -rf /tmp/release-check
          mkdir -p /tmp/release-check
          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${CHECKSUM_ASSET}" \
            --dir /tmp/release-check \
            --clobber
          (
            cd /tmp/release-check
            sha256sum -c "${CHECKSUM_ASSET}"
          )
          cmp --silent /tmp/expected.user.js "/tmp/release-check/${ASSET}"

          [[ -n "${GREASYFORK_INSTALL_URL}" ]]
          URL_SEPARATOR='?'
          [[ "${GREASYFORK_INSTALL_URL}" == *'?'* ]] && URL_SEPARATOR='&'
          GREASY_OK='false'
          for attempt in $(seq 1 60); do
            CHECK_URL="${GREASYFORK_INSTALL_URL}${URL_SEPARATOR}mc_release_check=$(date +%s)-${attempt}"
            if curl --fail --location --silent --show-error --retry 2 --max-time 30 \
              -H 'Cache-Control: no-cache' "${CHECK_URL}" -o /tmp/greasy.user.js; then
              python3 - <<'PY'
          from pathlib import Path

          def normalise(path):
              text = Path(path).read_text(encoding='utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')
              lines = []
              for line in text.split('\n'):
                  stripped = line.strip()
                  if stripped.startswith('// @downloadURL') or stripped.startswith('// @updateURL'):
                      continue
                  lines.append(line.rstrip())
              return '\n'.join(lines).strip() + '\n'

          expected = normalise('/tmp/expected.user.js')
          greasy = normalise('/tmp/greasy.user.js')
          raise SystemExit(0 if expected == greasy else 1)
          PY
              if [[ "$?" == '0' ]]; then
                GREASY_OK='true'
                break
              fi
            fi
            sleep 5
          done
          [[ "${GREASY_OK}" == 'true' ]]

          CHECKSUM="$(sha256sum /tmp/expected.user.js | awk '{print $1}')"
          cat > /tmp/receipt.md <<EOF
          ## v1.0.63 release verified

          - GitHub release: ${RELEASE_URL}
          - Userscript and checksum assets: verified
          - Greasy Fork: version and normalised source parity confirmed
          - Discord: one delivery receipt confirmed as \`${RECEIPT_NAME}\`
          - Published source commit: \`${TAG_SHA}\`
          - SHA-256: \`${CHECKSUM}\`
          EOF
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/receipt.md

      - name: Close verifier PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          gh pr close "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --comment 'v1.0.63 is verified across GitHub, Greasy Fork and Discord.'
