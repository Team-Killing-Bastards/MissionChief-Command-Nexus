name: Build v1.0.63 Issue 215 HazMat OSU fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-v1063-hazmat-osu
  cancel-in-progress: false

jobs:
  build:
    name: Apply and validate HazMat OSU correction
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/hazmat-osu-issue-215-v1063'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply Issue 215 correction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-hazmat-osu-issue-215-v1063.py
          rm -f scripts/apply-hazmat-osu-issue-215-v1063.py

      - name: Validate complete candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-hazmat-osu-issue-215.mjs
          node scripts/check-mission-update-single-pass.mjs
          node scripts/check-trained-personnel-panel.mjs
          node scripts/check-missing-on-mission-authority.mjs
          node scripts/check-missing-requirements-priority.mjs
          node scripts/check-auto-dispatch-eod-required-personnel.mjs
          node scripts/check-trained-coverage-optimizer.mjs
          node scripts/check-mission-definition-trained-personnel.mjs
          node scripts/check-initial-trained-personnel-authority.mjs
          node scripts/check-police-search-advisor-register.mjs
          node scripts/check-bulk-trained-register-update.mjs
          node scripts/check-fire-engine-update-mapping.mjs
          node scripts/check-road-rail-rru-mapping.mjs
          node scripts/check-auto-prisoner-cell-gate.mjs
          node scripts/check-auto-memory-lifecycle.mjs
          node scripts/check-auto-memory-recycle.mjs
          node scripts/check-hems-ambulance-eta-priority.mjs
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-police-irv-fallback.mjs
          node scripts/check-ios-unit-finder-selection.mjs
          node scripts/check-ios-mission-requirements-source.mjs
          node scripts/check-iphone-mission-ui.mjs
          node scripts/check-open-issues-batch.mjs
          node scripts/check-unit-finder-diagnostic-export.mjs
          node scripts/check-saved-position-helper-copy.mjs
          node scripts/check-auto-patient-transport-anchor.mjs
          node scripts/check-auto-patient-transport-iframe.mjs
          node scripts/check-personnel-register-transfer.mjs
          node scripts/check-fast-personnel-register.mjs
          git diff --check

      - name: Commit validated product changes
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Issue 215 HazMat requirements with exact OSUs'
          git push origin "HEAD:${HEAD_BRANCH}"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body 'v1.0.63 Issue #215 HazMat-to-OSU correction applied; the complete dispatch, Mission Update, trained-personnel, patient, EOD, memory and platform regression suite passed.'
