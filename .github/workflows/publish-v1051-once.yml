name: Build and publish v1.0.56 diagnostics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-v1.0.56-diagnostics
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate Unit Finder diagnostic export
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/run-v1056-comment'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply diagnostic export feature
        run: python3 scripts/apply-unit-finder-diagnostic-export-v1056.py

      - name: Validate complete release candidate
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for test in scripts/check-*.mjs; do
            echo "Running ${test}"
            node "$test"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Restore workflows and commit product source
        run: |
          set -euo pipefail
          git show 22aaa070398684273338f5b5d03488f147e5d29a:.github/workflows/repository-quality.yml > .github/workflows/repository-quality.yml
          git show 9b13210a83abbba1828cba7677e685a0faf4ced9:.github/workflows/publish-v1051-once.yml > .github/workflows/publish-v1051-once.yml
          git show HEAD:.github/workflows/validate-userscript.yml > .github/workflows/validate-userscript.yml
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Add Unit Finder diagnostic export'
          git push origin HEAD:refs/heads/main

  publish:
    name: Publish and verify v1.0.56
    needs: build
    if: needs.build.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.56
      release_notes: Add exportable Unit Finder and Mission Update requirement and selection diagnostics.
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

  finish:
    name: Report v1.0.56 diagnostic release
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report release result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "v1.0.56 diagnostic export: build=${BUILD_RESULT}, publish=${PUBLISH_RESULT}."
