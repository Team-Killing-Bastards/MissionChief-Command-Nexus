name: Tail Issue 33 notifier failure

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  actions: read

jobs:
  tail:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/issue-33-validation'
    runs-on: ubuntu-latest

    steps:
      - name: Print final notifier failure lines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/88307768420/logs" \
            > /tmp/notifier.log

          echo '===== FINAL NOTIFIER LINES ====='
          tail -n 25 /tmp/notifier.log
