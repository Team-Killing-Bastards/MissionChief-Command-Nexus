name: Compare v1.0.84 Greasy Fork source

on:
  push:
    branches:
      - release/reconcile-v1.0.84-discord
    paths:
      - '.github/workflows/compare-v1084-greasyfork.yml'
      - '.compare-v1084-greasyfork-trigger'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v6
        with:
          ref: release/reconcile-v1.0.84-discord
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Compare immutable and served source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git show 'v1.0.84:src/missionchief-command-nexus.user.js' > /tmp/tag.user.js
          curl --location --fail --silent --show-error \
            'https://update.greasyfork.org/scripts/587702/MissionChief%20Command%20Nexus.user.js' \
            --output /tmp/gf.user.js

          python3 - <<'PY' > .release-v1084-source-comparison.json
          import hashlib
          import json
          from pathlib import Path

          tag = Path('/tmp/tag.user.js').read_bytes()
          gf = Path('/tmp/gf.user.js').read_bytes()

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def normalise(data):
              return data.replace(b'\r\n', b'\n').replace(b'\r', b'\n')

          def lines(data):
              return normalise(data).decode('utf-8-sig', errors='replace').splitlines()

          tag_lines = lines(tag)
          gf_lines = lines(gf)
          first_differences = []
          for index in range(max(len(tag_lines), len(gf_lines))):
              left = tag_lines[index] if index < len(tag_lines) else None
              right = gf_lines[index] if index < len(gf_lines) else None
              if left != right:
                  first_differences.append({
                      'line': index + 1,
                      'tag': left,
                      'greasy_fork': right,
                  })
                  if len(first_differences) >= 20:
                      break

          def metadata(source_lines):
              result = {}
              for line in source_lines[:80]:
                  if line.startswith('// @'):
                      key, _, value = line[3:].partition(' ')
                      result[key.strip()] = value.strip()
              return result

          payload = {
              'tag': {
                  'bytes': len(tag),
                  'sha256': sha(tag),
                  'normalised_sha256': sha(normalise(tag)),
                  'line_count': len(tag_lines),
                  'metadata': metadata(tag_lines),
              },
              'greasy_fork': {
                  'bytes': len(gf),
                  'sha256': sha(gf),
                  'normalised_sha256': sha(normalise(gf)),
                  'line_count': len(gf_lines),
                  'metadata': metadata(gf_lines),
              },
              'byte_equal': tag == gf,
              'line_ending_normalised_equal': normalise(tag) == normalise(gf),
              'first_differences': first_differences,
          }
          print(json.dumps(payload, indent=2))
          PY

          git rm -f --ignore-unmatch \
            .github/workflows/compare-v1084-greasyfork.yml \
            .compare-v1084-greasyfork-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record v1.0.84 Greasy Fork source comparison'
          git push origin HEAD:refs/heads/release/reconcile-v1.0.84-discord
