name: Print v1.0.24 release status

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: read
  contents: read

jobs:
  status:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/normal-irv-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print permanent release run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.24
          RELEASE_SHA: c610bef883bb1be42869e625e8245b77f05ad0d8
        shell: bash
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=push&per_page=30")"
          RUN_ROW="$(
            jq -c \
              --arg tag "${RELEASE_TAG}" \
              --arg sha "${RELEASE_SHA}" \
              '.workflow_runs |
               map(select(.head_branch == $tag or .head_sha == $sha)) |
               sort_by(.created_at) |
               reverse |
               .[0] // empty' <<< "${RUN_JSON}"
          )"
          if [[ -z "${RUN_ROW}" ]]; then
            echo 'NO_MATCHING_RELEASE_RUN'
            exit 0
          fi
          RUN_ID="$(jq -r '.id' <<< "${RUN_ROW}")"
          echo 'RELEASE_RUN'
          jq '{id,html_url,status,conclusion,event,head_branch,head_sha,created_at,updated_at}' <<< "${RUN_ROW}"
          echo 'RELEASE_JOBS'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" |
            jq '.jobs | map({id,name,status,conclusion,started_at,completed_at,steps})'
