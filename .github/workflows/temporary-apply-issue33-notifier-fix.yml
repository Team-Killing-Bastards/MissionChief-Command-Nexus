name: Apply Issue 33 notifier fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/issue-33-notifier-propagation'
    runs-on: ubuntu-latest

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply, validate and commit notifier fix
        shell: bash
        run: |
          set -euo pipefail

          PATCH='automation/issue33_notifier_patch.py'

          if [[ ! -f "${PATCH}" ]]; then
            echo 'Notifier patch payload already consumed.'
            exit 0
          fi

          python3 "${PATCH}"
          git rm -f "${PATCH}"

          node --check scripts/release-notify.mjs
          node --check scripts/publish-release.mjs
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/release-notify.mjs \
            .github/workflows/release.yml
          git commit -m 'Use authenticated immutable source verification for releases'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
