name: Repair v1.0.84 current assertions

on:
  push:
    branches:
      - fix/ios-personnel-assignment-completeness-v1084
    paths:
      - '.github/workflows/repair-v1084-current-assertions.yml'
      - '.repair-v1084-current-assertions-trigger'

permissions:
  contents: write

concurrency:
  group: repair-v1084-current-assertions
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: fix/ios-personnel-assignment-completeness-v1084
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Repair all stale current-release assertions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '// @version      1.0.83': '// @version      1.0.84',
              'MISSION FINDER V10.6.143': 'MISSION FINDER V10.6.144',
              "const PERSONNEL_VERSION = '1.3.8';": "const PERSONNEL_VERSION = '1.3.9';",
          }

          changed = []
          for path in sorted(Path('scripts').glob('check-*.mjs')):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No stale v1.0.83/V10.6.143/Personnel 1.3.8 assertions were found')

          print('Updated current-release assertions:')
          print('\n'.join(changed))
          PY

          git rm -f --ignore-unmatch \
            .github/workflows/repair-v1084-current-assertions.yml \
            .repair-v1084-current-assertions-trigger

          if grep -RIl --include='check-*.mjs' -- '// @version      1.0.83' scripts | grep -q .; then
            echo 'Stale Command Nexus 1.0.83 assertion remains.'
            exit 1
          fi
          if grep -RIl --include='check-*.mjs' -- 'MISSION FINDER V10.6.143' scripts | grep -q .; then
            echo 'Stale Mission Finder V10.6.143 assertion remains.'
            exit 1
          fi
          if grep -RIl --include='check-*.mjs' -- "const PERSONNEL_VERSION = '1.3.8';" scripts | grep -q .; then
            echo 'Stale Personnel Assignment 1.3.8 assertion remains.'
            exit 1
          fi

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh v1.0.84 current-release assertions'
          git push origin HEAD:refs/heads/fix/ios-personnel-assignment-completeness-v1084
