name: Repair v1.0.84 current assertions
# Owner-authorised simplified migration: 2026-08-06T07:52:00+01:00

on:
  push:
    branches:
      - fix/ios-personnel-assignment-completeness-v1084
    paths:
      - '.github/workflows/repair-v1084-current-assertions.yml'
      - '.repair-v1084-current-assertions-trigger'

permissions:
  contents: write

concurrency:
  group: repair-v1084-current-assertions
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: fix/ios-personnel-assignment-completeness-v1084
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Refresh stale current-release assertions and self-clean
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '// @version      1.0.83': '// @version      1.0.84',
              'MISSION FINDER V10.6.143': 'MISSION FINDER V10.6.144',
              "const PERSONNEL_VERSION = '1.3.8';": "const PERSONNEL_VERSION = '1.3.9';",
          }

          changed = []
          for path in sorted(Path('scripts').glob('check-*.mjs')):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated current-release assertions:')
          print('\n'.join(changed) if changed else '(none)')
          PY

          git rm -f --ignore-unmatch \
            .github/workflows/repair-v1084-current-assertions.yml \
            .repair-v1084-current-assertions-trigger

          if grep -RIl --include='check-*.mjs' -- '// @version      1.0.83' scripts | grep -q .; then
            echo 'Stale Command Nexus 1.0.83 assertion remains.'
            exit 1
          fi
          if grep -RIl --include='check-*.mjs' -- 'MISSION FINDER V10.6.143' scripts | grep -q .; then
            echo 'Stale Mission Finder V10.6.143 assertion remains.'
            exit 1
          fi
          if grep -RIl --include='check-*.mjs' -- "const PERSONNEL_VERSION = '1.3.8';" scripts | grep -q .; then
            echo 'Stale Personnel Assignment 1.3.8 assertion remains.'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No branch repair changes were required.'
            exit 0
          fi

          git commit -m 'Refresh all v1.0.84 current-release assertions'
          git push origin HEAD:refs/heads/fix/ios-personnel-assignment-completeness-v1084
