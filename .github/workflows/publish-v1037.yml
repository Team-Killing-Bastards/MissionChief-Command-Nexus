name: Publish v1.0.37 through normal release workflow

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/verify-v1037-delivery'
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.37
      release_notes: Restore Personnel Register controls on the latest Command Nexus source while preserving the trained-personnel coverage optimiser.
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
