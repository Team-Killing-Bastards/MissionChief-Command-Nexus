name: Diagnose corrected fast register apply

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fast-personnel-register-v1051'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct and diagnose patcher
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          awk '/cat > \/tmp\/build-fast-register.py.gz.b64 <<'"'"'EOF'"'"'/{capture=1; next} /^[[:space:]]*EOF$/{capture=0} capture {print}' \
            .github/workflows/build-fast-personnel-register-fix.yml |
            tr -d '\r\n\t ' > /tmp/patcher.b64
          base64 --decode /tmp/patcher.b64 > /tmp/patcher.gz
          gzip --decompress --stdout /tmp/patcher.gz > /tmp/patcher.py
          set +e
          python3 /tmp/patcher.py > /tmp/apply.log 2>&1
          status=$?
          set -e
          if [[ ${status} -ne 0 ]]; then
            {
              echo '## Corrected fast register apply failure'
              echo
              echo '```text'
              cat /tmp/apply.log
              echo '```'
            } > /tmp/comment.md
            gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
            cat /tmp/apply.log
            exit ${status}
          fi
          for path in .github/workflows/build-fast-personnel-register-once.yml .github/workflows/build-fast-personnel-register-fix.yml; do
            [[ -f "${path}" ]] || { echo "Missing expected workflow before cleanup: ${path}"; exit 1; }
          done
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body 'Corrected fast register patcher applied successfully in isolation.'
