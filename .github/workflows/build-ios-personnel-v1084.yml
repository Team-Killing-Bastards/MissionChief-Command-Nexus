name: Build iOS Personnel Assignment v1.0.84

on:
  push:
    branches:
      - fix/ios-personnel-assignment-completeness-v1084
    paths:
      - '.ios-personnel-v1084-trigger'

permissions:
  contents: write

concurrency:
  group: build-ios-personnel-v1084
  cancel-in-progress: false

jobs:
  build:
    name: Patch, validate and commit complete mobile controls
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: fix/ios-personnel-assignment-completeness-v1084
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare Command Nexus v1.0.84
        env:
          RELEASE_NOTES: |-
            Restore every Personnel Assignment action on iPhone and iPad Safari: Refresh Stations, Import, Start, Pause and Stop.
            Keep the native JSON file input hidden so it cannot displace or cover the visible mobile action buttons.
            Restore the Tools and reports disclosure so closed content stays hidden and every status/report tool appears when opened.
            Add touch-sized two-column mobile grids, dynamic-viewport scrolling and iOS safe-area protection without removing desktop functionality.
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs \
            --version 1.0.84 \
            --notes "${RELEASE_NOTES}"

      - name: Apply iOS Personnel Assignment completeness patch
        run: python3 scripts/temporary-build-ios-personnel-v1084.py

      - name: Remove one-use non-workflow material
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/validate-userscript.yml
          rm -f \
            .ios-personnel-v1084-trigger \
            scripts/temporary-build-ios-personnel-v1084.py
          rm -rf scripts/__pycache__

      - name: Validate exact candidate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-personnel-assignment-ios-completeness-v1084.mjs
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit validated production candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo 'No candidate changes were produced.'
            exit 1
          fi

          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'The production candidate must not modify workflow files in this push.'
            git diff --cached --name-only
            exit 1
          fi

          git commit -m "Restore complete iOS Personnel Assignment controls"
          git push origin HEAD:fix/ios-personnel-assignment-completeness-v1084

      - name: Record candidate summary
        shell: bash
        run: |
          {
            echo '### iOS Personnel Assignment candidate complete'
            echo '- Command Nexus: `1.0.84`'
            echo '- Personnel Assignment: `1.3.9`'
            echo '- Mobile actions: Refresh, Import, Start, Pause and Stop retained'
            echo '- Tools and reports: complete and default-open on iOS'
            echo '- Native file input: permanently hidden from layout'
            echo '- iOS layout: 44px touch controls, 2-column grids, safe-area and 100dvh scrolling'
            echo '- Non-workflow one-use material: removed before commit'
            echo '- Targeted candidate validation: passed before push'
          } >> "${GITHUB_STEP_SUMMARY}"
