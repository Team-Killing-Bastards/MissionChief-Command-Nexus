name: Temporary v3.0.37 naming cascade inspection

on:
  push:
    branches:
      - fix/v3037-naming-cascade-rollback

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip v3037 inspection]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract current and last known working naming paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import subprocess

          path = 'src/missionchief-command-nexus.user.js'
          current = Path(path).read_text(encoding='utf-8')
          working = subprocess.check_output(
              ['git', 'show', f'v1.0.95:{path}'],
              text=True,
              encoding='utf-8',
          )

          def span(text, name):
              markers = [f'async function {name}(', f'function {name}(']
              starts = [text.find(marker) for marker in markers]
              starts = [value for value in starts if value >= 0]
              if not starts:
                  return None
              start = min(starts)
              brace = text.find('{', start)
              depth = 0
              quote = ''
              escaped = False
              line_comment = False
              block_comment = False
              index = brace
              while index < len(text):
                  char = text[index]
                  nxt = text[index + 1] if index + 1 < len(text) else ''
                  if line_comment:
                      if char == '\n': line_comment = False
                      index += 1
                      continue
                  if block_comment:
                      if char == '*' and nxt == '/':
                          block_comment = False
                          index += 2
                          continue
                      index += 1
                      continue
                  if quote:
                      if escaped: escaped = False
                      elif char == '\\': escaped = True
                      elif char == quote: quote = ''
                      index += 1
                      continue
                  if char == '/' and nxt == '/':
                      line_comment = True
                      index += 2
                      continue
                  if char == '/' and nxt == '*':
                      block_comment = True
                      index += 2
                      continue
                  if char in ("'", '"', '`'):
                      quote = char
                      index += 1
                      continue
                  if char == '{': depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          return text[start:index + 1]
                  index += 1
              raise RuntimeError(f'Unterminated function {name}')

          names = [
              'getNamingStationRowBuildingId',
              'getNamingStationRowDispatchCentreId',
              'getNamingDispatchCentreStationRowDocuments',
              'extractNamingDispatchCentresFromStationControls',
              'extractNamingDispatchCentresFromStationRows',
              'collectNamingDispatchCentresFromStationRows',
              'refreshNamingDispatchCentreAssignmentsFromStationRows',
              'loadNamingDispatchCentreList',
              'loadNamingDispatchCentreData',
              'syncNamingStationDispatchCentreAssignments',
              'hydrateNamingInventoriesFromCurrentOverview',
              'refreshNamingDispatchCentres',
              'getNamingDispatchCentreId',
              'stationMatchesNamingDispatchCentre',
              'getNamingServiceForStation',
              'getStationsForNamingDispatchCentre',
              'getStationsForNamingService',
              'populateNamingDispatchCentreFilter',
              'populateNamingServiceFilter',
              'populateNamingStationTypeFilter',
              'populateStartDropdown',
              'populateStationNamingStartDropdown',
              'getStationOverviewDocuments',
              'getStationOverviewEntries',
              'refreshStations',
              'refreshStationNamingStations',
              'handleUnitDispatchCentreChange',
              'handleUnitNamingServiceChange',
              'handleUnitStationTypeChange',
              'handleStationDispatchCentreChange',
              'handleStationNamingServiceChange',
              'ensureSingleNamingToolsPanel',
              'mountNamingTools',
              'initializeTools',
          ]

          def build_map(text, label):
              parts = [f'===== {label} =====']
              for name in names:
                  function = span(text, name)
                  parts.append(f'\n===== {name} =====\n{function or "NOT FOUND"}')
              return '\n'.join(parts) + '\n'

          current_map = build_map(current, 'CURRENT MAIN-BASED BRANCH')
          working_map = build_map(working, 'LAST KNOWN WORKING v1.0.95')
          Path('.tmp-v3037-naming-current.txt').write_text(current_map, encoding='utf-8')
          Path('.tmp-v3037-naming-v1095.txt').write_text(working_map, encoding='utf-8')
          Path('.tmp-v3037-naming-function-diff.txt').write_text(
              ''.join(difflib.unified_diff(
                  working_map.splitlines(keepends=True),
                  current_map.splitlines(keepends=True),
                  fromfile='v1.0.95',
                  tofile='v3.0.36',
              )),
              encoding='utf-8',
          )

          lines = current.splitlines()
          terms = [
              'mc-namer-dispatch-centre',
              'mc-station-dispatch-centre',
              'leitstelle_building_id',
              'Refresh Stations',
              'refreshNamingDispatchCentreAssignmentsFromStationRows',
              'getNamingDispatchCentreStationRowDocuments',
              'hydrateNamingInventoriesFromCurrentOverview',
              'syncNamingStationDispatchCentreAssignments',
          ]
          ranges = []
          for number, line in enumerate(lines, 1):
              if any(term in line for term in terms):
                  ranges.append((max(1, number - 20), min(len(lines), number + 55)))
          merged = []
          for start, end in ranges:
              if merged and start <= merged[-1][1] + 5:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], end))
              else:
                  merged.append((start, end))
          report = []
          for index, (start, end) in enumerate(merged, 1):
              report.append(f'===== context-{index} [{start}-{end}] =====')
              report.extend(f'{line_no:06d}: {lines[line_no - 1]}' for line_no in range(start, end + 1))
              report.append('')
          Path('.tmp-v3037-naming-contexts.txt').write_text('\n'.join(report), encoding='utf-8')
          PY

      - name: Commit naming inspection maps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-v3037-naming-*.txt
          if git diff --cached --quiet; then
            echo "Inspection maps unchanged."
            exit 0
          fi
          git commit -m "Expand naming rollback inspection maps [skip v3037 inspection]"
          git push origin HEAD:fix/v3037-naming-cascade-rollback
