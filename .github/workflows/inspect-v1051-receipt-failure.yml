name: Inspect v1.0.51 receipt failure

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  pull-requests: write

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'release/publish-v1051'
    runs-on: ubuntu-latest
    steps:
      - name: Post failed receipt log tail
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_ID: 90146556219
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            > /tmp/job.log
          {
            echo '## v1.0.51 receipt failure log tail'
            echo
            echo '```text'
            tail -120 /tmp/job.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
