name: Apply activity recorder v1.1.9

on:
  push:
    branches:
      - feature/activity-recorder-v119
    paths:
      - scripts/apply-activity-recorder-v119.py
      - .github/workflows/apply-activity-recorder-v119.yml
  pull_request:
    types: [opened]
    branches:
      - main
    paths:
      - scripts/apply-activity-recorder-v119.py
      - .github/workflows/apply-activity-recorder-v119.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/activity-recorder-v119
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/apply-activity-recorder-v119.py

      - name: Validate activity recorder
        run: |
          node scripts/check-activity-recorder-v119.mjs
          node scripts/check-private-url-logger-profile.mjs
          node scripts/check-mission-user-logger.mjs
          node scripts/check-background-patient-transport-worker.mjs
          node scripts/check-patient-transfer-drawer-v117.mjs
          node scripts/check-hgv-tow-other-information-v118.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main

      - name: Commit generated release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/missionchief-command-nexus.user.js \
                  integrations/google-apps-script/Code.gs \
                  CHANGELOG.md README.md \
                  scripts/check-private-url-logger-profile.mjs \
                  scripts/check-mission-user-logger.mjs \
                  scripts/check-activity-recorder-v119.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Implement v1.1.9 comprehensive activity recorder"
          git push origin HEAD:feature/activity-recorder-v119
