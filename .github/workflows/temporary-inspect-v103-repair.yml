name: Temporary inspect v1.0.3 repair failure

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  actions: read
  contents: read

jobs:
  inspect-repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/trigger-publish-v1.0.3'
    runs-on: ubuntu-latest

    steps:
      - name: Print failed repair logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 29709157118 \
            --repo "${GITHUB_REPOSITORY}" \
            --log-failed
