name: Inspect HGV Recovery v1.0.97

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/inspect-hgv-recovery-v1097.mjs'
      - '.github/workflows/inspect-hgv-recovery-v1097.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Print current towing and requirement ingestion call-sites
        run: node scripts/inspect-hgv-recovery-v1097.mjs
