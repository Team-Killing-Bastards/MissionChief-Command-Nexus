name: Build prisoner SVG close fix v1.0.84

on:
  push:
    branches:
      - fix/prisoner-svg-close-v1084
    paths:
      - '.github/workflows/temporary-prisoner-svg-close-v1084.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/prisoner-svg-close-v1084
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build v1.0.84 candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'gh pr comment 257 --body "The automated v1.0.84 prisoner SVG close builder failed before committing a candidate. The branch remains draft and production is unchanged." || true' ERR

          python3 scripts/temporary-build-prisoner-svg-close-v1084.py

          git rm -f --ignore-unmatch \
            .github/workflows/temporary-prisoner-svg-close-v1084.yml \
            scripts/temporary-build-prisoner-svg-close-v1084.mjs \
            scripts/temporary-build-prisoner-svg-close-v1084.py \
            diagnostics/prisoner-close-current.txt \
            diagnostics/branch-create-request.txt

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix prisoner result SVG close control'
          git push origin HEAD:fix/prisoner-svg-close-v1084

          gh pr comment 257 --body "Built the clean Command Nexus 1.0.84 / Mission Finder V10.6.144 candidate. The Vue/Font Awesome xmark marker now resolves to its live interactive parent, retries reacquire current DOM nodes, every permanent regression passed, repository integrity passed, and all temporary diagnostics/build files were removed." || true
