name: Temporary tail v1.0.3 repair log

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  actions: read
  contents: read

jobs:
  tail-log:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/trigger-publish-v1.0.3'
    runs-on: ubuntu-latest

    steps:
      - name: Download and tail failed repair log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            if gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/jobs/88250908418/logs" \
              > /tmp/repair.log; then
              tail -n 80 /tmp/repair.log
              exit 0
            fi
            sleep 10
          done

          echo 'Unable to download the failed repair job log after retries.'
          exit 1
