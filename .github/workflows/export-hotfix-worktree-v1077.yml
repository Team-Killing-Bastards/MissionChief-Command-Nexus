name: Export v1.0.77 hotfix worktree

on:
  pull_request:
    paths:
      - '.github/workflows/export-hotfix-worktree-v1077.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Package repository worktree
        run: tar --exclude=.git -czf /tmp/command-nexus-v1077-worktree.tar.gz .

      - name: Upload worktree
        uses: actions/upload-artifact@v4
        with:
          name: command-nexus-v1077-worktree
          path: /tmp/command-nexus-v1077-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
