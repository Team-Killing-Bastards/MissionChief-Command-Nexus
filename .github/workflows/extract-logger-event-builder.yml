name: Extract logger event builder context

on:
  push:
    branches:
      - fix/mission-generation-and-journey-capture
    paths:
      - .github/workflows/extract-logger-event-builder.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mission-generation-and-journey-capture
          fetch-depth: 0

      - name: Extract source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/missionchief-command-nexus.user.js')
          source = path.read_text(encoding='utf-8')

          def function_body_start(start):
              paren = source.find('(', start)
              depth = 0
              quote = None
              escaped = False
              i = paren
              while i < len(source):
                  ch = source[i]
                  if quote:
                      if escaped: escaped = False
                      elif ch == '\\': escaped = True
                      elif ch == quote: quote = None
                      i += 1
                      continue
                  if ch in ('\"', "'", '`'):
                      quote = ch
                  elif ch == '(':
                      depth += 1
                  elif ch == ')':
                      depth -= 1
                      if depth == 0:
                          return source.find('{', i)
                  i += 1
              return -1

          def extract(name):
              marker = f'function {name}('
              start = source.find(marker)
              if start < 0: return f'### {name}\nMISSING\n'
              brace = function_body_start(start)
              if brace < 0: return f'### {name}\nNO BODY\n'
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(source):
                  ch = source[i]
                  nxt = source[i+1] if i+1 < len(source) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if ch == '*' and nxt == '/': block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escaped: escaped = False
                      elif ch == '\\': escaped = True
                      elif ch == quote: quote = None
                      i += 1; continue
                  if ch == '/' and nxt == '/': line_comment = True; i += 2; continue
                  if ch == '/' and nxt == '*': block_comment = True; i += 2; continue
                  if ch in ('\"', "'", '`'): quote = ch; i += 1; continue
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return f'### {name}\n{source[start:i+1]}\n'
                  i += 1
              return f'### {name}\nUNBOUNDED\n'

          names = [
              'createMissionLoggerEvent',
              'getMissionLoggerOwnership',
              'getMissionLoggerMissionSnapshot',
              'getMissionLoggerSameOriginWindows',
              'getMissionLoggerCacheRecord',
              'queueMissionLoggerEvent',
              'startMissionFinderObserver',
              'stopMissionLoggerSyncTimer',
              'disconnectMissionLoggerBrowser',
              'installMissionFinderRuntimeCleanup',
              'scheduleMissionFinderMutationWork',
              'flushMissionFinderMutationWork'
          ]
          out = [extract(name) for name in names]

          lines = source.splitlines()
          for token in [
              'const MF_MISSION_LOGGER_CLIENT_VERSION',
              'let mfMissionLoggerEnabled',
              'startMissionFinderObserver();',
              'missionMarkerAdd',
              'MF_IS_TOP_WINDOW'
          ]:
              out.append(f'### CONTEXT {token}')
              for idx, line in enumerate(lines):
                  if token not in line: continue
                  lo, hi = max(0, idx-12), min(len(lines), idx+20)
                  out.extend(f'{n+1:06d}: {lines[n]}' for n in range(lo, hi))

          Path('logger-event-builder-snapshot.txt').write_text(
              '\n\n'.join(out) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit snapshot
        shell: bash
        run: |
          rm .github/workflows/extract-logger-event-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract logger event builder context"
          git push origin HEAD:fix/mission-generation-and-journey-capture
