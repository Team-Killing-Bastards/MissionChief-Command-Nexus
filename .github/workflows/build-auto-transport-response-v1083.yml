name: Build faster Auto Mode transport v1.0.83

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/build-auto-transport-response-v1083')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Resolve pull request branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_BRANCH="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)"
          test "$HEAD_BRANCH" = 'fix/faster-auto-transport-v1083'
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply bounded patient and prisoner response improvements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          SOURCE = Path('src/missionchief-command-nexus.user.js')
          source = SOURCE.read_text(encoding='utf-8')

          def replace_exact(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} match(es), found {count}')
              return text.replace(old, new)

          def function_span(text, name):
              match = re.search(rf'(?m)^\s*(?:async\s+)?function\s+{re.escape(name)}\s*\(', text)
              if not match:
                  raise SystemExit(f'Unable to locate function {name}')
              brace = text.find('{', match.end())
              if brace < 0:
                  raise SystemExit(f'Unable to locate opening brace for {name}')
              depth = 0
              state = 'code'
              quote = ''
              escaped = False
              index = brace
              while index < len(text):
                  char = text[index]
                  nxt = text[index + 1] if index + 1 < len(text) else ''
                  if state == 'line-comment':
                      if char == '\n': state = 'code'
                  elif state == 'block-comment':
                      if char == '*' and nxt == '/':
                          state = 'code'
                          index += 1
                  elif state == 'string':
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          state = 'code'
                  else:
                      if char == '/' and nxt == '/':
                          state = 'line-comment'
                          index += 1
                      elif char == '/' and nxt == '*':
                          state = 'block-comment'
                          index += 1
                      elif char in ('\'', '"', '`'):
                          state = 'string'
                          quote = char
                      elif char == '{':
                          depth += 1
                      elif char == '}':
                          depth -= 1
                          if depth == 0:
                              return match.start(), index + 1
                  index += 1
              raise SystemExit(f'Unable to locate closing brace for {name}')

          # Patient transport: keep the shared duplicate-click guard, but shorten
          # its bounded suppression window and the Vue/iframe retry pause.
          source = replace_exact(
              source,
              'if (Date.now() - mfTransportLastClickAt < 4000) return false;',
              'if (Date.now() - mfTransportLastClickAt < 2500) return false;',
              2,
              'patient shared click guard'
          )
          source = replace_exact(
              source,
              'if (fingerprint && fingerprint === mfLastTransportFingerprint && now - mfLastTransportClickAt < 4000) {',
              'if (fingerprint && fingerprint === mfLastTransportFingerprint && now - mfLastTransportClickAt < 2500) {',
              1,
              'patient fingerprint click guard'
          )
          source = replace_exact(
              source,
              '                    await wait(1800);\n                    continue;',
              '                    await wait(900);\n                    continue;',
              1,
              'patient Vue/iframe retry wait'
          )

          # Prisoner transport: retain all fail-closed maximum timeouts, while
          # checking the live destination/result DOM more promptly and allowing
          # guarded failed-click retries sooner.
          source = replace_exact(
              source,
              'const MF_AUTO_PRISONER_CELL_CLICK_RETRY_MS = 6500;',
              'const MF_AUTO_PRISONER_CELL_CLICK_RETRY_MS = 4000;',
              1,
              'prisoner cell click retry guard'
          )
          source = replace_exact(
              source,
              'const MF_AUTO_PRISONER_RELEASE_CLICK_RETRY_MS = 6500;',
              'const MF_AUTO_PRISONER_RELEASE_CLICK_RETRY_MS = 4000;',
              1,
              'prisoner release click retry guard'
          )

          start, end = function_span(source, 'handleAutoPrisonerCellBeforeUnitFinder')
          block = source[start:end]
          block = replace_exact(
              block,
              '        await wait(250);',
              '        await wait(125);',
              1,
              'prisoner destination polling'
          )
          source = source[:start] + block + source[end:]

          start, end = function_span(source, 'closeAutoPrisonerReleaseDismissAfterClick')
          block = source[start:end]
          block = replace_exact(
              block,
              '        await wait(200);',
              '        await wait(100);',
              2,
              'prisoner result/dismiss polling'
          )
          block = replace_exact(
              block,
              '        await wait(480);',
              '        await wait(250);',
              1,
              'prisoner close retry wait'
          )
          source = source[:start] + block + source[end:]

          # Versioned production baseline.
          source = replace_exact(
              source,
              '// @version      1.0.82',
              '// @version      1.0.83',
              1,
              'userscript version'
          )
          source = replace_exact(
              source,
              ' * MODULE 2: MISSION FINDER V10.6.142',
              ' * MODULE 2: MISSION FINDER V10.6.143',
              1,
              'Mission Finder engine header'
          )
          SOURCE.write_text(source, encoding='utf-8')

          # Keep permanent checks aligned with the new production baseline.
          for check in Path('scripts').glob('check-*.mjs'):
              text = check.read_text(encoding='utf-8')
              text = text.replace('// @version      1.0.82', '// @version      1.0.83')
              text = text.replace('V10.6.142', 'V10.6.143')
              check.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = replace_exact(
              text,
              '**Current version:** `1.0.82` · **Mission Finder engine:** `V10.6.142`',
              '**Current version:** `1.0.83` · **Mission Finder engine:** `V10.6.143`',
              1,
              'README version baseline'
          )
          readme.write_text(text, encoding='utf-8')

          source_readme = Path('src/README.md')
          text = source_readme.read_text(encoding='utf-8')
          text = replace_exact(text, '| Command Nexus version | `1.0.82` |', '| Command Nexus version | `1.0.83` |', 1, 'source README version')
          text = replace_exact(text, '| Mission Finder baseline | `V10.6.142` |', '| Mission Finder baseline | `V10.6.143` |', 1, 'source README engine')
          source_readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if '## [1.0.83] - 2026-08-05' not in text:
              section = '''## [1.0.83] - 2026-08-05

### Changed

- Patient transport keeps the existing exact-route, iframe and duplicate-click safeguards while reducing the shared repeat-click window from 4.0 seconds to 2.5 seconds.
- A stalled patient **Transport Patient / Approach** attempt now retries the live Vue/iframe state after 0.9 seconds instead of 1.8 seconds.
- Prisoner cell and release destination discovery now polls the live result UI at 100-125 ms rather than 200-250 ms.
- Verified prisoner-result close retries now run after 250 ms instead of 480 ms, and guarded failed-click retries become eligible after 4 seconds instead of 6.5 seconds.

### Safety

- Exact patient and prisoner routes, nearest valid destination selection, pending-state hand-off, result-screen identity, duplicate-click protection and fail-closed maximum timeouts remain unchanged.
- Unit Finder remains blocked while patient or prisoner transport ownership is unresolved.

### Changed engine baseline

- Mission Finder increased from `V10.6.142` to `V10.6.143`.

'''
              marker = '## [1.0.82]'
              index = text.find(marker)
              if index < 0:
                  raise SystemExit('v1.0.82 changelog section missing')
              text = text[:index] + section + text[index:]
          changelog.write_text(text, encoding='utf-8')

          regression = Path('scripts/check-auto-transport-response-v1083.mjs')
          regression.write_text(r'''#!/usr/bin/env node
import { readFile } from 'node:fs/promises';

const source = await readFile('src/missionchief-command-nexus.user.js', 'utf8');
const fail = message => { console.error(`ERROR: ${message}`); process.exit(1); };

function requireText(token, label) {
  if (!source.includes(token)) fail(`Missing faster Auto Mode transport contract: ${label}`);
}

function extractFunction(name) {
  const pattern = new RegExp(`^\\s*(?:async\\s+)?function\\s+${name}\\s*\\(`, 'm');
  const match = pattern.exec(source);
  if (!match) fail(`Unable to locate function ${name}`);
  const start = match.index;
  const rest = source.slice(start + match[0].length);
  const next = /^\\s*(?:async\\s+)?function\\s+[A-Za-z0-9_$]+\\s*\\(/m.exec(rest);
  if (!next) fail(`Unable to locate end of function ${name}`);
  return source.slice(start, start + match[0].length + next.index);
}

for (const [token, label] of [
  ['// @version      1.0.83', 'v1.0.83 metadata'],
  ['MISSION FINDER V10.6.143', 'Mission Finder V10.6.143'],
  ['function mfIsExactPatientTransportAnchor(', 'exact patient route guard'],
  ['function mfFindExactPatientTransportAnchorDeep(', 'iframe-aware patient finder'],
  ['const MF_AUTO_PRISONER_CELL_DESTINATION_WAIT_MS = 8000;', 'cell maximum wait retained'],
  ['const MF_AUTO_PRISONER_RELEASE_RESULT_WAIT_MS = 10000;', 'release result maximum wait retained'],
  ['const MF_AUTO_PRISONER_RELEASE_DISMISS_WAIT_MS = 8000;', 'dismiss maximum wait retained'],
  ['const MF_AUTO_PRISONER_RELEASE_DISMISS_CLOSE_WAIT_MS = 8000;', 'dismiss close maximum wait retained'],
  ['const MF_AUTO_PRISONER_CELL_CLICK_RETRY_MS = 4000;', 'cell failed-click retry'],
  ['const MF_AUTO_PRISONER_RELEASE_CLICK_RETRY_MS = 4000;', 'release failed-click retry'],
]) requireText(token, label);

const exactClick = extractFunction('clickExactApproachTransportButton');
const bruteClick = extractFunction('mfBruteClickFirstApproach');
for (const [block, label] of [[exactClick, 'exact patient click'], [bruteClick, 'brute patient click']]) {
  if (!block.includes('Date.now() - mfTransportLastClickAt < 2500')) fail(`${label} does not use the 2.5 second shared guard`);
  if (block.includes('mfTransportLastClickAt < 4000')) fail(`${label} retained the old 4 second guard`);
}
if (!exactClick.includes('now - mfLastTransportClickAt < 2500')) fail('Patient fingerprint guard was not reduced to 2.5 seconds');

const retryMessage = source.indexOf('Approach found but click helper did not click yet; waiting for Vue/iframe update.');
if (retryMessage < 0) fail('Unable to locate patient Vue/iframe retry path');
const retryWindow = source.slice(retryMessage, retryMessage + 500);
if (!retryWindow.includes('await wait(900);')) fail('Patient Vue/iframe retry wait is not 900 ms');
if (retryWindow.includes('await wait(1800);')) fail('Patient Vue/iframe retry retained the old 1800 ms delay');

const cellGate = extractFunction('handleAutoPrisonerCellBeforeUnitFinder');
if (!cellGate.includes('await wait(125);')) fail('Prisoner cell destination polling is not 125 ms');
if (cellGate.includes('await wait(250);')) fail('Prisoner cell destination polling retained 250 ms');

const dismiss = extractFunction('closeAutoPrisonerReleaseDismissAfterClick');
const fastPolls = dismiss.match(/await wait\(100\);/g) || [];
if (fastPolls.length !== 2) fail(`Expected two 100 ms prisoner result polls, found ${fastPolls.length}`);
if (dismiss.includes('await wait(200);')) fail('Prisoner result polling retained 200 ms');
if (!dismiss.includes('await wait(250);')) fail('Prisoner close retry is not 250 ms');
if (dismiss.includes('await wait(480);')) fail('Prisoner close retry retained 480 ms');

for (const token of [
  'getActivePrisonerCellSelectionContext()',
  'getTopmostAutoPrisonerReleaseDismissContext(',
  'resolveAutoPrisonerReleaseDismissContext(',
  'isAutoPrisonerReleaseDismissContextVisible(',
  'realClickForQueueRestart(current.closeButton);',
]) {
  if (!dismiss.includes(token)) fail(`Prisoner dismiss safety contract changed: ${token}`);
}

console.log('Auto Mode transport response contracts passed: patient retries and prisoner UI polling are faster while route identity, ownership, duplicate-click guards and fail-closed timeouts remain intact.');
''', encoding='utf-8')

          workflow = Path('.github/workflows/validate-userscript.yml')
          text = workflow.read_text(encoding='utf-8')
          path_marker = "      - '.github/workflows/validate-userscript.yml'"
          if 'scripts/check-auto-transport-response-v1083.mjs' not in text:
              if text.count(path_marker) != 2:
                  raise SystemExit('validation path marker count mismatch')
              text = text.replace(path_marker, "      - 'scripts/check-auto-transport-response-v1083.mjs'\n" + path_marker)
              run_marker = '      - name: Require a version increase when code changes\n'
              if text.count(run_marker) != 1:
                  raise SystemExit('validation run marker mismatch')
              step = "      - name: Validate faster patient and prisoner transport response\n        run: node scripts/check-auto-transport-response-v1083.mjs\n\n"
              text = text.replace(run_marker, step + run_marker, 1)
          workflow.write_text(text, encoding='utf-8')

          marker = Path('.diagnostics/faster-auto-transport-v1083.md')
          if marker.exists(): marker.unlink()
          PY

          git diff --check

      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          for check in scripts/check-*.mjs; do
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Push validated candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_BRANCH: ${{ steps.pr.outputs.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Speed up Auto Mode patient and prisoner transport'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
          SHA="$(git rev-parse HEAD)"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title 'Speed up Auto Mode patient and prisoner transport' --body "## Objective\n\nMake Auto Mode react faster when clicking patient and prisoner transport controls without weakening exact destination, ownership or duplicate-click safeguards.\n\n## Changes\n\n- Patient repeat-click guard: 4.0s -> 2.5s.\n- Patient Vue/iframe retry wait: 1.8s -> 0.9s.\n- Prisoner destination/result polling: 200-250ms -> 100-125ms.\n- Prisoner verified close retry: 480ms -> 250ms.\n- Guarded failed prisoner click retry: 6.5s -> 4.0s.\n\n## Safety retained\n\nExact patient/prisoner routes, nearest valid destination selection, pending-state hand-off, result-screen identity, Unit Finder blocking, duplicate-click guards and fail-closed maximum timeouts remain authoritative.\n\n## Release\n\n- Command Nexus \`1.0.83\`\n- Mission Finder \`V10.6.143\`\n- Permanent regression: \`scripts/check-auto-transport-response-v1083.mjs\`\n\nEvery permanent regression, syntax, userscript validation, repository integrity and whitespace check passed.\n\nValidated commit: \`${SHA}\`."
