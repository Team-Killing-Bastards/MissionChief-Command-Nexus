name: Emergency station overlay source export

on:
  pull_request:
    paths:
      - '.github/workflows/emergency-station-overlay-source-export.yml'
      - 'src/missionchief-command-nexus.user.js'
      - '.github/builders/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Upload exact userscript source
        uses: actions/upload-artifact@v4
        with:
          name: emergency-station-overlay-source
          path: src/missionchief-command-nexus.user.js
          if-no-files-found: error
          retention-days: 1
