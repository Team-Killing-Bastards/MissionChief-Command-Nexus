name: Temporary patient transfer drawer builder

on:
  push:
    branches:
      - agent/patient-transfer-drawer

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build Patient Transfers release candidate
        run: python3 tmp/build_patient_transfer_drawer.py

      - name: Remove one-use builder controls
        run: |
          rm -f tmp/build_patient_transfer_drawer.py
          rm -f .github/workflows/tmp-patient-transfer-drawer-builder.yml

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_workflow_yaml.py
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v1.1.7 patient transfer drawer"
          git push origin HEAD:agent/patient-transfer-drawer
