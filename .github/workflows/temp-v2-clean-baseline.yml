name: Temporary V2 clean baseline builder

on:
  push:
    branches:
      - agent/v2-clean-baseline
    paths:
      - '.github/workflows/temp-v2-clean-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out clean V2 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build V2 from exact v1.0.127 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          BASE = '298e08bf003d6c7ddd489ec45fd488a0d381245e'
          script_path = Path('src/missionchief-command-nexus.user.js')
          code = script_path.read_text(encoding='utf-8')
          old = '// @version      1.0.127'
          new = '// @version      2.0.0'
          if code.count(old) != 1:
              raise SystemExit(f'Expected exactly one v1.0.127 metadata line, found {code.count(old)}')
          code = code.replace(old, new, 1)
          script_path.write_text(code, encoding='utf-8')

          current_docs = [
              Path('README.md'),
              Path('src/README.md'),
              Path('docs/DEVELOPER_HANDOFF.md'),
              Path('docs/ARCHITECTURE.md'),
              Path('docs/ROADMAP.md'),
              Path('docs/MIGRATION.md'),
              Path('docs/README.md'),
          ]
          for path in current_docs:
              text = path.read_text(encoding='utf-8')
              if '1.0.127' not in text:
                  raise SystemExit(f'{path} does not contain the expected current 1.0.127 baseline')
              path.write_text(text.replace('1.0.127', '2.0.0'), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '**Current version:** `2.0.0`'
          if marker not in text:
              raise SystemExit('README current-version marker was not updated')
          note = ('\n\n> **V2 clean baseline:** `2.0.0` deliberately resets production to the proven '
                  '`1.0.127` operational code. Mission Analytics, Sharing & Sync, Google Apps Script '
                  'uploading, external telemetry and the later `1.1.x` logger line are not part of V2.\n')
          line_end = text.find('\n', text.index(marker))
          text = text[:line_end] + note + text[line_end:]
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = '## [1.0.127] - 2026-08-16'
          if text.count(anchor) != 1:
              raise SystemExit('Expected exactly one v1.0.127 changelog anchor')
          section = '''## [2.0.0] - 2026-08-19

### Changed

- Reset the production line to the exact proven Command Nexus `1.0.127` operational baseline and promoted that code to the new major `2.0.0` release line.
- Deliberately abandoned the Mission Analytics / Sharing & Sync / Google Apps Script logger work introduced after `1.0.127`. V2 contains no external analytics uploader, logger outbox, activity recorder, hard-coded Apps Script endpoint or logger backend integration.
- Preserved Mission Finder `V10.6.164`, Resource Administration `V4.2.8`, Unit Naming `3.3.27`, Station Naming `1.3.22` and Personnel Assignment `1.3.12` from the proven rollback baseline.

### Safety

- Added a permanent `check-no-external-logger-v200.mjs` regression so the abandoned logger stack cannot silently return to the canonical userscript or repository integration paths.
- Historical `1.1.x` commits, tags and releases remain historical records only; they are not part of the V2 production source.

'''
          text = text.replace(anchor, section + anchor, 1)
          changelog.write_text(text, encoding='utf-8')
          PY

          cat > scripts/check-no-external-logger-v200.mjs <<'EOF'
          #!/usr/bin/env node
          import fs from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const scriptPath = path.join(root, 'src', 'missionchief-command-nexus.user.js');
          const code = fs.readFileSync(scriptPath, 'utf8');

          const forbiddenSourceSignatures = [
            'script.google.com',
            'script.googleusercontent.com',
            'Mission Analytics',
            'Sharing & Sync',
            'missionAnalytics',
            'MISSION_ANALYTICS',
            'activity recorder',
          ];

          const sourceHits = forbiddenSourceSignatures.filter((signature) =>
            code.toLowerCase().includes(signature.toLowerCase())
          );
          if (sourceHits.length) {
            throw new Error(`V2 must not contain the abandoned external logger stack: ${sourceHits.join(', ')}`);
          }

          const forbiddenPaths = [
            'integrations/google-apps-script',
            'integrations/google-app-script',
          ];
          const pathHits = forbiddenPaths.filter((relative) => fs.existsSync(path.join(root, relative)));
          if (pathHits.length) {
            throw new Error(`V2 must not restore logger backend integration paths: ${pathHits.join(', ')}`);
          }

          const metadataMatch = code.match(/^\/\/\s+@version\s+(\S+)\s*$/m);
          if (!metadataMatch || metadataMatch[1] !== '2.0.0') {
            throw new Error(`Expected clean V2 metadata version 2.0.0; found ${metadataMatch?.[1] ?? 'none'}`);
          }

          console.log('V2 external logger exclusion check passed.');
          EOF

      - name: Validate exact V2 candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs --base-ref 298e08bf003d6c7ddd489ec45fd488a0d381245e
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          python3 scripts/check_workflow_yaml.py
          git diff --check

      - name: Commit clean V2 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/missionchief-command-nexus.user.js README.md src/README.md CHANGELOG.md \
            docs/DEVELOPER_HANDOFF.md docs/ARCHITECTURE.md docs/ROADMAP.md docs/MIGRATION.md docs/README.md \
            scripts/check-no-external-logger-v200.mjs
          git commit -m 'Release v2.0.0 clean pre-logger baseline'
          git push origin HEAD:agent/v2-clean-baseline
