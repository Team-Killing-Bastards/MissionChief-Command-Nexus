name: Build v1.0.95 automatic station refresh candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and validate v1.0.95
    if: >-
      github.event.pull_request.head.ref == 'ux/dispatch-centre-auto-station-refresh-v1095' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: ux/dispatch-centre-auto-station-refresh-v1095
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f scripts/build-v1095-auto-station-refresh.py ]]; then
            echo 'Candidate already built; no one-use builder remains.'
            exit 0
          fi

          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "dc34b9791efe19dd230995de1d36cd506d6b1498"

          python3 scripts/build-v1095-auto-station-refresh.py
          rm -f scripts/build-v1095-auto-station-refresh.py

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-naming-dispatch-centre-auto-station-refresh-v1095.mjs
          for check in scripts/check-*.mjs; do
            echo "Running $check"
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Auto-refresh stations after Dispatch Centre selection in v1.0.95'
          git push origin HEAD:ux/dispatch-centre-auto-station-refresh-v1095
