name: Build mission-definition trained personnel v1.0.54

on:
  push:
    branches:
      - agent/mission-definition-trained-personnel-v1054

permissions:
  contents: write

concurrency:
  group: mission-definition-trained-personnel-v1054
  cancel-in-progress: false

jobs:
  build:
    if: github.event.head_commit.message == 'Run mission definition trained personnel builder'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: agent/mission-definition-trained-personnel-v1054
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply mission-definition trained-personnel change
        env:
          PATCH_B64: 
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > scripts/apply-mission-definition-trained-personnel-v1054.py
          python3 scripts/apply-mission-definition-trained-personnel-v1054.py
          git diff --check

      - name: Validate complete candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          for test in scripts/check-*.mjs; do
            echo "Running ${test}"
            node "$test"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit and push validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Use mission definition trained personnel in Unit Finder'
          git push origin HEAD:refs/heads/agent/mission-definition-trained-personnel-v1054
          echo "Validated commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
