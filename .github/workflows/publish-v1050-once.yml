name: Finalize verified v1.0.50 receipt

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-v1.0.50-receipt
  cancel-in-progress: false

jobs:
  receipt:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/publish-v1050'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Record final published receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_TAG: v1.0.50
          RELEASE_SHA: 3a8351b15bdd61f393195f3f72f80f2fc65ca249
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          ASSET='MissionChief-Command-Nexus-1.0.50.user.js'
          CHECKSUM_ASSET="${ASSET}.sha256"
          gh release view "${RELEASE_TAG}" \
            --json url,isDraft,isPrerelease,assets > /tmp/v1050-release.json

          [[ "$(jq -r '.isDraft' /tmp/v1050-release.json)" == 'false' ]]
          [[ "$(jq -r '.isPrerelease' /tmp/v1050-release.json)" == 'false' ]]
          RELEASE_URL="$(jq -r '.url' /tmp/v1050-release.json)"

          for name in "${ASSET}" "${CHECKSUM_ASSET}"; do
            COUNT="$(jq -r --arg name "${name}" '[.assets[] | select(.name == $name)] | length' /tmp/v1050-release.json)"
            [[ "${COUNT}" == '1' ]]
          done

          RECEIPT_COUNT="$(
            jq -r '[.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.50-"))] | length' \
              /tmp/v1050-release.json
          )"
          [[ "${RECEIPT_COUNT}" == '1' ]]
          RECEIPT_NAME="$(
            jq -r '.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.50-")) | .name' \
              /tmp/v1050-release.json
          )"

          TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          [[ "${TAG_SHA}" == "${RELEASE_SHA}" ]]

          rm -rf /tmp/v1050-release-check
          mkdir -p /tmp/v1050-release-check
          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${CHECKSUM_ASSET}" \
            --dir /tmp/v1050-release-check \
            --clobber
          (
            cd /tmp/v1050-release-check
            sha256sum -c "${CHECKSUM_ASSET}"
          )

          git show "${TAG_SHA}:src/missionchief-command-nexus.user.js" > /tmp/v1050-expected.user.js
          cmp --silent /tmp/v1050-expected.user.js "/tmp/v1050-release-check/${ASSET}"
          CHECKSUM="$(sha256sum /tmp/v1050-expected.user.js | awk '{print $1}')"

          cat > /tmp/v1050-receipt.md <<EOF
          ## v1.0.50 release verified

          - GitHub release: ${RELEASE_URL}
          - GitHub userscript and checksum assets: verified
          - Greasy Fork: exact source parity verified by the successful permanent release workflow
          - Discord: one delivery receipt confirmed as \`${RECEIPT_NAME}\`
          - Source commit: \`${TAG_SHA}\`
          - SHA-256: \`${CHECKSUM}\`
          EOF

          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/v1050-receipt.md
          gh pr close "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --comment 'v1.0.50 was published and verified across GitHub, Greasy Fork and Discord.'
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/release/publish-v1050" || true
