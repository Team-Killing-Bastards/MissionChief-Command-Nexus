name: Publish and verify v1.0.53

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-v1.0.53-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'release/publish-v1053'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Create or verify clean v1.0.53 tag
        env:
          CLEAN_SHA: f5b981d810bf2cd0b0148d6e93eef9089262de73
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          VERSION="$(git show "${CLEAN_SHA}:src/missionchief-command-nexus.user.js" | sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' | head -n1 | xargs)"
          test "$VERSION" = '1.0.53'
          test -z "$(git ls-tree -r --name-only "$CLEAN_SHA" | grep -E '^\.github/workflows/(publish-v1053-once|run-auto-patient-transport-v1053|build-auto-patient-transport-v1053)' || true)"
          if git show-ref --tags --verify --quiet refs/tags/v1.0.53; then
            test "$(git rev-list -n1 v1.0.53)" = "$CLEAN_SHA"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a v1.0.53 "$CLEAN_SHA" -m 'MissionChief Command Nexus 1.0.53'
            git push origin refs/tags/v1.0.53
          fi
      - name: Validate immutable tagged source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-source
          git worktree add --force --detach release-source v1.0.53
          cd release-source
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-auto-patient-transport-anchor.mjs
          node scripts/check-auto-patient-transport-iframe.mjs
          python3 scripts/check_repository.py
      - name: Build release assets and notes
        shell: bash
        run: |
          set -euo pipefail
          ASSET='MissionChief-Command-Nexus-1.0.53.user.js'
          cp release-source/src/missionchief-command-nexus.user.js "$ASSET"
          sha256sum "$ASSET" > "${ASSET}.sha256"
          python3 - <<'PY'
          import re
          from pathlib import Path
          changelog=Path('release-source/CHANGELOG.md').read_text(encoding='utf-8')
          match=re.search(r'^## \[1\.0\.53\].*?$(.*?)(?=^## |\Z)',changelog,re.M|re.S)
          if not match: raise SystemExit('Missing v1.0.53 changelog section')
          checksum=Path('MissionChief-Command-Nexus-1.0.53.user.js.sha256').read_text().split()[0]
          Path('release-notes.md').write_text('## Mission Brief\n\n'+match.group(1).strip()+'\n\n## Build Verification\n\n- Source commit: `f5b981d810bf2cd0b0148d6e93eef9089262de73`\n- SHA-256: `'+checksum+'`\n',encoding='utf-8')
          PY
      - name: Reconcile and publish GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-release.mjs \
            --tag v1.0.53 \
            --target f5b981d810bf2cd0b0148d6e93eef9089262de73 \
            --title 'MissionChief Command Nexus 1.0.53' \
            --notes release-notes.md \
            --asset MissionChief-Command-Nexus-1.0.53.user.js \
            --asset MissionChief-Command-Nexus-1.0.53.user.js.sha256
      - name: Independently verify assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-check && mkdir release-check
          gh release view v1.0.53 --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false) | .url'
          gh release download v1.0.53 --repo "$GITHUB_REPOSITORY" \
            --pattern 'MissionChief-Command-Nexus-1.0.53.user.js' \
            --pattern 'MissionChief-Command-Nexus-1.0.53.user.js.sha256' \
            --dir release-check --clobber
          cmp --silent MissionChief-Command-Nexus-1.0.53.user.js release-check/MissionChief-Command-Nexus-1.0.53.user.js
          cmp --silent MissionChief-Command-Nexus-1.0.53.user.js.sha256 release-check/MissionChief-Command-Nexus-1.0.53.user.js.sha256
          cd release-check && sha256sum -c MissionChief-Command-Nexus-1.0.53.user.js.sha256
      - name: Verify deployment and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          GREASYFORK_PAGE_URL: ${{ vars.GREASYFORK_PAGE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: v1.0.53
          RELEASE_SHA: f5b981d810bf2cd0b0148d6e93eef9089262de73
          SOURCE_PATH: release-source/src/missionchief-command-nexus.user.js
          CHANGELOG_PATH: release-source/CHANGELOG.md
          PRODUCT_NAME: MissionChief Command Nexus
        run: node scripts/release-notify.mjs
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_STATUS: ${{ job.status }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "v1.0.53 publication completed with status: ${JOB_STATUS}."
