name: Apply v1.0.23 summer collectible collector

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-v1023-summer-collector
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/v1023-summer-collector'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply summer collectible collector
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          (
            python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_v1023_summer_collectibles.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          release_start = next(
              (index for index, line in enumerate(lines)
               if line.startswith('release_anchor = source.find(')),
              None,
          )
          if release_start is None:
              raise SystemExit('Stale release-note block start was not found')

          release_end = next(
              (index for index in range(release_start, len(lines))
               if lines[index].startswith('source = source[:release_anchor]')),
              None,
          )
          if release_end is None:
              raise SystemExit('Stale release-note block end was not found')

          del lines[release_start:release_end + 1]

          guard_start = next(
              (index for index, line in enumerate(lines)
               if line.startswith('module_tail = source[module_index:]')),
              None,
          )
          if guard_start is None:
              raise SystemExit('Old guard-matching block start was not found')

          guard_end = next(
              (index for index in range(guard_start, len(lines))
               if lines[index].startswith('insert_at = module_index + guard_match.end(')),
              None,
          )
          if guard_end is None:
              raise SystemExit('Old guard-matching block end was not found')

          replacement = [
              "module_tail = source[module_index:]\n",
              "first_mission_finder_constant = re.search(\n",
              "    r\"\\n\\s*const\\s+MF_[A-Z0-9_]+\\s*=\",\n",
              "    module_tail,\n",
              ")\n",
              "if not first_mission_finder_constant:\n",
              "    raise SystemExit(\"First Mission Finder constant was not found\")\n",
              "\n",
              "insert_at = module_index + first_mission_finder_constant.start()\n",
          ]
          lines[guard_start:guard_end + 1] = replacement
          text = ''.join(lines)

          collector_anchor = "collector = r'''\n"
          collector_note = (
              "collector = r'''\n"
              "\n"
              "    // V10.6.88: visible seasonal mission collectibles, including the\n"
              "    // summer sunflower item, are claimed through MissionChief's exact\n"
              "    // claim_found_object_sync route without navigating away from the mission.\n"
          )
          if text.count(collector_anchor) != 1:
              raise SystemExit('Summer collector insertion block was not unique')

          text = text.replace(collector_anchor, collector_note, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

            python3 scripts/apply_v1023_summer_collectibles.py
          ) > /tmp/v1023-apply.log 2>&1
          status=$?
          cat /tmp/v1023-apply.log
          if [[ ${status} -ne 0 ]]; then
            {
              echo 'v1.0.23 transformation failed:'
              echo '```text'
              tail -n 80 /tmp/v1023-apply.log
              echo '```'
            } > /tmp/v1023-comment.md
            gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/v1023-comment.md || true
            exit "${status}"
          fi

      - name: Remove one-use build files
        run: |
          git rm -f scripts/apply_v1023_summer_collectibles.py
          git rm -f .github/workflows/apply-v1023-summer-collector.yml

      - name: Validate complete repository
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          python3 scripts/check_repository.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          required = {
              'version': '// @version      1.0.23',
              'Mission Finder': ' * MODULE 2: MISSION FINDER V10.6.88',
              'collector selector': 'MF_EVENT_COLLECTIBLE_SELECTOR',
              'exact element id': "link.id !== 'easter-egg-link'",
              'exact claim route': 'claim_found_object_sync',
              'same-origin request': "credentials: 'same-origin'",
              'no-navigation request': "await fetch(",
              'collector start': 'startMissionEventCollectibleCollector();',
          }
          missing = [name for name, token in required.items() if token not in source]
          if missing:
              raise SystemExit('Missing v1.0.23 contracts: ' + ', '.join(missing))

          if source.count('const MF_EVENT_COLLECTIBLE_SELECTOR =') != 1:
              raise SystemExit('Seasonal collectible collector must exist exactly once')
          if source.count('new MutationObserver(') != 2:
              raise SystemExit('The collector must not add a third permanent MutationObserver')
          if '/^\\/missions\\/(\\d+)\\/claim_found_object_sync' not in source:
              raise SystemExit('Exact mission collectible claim-route validation is missing')

          print('Focused v1.0.23 seasonal collectible contracts passed.')
          PY

      - name: Push validated update
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIGGER_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Collect seasonal mission items automatically'
          git push origin HEAD:main
          gh pr close "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --comment 'v1.0.23 validated and pushed to main.' || true
          git push origin --delete "${TRIGGER_BRANCH}" || true
