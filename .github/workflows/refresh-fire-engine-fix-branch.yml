name: Refresh Fire Engine fix branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fire-engine-update-type-guard-ui-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/fire-engine-update-type-guard-ui-cleanup
          fetch-depth: 0
          show-progress: false

      - name: Merge current main into branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'Branch already contains current main.'
            exit 0
          fi
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git merge --no-ff origin/main -m 'Refresh Fire Engine fix branch with main'
          git push origin HEAD:agent/fire-engine-update-type-guard-ui-cleanup
