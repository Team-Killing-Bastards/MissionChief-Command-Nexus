name: One-use Mission Analytics v1.1.10 PR runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-builder:
    if: github.head_ref == 'hotfix/mission-analytics-v1.1.10'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v6
        with:
          ref: hotfix/mission-analytics-v1.1.10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Execute embedded hotfix builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/hotfix-mission-analytics-v1110.yml').read_text(encoding='utf-8')
          start_marker = "      - name: Build permanent hotfix\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Install workflow YAML parser"
          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit('Unable to isolate the embedded hotfix build step')
          block = workflow[start + len(start_marker):end]
          lines = []
          for line in block.splitlines():
              if line and not line.startswith('          '):
                  raise SystemExit(f'Unexpected builder indentation: {line!r}')
              lines.append(line[10:] if line else '')
          Path('/tmp/mission-analytics-v1110-build.sh').write_text(
              '\n'.join(lines) + '\n',
              encoding='utf-8'
          )
          PY
          bash /tmp/mission-analytics-v1110-build.sh
          rm -f .github/workflows/hotfix-mission-analytics-v1110-pr-runner.yml

      - name: Install workflow YAML parser
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_workflow_yaml.py
          python3 -m py_compile scripts/check_repository.py
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit permanent hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Hotfix runner produced no changes.' >&2
            exit 1
          fi
          git commit -m 'Hotfix Mission Analytics recorder and upload locking'
          git push origin HEAD:hotfix/mission-analytics-v1.1.10
