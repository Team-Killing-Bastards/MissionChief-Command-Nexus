name: Temporary v3.0.36 transport ownership inspection

on:
  push:
    branches:
      - hotfix/v3036-transport-owner-race

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip v3036 inspection]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract legacy transport and ownership helpers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')

          def span(name, start_at=0):
              start = source.find(f'function {name}(', start_at)
              if start < 0:
                  return None
              brace = source.find('{', start)
              depth = 0
              quote = ''
              escaped = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escaped: escaped = False
                      elif c == '\\': escaped = True
                      elif c == quote: quote = ''
                      i += 1; continue
                  if c == '/' and n == '/': line_comment = True; i += 2; continue
                  if c == '/' and n == '*': block_comment = True; i += 2; continue
                  if c in ("'", '"', '`'): quote = c; i += 1; continue
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: return start, i + 1
                  i += 1
              return None

          names = [
              'maybeAssistPatientTransport',
              'maybeAssistPrisonerTransport',
              'maybeHandleConfirmedPrisonerReleaseSuccess',
              'maybeReturnFromCompletedPrisonerDestination',
              'maybeRecoverStalledTransportContext',
              'maybeRecoverStrandedPrisonerHandoff',
              'maybeRecoverStalledNonMissionRedirect',
              'maybeFastReleaseStalePostTransportQueueGuard',
              'schedulePostTransportRehook',
              'watchWorker',
          ]
          parts = []
          for name in names:
              found = span(name)
              parts.append(f'===== {name} =====\n' + (source[found[0]:found[1]] if found else 'NOT FOUND'))
          Path('.tmp-v3036-legacy-transport-functions.txt').write_text('\n\n'.join(parts) + '\n', encoding='utf-8')

          module = source.find('MODULE 2: MISSION FINDER')
          names = [
              'isMfV3ManagedActiveFrame',
              'isMfV3ManagedActiveWorker',
              'isMfV3ManagedTransportWorker',
              'shouldKeepMissionFinderObserverForCurrentFrame',
              'startMissionFinderObserver',
              'isTransportAutomationAllowed',
              'handleTransportRequestsAfterDispatch',
              'syncBackgroundAutomationWatchers',
          ]
          parts = []
          for name in names:
              found = span(name, module)
              parts.append(f'===== {name} =====\n' + (source[found[0]:found[1]] if found else 'NOT FOUND'))
          Path('.tmp-v3036-runtime-gates.txt').write_text('\n\n'.join(parts) + '\n', encoding='utf-8')

          checks = []
          for path in sorted(Path('scripts').glob('check-*.mjs')):
              text = path.read_text(encoding='utf-8')
              if any(term in text for term in [
                  'maybeReturnFromCompletedPrisonerDestination',
                  'maybeRecoverStalledTransportContext',
                  'maybeAssistPatientTransport',
                  'maybeAssistPrisonerTransport',
                  'shouldKeepMissionFinderObserverForCurrentFrame',
                  'isTransportAutomationAllowed',
                  'return-existing-worker-after-completed-prisoner-destination',
              ]):
                  checks.append(f'===== {path} =====\n{text}')
          Path('.tmp-v3036-related-checks.txt').write_text('\n\n'.join(checks) + '\n', encoding='utf-8')
          PY

      - name: Commit final inspection maps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-v3036-*.txt
          git commit -m "Add final v3.0.36 transport maps [skip v3036 inspection]"
          git push origin HEAD:hotfix/v3036-transport-owner-race
