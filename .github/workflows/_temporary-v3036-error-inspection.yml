name: Temporary v3.0.36 ownership-race build

on:
  push:
    branches:
      - hotfix/v3036-transport-owner-race

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v3.0.36 candidate
        shell: bash
        run: |
          python3 scripts/_temporary-build-v3036-owner-race.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-v3-prisoner-handoff-dispatch-latch.mjs')
          text = path.read_text(encoding='utf-8')
          start_marker = "assert.ok(source.includes('const PRISONER_HANDOFF_REDIRECT_RECOVERY_MS = 12000;'));"
          end_marker = 'const storage = new Map();'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Prisoner-handoff regression replacement markers not found.')
          replacement = '\n'.join([
              "const recovery = extractFunction('maybeRecoverStrandedPrisonerHandoff');",
              "assert.match(recovery, /\\{\\s*return false;\\s*\\}$/,",
              "  'legacy mission-A prisoner redirect recovery must remain disabled');",
              "assert.doesNotMatch(recovery, /location\\.(?:replace|assign)|createWorker\\s*\\(|\\.click\\s*\\(|clickDispatch/i,",
              "  'mission Worker A must never navigate, rebuild or click during prisoner transport');",
              '',
              "const timeout = extractFunction('maybeHandleTransportServiceTimeout');",
              "assert.match(timeout, /state\\.workerRole !== 'TRANSPORT_B'/,",
              "  'bounded prisoner transport recovery must be owned only by Worker B');",
              "assert.doesNotMatch(timeout, /clickDispatch/i,",
              "  'transport Worker B timeout must never click Dispatch');",
              '',
              "const finish = extractFunction('returnToTopMissionAfterTransport');",
              "assert.ok(finish.indexOf('removeWorker(false)') < finish.indexOf('createWorker(mission.url)'),",
              "  'transport B must be removed before the next mission A is created');",
              '',
              '',
          ])
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              'PASS: prisoner handoff redirect recovery is no-dispatch/fail-closed and repeat mission Dispatch claims are blocked atomically.',
              'PASS: prisoner handoff is transport-B-only and repeat mission Dispatch claims are blocked atomically.',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean hotfix candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Block transport leakage from mission Worker A"
          git push origin HEAD:hotfix/v3036-transport-owner-race
