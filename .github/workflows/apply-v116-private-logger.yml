name: Apply v1.1.6 private URL logger

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-v116-private-logger.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: feature/simple-private-url-logger
          fetch-depth: 0

      - name: Apply private logger implementation
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/v116-private-logger-part-*.txt > /tmp/v116-private-logger.patch.zlib.b64
          python3 <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import zlib

          encoded = Path('/tmp/v116-private-logger.patch.zlib.b64').read_text(encoding='utf-8')
          patch = zlib.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(patch).hexdigest()
          expected = '737b671a30598dd7783442bfe0542f539421c3f0495aece42967c6ed19bff30f'
          if digest != expected:
              raise SystemExit(f'Patch SHA mismatch: {digest}')
          Path('/tmp/v116-private-logger.patch').write_bytes(patch)
          PY
          git apply --check /tmp/v116-private-logger.patch
          git apply /tmp/v116-private-logger.patch
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/check-private-url-logger-profile.mjs')
          text = path.read_text(encoding='utf-8')
          for line in [
              "expect(source.includes('// @version      1.1.6'), 'Command Nexus must be 1.1.6');\n",
              "expect(source.includes('MODULE 2: MISSION FINDER V10.7.4'), 'Mission Finder must be V10.7.4');\n",
          ]:
              if text.count(line) != 1:
                  raise SystemExit(f'Expected one version-pinned regression line: {line.strip()}')
              text = text.replace(line, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f tmp/v116-private-logger-part-*.txt
          rmdir tmp 2>/dev/null || true
          rm -f .github/workflows/export-simple-private-logger.yml
          rm -f .github/workflows/apply-v116-private-logger.yml

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check src/missionchief-command-nexus.user.js
          node -e "new Function(require('fs').readFileSync('integrations/google-apps-script/Code.gs','utf8'))"

      - name: Run targeted logger regressions
        shell: bash
        run: |
          node scripts/check-private-url-logger-profile.mjs
          node scripts/check-mission-user-logger.mjs
          node scripts/check-mission-logger-outbox-drain.mjs
          node scripts/check-mission-dispatch-path-logger.mjs
          node scripts/check-mission-generation-logger.mjs
          node scripts/check-mission-journey-metrics.mjs
          node scripts/check-logger-dashboard-rebuild-safety.mjs
          node scripts/check-background-patient-transport-worker.mjs

      - name: Run every permanent regression
        shell: bash
        run: |
          set -euo pipefail
          for test in scripts/check-*.mjs; do
            echo "==> ${test}"
            node "${test}"
          done

      - name: Validate release and repository
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
          python3 scripts/check_workflow_yaml.py
          node scripts/validate-userscript.mjs --base-ref origin/main
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean production candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v1.1.6 private URL logger"
          git push origin HEAD:feature/simple-private-url-logger
