name: Sync v1.1.9 operational docs

on:
  push:
    branches:
      - feature/activity-recorder-v119
    paths:
      - .github/workflows/sync-v119-operational-docs.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activity-recorder-v119
          fetch-depth: 0
      - name: Synchronize current baseline versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('docs/ARCHITECTURE.md'),
              Path('docs/ROADMAP.md'),
              Path('docs/MIGRATION.md'),
              Path('docs/README.md'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace('1.1.8', '1.1.9')
              text = text.replace('V10.7.6', 'V10.7.7')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md docs/ROADMAP.md docs/MIGRATION.md docs/README.md
          if git diff --cached --quiet; then
            echo "Documentation already synchronized."
            exit 0
          fi
          git commit -m "Update operational docs for v1.1.9"
          git push origin HEAD:feature/activity-recorder-v119
