name: Temporary lifecycle source inspection

on:
  push:
    branches:
      - build/lifecycle-diagnostics-v3034

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip lifecycle inspection]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build bounded source map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/missionchief-command-nexus.user.js')
          lines = path.read_text(encoding='utf-8').splitlines()
          report = []
          report.append(f'lines={len(lines)} bytes={path.stat().st_size}')

          def emit(title, start, end):
              start = max(1, start)
              end = min(len(lines), end)
              report.append(f'\n===== {title} [{start}-{end}] =====')
              for number in range(start, end + 1):
                  report.append(f'{number:06d}: {lines[number - 1]}')

          emit('header', 1, 180)

          exact_terms = [
              'exportUnitFinderDiagnosticSnapshot',
              'recordUnitFinderDiagnostic',
              'unitFinderDiagnostic',
              'diagnosticSnapshot',
              'Export Diagnostics',
              'mf-export-unit-finder-diagnostics',
              'pagehide',
              'beforeunload',
              'transport return',
              'transportReturn',
              'workerGeneration',
              'generationToken',
              'promote',
              'promotion',
              'suspend',
              'mission overlay',
              'Mission Control',
              'AUTO_V3',
              'Worker A',
              'worker A',
              'active owner',
              'inactive owner',
          ]
          matched_ranges = []
          for number, line in enumerate(lines, 1):
              if any(term.lower() in line.lower() for term in exact_terms):
                  matched_ranges.append((max(1, number - 7), min(len(lines), number + 14)))

          merged = []
          for start, end in sorted(matched_ranges):
              if merged and start <= merged[-1][1] + 2:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], end))
              else:
                  merged.append((start, end))

          # Keep the report reviewable while covering every key area.
          for index, (start, end) in enumerate(merged[:160], 1):
              emit(f'match-{index}', start, end)

          report.append('\n===== relevant declarations =====')
          declaration = re.compile(r'^\s*(?:async\s+)?function\s+([A-Za-z0-9_$]+)|^\s*(?:const|let|var)\s+([A-Za-z0-9_$]+)\s*=')
          keywords = ('diagnostic', 'worker', 'transport', 'owner', 'overlay', 'missioncontrol', 'automode', 'autoMode', 'lifecycle')
          for number, line in enumerate(lines, 1):
              match = declaration.search(line)
              name = next((group for group in match.groups() if group), '') if match else ''
              if name and any(word.lower() in name.lower() for word in keywords):
                  report.append(f'{number:06d}: {line}')

          emit('tail', max(1, len(lines) - 180), len(lines))
          Path('.tmp-lifecycle-source-map.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          PY

      - name: Commit inspection map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-lifecycle-source-map.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add lifecycle source inspection [skip lifecycle inspection]"
          git push origin HEAD:build/lifecycle-diagnostics-v3034
