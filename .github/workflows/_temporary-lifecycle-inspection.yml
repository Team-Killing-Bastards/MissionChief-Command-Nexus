name: Temporary lifecycle diagnostics build

on:
  push:
    branches:
      - build/lifecycle-diagnostics-v3034

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build diagnostic-only 3.0.34 candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_temporary-build-lifecycle-v3034.py')
          text = path.read_text(encoding='utf-8')

          old = "text = replace_once(text, '## [Unreleased]\\n\\n', '## [Unreleased]\\n\\n' + entry, 'changelog insertion')"
          new = "text = text.replace('## [Unreleased]\\n\\n', '## [Unreleased]\\n\\n' + entry, 1)"
          if old not in text:
              raise SystemExit('Temporary changelog patch marker was not found.')
          text = text.replace(old, new, 1)

          for pinned in (
              '  "// @version      3.0.34",\n',
              '  "const VERSION = \'3.0.34\';",\n',
              '  "const MASTER_VERSION = \'3.0.34\';",\n',
          ):
              if pinned not in text:
                  raise SystemExit(f'Temporary pinned regression marker was not found: {pinned!r}')
              text = text.replace(pinned, '', 1)

          pinned_block = '''if (!source.includes("const MISSION_FINDER_VERSION = '10.6.177';")) {
            throw new Error('Diagnostic-only release changed the Mission Finder engine version.');
          }
          console.log('Worker lifecycle diagnostics v3.0.34 regression passed.');'''
          generic_block = "console.log('Worker lifecycle diagnostics regression passed.');"
          if pinned_block not in text:
              raise SystemExit('Temporary component-version regression block was not found.')
          text = text.replace(pinned_block, generic_block, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/_temporary-build-lifecycle-v3034.py

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add diagnostic-only Worker A lifecycle tracing"
          git push origin HEAD:build/lifecycle-diagnostics-v3034
