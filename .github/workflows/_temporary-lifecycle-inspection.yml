name: Temporary lifecycle source inspection

on:
  push:
    branches:
      - build/lifecycle-diagnostics-v3034

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip lifecycle inspection]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact lifecycle ranges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/missionchief-command-nexus.user.js')
          lines = path.read_text(encoding='utf-8').splitlines()

          def write_range(name, start, end):
              start = max(1, start)
              end = min(len(lines), end)
              content = [f'{number:06d}: {lines[number - 1]}' for number in range(start, end + 1)]
              Path(name).write_text('\n'.join(content) + '\n', encoding='utf-8')

          write_range('.tmp-src-controller-core.txt', 1, 900)
          write_range('.tmp-src-controller-worker.txt', 1600, 1900)
          write_range('.tmp-src-controller-pipeline.txt', 2920, 4310)
          write_range('.tmp-src-controller-transport.txt', 4610, 5745)
          write_range('.tmp-src-controller-admission.txt', 5740, 7525)
          write_range('.tmp-src-controller-export.txt', 7860, 8380)
          write_range('.tmp-src-mf-bootstrap.txt', 18200, 19250)
          write_range('.tmp-src-mf-diagnostics.txt', 20480, 21600)

          terms = [
              '__MCN_BOOT_TRACE__',
              'isMfV3ManagedActiveWorker',
              'mission-observer-managed-active-owner',
              'mission-observer-inactive-owner',
              'MF_FRAME_RUNTIME_RECONCILE',
              'V2_FRAME_RUNTIME_RECONCILE',
              'managed-active-owner',
              'bootstrapTrace',
          ]
          report = []
          for number, line in enumerate(lines, 1):
              if any(term.lower() in line.lower() for term in terms):
                  start = max(1, number - 12)
                  end = min(len(lines), number + 24)
                  report.append(f'\n===== {number} [{start}-{end}] =====')
                  for line_number in range(start, end + 1):
                      report.append(f'{line_number:06d}: {lines[line_number - 1]}')
          Path('.tmp-src-bootstrap-map.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          PY

      - name: Commit exact lifecycle ranges
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-src-*.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add exact lifecycle source ranges [skip lifecycle inspection]"
          git push origin HEAD:build/lifecycle-diagnostics-v3034
