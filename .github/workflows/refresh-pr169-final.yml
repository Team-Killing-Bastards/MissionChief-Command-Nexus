name: Final refresh PR 169

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/auto-prisoner-cell-before-unit-finder'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out prisoner branch
        uses: actions/checkout@v6
        with:
          ref: agent/auto-prisoner-cell-before-unit-finder
          fetch-depth: 0
          show-progress: false

      - name: Record current main without altering validated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git fetch origin main
          git merge -s ours --no-edit origin/main
          git push origin HEAD:agent/auto-prisoner-cell-before-unit-finder
