name: Temporary v1.1.12 release recovery

on:
  push:
    branches:
      - hotfix/v1.1.12-multi-device-lag
    paths:
      - '.github/workflows/tmp-pr368-plan.yml'

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/v1.1.12-multi-device-lag
          fetch-depth: 0

      - name: Dispatch official repository-quality recovery path
        shell: bash
        run: |
          set -uo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > scripts/tmp-pr-completion/recovery-requested-at.txt
          gh workflow run repository-quality.yml --ref main \
            > scripts/tmp-pr-completion/recovery-dispatch.stdout \
            2> scripts/tmp-pr-completion/recovery-dispatch.stderr
          status=$?
          printf '%s\n' "${status}" > scripts/tmp-pr-completion/recovery-dispatch.exit-code
          sleep 5
          gh run list \
            --workflow repository-quality.yml \
            --event workflow_dispatch \
            --limit 10 \
            --json databaseId,workflowName,displayTitle,event,status,conclusion,url,createdAt,updatedAt,headSha,number \
            > scripts/tmp-pr-completion/recovery-runs.json
          list_status=$?
          printf '%s\n' "${list_status}" > scripts/tmp-pr-completion/recovery-runs.exit-code
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/tmp-pr-completion
          git commit -m "Dispatch official v1.1.12 release recovery"
          git push origin HEAD:hotfix/v1.1.12-multi-device-lag
          if [[ "${status}" -ne 0 ]]; then
            exit "${status}"
          fi
          exit "${list_status}"
