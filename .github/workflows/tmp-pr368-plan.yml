name: Temporary v1.1.12 release monitor

on:
  push:
    branches:
      - hotfix/v1.1.12-multi-device-lag
    paths:
      - '.github/workflows/tmp-pr368-plan.yml'

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/v1.1.12-multi-device-lag
          fetch-depth: 0

      - name: Capture v1.1.12 release state
        shell: bash
        run: |
          set -uo pipefail
          gh run list \
            --commit 6aeac5cce756af23c1d213ef4c1fdaf7f9620df3 \
            --limit 30 \
            --json databaseId,workflowName,displayTitle,event,status,conclusion,url,createdAt,updatedAt,headSha,number \
            > scripts/tmp-pr-completion/release-runs.json
          run_status=$?
          if gh release view v1.1.12 \
            --json tagName,name,url,isDraft,isPrerelease,publishedAt,targetCommitish,assets \
            > scripts/tmp-pr-completion/release-state.json 2>scripts/tmp-pr-completion/release-state.error; then
            release_status=0
          else
            release_status=$?
            printf '%s\n' '{"state":"not-published"}' > scripts/tmp-pr-completion/release-state.json
          fi
          printf '%s\n' "${run_status}" > scripts/tmp-pr-completion/release-runs.exit-code
          printf '%s\n' "${release_status}" > scripts/tmp-pr-completion/release-state.exit-code
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/tmp-pr-completion
          git commit -m "Record v1.1.12 release pipeline state"
          git push origin HEAD:hotfix/v1.1.12-multi-device-lag
          exit "${run_status}"
