name: Temporary v1.1.12 final verification

on:
  push:
    branches:
      - hotfix/v1.1.12-multi-device-lag
    paths:
      - '.github/workflows/tmp-pr368-plan.yml'

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/v1.1.12-multi-device-lag
          fetch-depth: 0

      - name: Capture and independently verify final release
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.1.12 \
            --json tagName,name,url,isDraft,isPrerelease,publishedAt,targetCommitish,assets \
            > scripts/tmp-pr-completion/final-release.json
          gh run view 32303451061 \
            --json databaseId,workflowName,event,status,conclusion,url,headSha,createdAt,updatedAt,jobs \
            > scripts/tmp-pr-completion/final-release-run.json

          git fetch origin main --tags --force
          {
            echo "tag_object=$(git rev-parse v1.1.12)"
            echo "tag_target=$(git rev-parse 'v1.1.12^{}')"
            echo "main=$(git rev-parse origin/main)"
          } > scripts/tmp-pr-completion/final-tag.txt

          verify_dir="$(mktemp -d)"
          gh release download v1.1.12 \
            --pattern 'MissionChief-Command-Nexus-1.1.12.user.js' \
            --pattern 'MissionChief-Command-Nexus-1.1.12.user.js.sha256' \
            --dir "${verify_dir}"
          (
            cd "${verify_dir}"
            sha256sum -c MissionChief-Command-Nexus-1.1.12.user.js.sha256
          ) > scripts/tmp-pr-completion/final-checksum.txt

          receipt_count="$(jq '[.assets[].name | select(startswith("Command-Nexus-Discord-Receipt-v1.1.12-"))] | length' scripts/tmp-pr-completion/final-release.json)"
          verified_asset_count="$(jq '[.assets[].name | select(. == "MissionChief-Command-Nexus-1.1.12.user.js" or . == "MissionChief-Command-Nexus-1.1.12.user.js.sha256")] | unique | length' scripts/tmp-pr-completion/final-release.json)"
          {
            echo "verified_assets=${verified_asset_count}/2"
            echo "discord_receipts=${receipt_count}"
          } > scripts/tmp-pr-completion/final-counts.txt
          test "${verified_asset_count}" = "2"
          test "${receipt_count}" = "1"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/tmp-pr-completion
          git commit -m "Record verified v1.1.12 release evidence"
          git push origin HEAD:hotfix/v1.1.12-multi-device-lag
