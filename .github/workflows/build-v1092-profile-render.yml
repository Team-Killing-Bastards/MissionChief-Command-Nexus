name: Build v1.0.92 rendered profile candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and validate v1.0.92
    if: >-
      github.event.pull_request.head.ref == 'fix/dispatch-centre-profile-render-v1092' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/dispatch-centre-profile-render-v1092
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force

          # One-use builder was authored before the final v1.0.91 workflow label was read.
          # Correct that local-only label expectation before executing it.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-v1092-profile-render.py')
          text = path.read_text()
          text = text.replace(
              'Validate profile Dispatch Centre hierarchy',
              'Validate profile Dispatch Centre and Service hierarchy'
          )
          path.write_text(text)
          PY

          python3 scripts/build-v1092-profile-render.py

          # Remove all one-use machinery before validation/commit.
          rm -f scripts/build-v1092-profile-render.py
          rm -f .github/workflows/build-v1092-profile-render.yml

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running $check"
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Render MissionChief profile before reading Dispatch Centres in v1.0.92'
          git push origin HEAD:fix/dispatch-centre-profile-render-v1092
