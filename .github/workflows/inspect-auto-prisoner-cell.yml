name: Prepare Auto Mode prisoner cell gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/auto-prisoner-cell-before-unit-finder'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/auto-prisoner-cell-before-unit-finder
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply prisoner cell gate
        shell: bash
        run: |
          set -euo pipefail
          python3 .diagnostics/fix-auto-prisoner-builder.py
          python3 .diagnostics/apply-auto-prisoner-cell.py
          rm -f .diagnostics/fix-auto-prisoner-builder.py
          rm -f .diagnostics/apply-auto-prisoner-cell.py
          rm -f .diagnostics/prisoner-cell-auto.txt
          rm -f .diagnostics/auto-prisoner-context.txt
          rm -f .diagnostics/auto-prisoner-transport-context.txt

      - name: Validate complete Command Nexus candidate
        shell: bash
        run: |
          set +e
          mkdir -p .diagnostics
          {
            set -x
            node --check src/missionchief-command-nexus.user.js
            node scripts/validate-userscript.mjs
            python3 scripts/check_repository.py
            for check in scripts/check-*.mjs; do
              echo "Running ${check}"
              node "${check}" || exit $?
            done
            test ! -e src/personnel-register-tools.user.js
            grep -Fq '// @version      1.0.41' src/missionchief-command-nexus.user.js
            grep -Fq ' * MODULE 2: MISSION FINDER V10.6.105' src/missionchief-command-nexus.user.js
            grep -Fq 'await handleAutoPrisonerCellBeforeUnitFinder();' src/missionchief-command-nexus.user.js
            grep -Fq 'a.btn.btn-success[data-prison-id][href*="/gefangener/"]' src/missionchief-command-nexus.user.js
            git diff --check
          } > .diagnostics/auto-prisoner-validation.log 2>&1
          status=$?
          cat .diagnostics/auto-prisoner-validation.log
          if [[ ${status} -ne 0 ]]; then
            git config user.name MartyBlyth
            git config user.email 32400596+Martyblyth@users.noreply.github.com
            git add .diagnostics/auto-prisoner-validation.log
            git commit -m 'Capture Auto Mode prisoner validation failure'
            git push origin HEAD:agent/auto-prisoner-cell-before-unit-finder
            exit ${status}
          fi
          rm -f .diagnostics/auto-prisoner-validation.log

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Handle prisoner cells before Auto Mode Unit Finder'
          git push origin HEAD:agent/auto-prisoner-cell-before-unit-finder
