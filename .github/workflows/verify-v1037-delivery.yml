name: Verify v1.0.37 delivery

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/verify-v1037-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Wait for and verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.37
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          ASSET='MissionChief-Command-Nexus-1.0.37.user.js'
          CHECKSUM_ASSET="${ASSET}.sha256"

          for attempt in $(seq 1 60); do
            if gh release view "${RELEASE_TAG}" \
              --json url,isDraft,isPrerelease,targetCommitish,assets \
              > /tmp/release.json 2>/tmp/release-error.txt; then
              asset_count="$(jq -r --arg a "${ASSET}" --arg c "${CHECKSUM_ASSET}" '[.assets[] | select(.name == $a or .name == $c)] | unique_by(.name) | length' /tmp/release.json)"
              if [[ "$(jq -r '.isDraft' /tmp/release.json)" == 'false' && \
                    "$(jq -r '.isPrerelease' /tmp/release.json)" == 'false' && \
                    "${asset_count}" == '2' ]]; then
                break
              fi
            fi
            if [[ "${attempt}" == '60' ]]; then
              echo 'GitHub release or required assets were not ready.'
              cat /tmp/release-error.txt || true
              exit 1
            fi
            sleep 5
          done

          TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          git show "${TAG_SHA}:src/missionchief-command-nexus.user.js" > /tmp/tagged.user.js
          grep -Fq '// @version      1.0.37' /tmp/tagged.user.js
          grep -Fq 'Build All Register' /tmp/tagged.user.js
          grep -Fq 'id="mc-personnel-export-register"' /tmp/tagged.user.js
          grep -Fq 'id="mc-personnel-import-register"' /tmp/tagged.user.js
          grep -Fq ' * MODULE 2: MISSION FINDER V10.6.101' /tmp/tagged.user.js

          rm -rf /tmp/release-assets
          mkdir -p /tmp/release-assets
          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${CHECKSUM_ASSET}" \
            --dir /tmp/release-assets \
            --clobber
          (
            cd /tmp/release-assets
            sha256sum -c "${CHECKSUM_ASSET}"
          )
          cmp --silent /tmp/tagged.user.js "/tmp/release-assets/${ASSET}"

          jq -r '.url' /tmp/release.json > /tmp/release-url.txt
          printf '%s\n' "${TAG_SHA}" > /tmp/tag-sha.txt
          sha256sum /tmp/tagged.user.js | awk '{print $1}' > /tmp/source-sha256.txt

      - name: Wait for Discord single-delivery receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.37
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            gh release view "${RELEASE_TAG}" --json assets > /tmp/receipt-release.json
            RECEIPT_NAME="$(
              jq -r \
                '.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.37-")) | .name' \
                /tmp/receipt-release.json | head -n 1
            )"
            if [[ -n "${RECEIPT_NAME}" ]]; then
              printf '%s\n' "${RECEIPT_NAME}" > /tmp/discord-receipt-name.txt
              exit 0
            fi
            sleep 5
          done
          echo 'Discord release receipt asset was not recorded.'
          exit 1

      - name: Wait for exact Greasy Fork parity
        env:
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GREASYFORK_INSTALL_URL}" ]]; then
            echo 'GREASYFORK_INSTALL_URL repository variable is missing.'
            exit 1
          fi

          for attempt in $(seq 1 60); do
            if curl --fail --location --silent --show-error \
              --header 'Accept: text/plain, application/javascript, */*' \
              --user-agent 'MissionChief-Command-Nexus-v1.0.37-Delivery-Audit' \
              "${GREASYFORK_INSTALL_URL}?release_check=$(date +%s%N)" \
              --output /tmp/greasy.user.js; then
              if node - /tmp/tagged.user.js /tmp/greasy.user.js <<'NODE'
          const fs = require('fs');
          const [expectedPath, livePath] = process.argv.slice(2);
          const normalise = (text) => text
            .replace(/^\uFEFF/, '')
            .replace(/\r\n?/g, '\n')
            .replace(/^\s*\/\/\s*@(downloadURL|updateURL|installURL)\s+.*\n?/gim, '')
            .replace(/[ \t]+$/gm, '')
            .trimEnd()
            .concat('\n');
          const expected = normalise(fs.readFileSync(expectedPath, 'utf8'));
          const live = normalise(fs.readFileSync(livePath, 'utf8'));
          const version = live.match(/^\s*\/\/\s*@version\s+([^\s]+)\s*$/m)?.[1] || '';
          if (version !== '1.0.37' || live !== expected) process.exit(1);
          NODE
              then
                printf '1.0.37\n' > /tmp/greasy-version.txt
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Greasy Fork did not reach exact v1.0.37 source parity.'
          exit 1

      - name: Record verified delivery receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_URL="$(cat /tmp/release-url.txt)"
          TAG_SHA="$(cat /tmp/tag-sha.txt)"
          CHECKSUM="$(cat /tmp/source-sha256.txt)"
          GREASY_VERSION="$(cat /tmp/greasy-version.txt)"
          RECEIPT_NAME="$(cat /tmp/discord-receipt-name.txt)"

          cat > /tmp/receipt.md <<EOF
          ## v1.0.37 delivery verified

          - GitHub release: ${RELEASE_URL}
          - GitHub userscript asset and SHA-256: verified against tag \`${TAG_SHA}\`
          - Greasy Fork: live source is exact normalised parity at version \`${GREASY_VERSION}\`
          - Discord: single-delivery receipt asset confirmed as \`${RECEIPT_NAME}\`
          - SHA-256: \`${CHECKSUM}\`
          EOF

          gh pr comment "${SOURCE_PR}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/receipt.md
