name: Apply preloaded vehicle requirements v1.0.75

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/builders/apply-preloaded-vehicle-requirements-v1075.py'
      - '.github/workflows/apply-preloaded-vehicle-requirements-v1075.yml'

permissions:
  contents: write

concurrency:
  group: apply-preloaded-vehicle-requirements-v1075
  cancel-in-progress: false

jobs:
  build-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply validated preloaded Vehicle Load patch
        run: python3 .github/builders/apply-preloaded-vehicle-requirements-v1075.py

      - name: Validate JavaScript syntax
        run: node --check src/missionchief-command-nexus.user.js

      - name: Run every permanent behavioural regression
        run: |
          for check in scripts/check-*.mjs; do
            echo "Running $check"
            node "$check"
          done

      - name: Validate userscript and repository
        run: |
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit validated candidate
        run: |
          if git diff --quiet --exit-code && [ -z "$(git status --porcelain)" ]; then
            echo "No candidate changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md src scripts
          git commit -m "Preload fresh-mission vehicle requirements into Vehicle Load"
          git push origin "HEAD:${{ github.head_ref }}"
