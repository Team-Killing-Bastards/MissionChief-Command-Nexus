name: Scan current-version assertions

on:
  push:
    branches:
      - fix/ios-personnel-assignment-completeness-v1084
    paths:
      - '.scan-current-version-assertions-trigger'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ios-personnel-assignment-completeness-v1084
          fetch-depth: 0
      - name: Find stale current-release assertions
        shell: bash
        run: |
          set -euo pipefail
          echo '=== scripts containing old userscript metadata ==='
          grep -RIl --include='check-*.mjs' -- '// @version      1.0.83' scripts || true
          echo '=== scripts containing old Mission Finder header ==='
          grep -RIl --include='check-*.mjs' -- 'MISSION FINDER V10.6.143' scripts || true
          echo '=== all hard-coded userscript metadata checks ==='
          grep -RIn --include='check-*.mjs' -- "@version      1.0." scripts || true
          echo '=== all hard-coded current Mission Finder header checks ==='
          grep -RIn --include='check-*.mjs' -- 'MODULE 2: MISSION FINDER V10.6.' scripts || true
