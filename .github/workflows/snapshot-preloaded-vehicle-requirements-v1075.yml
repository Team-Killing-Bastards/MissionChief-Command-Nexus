name: Snapshot preloaded vehicle requirements v1.0.75

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-preloaded-vehicle-requirements-v1075.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact branch snapshot
        run: |
          tar --exclude=.git -czf "$RUNNER_TEMP/preloaded-vehicle-v1075-snapshot.tar.gz" .
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: preloaded-vehicle-v1075-snapshot
          path: ${{ runner.temp }}/preloaded-vehicle-v1075-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
