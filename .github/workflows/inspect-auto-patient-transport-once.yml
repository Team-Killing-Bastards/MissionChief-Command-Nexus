name: Build Auto Mode patient transport v1.0.52

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/fix-auto-patient-transport-v1052'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply fix
        run: python3 scripts/apply-auto-patient-transport-v1052.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-auto-patient-transport-anchor.mjs
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-auto-prisoner-cell-gate.mjs
          node scripts/check-missing-requirements-priority.mjs
          node scripts/check-trained-coverage-optimizer.mjs
          node scripts/check-police-search-advisor-register.mjs
          node scripts/check-fast-personnel-register.mjs
          python3 scripts/check_repository.py
          git diff --check
      - name: Push validated candidate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Fix Auto Mode patient transport anchor'
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
          SHA="$(git rev-parse HEAD)"
          gh pr edit "$PR_NUMBER" --title 'Fix Auto Mode patient transport anchor' --body "## Fix\n\n- Recognises the current green **Transport Patient** anchor by its exact numeric \`/vehicles/{vehicle}/patient/{hospital}\` route.\n- Checks it before both legacy **Approach** handlers.\n- Keeps unrelated controls excluded.\n\n## Release\n\n- Command Nexus \`1.0.52\`\n- Mission Finder \`V10.6.115\`\n- Personnel Assignment \`1.3.7\`\n\nThe supplied HTML route has permanent regression coverage. Validation passed.\n\nValidated commit: \`${SHA}\`."
