name: Inspect Auto Mode patient transport once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/fix-auto-patient-transport-v1052'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Extract transport selector context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/context.txt
          from pathlib import Path
          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          names = ['mfChoosePreferredApproachButton','mfFindAnyVisibleApproachButtonInModal','mfFindAnyVisibleApproachButtonDeep','mfGetTransportActiveScopes','findExactFirstApproachTransportButton','mfBruteFindFirstApproachButton']
          for name in names:
              sig = f'function {name}('
              i=source.find(sig)
              print(f'--- {name} @ {i} ---')
              if i < 0: continue
              brace=source.find('{',i); depth=0; quote=None; esc=False
              end=len(source)
              for p in range(brace,len(source)):
                  c=source[p]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      continue
                  if c in "'\"`": quote=c; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: end=p+1; break
              print(source[i:end])
              print()
          PY
          {
            echo '## Auto Mode patient transport function context'
            echo
            echo '```javascript'
            cat /tmp/context.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
