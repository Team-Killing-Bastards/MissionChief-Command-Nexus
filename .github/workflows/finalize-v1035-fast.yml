name: Finalize v1.0.35 fast receipt

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: finalize-v1.0.35-fast
  cancel-in-progress: true

jobs:
  tag:
    name: Confirm clean v1.0.35 tag
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/finalize-v1035'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.35
          RELEASE_SHA: 4b93c42b83471d1ad9604ee916d6a5a75c3531ee
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/v1035-tag-check
          cd /tmp/v1035-tag-check
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --force
          TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if [[ "${TAG_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "${RELEASE_TAG} points to ${TAG_SHA}; expected ${RELEASE_SHA}."
            exit 1
          fi
          git fetch origin "${RELEASE_SHA}" --depth=1
          VERSION="$(
            git show "${RELEASE_SHA}:src/missionchief-command-nexus.user.js" |
              sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' |
              head -n 1 |
              xargs
          )"
          [[ "${VERSION}" == '1.0.35' ]]

  publish:
    name: Reconcile v1.0.35 through permanent release workflow
    needs: tag
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.35
      release_notes: Prioritises current Missing Vehicles and supported Missing Personnel requirements before full mission totals, preventing the whole mission requirement set from being selected again.
    secrets: inherit

  receipt:
    name: Verify published assets and Discord receipt
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Record final release receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR: '149'
          FINALIZER_PR: ${{ github.event.pull_request.number }}
          RELEASE_TAG: v1.0.35
          RELEASE_SHA: 4b93c42b83471d1ad9604ee916d6a5a75c3531ee
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force

          ASSET='MissionChief-Command-Nexus-1.0.35.user.js'
          CHECKSUM_ASSET="${ASSET}.sha256"
          gh release view "${RELEASE_TAG}" \
            --json url,isDraft,isPrerelease,assets \
            > /tmp/v1035-release.json

          [[ "$(jq -r '.isDraft' /tmp/v1035-release.json)" == 'false' ]]
          [[ "$(jq -r '.isPrerelease' /tmp/v1035-release.json)" == 'false' ]]
          RELEASE_URL="$(jq -r '.url' /tmp/v1035-release.json)"

          for required_asset in "${ASSET}" "${CHECKSUM_ASSET}"; do
            COUNT="$(
              jq -r --arg name "${required_asset}" \
                '[.assets[] | select(.name == $name)] | length' \
                /tmp/v1035-release.json
            )"
            [[ "${COUNT}" == '1' ]]
          done

          RECEIPT_COUNT="$(
            jq -r \
              '[.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.35-"))] | length' \
              /tmp/v1035-release.json
          )"
          [[ "${RECEIPT_COUNT}" == '1' ]]
          RECEIPT_NAME="$(
            jq -r \
              '.assets[] | select(.name | startswith("Command-Nexus-Discord-Receipt-v1.0.35-")) | .name' \
              /tmp/v1035-release.json
          )"

          TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          [[ "${TAG_SHA}" == "${RELEASE_SHA}" ]]

          rm -rf /tmp/v1035-release-check
          mkdir -p /tmp/v1035-release-check
          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${CHECKSUM_ASSET}" \
            --dir /tmp/v1035-release-check \
            --clobber
          (
            cd /tmp/v1035-release-check
            sha256sum -c "${CHECKSUM_ASSET}"
          )

          git show "${TAG_SHA}:src/missionchief-command-nexus.user.js" \
            > /tmp/v1035-expected.user.js
          cmp --silent \
            /tmp/v1035-expected.user.js \
            "/tmp/v1035-release-check/${ASSET}"

          CHECKSUM="$(sha256sum /tmp/v1035-expected.user.js | awk '{print $1}')"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > /tmp/v1035-receipt.md <<EOF
          ## v1.0.35 release verified

          - Release workflow: ${RUN_URL}
          - GitHub release: ${RELEASE_URL}
          - GitHub userscript and checksum assets: verified
          - Greasy Fork: exact source parity verified by the permanent release workflow
          - Discord: one delivery receipt confirmed as \`${RECEIPT_NAME}\`
          - Source commit: \`${TAG_SHA}\`
          - SHA-256: \`${CHECKSUM}\`
          EOF

          gh pr comment "${SOURCE_PR}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/v1035-receipt.md
          gh pr comment "${FINALIZER_PR}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/v1035-receipt.md

  finish:
    name: Close one-use finalizer
    needs:
      - tag
      - publish
      - receipt
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Close and remove one-use branches
        env:
          GH_TOKEN: ${{ github.token }}
          FINALIZER_PR: ${{ github.event.pull_request.number }}
          TAG_RESULT: ${{ needs.tag.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RECEIPT_RESULT: ${{ needs.receipt.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TAG_RESULT}" == 'success' && \
                "${PUBLISH_RESULT}" == 'success' && \
                "${RECEIPT_RESULT}" == 'success' ]]; then
            gh pr close "${FINALIZER_PR}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment 'v1.0.35 was published and verified across GitHub, Greasy Fork and Discord.'
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/release/finalize-v1035" || true
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/diagnostic/v1035-release-status" || true
          else
            gh pr comment "${FINALIZER_PR}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Fast v1.0.35 finalizer stopped: tag=${TAG_RESULT}, publish=${PUBLISH_RESULT}, receipt=${RECEIPT_RESULT}."
            exit 1
          fi
