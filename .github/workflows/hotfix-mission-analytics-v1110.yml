name: One-use Mission Analytics v1.1.10 hotfix builder

on:
  push:
    branches:
      - hotfix/mission-analytics-v1.1.10

permissions:
  contents: write

jobs:
  build-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v6
        with:
          ref: hotfix/mission-analytics-v1.1.10
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build permanent hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact match, found {count}')
              return text.replace(old, new, 1)

          def replace_at_least_once(text, old, new, label):
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{label}: expected at least one exact match')
              return text.replace(old, new)

          source_path = 'src/missionchief-command-nexus.user.js'
          source = load(source_path)
          source = replace_once(
              source,
              '// @version      1.1.9',
              '// @version      1.1.10',
              'userscript metadata version'
          )
          source = replace_once(
              source,
              "const MF_MISSION_LOGGER_CLIENT_VERSION = '1.1.9';",
              "const MF_MISSION_LOGGER_CLIENT_VERSION = '1.1.10';",
              'logger client version'
          )
          source = replace_once(
              source,
              """    const MF_MISSION_LOGGER_REQUEST_TIMEOUT_MS =
        30000;""",
              """    const MF_MISSION_LOGGER_REQUEST_TIMEOUT_MS =
        120000;""",
              'logger acknowledgement timeout'
          )
          source = replace_once(
              source,
              """    const MF_MISSION_LOGGER_SYNC_LOCK_LEASE_MS =
        MF_MISSION_LOGGER_REQUEST_TIMEOUT_MS + 20000;
    const MF_MISSION_LOGGER_BATCH_CONFIRM_RETRY_DELAY_MS = 1000;""",
              """    const MF_MISSION_LOGGER_SYNC_LOCK_LEASE_MS =
        MF_MISSION_LOGGER_REQUEST_TIMEOUT_MS + 30000;
    const MF_MISSION_LOGGER_BATCH_CONFIRM_RETRY_DELAY_MS = 1000;
    const MF_MISSION_LOGGER_BUSY_RETRY_DELAYS_MS =
        Object.freeze([2000, 5000, 15000]);""",
              'logger lease and busy retry constants'
          )

          helper_start = source.index('    async function submitMissionLoggerUploadBatch(')
          helper_end = source.index('\n    async function syncMissionLoggerNow', helper_start)
          if helper_start < 0 or helper_end <= helper_start:
              raise SystemExit('Unable to isolate submitMissionLoggerUploadBatch')
          new_helper = r'''    async function submitMissionLoggerUploadBatch(
        identity,
        pending,
        batchEvents,
        lockOwner
    ) {
        let lastError = null;

        for (
            let busyAttempt = 0;
            busyAttempt <=
                MF_MISSION_LOGGER_BUSY_RETRY_DELAYS_MS.length;
            busyAttempt += 1
        ) {
            try {
                for (
                    let attempt = 0;
                    attempt < 2;
                    attempt += 1
                ) {
                    if (!refreshMissionLoggerSyncLock(lockOwner)) {
                        const error = new Error(
                            'The shared logger upload lock was lost before the batch could be confirmed.'
                        );
                        error.code = 'LOGGER_LOCK_LOST';
                        throw error;
                    }

                    try {
                        return await submitMissionLoggerRequest(
                            'upload',
                            {
                                profileName:
                                    identity.legacyPlayerName ||
                                    identity.playerName,
                                profileId: identity.playerId,
                                username: identity.playerName,
                                deviceId: identity.deviceId,
                                deviceLabel: identity.deviceLabel,
                                batchId: pending.batchId,
                                events: batchEvents
                            }
                        );
                    } catch (error) {
                        lastError = error;
                        if (
                            String(error?.code || '') !==
                                'LOGGER_TIMEOUT' ||
                            attempt > 0
                        ) {
                            throw error;
                        }

                        writeMissionLoggerState({
                            drainMessage:
                                'Google is still processing the batch; confirming the same batch ID once more.'
                        });
                        await wait(
                            MF_MISSION_LOGGER_BATCH_CONFIRM_RETRY_DELAY_MS
                        );
                    }
                }
            } catch (error) {
                lastError = error;
                if (
                    String(error?.code || '') !==
                        'LOGGER_BUSY' ||
                    busyAttempt >=
                        MF_MISSION_LOGGER_BUSY_RETRY_DELAYS_MS.length
                ) {
                    throw error;
                }

                const retryDelay =
                    MF_MISSION_LOGGER_BUSY_RETRY_DELAYS_MS[
                        busyAttempt
                    ];
                writeMissionLoggerState({
                    lastError: '',
                    drainMessage:
                        `Google logger is busy; retrying the same batch ID in ${Math.ceil(retryDelay / 1000)}s.`
                });
                await wait(retryDelay);
            }
        }

        throw lastError || new Error(
            'Google logger upload could not be confirmed.'
        );
    }
'''
          source = source[:helper_start] + new_helper + source[helper_end:]

          init_start = source.index('    function initialize() {')
          init_end = source.index('\n    function getVehicleCheckboxListSignature', init_start)
          if init_start < 0 or init_end <= init_start:
              raise SystemExit('Unable to isolate Mission Finder initialize')
          initialize = source[init_start:init_end]
          initialize = replace_once(
              initialize,
              """    function initialize() {
        if (!isMissionPage()) return;

        if (!claimCurrentMissionExecutionOwnership('initialize')) {""",
              """    function initialize() {
        if (!isMissionPage()) return;

        // The top window owns the single activity recorder even when the
        // active mission frame owns the heavy Mission Finder runtime.
        installMissionActivityRecorder();

        if (!claimCurrentMissionExecutionOwnership('initialize')) {""",
              'top-window recorder before Mission Finder ownership return'
          )
          initialize = replace_once(
              initialize,
              """        installMissionLoggerStorageListener();
        installMissionLoggerDispatchCapture();
        installMissionActivityRecorder();
        recordMissionLoggerObservedEvent();""",
              """        installMissionLoggerStorageListener();
        installMissionLoggerDispatchCapture();
        recordMissionLoggerObservedEvent();""",
              'remove late duplicate recorder installation'
          )
          source = source[:init_start] + initialize + source[init_end:]
          save(source_path, source)

          backend_path = 'integrations/google-apps-script/Code.gs'
          backend = load(backend_path)
          backend = replace_once(
              backend,
              "buildId: '1.1.9-activity-recorder-2'",
              "buildId: '1.1.10-upload-lock-hotfix-1'",
              'backend build marker'
          )
          backend = replace_once(
              backend,
              """  maxEventsPerBatch: 40,
  maxUnitsPerEvent: 500,""",
              """  maxEventsPerBatch: 40,
  uploadLockWaitMs: 2000,
  maxUnitsPerEvent: 500,""",
              'backend upload lock wait setting'
          )
          backend = replace_once(
              backend,
              """        'activity-recorder',
        'navbar-profile-id'""",
              """        'activity-recorder',
        'navbar-profile-id',
        'retryable-upload-lock'""",
              'backend feature marker'
          )
          backend = replace_once(
              backend,
              """  } catch (error) {
    response = {
      ok: false,
      code: cleanText_(error && error.code ? error.code : 'LOGGER_ERROR', 80),
      error: cleanText_(error && error.message ? error.message : String(error), 500)
    };
  }

  response.source = MC_LOGGER.responseSource;""",
              """  } catch (error) {
    const errorCode = cleanText_(
      error && error.code ? error.code : 'LOGGER_ERROR',
      80
    );
    response = {
      ok: false,
      code: errorCode,
      error: cleanText_(error && error.message ? error.message : String(error), 500),
      retryable: errorCode === 'LOGGER_BUSY'
    };
  }

  response.source = MC_LOGGER.responseSource;""",
              'retryable busy response'
          )
          upload_start = backend.index('function handleLoggerUpload_(payload) {')
          upload_end = backend.index('\nfunction handleLoggerRevoke_', upload_start)
          if upload_start < 0 or upload_end <= upload_start:
              raise SystemExit('Unable to isolate handleLoggerUpload_')
          upload = backend[upload_start:upload_end]
          upload = replace_once(
              upload,
              """  const lock = LockService.getScriptLock();
  lock.waitLock(30000);

  try {""",
              """  const lock = LockService.getScriptLock();
  if (!lock.tryLock(MC_LOGGER.uploadLockWaitMs)) {
    throw loggerError_(
      'LOGGER_BUSY',
      'The logger is busy processing another batch. Retry the same batch shortly.'
    );
  }

  try {""",
              'bounded upload lock acquisition'
          )
          backend = backend[:upload_start] + upload + backend[upload_end:]
          save(backend_path, backend)

          outbox_path = 'scripts/check-mission-logger-outbox-drain.mjs'
          outbox = load(outbox_path)
          outbox = replace_once(
              outbox,
              """  `submitMissionLoggerRequest(
                    'upload'`,""",
              """  'submitMissionLoggerRequest(',""",
              'make existing outbox call check indentation-agnostic'
          )
          save(outbox_path, outbox)

          logger_check_path = 'scripts/check-mission-user-logger.mjs'
          logger_check = load(logger_check_path)
          logger_check = replace_once(
              logger_check,
              "buildId: '1.1.9-activity-recorder-2'",
              "buildId: '1.1.10-upload-lock-hotfix-1'",
              'mission logger backend build regression'
          )
          save(logger_check_path, logger_check)

          regression = r'''#!/usr/bin/env node
import { readFile } from 'node:fs/promises';

const source = await readFile('src/missionchief-command-nexus.user.js', 'utf8');
const backend = await readFile('integrations/google-apps-script/Code.gs', 'utf8');

function fail(message) {
  console.error(`ERROR: ${message}`);
  process.exit(1);
}
function expect(condition, message) {
  if (!condition) fail(message);
}
function extractFunction(text, name) {
  const expression = new RegExp(`(?:async\\s+)?function\\s+${name}\\s*\\(`);
  const match = expression.exec(text);
  if (!match) fail(`Missing function ${name}`);
  const start = match.index;
  const parameterStart = text.indexOf('(', start);
  let parameterDepth = 0;
  let bodyStart = -1;
  let quote = '';
  let escaped = false;
  for (let index = parameterStart; index < text.length; index += 1) {
    const character = text[index];
    if (quote) {
      if (escaped) escaped = false;
      else if (character === '\\') escaped = true;
      else if (character === quote) quote = '';
      continue;
    }
    if (character === '"' || character === "'" || character === '`') {
      quote = character;
      continue;
    }
    if (character === '(') parameterDepth += 1;
    if (character === ')') {
      parameterDepth -= 1;
      if (parameterDepth === 0) {
        bodyStart = text.indexOf('{', index);
        break;
      }
    }
  }
  if (bodyStart < 0) fail(`Missing body for ${name}`);

  let depth = 0;
  quote = '';
  escaped = false;
  let lineComment = false;
  let blockComment = false;
  for (let index = bodyStart; index < text.length; index += 1) {
    const character = text[index];
    const next = text[index + 1] || '';
    if (lineComment) {
      if (character === '\n') lineComment = false;
      continue;
    }
    if (blockComment) {
      if (character === '*' && next === '/') {
        blockComment = false;
        index += 1;
      }
      continue;
    }
    if (quote) {
      if (escaped) escaped = false;
      else if (character === '\\') escaped = true;
      else if (character === quote) quote = '';
      continue;
    }
    if (character === '/' && next === '/') {
      lineComment = true;
      index += 1;
      continue;
    }
    if (character === '/' && next === '*') {
      blockComment = true;
      index += 1;
      continue;
    }
    if (character === '"' || character === "'" || character === '`') {
      quote = character;
      continue;
    }
    if (character === '{') depth += 1;
    if (character === '}') {
      depth -= 1;
      if (depth === 0) return text.slice(start, index + 1);
    }
  }
  fail(`Unable to isolate ${name}`);
}

expect(/^\/\/\s+@version\s+1\.1\.10\s*$/m.test(source), 'Command Nexus must be v1.1.10');
expect(/MF_MISSION_LOGGER_REQUEST_TIMEOUT_MS\s*=\s*120000;/.test(source), 'Google acknowledgement timeout must be 120 seconds');
expect(source.includes('MF_MISSION_LOGGER_REQUEST_TIMEOUT_MS + 30000'), 'Cross-tab lease must exceed the request window by 30 seconds');
expect(source.includes('Object.freeze([2000, 5000, 15000])'), 'Busy retries must use bounded 2s, 5s and 15s backoff');

const initialize = extractFunction(source, 'initialize');
const pageGuardAt = initialize.indexOf('if (!isMissionPage()) return;');
const recorderAt = initialize.indexOf('installMissionActivityRecorder();');
const ownerClaimAt = initialize.indexOf("claimCurrentMissionExecutionOwnership('initialize')");
expect(pageGuardAt >= 0, 'Mission-page guard is missing');
expect(recorderAt > pageGuardAt, 'Recorder must remain mission-page scoped');
expect(recorderAt < ownerClaimAt, 'Top-window recorder must install before Mission Finder ownership can return');
expect((initialize.match(/installMissionActivityRecorder\(\);/g) || []).length === 1, 'Initialize must install the recorder exactly once');
const recorder = extractFunction(source, 'installMissionActivityRecorder');
expect(recorder.includes('!MF_IS_TOP_WINDOW'), 'Recorder must remain single-owner in the top window');

const uploadBatch = extractFunction(source, 'submitMissionLoggerUploadBatch');
for (const token of [
  'busyAttempt <=',
  'MF_MISSION_LOGGER_BUSY_RETRY_DELAYS_MS.length',
  "'LOGGER_BUSY'",
  'await wait(retryDelay)',
  'batchId: pending.batchId',
  'attempt < 2',
  "'LOGGER_TIMEOUT'",
]) {
  expect(uploadBatch.includes(token), `Upload helper is missing ${token}`);
}

function makeRunner(submit, waits, states) {
  return Function(
    'submitMissionLoggerRequest',
    'wait',
    'writeMissionLoggerState',
    'refreshMissionLoggerSyncLock',
    `"use strict";
     const MF_MISSION_LOGGER_BUSY_RETRY_DELAYS_MS = Object.freeze([2000, 5000, 15000]);
     const MF_MISSION_LOGGER_BATCH_CONFIRM_RETRY_DELAY_MS = 1000;
     ${uploadBatch}
     return submitMissionLoggerUploadBatch;`
  )(
    submit,
    async delay => { waits.push(delay); },
    state => { states.push(state); },
    () => true
  );
}

const identity = {
  playerId: '1988',
  playerName: 'Conroy',
  legacyPlayerName: 'Conroy',
  deviceId: 'device-conroy',
  deviceLabel: 'Windows · Chrome'
};
const pending = { batchId: 'stable-batch-1' };
const events = [{ eventId: 'event-1' }];

{
  const calls = [];
  const waits = [];
  const states = [];
  const run = makeRunner(async (action, payload) => {
    calls.push({ action, payload });
    if (calls.length < 3) {
      const error = new Error('busy');
      error.code = 'LOGGER_BUSY';
      throw error;
    }
    return { ok: true, batchId: payload.batchId };
  }, waits, states);
  const result = await run(identity, pending, events, 'owner');
  expect(result.ok === true, 'Busy upload must eventually return the acknowledgement');
  expect(calls.length === 3, 'Two busy responses must produce exactly two bounded retries');
  expect(calls.every(call => call.payload.batchId === pending.batchId), 'Busy retries must preserve the same batch ID');
  expect(JSON.stringify(waits) === JSON.stringify([2000, 5000]), 'Busy backoff order is incorrect');
  expect(states.every(state => String(state.drainMessage || '').includes('same batch ID')), 'Busy status must explain idempotent retry');
}

{
  const calls = [];
  const waits = [];
  const states = [];
  const run = makeRunner(async (action, payload) => {
    calls.push({ action, payload });
    if (calls.length === 1) {
      const error = new Error('timeout');
      error.code = 'LOGGER_TIMEOUT';
      throw error;
    }
    return { ok: true, batchId: payload.batchId };
  }, waits, states);
  await run(identity, pending, events, 'owner');
  expect(calls.length === 2, 'A timeout must receive one confirmation retry');
  expect(calls.every(call => call.payload.batchId === pending.batchId), 'Timeout confirmation must preserve the same batch ID');
  expect(JSON.stringify(waits) === JSON.stringify([1000]), 'Timeout confirmation delay changed unexpectedly');
}

{
  const calls = [];
  const waits = [];
  const states = [];
  const run = makeRunner(async () => {
    calls.push(true);
    const error = new Error('busy');
    error.code = 'LOGGER_BUSY';
    throw error;
  }, waits, states);
  let rejected = null;
  try {
    await run(identity, pending, events, 'owner');
  } catch (error) {
    rejected = error;
  }
  expect(rejected?.code === 'LOGGER_BUSY', 'Exhausted busy retries must surface LOGGER_BUSY');
  expect(calls.length === 4, 'Busy retry count must remain bounded to the initial request plus three retries');
  expect(JSON.stringify(waits) === JSON.stringify([2000, 5000, 15000]), 'All configured busy delays must be used once');
}

expect(backend.includes("buildId: '1.1.10-upload-lock-hotfix-1'"), 'Backend build marker must identify the hotfix');
expect(backend.includes('uploadLockWaitMs: 2000'), 'Backend lock acquisition must be bounded to two seconds');
const backendUpload = extractFunction(backend, 'handleLoggerUpload_');
expect(backendUpload.includes('lock.tryLock(MC_LOGGER.uploadLockWaitMs)'), 'Upload endpoint must use bounded tryLock');
expect(!backendUpload.includes('lock.waitLock(30000)'), 'Upload endpoint must not consume the old 30-second wait budget');
expect(backendUpload.includes("'LOGGER_BUSY'"), 'Lock contention must return an explicit LOGGER_BUSY code');
const doPost = extractFunction(backend, 'doPost');
expect(doPost.includes("retryable: errorCode === 'LOGGER_BUSY'"), 'Busy response must be marked retryable');

console.log('Mission Analytics v1.1.10 hotfix regression passed: top-window recorder ownership, 120-second acknowledgement window, stable batch IDs and bounded LOGGER_BUSY backoff are locked.');
'''
          save('scripts/check-mission-logger-hotfix-v1110.mjs', regression)

          changelog_path = 'CHANGELOG.md'
          changelog = load(changelog_path)
          old_head = """## [Unreleased]

No changes queued after `1.1.9`.

## [1.1.9] - 2026-08-18"""
          new_head = """## [Unreleased]

No changes queued after `1.1.10`.

## [1.1.10] - 2026-08-18

### Fixed

- Installed the single Mission Analytics activity recorder in the top window before Mission Finder can hand heavy execution ownership to the active mission frame. Activity Log, Sessions and Action Summary can now receive top-window and same-origin mission-frame events without creating a second heavy Mission Finder runtime.
- Increased the Google logger acknowledgement window from 30 seconds to 120 seconds and extended the shared cross-tab lease beyond that request window, preventing the browser from abandoning a batch while Apps Script is still waiting or writing.
- Replaced the upload endpoint's 30-second script-lock wait with a two-second bounded lock attempt. Contention now returns explicit retryable `LOGGER_BUSY`, and Nexus retries the same persistent batch ID after 2, 5 and 15 seconds. Existing timeout confirmation remains a single same-ID retry.

### Compatibility and recovery

- Existing private logger URL, selected user, device diagnostics, queued events and pending batch IDs are retained. **Forget setup** is not a recovery action because it clears profile-scoped queued data.
- The 120-second client remains compatible with the currently deployed private backend. Updating the existing Apps Script web-app deployment to backend build `1.1.10-upload-lock-hotfix-1` activates the fast `LOGGER_BUSY` response without changing the saved `/exec` URL.
- Added `scripts/check-mission-logger-hotfix-v1110.mjs`. Increased Command Nexus from `1.1.9` to `1.1.10`; Mission Finder remains `V10.7.7` and all Resource Administration component versions remain unchanged.

## [1.1.9] - 2026-08-18"""
          changelog = replace_once(changelog, old_head, new_head, 'v1.1.10 changelog section')
          save(changelog_path, changelog)

          version_updates = [
              ('README.md', '**Current version:** `1.1.9`', '**Current version:** `1.1.10`'),
              ('src/README.md', '| Command Nexus version | `1.1.9` |', '| Command Nexus version | `1.1.10` |'),
              ('docs/DEVELOPER_HANDOFF.md', '| Command Nexus version | `1.1.9` |', '| Command Nexus version | `1.1.10` |'),
              ('docs/ARCHITECTURE.md', 'Command Nexus v1.1.9', 'Command Nexus v1.1.10'),
              ('docs/ROADMAP.md', 'Current production baseline — v1.1.9', 'Current production baseline — v1.1.10'),
              ('docs/MIGRATION.md', 'Command Nexus `1.1.9`', 'Command Nexus `1.1.10`'),
              ('docs/README.md', 'Command Nexus `1.1.9` with Mission Finder `V10.7.7`', 'Command Nexus `1.1.10` with Mission Finder `V10.7.7`'),
          ]
          for path, old, new in version_updates:
              text = load(path)
              text = replace_at_least_once(text, old, new, f'current version in {path}')
              save(path, text)

          app_readme_path = 'integrations/google-apps-script/README.md'
          app_readme = load(app_readme_path)
          app_readme = replace_once(
              app_readme,
              '## Browser migration',
              """## v1.1.10 upload-lock hotfix

For an existing private logger, replace `Code.gs`, then open **Deploy → Manage deployments**, edit the current web-app deployment, select **New version**, and deploy. Editing the existing deployment preserves the saved `/exec` URL. Re-running workbook initialisation is not required for this lock-only backend change.

Build `1.1.10-upload-lock-hotfix-1` waits at most two seconds for the shared upload lock. A busy backend returns retryable `LOGGER_BUSY`; Command Nexus keeps the pending batch intact and retries the same batch ID using bounded backoff. The longer 120-second browser acknowledgement window is compatible before and after this backend deployment.

## Browser migration""",
              'Apps Script hotfix deployment instructions'
          )
          app_readme = replace_once(
              app_readme,
              '1.1.6-private-profile-1',
              '1.1.10-upload-lock-hotfix-1',
              'Apps Script README current build marker'
          )
          save(app_readme_path, app_readme)
          PY

          rm -f .github/workflows/hotfix-mission-analytics-v1110.yml

      - name: Install workflow YAML parser
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_workflow_yaml.py
          python3 -m py_compile scripts/check_repository.py
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit permanent hotfix and remove builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Hotfix builder produced no changes.' >&2
            exit 1
          fi
          git commit -m 'Hotfix Mission Analytics recorder and upload locking'
          git push origin HEAD:hotfix/mission-analytics-v1.1.10
