name: Post v1.0.84 transport correction

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: post-v1084-transport-correction
  cancel-in-progress: false

jobs:
  post-correction:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release/post-v1084-transport-correction'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Check correction delivery state
        id: correction_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(
            gh release view v1.0.84 --json assets \
              --jq '.assets[].name' |
              grep -m1 '^Command-Nexus-Discord-Correction-v1.0.84-' || true
          )"

          if [[ -n "${EXISTING}" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "existing_asset=${EXISTING}" >> "${GITHUB_OUTPUT}"
            echo "Correction already recorded: ${EXISTING}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Post transport release-note correction
        id: post
        if: steps.correction_state.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo 'Missing DISCORD_RELEASE_WEBHOOK repository secret.'
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');

          const webhook = process.env.DISCORD_WEBHOOK_URL;
          const endpoint = new URL(webhook);
          endpoint.searchParams.set('wait', 'true');

          const payload = {
            username: 'Command Nexus Release Control',
            embeds: [
              {
                title: '📢 Release note correction — patient and prisoner transport',
                color: 0xf59e0b,
                description:
                  'The previous **v1.0.84 LIVE** announcement only described the iOS Personnel Assignment delta. ' +
                  'It omitted the Auto Mode transport-speed work delivered in **v1.0.83** and still included in **v1.0.84**.',
                fields: [
                  {
                    name: '🚑 Patient transport',
                    value:
                      '• Duplicate-click guard: **4.0s → 2.5s**\n' +
                      '• Vue/iframe retry wait: **1.8s → 0.9s**',
                    inline: false,
                  },
                  {
                    name: '🚓 Prisoner transport',
                    value:
                      '• Destination polling: **250ms → 125ms**\n' +
                      '• Result/dismiss polling: **200ms → 100ms**\n' +
                      '• Verified-close wait: **480ms → 250ms**\n' +
                      '• Guarded failed-click retry: **6.5s → 4.0s**',
                    inline: false,
                  },
                  {
                    name: '🛡️ Safety retained',
                    value:
                      'Exact destinations, ownership checks, pending-state hand-off, duplicate-click protection, ' +
                      'Unit Finder blocking and fail-closed maximum timeouts remain active.',
                    inline: false,
                  },
                  {
                    name: 'Current production release',
                    value: '**Command Nexus 1.0.84** · **Mission Finder V10.6.144** · 🟢 LIVE',
                    inline: false,
                  },
                ],
                footer: {
                  text: 'Release-note correction only — no additional code deployment',
                },
                timestamp: new Date().toISOString(),
              },
            ],
          };

          (async () => {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
              redirect: 'follow',
            });

            const body = await response.text();
            if (!response.ok) {
              throw new Error(
                `Discord correction returned HTTP ${response.status}: ${body.slice(0, 1000)}`
              );
            }

            const message = JSON.parse(body);
            if (!message.id || !message.channel_id) {
              throw new Error('Discord did not return a valid message receipt.');
            }

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `message_id=${message.id}\nchannel_id=${message.channel_id}\n`,
              'utf8'
            );
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload correction receipt
        if: steps.correction_state.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE_ID: ${{ steps.post.outputs.message_id }}
          CHANNEL_ID: ${{ steps.post.outputs.channel_id }}
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="Command-Nexus-Discord-Correction-v1.0.84-${MESSAGE_ID}.json"
          cat > "${RECEIPT}" <<EOF
          {
            "schema": 1,
            "type": "release-note-correction",
            "product": "MissionChief Command Nexus",
            "release_tag": "v1.0.84",
            "subject": "patient-and-prisoner-transport-speed",
            "channel_id": "${CHANNEL_ID}",
            "message_id": "${MESSAGE_ID}",
            "posted_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          gh release upload v1.0.84 "${RECEIPT}" --clobber
          echo "Discord correction receipt uploaded: ${RECEIPT}"

      - name: Remove one-use correction publisher
        if: always() && (steps.correction_state.outputs.skip == 'true' || steps.post.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          git checkout -B main origin/main
          git rm -f --ignore-unmatch \
            .github/workflows/post-v1084-transport-correction.yml \
            .github/discord-transport-correction-v1084-trigger.txt

          if git diff --cached --quiet; then
            echo 'One-use correction files already absent.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-use v1.0.84 transport correction publisher'
          git push origin HEAD:refs/heads/main
