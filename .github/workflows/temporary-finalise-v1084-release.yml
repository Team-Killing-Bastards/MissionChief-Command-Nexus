name: Finalise Command Nexus v1.0.84 release

on:
  push:
    branches:
      - main
    paths:
      - '.finalise-v1084-release-trigger'

permissions:
  contents: write

concurrency:
  group: finalise-command-nexus-v1084
  cancel-in-progress: false

jobs:
  finalise:
    name: Bind tag, verify assets and notify Discord
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Retain correct tag binding in publisher
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/publish-release.mjs')
          source = path.read_text(encoding='utf-8')
          start = source.index('async function publishRelease(')
          end = source.index('\nasync function verifyPublishedRelease(', start)
          block = source[start:end]
          old = """    body: JSON.stringify({
                name: title,"""
          new = """    body: JSON.stringify({
                tag_name: tag,
                name: title,"""
          count = block.count(old)
          if count != 1:
              raise SystemExit(f'Expected one publish metadata block, found {count}')
          block = block.replace(old, new)
          path.write_text(source[:start] + block + source[end:], encoding='utf-8')
          PY

          node --check scripts/publish-release.mjs
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/publish-release.mjs
          git commit -m "Preserve release tag during publication"
          git push origin HEAD:main

      - name: Bind published release to v1.0.84
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: '366026975'
          RELEASE_TAG: v1.0.84
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .tag_name)"
          if [[ "${CURRENT_TAG}" != "${RELEASE_TAG}" ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -f tag_name="${RELEASE_TAG}" \
              -f name='MissionChief Command Nexus 1.0.84' \
              -F draft=false \
              -F prerelease=false \
              --silent
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq 'select(.draft == false and .prerelease == false) | .html_url'

      - name: Independently verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.84
        shell: bash
        run: |
          set -euo pipefail
          ASSET='MissionChief-Command-Nexus-1.0.84.user.js'

          rm -rf release-check
          mkdir release-check
          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${ASSET}.sha256" \
            --dir release-check \
            --clobber

          git show "${RELEASE_TAG}:src/missionchief-command-nexus.user.js" > "${ASSET}"
          cmp --silent "${ASSET}" "release-check/${ASSET}"
          (
            cd release-check
            sha256sum -c "${ASSET}.sha256"
          )

      - name: Verify deployment and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          GREASYFORK_PAGE_URL: ${{ vars.GREASYFORK_PAGE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: v1.0.84
          RELEASE_SHA: d0e956fb5df60bbc029fddf17e06c7be7d8dcaf9
          SOURCE_PATH: release-source/src/missionchief-command-nexus.user.js
          CHANGELOG_PATH: release-source/CHANGELOG.md
          PRODUCT_NAME: MissionChief Command Nexus
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-source
          git worktree add --force --detach release-source v1.0.84
          node scripts/release-notify.mjs

      - name: Final release receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.84" \
            --jq '{url: .html_url, tag: .tag_name, draft: .draft, prerelease: .prerelease, assets: [.assets[].name]}'
