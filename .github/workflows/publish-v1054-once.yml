name: Publish and verify v1.0.54

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-v1.0.54-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'release/publish-v1054'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out current publisher
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Create or verify clean v1.0.54 tag
        env:
          CLEAN_SHA: 61924af48dd3d9bcec83a5b2a08ba692d718f314
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          VERSION="$(git show "${CLEAN_SHA}:src/missionchief-command-nexus.user.js" | sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' | head -n1 | xargs)"
          test "$VERSION" = '1.0.54'
          if git show-ref --tags --verify --quiet refs/tags/v1.0.54; then
            test "$(git rev-list -n1 v1.0.54)" = "$CLEAN_SHA"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a v1.0.54 "$CLEAN_SHA" -m 'MissionChief Command Nexus 1.0.54'
            git push origin refs/tags/v1.0.54
          fi

      - name: Validate immutable tagged source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-source
          git worktree add --force --detach release-source v1.0.54
          cd release-source
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-mission-definition-trained-personnel.mjs
          node scripts/check-trained-coverage-optimizer.mjs
          node scripts/check-missing-requirements-priority.mjs
          node scripts/check-police-search-advisor-register.mjs
          python3 scripts/check_repository.py

      - name: Build release assets and notes
        shell: bash
        run: |
          set -euo pipefail
          ASSET='MissionChief-Command-Nexus-1.0.54.user.js'
          cp release-source/src/missionchief-command-nexus.user.js "$ASSET"
          sha256sum "$ASSET" > "${ASSET}.sha256"
          python3 - <<'PY'
          import re
          from pathlib import Path

          changelog = Path('release-source/CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'^## \[1\.0\.54\].*?$(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if not match:
              raise SystemExit('Missing v1.0.54 changelog section')
          checksum = Path('MissionChief-Command-Nexus-1.0.54.user.js.sha256').read_text().split()[0]
          Path('release-notes.md').write_text(
              '## Mission Brief\n\n'
              + match.group(1).strip()
              + '\n\n## Build Verification\n\n'
              + '- Source commit: `61924af48dd3d9bcec83a5b2a08ba692d718f314`\n'
              + f'- SHA-256: `{checksum}`\n',
              encoding='utf-8',
          )
          PY

      - name: Reconcile and publish GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-release.mjs \
            --tag v1.0.54 \
            --target 61924af48dd3d9bcec83a5b2a08ba692d718f314 \
            --title 'MissionChief Command Nexus 1.0.54' \
            --notes release-notes.md \
            --asset MissionChief-Command-Nexus-1.0.54.user.js \
            --asset MissionChief-Command-Nexus-1.0.54.user.js.sha256

      - name: Independently verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-check && mkdir release-check
          gh release view v1.0.54 --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false) | .url'
          gh release download v1.0.54 --repo "$GITHUB_REPOSITORY" \
            --pattern 'MissionChief-Command-Nexus-1.0.54.user.js' \
            --pattern 'MissionChief-Command-Nexus-1.0.54.user.js.sha256' \
            --dir release-check --clobber
          cmp --silent MissionChief-Command-Nexus-1.0.54.user.js release-check/MissionChief-Command-Nexus-1.0.54.user.js
          cmp --silent MissionChief-Command-Nexus-1.0.54.user.js.sha256 release-check/MissionChief-Command-Nexus-1.0.54.user.js.sha256
          cd release-check && sha256sum -c MissionChief-Command-Nexus-1.0.54.user.js.sha256

      - name: Verify deployment and notify Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          GREASYFORK_PAGE_URL: ${{ vars.GREASYFORK_PAGE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: v1.0.54
          RELEASE_SHA: 61924af48dd3d9bcec83a5b2a08ba692d718f314
          SOURCE_PATH: release-source/src/missionchief-command-nexus.user.js
          CHANGELOG_PATH: release-source/CHANGELOG.md
          PRODUCT_NAME: MissionChief Command Nexus
        run: node scripts/release-notify.mjs

      - name: Report publication result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_STATUS: ${{ job.status }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "v1.0.54 publication completed with status: ${JOB_STATUS}."
