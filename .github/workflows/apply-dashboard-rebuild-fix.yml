name: Apply logger dashboard rebuild safety fix

on:
  push:
    branches:
      - fix/logger-dashboard-rebuild-safety
    paths:
      - .github/workflows/apply-dashboard-rebuild-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/logger-dashboard-rebuild-safety
          fetch-depth: 0

      - name: Patch backend and add regression
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          code_path = Path("integrations/google-apps-script/Code.gs")
          code = code_path.read_text(encoding="utf-8")

          code = replace_once(
              code,
              "  buildId: '1.1.2-journey-1',",
              "  buildId: '1.1.2-dashboard-guard-1',",
              "backend build marker",
          )

          old_clear = """function clearLoggerSheetData_(sheet) {
            const lastRow = sheet.getLastRow();
            if (lastRow >= 2) sheet.deleteRows(2, lastRow - 1);
            ensureLoggerSheetRowCapacity_(sheet, MC_LOGGER.liveSheetRowBuffer);
            trimLoggerSheetRows_(sheet);
          }"""
          new_clear = """function clearLoggerSheetData_(sheet) {
            const lastRow = sheet.getLastRow();
            const lastColumn = sheet.getLastColumn();
            if (lastRow >= 2 && lastColumn >= 1) {
              sheet.getRange(2, 1, lastRow - 1, lastColumn).clearContent();
            }
            ensureLoggerSheetRowCapacity_(sheet, MC_LOGGER.liveSheetRowBuffer);
            trimLoggerSheetRows_(sheet);
          }"""
          code = replace_once(
              code,
              old_clear,
              new_clear,
              "formula-preserving logger clear",
          )

          create_start = code.index(
              "function createMissionChiefPlayerPairing() {"
          )
          create_end = code.index(
              "\n}\n\nfunction createMissionChiefDevicePairing() {",
              create_start,
          ) + 2
          create_body = code[create_start:create_end]
          players_line = (
              "    const players = spreadsheet.getSheetByName("
              "MC_LOGGER_SHEETS.players.name);\n\n"
          )
          guard = """    const existingDisplayName = findActivePlayerByDisplayName_(
              players,
              displayName
            );
            if (existingDisplayName) {
              throw new Error(
                'An active player already uses the display name "' + displayName +
                '". Use Create another device pairing with player ID ' +
                existingDisplayName.playerId + ' instead.'
              );
            }

          """
          if "findActivePlayerByDisplayName_(" in create_body:
              raise SystemExit("duplicate display-name guard already exists")
          create_body = replace_once(
              create_body,
              players_line,
              players_line + guard,
              "create-player sheet anchor",
          )
          code = code[:create_start] + create_body + code[create_end:]

          helper = """
          function findActivePlayerByDisplayName_(sheet, displayName) {
            if (!sheet || sheet.getLastRow() < 2) return null;
            const target = cleanText_(displayName, 120).toLowerCase();
            if (!target) return null;

            const rows = sheet.getRange(
              2,
              1,
              sheet.getLastRow() - 1,
              3
            ).getValues();

            for (let index = 0; index < rows.length; index += 1) {
              const row = rows[index];
              if (String(row[2] || '').toUpperCase() !== 'ACTIVE') continue;
              const candidate = cleanText_(row[1], 120).toLowerCase();
              if (candidate === target) {
                return {
                  rowNumber: index + 2,
                  playerId: String(row[0] || '')
                };
              }
            }
            return null;
          }
          """
          if "function findActivePlayerByDisplayName_(" in code:
              raise SystemExit("active display-name helper already exists")
          code = code.rstrip() + "\n\n" + helper.strip() + "\n"
          code_path.write_text(code, encoding="utf-8")

          readme_path = Path("integrations/google-apps-script/README.md")
          readme = readme_path.read_text(encoding="utf-8")
          if "1.1.2-journey-1" not in readme:
              raise SystemExit("README deployment marker was not found")
          readme = readme.replace(
              "1.1.2-journey-1",
              "1.1.2-dashboard-guard-1",
          )
          readme_path.write_text(readme, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          old_unreleased = "No changes have been queued after `1.1.2`."
          new_unreleased = """### Fixed

          - Preserved Google Sheets dashboard and analysis formula references during logger rebuilds by clearing source data cells instead of deleting the referenced rows.
          - Blocked duplicate active player display names and directs additional browsers to **Create another device pairing**, preventing ambiguous dashboard player filters."""
          if old_unreleased in changelog:
              changelog = changelog.replace(
                  old_unreleased,
                  new_unreleased,
                  1,
              )
          elif new_unreleased not in changelog:
              raise SystemExit("Unreleased changelog anchor was not found")
          changelog_path.write_text(changelog, encoding="utf-8")

          test_path = Path("scripts/check-logger-dashboard-rebuild-safety.mjs")
          test_path.write_text(
              """import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const backend = await readFile(
            'integrations/google-apps-script/Code.gs',
            'utf8'
          );

          function extractFunction(name) {
            const start = backend.indexOf(`function ${name}(`);
            assert.notEqual(start, -1, `${name} must exist`);
            const end = backend.indexOf('\\n}\\n\\nfunction ', start);
            assert.notEqual(end, -1, `${name} must have a bounded source body`);
            return backend.slice(start, end + 2);
          }

          const clearBody = extractFunction('clearLoggerSheetData_');
          assert.match(clearBody, /\\.clearContent\\(\\)/);
          assert.doesNotMatch(clearBody, /\\.deleteRows\\(/);

          const createPlayerBody = extractFunction(
            'createMissionChiefPlayerPairing'
          );
          assert.match(
            createPlayerBody,
            /findActivePlayerByDisplayName_\\(\\s*players,\\s*displayName\\s*\\)/
          );
          assert.match(createPlayerBody, /Create another device pairing/);

          const helperStart = backend.indexOf(
            'function findActivePlayerByDisplayName_('
          );
          assert.notEqual(helperStart, -1);
          const helperBody = backend.slice(helperStart);
          assert.match(helperBody, /toLowerCase\\(\\)/);
          assert.match(helperBody, /ACTIVE/);

          assert.match(
            backend,
            /buildId: '1\\.1\\.2-dashboard-guard-1'/
          );

          console.log(
            'Logger dashboard rebuild safety and duplicate-player guard verified.'
          );
          """,
              encoding="utf-8",
          )
          PY

      - name: Run targeted validation
        shell: bash
        run: |
          node -e "new Function(require('fs').readFileSync('integrations/google-apps-script/Code.gs','utf8'))"
          node scripts/check-logger-dashboard-rebuild-safety.mjs
          node scripts/check-mission-user-logger.mjs
          node scripts/check-mission-journey-metrics.mjs
          node scripts/validate-userscript.mjs

      - name: Commit repaired backend
        shell: bash
        run: |
          rm .github/workflows/apply-dashboard-rebuild-fix.yml
          python3 scripts/check_repository.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix logger dashboard rebuild safety"
          git push origin HEAD:fix/logger-dashboard-rebuild-safety
