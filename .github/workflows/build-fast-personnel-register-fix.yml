name: Build and validate fast incremental Personnel Register

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-fast-personnel-register-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fast-personnel-register-v1051'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Inspect branch state
        id: state
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_BRANCH}" --force
          VERSION="$(
            git show "origin/${HEAD_BRANCH}:src/missionchief-command-nexus.user.js" 2>/dev/null |
              sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' |
              head -n 1 |
              xargs || true
          )"
          if [[ "${VERSION}" == '1.0.51' ]]; then
            echo 'already_built=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'already_built=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Reconstruct and verify source builder
        if: steps.state.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/builders/fast-register-v2.part-* |
            tr -d '\r\n\t ' > /tmp/fast-register-builder.b64
          echo 'aa4f0482b880d8fbf1b035607b8dc9a300988e4d960c150d30ee64066bdf82ac  /tmp/fast-register-builder.b64' |
            sha256sum --check
          base64 --decode /tmp/fast-register-builder.b64 > /tmp/fast-register-builder.py.gz
          echo '70813d274c94826e8c6317b104c5a91c5d2a3d2414f2d2d7c7e8b36d80fc844b  /tmp/fast-register-builder.py.gz' |
            sha256sum --check
          gzip --test /tmp/fast-register-builder.py.gz
          gzip --decompress --stdout /tmp/fast-register-builder.py.gz > /tmp/fast-register-builder.py
          echo '6fc7d51223471044decd603955aa37e489a2ebaa9f5b1cc2584136cb323045f9  /tmp/fast-register-builder.py' |
            sha256sum --check
          python3 -m py_compile /tmp/fast-register-builder.py

      - name: Apply implementation and remove build-only files
        if: steps.state.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/fast-register-builder.py
          git rm -f --ignore-unmatch .github/workflows/build-fast-personnel-register-fix.yml
          git rm -f --ignore-unmatch .github/builders/fast-register*.part-*
          git diff --check

      - name: Set up Node.js
        if: steps.state.outputs.already_built != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate complete userscript and repository
        if: steps.state.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-police-irv-fallback.mjs
          node scripts/check-ios-unit-finder-selection.mjs
          node scripts/check-ios-mission-requirements-source.mjs
          node scripts/check-iphone-mission-ui.mjs
          node scripts/check-open-issues-batch.mjs
          node scripts/check-missing-requirements-priority.mjs
          node scripts/check-trained-coverage-optimizer.mjs
          node scripts/check-road-rail-rru-mapping.mjs
          node scripts/check-auto-prisoner-cell-gate.mjs
          node scripts/check-fire-engine-update-mapping.mjs
          node scripts/check-saved-position-helper-copy.mjs
          node scripts/check-bulk-trained-register-update.mjs
          node scripts/check-hems-ambulance-eta-priority.mjs
          node scripts/check-police-search-advisor-register.mjs
          node scripts/check-personnel-register-transfer.mjs
          node scripts/check-fast-personnel-register.mjs
          node scripts/check-release-notification-single-delivery.mjs
          python3 scripts/check_repository.py
          git diff --check

      - name: Replace marker branch with validated source
        if: steps.state.outputs.already_built != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Accelerate incremental Personnel Register refresh'
          git push --force origin "HEAD:refs/heads/${HEAD_BRANCH}"
          COMMIT_SHA="$(git rev-parse HEAD)"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "Command Nexus 1.0.51 / Personnel Assignment 1.3.7 passed the complete validation suite. Validated source commit: \`${COMMIT_SHA}\`."
