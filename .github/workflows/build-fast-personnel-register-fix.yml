name: Build corrected fast incremental Personnel Register

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-fast-personnel-register-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fast-personnel-register-v1051'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Inspect branch state
        id: state
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_BRANCH}" --force
          VERSION="$(
            git show "origin/${HEAD_BRANCH}:src/missionchief-command-nexus.user.js" 2>/dev/null |
              sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' |
              head -n 1 |
              xargs || true
          )"
          if [[ "${VERSION}" == '1.0.51' ]]; then
            echo 'already_built=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'already_built=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Reconstruct source patcher
        if: steps.state.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/build-fast-register.py.gz.b64 <<'EOF'
          
          EOF
          tr -d '\r\n\t ' < /tmp/build-fast-register.py.gz.b64 > /tmp/build-fast-register.py.gz.b64.normalized
          base64 --decode /tmp/build-fast-register.py.gz.b64.normalized > /tmp/build-fast-register.py.gz
          gzip --test /tmp/build-fast-register.py.gz
          gzip --decompress --stdout /tmp/build-fast-register.py.gz > /tmp/build-fast-register.py
          python3 -m py_compile /tmp/build-fast-register.py

      - name: Apply fast register implementation
        if: steps.state.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/build-fast-register.py
          git rm -f .github/workflows/build-fast-personnel-register-once.yml .github/workflows/build-fast-personnel-register-fix.yml
          git diff --check

      - name: Set up Node.js
        if: steps.state.outputs.already_built != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate complete userscript and repository
        if: steps.state.outputs.already_built != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-police-irv-fallback.mjs
          node scripts/check-ios-unit-finder-selection.mjs
          node scripts/check-ios-mission-requirements-source.mjs
          node scripts/check-iphone-mission-ui.mjs
          node scripts/check-open-issues-batch.mjs
          node scripts/check-missing-requirements-priority.mjs
          node scripts/check-trained-coverage-optimizer.mjs
          node scripts/check-road-rail-rru-mapping.mjs
          node scripts/check-auto-prisoner-cell-gate.mjs
          node scripts/check-fire-engine-update-mapping.mjs
          node scripts/check-saved-position-helper-copy.mjs
          node scripts/check-bulk-trained-register-update.mjs
          node scripts/check-hems-ambulance-eta-priority.mjs
          node scripts/check-police-search-advisor-register.mjs
          node scripts/check-personnel-register-transfer.mjs
          node scripts/check-fast-personnel-register.mjs
          node scripts/check-release-notification-single-delivery.mjs
          python3 scripts/check_repository.py
          git diff --check

      - name: Publish validated branch
        if: steps.state.outputs.already_built != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Accelerate incremental Personnel Register refresh'
          git push --force origin "HEAD:refs/heads/${HEAD_BRANCH}"
          COMMIT_SHA="$(git rev-parse HEAD)"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --body "Command Nexus 1.0.51 / Personnel Assignment 1.3.7 passed the complete validation suite. Validated source commit: \`${COMMIT_SHA}\`."
