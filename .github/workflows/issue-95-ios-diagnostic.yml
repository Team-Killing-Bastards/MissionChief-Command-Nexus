name: Capture issue 95 iOS validation failure

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/issue-95-ios-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/fix-issue-95-stations-panel-lifecycle
      - name: Apply patch and capture validation output
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/issue-95-patch.py >/tmp/issue-95-patch.log 2>&1
          set +e
          node scripts/check-ios-compatibility.mjs >.issue-95-ios-validation.txt 2>&1
          status=$?
          set -e
          {
            echo
            echo "exit_status=$status"
          } >>.issue-95-ios-validation.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-95-ios-diagnostic.yml
          git add .issue-95-ios-validation.txt
          git commit -m 'Capture issue 95 iOS validation output'
          git push origin HEAD:agent/fix-issue-95-stations-panel-lifecycle
