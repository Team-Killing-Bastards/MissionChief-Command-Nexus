# Triggered after workflow registration.
name: Report v1.0.30 finalizer status

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/status-finalize-v1030.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Wait for finalizer and report exact result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '123'
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID=''
          RUN_ROW=''

          for attempt in $(seq 1 50); do
            RUNS_JSON="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/finalize-v1030.yml/runs?event=push&per_page=10"
            )"
            RUN_ROW="$(
              jq -c \
                '.workflow_runs | sort_by(.created_at) | reverse | .[0] // empty' \
                <<< "${RUNS_JSON}"
            )"

            if [[ -n "${RUN_ROW}" ]]; then
              RUN_ID="$(jq -r '.id' <<< "${RUN_ROW}")"
              STATUS="$(jq -r '.status' <<< "${RUN_ROW}")"
              [[ "${STATUS}" == 'completed' ]] && break
            fi

            sleep 15
          done

          if [[ -z "${RUN_ID}" ]]; then
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body 'v1.0.30 finalizer monitor could not find a workflow run.'
            exit 1
          fi

          RUN_URL="$(jq -r '.html_url' <<< "${RUN_ROW}")"
          STATUS="$(jq -r '.status' <<< "${RUN_ROW}")"
          CONCLUSION="$(jq -r '.conclusion // "pending"' <<< "${RUN_ROW}")"
          JOBS_JSON="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100"
          )"
          JOB_SUMMARY="$(
            jq -r \
              '.jobs[] |
               "- " + .name + ": " + .status + " / " + (.conclusion // "pending") +
               (if (.steps | length) > 0 then
                  "\n" + ([.steps[] | "  - " + .name + ": " + .status + " / " + (.conclusion // "pending")] | join("\n"))
                else "" end)' <<< "${JOBS_JSON}"
          )"

          FAILED_LOG=''
          if [[ "${CONCLUSION}" != 'success' ]]; then
            gh run view "${RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" \
              --log-failed > /tmp/v1030-finalizer-failed.log 2>&1 || true
            FAILED_LOG="$(tail -n 80 /tmp/v1030-finalizer-failed.log)"
          fi

          {
            echo '## v1.0.30 finalizer result'
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Run ID: \`${RUN_ID}\`"
            echo "- Status: \`${STATUS}\`"
            echo "- Conclusion: \`${CONCLUSION}\`"
            echo
            echo "${JOB_SUMMARY}"
            if [[ -n "${FAILED_LOG}" ]]; then
              echo
              echo '### Failed log tail'
              echo '```text'
              echo "${FAILED_LOG}"
              echo '```'
            fi
          } > /tmp/v1030-finalizer-result.md

          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/v1030-finalizer-result.md

          [[ "${CONCLUSION}" == 'success' ]]
