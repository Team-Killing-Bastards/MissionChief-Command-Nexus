name: Temporary guarded PR 374 merge verification

on:
  push:
    branches:
      - ops/pr374-guarded-landing
    paths:
      - '.github/workflows/tmp-pr374-guarded-landing.yml'

permissions:
  contents: write
  pull-requests: read
  checks: read
  statuses: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/pr374-guarded-landing
          fetch-depth: 0

      - name: Verify exact approved head merged
        shell: bash
        run: |
          set -uo pipefail
          python3 scripts/tmp-pr374/pr_watch.py \
            --target .=https://github.com/Team-Killing-Bastards/MissionChief-Command-Nexus/pull/374 \
            --no-config \
            --mode until-actionable \
            --interval 5 \
            --max-interval 20 \
            --timeout 600 \
            --jitter 0 \
            --cursor scripts/tmp-pr374/merge-watch.cursor.json \
            --observations-file scripts/tmp-pr374/merge-watch.observations.ndjson \
            --await-merge 1144ab8ce8a03170af0ff0ca456d3c298115e2c6 \
            --await-merge-mode auto \
            --await-merge-since 2026-08-19T23:02:24.232759Z \
            --pretty \
            > scripts/tmp-pr374/merge-watch.json
          watch_status=$?
          printf '%s\n' "${watch_status}" > scripts/tmp-pr374/merge-watch.exit-code

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/tmp-pr374
          git commit -m "Record exact-head merge verification for PR 374"
          git push origin HEAD:ops/pr374-guarded-landing
          exit "${watch_status}"
