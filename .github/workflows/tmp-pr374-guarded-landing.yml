name: Temporary guarded PR 374 readiness plan

on:
  push:
    branches:
      - ops/pr374-guarded-landing
    paths:
      - '.github/workflows/tmp-pr374-guarded-landing.yml'

permissions:
  contents: write
  pull-requests: read
  checks: read
  statuses: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/pr374-guarded-landing
          fetch-depth: 0

      - name: Observe exact-head readiness and produce guarded landing plan
        shell: bash
        run: |
          set -uo pipefail
          python3 scripts/tmp-pr374/pr_watch.py \
            --target .=https://github.com/Team-Killing-Bastards/MissionChief-Command-Nexus/pull/374 \
            --no-config \
            --mode until-actionable \
            --interval 5 \
            --max-interval 20 \
            --timeout 600 \
            --jitter 0 \
            --cursor scripts/tmp-pr374/readiness.cursor.json \
            --observations-file scripts/tmp-pr374/readiness.observations.ndjson \
            --pretty \
            > scripts/tmp-pr374/readiness.json
          watch_status=$?
          printf '%s\n' "${watch_status}" > scripts/tmp-pr374/readiness.exit-code

          if [[ "${watch_status}" -eq 0 ]]; then
            python3 scripts/tmp-pr374/pr_land.py \
              --repo . \
              --pr https://github.com/Team-Killing-Bastards/MissionChief-Command-Nexus/pull/374 \
              --no-config \
              --head 1144ab8ce8a03170af0ff0ca456d3c298115e2c6 \
              --mode auto \
              --method squash \
              --pretty \
              > scripts/tmp-pr374/plan.json
            plan_status=$?
          else
            printf '%s\n' '{"state":"watcher_not_ready"}' > scripts/tmp-pr374/plan.json
            plan_status="${watch_status}"
          fi
          printf '%s\n' "${plan_status}" > scripts/tmp-pr374/plan.exit-code

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/tmp-pr374
          git commit -m "Record guarded PR 374 readiness plan"
          git push origin HEAD:ops/pr374-guarded-landing
          exit "${plan_status}"
