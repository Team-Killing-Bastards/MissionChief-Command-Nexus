name: Temporary guarded PR 374 landing

on:
  push:
    branches:
      - ops/pr374-guarded-landing
    paths:
      - '.github/workflows/tmp-pr374-guarded-landing.yml'

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/pr374-guarded-landing
          fetch-depth: 0

      - name: Request guarded landing for approved exact head
        shell: bash
        run: |
          set -uo pipefail
          python3 scripts/tmp-pr374/pr_land.py \
            --repo . \
            --pr https://github.com/Team-Killing-Bastards/MissionChief-Command-Nexus/pull/374 \
            --no-config \
            --head 1144ab8ce8a03170af0ff0ca456d3c298115e2c6 \
            --mode auto \
            --method squash \
            --policy-digest 7691ab6501095b993156211c102a3520b590d3d54cb446f2df572c8e7c3f5219 \
            --confirm \
            --pretty \
            > scripts/tmp-pr374/landing.json
          landing_status=$?
          printf '%s\n' "${landing_status}" > scripts/tmp-pr374/landing.exit-code

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/tmp-pr374
          git commit -m "Record guarded PR 374 landing request"
          git push origin HEAD:ops/pr374-guarded-landing
          exit "${landing_status}"
