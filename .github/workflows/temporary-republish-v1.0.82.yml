name: Republish Command Nexus v1.0.82 externally

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.external-republish-v1.0.82-trigger'

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.82
      release_notes: 'Retry external synchronization and verified release delivery.'
    secrets: inherit
