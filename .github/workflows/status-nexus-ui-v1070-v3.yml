name: Capture repaired Nexus UI V1.0.70 builder result

on:
  push:
    branches:
      - feature/nexus-ui-system-v1070
    paths:
      - '.github/workflows/status-nexus-ui-v1070-v3.yml'

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/nexus-ui-system-v1070
      - name: Wait for and capture latest builder
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID="$({
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=feature%2Fnexus-ui-system-v1070&per_page=100" \
                --jq '.workflow_runs[] | select(.name == "Build Command Nexus visual system V1.0.70" and .head_sha == "2ebe70405fa947131a9d7effae9104cb728ecb30") | .id'
            } | head -n1)"
            if [[ -n "${RUN_ID}" ]]; then
              STATUS="$(gh run view "${RUN_ID}" --json status --jq '.status')"
              if [[ "${STATUS}" == "completed" ]]; then
                break
              fi
            fi
            sleep 5
          done

          {
            echo "run_id=${RUN_ID}"
            if [[ -n "${RUN_ID}" ]]; then
              gh run view "${RUN_ID}" --json name,status,conclusion,url,headSha
              echo '=== jobs ==='
              gh run view "${RUN_ID}" --json jobs --jq '.jobs[] | {name,status,conclusion,steps}'
              echo '=== log tail ==='
              gh run view "${RUN_ID}" --log 2>&1 | tail -n 320
            fi
          } > .nexus-ui-v1070-final-builder-status.txt
      - name: Commit status and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/status-nexus-ui-v1070-v3.yml
          git add .nexus-ui-v1070-final-builder-status.txt
          git commit -m 'Capture repaired Nexus UI V1.0.70 builder result'
          git push origin HEAD:feature/nexus-ui-system-v1070
