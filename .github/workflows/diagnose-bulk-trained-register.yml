name: Build bulk trained register update

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/bulk-trained-register-update'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/bulk-trained-register-update
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture bulk patch result
        shell: bash
        run: |
          set +e
          python3 .diagnostics/run-bulk-trained-register-update.py > /tmp/bulk-build.log 2>&1
          status=$?
          echo "${status}" > /tmp/bulk-build.status
          cat /tmp/bulk-build.log
          exit 0

      - name: Commit failed patch receipt
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat /tmp/bulk-build.status)"
          if [ "${status}" = '0' ]; then
            exit 0
          fi
          git reset --hard HEAD
          git clean -fd
          mkdir -p .diagnostics
          cp /tmp/bulk-build.log .diagnostics/bulk-build-failure.log
          echo "${status}" > .diagnostics/bulk-build-failure.status
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -f .diagnostics/bulk-build-failure.log .diagnostics/bulk-build-failure.status
          git commit -m 'Record bulk builder failure'
          git push origin HEAD:agent/bulk-trained-register-update

      - name: Require successful patch
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat /tmp/bulk-build.status)"
          if [ "${status}" != '0' ]; then
            exit "${status}"
          fi
          rm -rf .diagnostics

      - name: Validate complete candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          test ! -e src/personnel-register-tools.user.js
          grep -Fq '// @version      1.0.46' src/missionchief-command-nexus.user.js
          grep -Fq ' * MODULE 2: MISSION FINDER V10.6.110' src/missionchief-command-nexus.user.js
          grep -Fq "const PERSONNEL_VERSION = '1.3.5';" src/missionchief-command-nexus.user.js
          git diff --check

      - name: Commit validated bulk update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Candidate already current.'
            exit 0
          fi
          git commit -m 'Apply trained register and recovery bulk update'
          git push origin HEAD:agent/bulk-trained-register-update
