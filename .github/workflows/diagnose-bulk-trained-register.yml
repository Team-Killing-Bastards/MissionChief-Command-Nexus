name: Build bulk trained register update

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/bulk-trained-register-update'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/bulk-trained-register-update
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture bulk patch result
        shell: bash
        run: |
          set +e
          python3 .diagnostics/run-bulk-trained-register-update.py > /tmp/bulk-build.log 2>&1
          status=$?
          echo "${status}" > /tmp/bulk-build.status
          cat /tmp/bulk-build.log
          exit 0

      - name: Commit failed patch receipt
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat /tmp/bulk-build.status)"
          if [ "${status}" = '0' ]; then
            exit 0
          fi
          git reset --hard HEAD
          git clean -fd
          mkdir -p .diagnostics
          {
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            cat /tmp/bulk-build.log
          } > .diagnostics/bulk-build-failure.log
          {
            echo "STATUS=${status}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
          } > .diagnostics/bulk-build-failure.status
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -f .diagnostics/bulk-build-failure.log .diagnostics/bulk-build-failure.status
          git commit -m 'Record bulk builder failure'
          git push origin HEAD:agent/bulk-trained-register-update

      - name: Require successful patch
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat /tmp/bulk-build.status)"
          if [ "${status}" != '0' ]; then
            exit "${status}"
          fi

      - name: Capture complete validation result
        shell: bash
        run: |
          set +e
          log=/tmp/bulk-validation.log
          : > "${log}"
          status=0

          run_check() {
            label="$1"
            shift
            printf '\n### %s\n' "${label}" >> "${log}"
            "$@" >> "${log}" 2>&1
            result=$?
            if [ "${result}" != '0' ]; then
              status="${result}"
            fi
          }

          run_check 'JavaScript syntax' node --check src/missionchief-command-nexus.user.js
          if [ "${status}" = '0' ]; then run_check 'Userscript metadata' node scripts/validate-userscript.mjs; fi
          if [ "${status}" = '0' ]; then run_check 'Repository integrity' python3 scripts/check_repository.py; fi
          if [ "${status}" = '0' ]; then
            for check in scripts/check-*.mjs; do
              run_check "${check}" node "${check}"
              if [ "${status}" != '0' ]; then break; fi
            done
          fi
          if [ "${status}" = '0' ]; then run_check 'Standalone source absence' test ! -e src/personnel-register-tools.user.js; fi
          if [ "${status}" = '0' ]; then run_check 'Version metadata' grep -Fq '// @version      1.0.46' src/missionchief-command-nexus.user.js; fi
          if [ "${status}" = '0' ]; then run_check 'Mission Finder header' grep -Fq ' * MODULE 2: MISSION FINDER V10.6.110' src/missionchief-command-nexus.user.js; fi
          if [ "${status}" = '0' ]; then run_check 'Personnel version' grep -Fq "const PERSONNEL_VERSION = '1.3.5';" src/missionchief-command-nexus.user.js; fi
          if [ "${status}" = '0' ]; then run_check 'Diff whitespace' git diff --check; fi

          printf '\nFINAL_STATUS=%s\n' "${status}" >> "${log}"
          echo "${status}" > /tmp/bulk-validation.status
          tail -n 220 "${log}"
          exit 0

      - name: Commit failed validation receipt
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat /tmp/bulk-validation.status)"
          if [ "${status}" = '0' ]; then
            exit 0
          fi
          git reset --hard HEAD
          git clean -fd
          mkdir -p .diagnostics
          {
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            cat /tmp/bulk-validation.log
          } > .diagnostics/bulk-validation-failure.log
          {
            echo "STATUS=${status}"
            echo "RUN_ID=${GITHUB_RUN_ID}"
          } > .diagnostics/bulk-validation-failure.status
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -f .diagnostics/bulk-validation-failure.log .diagnostics/bulk-validation-failure.status
          git commit -m 'Record bulk validation failure'
          git push origin HEAD:agent/bulk-trained-register-update

      - name: Require successful validation
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat /tmp/bulk-validation.status)"
          if [ "${status}" != '0' ]; then
            exit "${status}"
          fi
          rm -rf .diagnostics

      - name: Promote validated bulk update
        shell: bash
        run: |
          set +e
          log=/tmp/bulk-promotion.log
          : > "${log}"
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A

          if git diff --cached --quiet; then
            echo 'Candidate already current.' | tee -a "${log}"
            exit 0
          fi

          git commit -m 'Apply trained register and recovery bulk update' >> "${log}" 2>&1
          commit_status=$?
          push_status=0

          if [ "${commit_status}" = '0' ]; then
            git push origin HEAD:agent/bulk-trained-register-update >> "${log}" 2>&1
            push_status=$?
          fi

          if [ "${commit_status}" = '0' ] && [ "${push_status}" = '0' ]; then
            cat "${log}"
            exit 0
          fi

          cat "${log}"
          git fetch origin agent/bulk-trained-register-update --force
          git reset --hard origin/agent/bulk-trained-register-update
          git clean -fd
          mkdir -p .diagnostics
          {
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "COMMIT_STATUS=${commit_status}"
            echo "PUSH_STATUS=${push_status}"
            cat "${log}"
          } > .diagnostics/bulk-promotion-failure.log
          git add -f .diagnostics/bulk-promotion-failure.log
          git commit -m 'Record bulk promotion failure'
          git push origin HEAD:agent/bulk-trained-register-update
          exit 1
