name: Locate issue 57 legacy references

on:
  pull_request:
    paths:
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Record all bundled-profile references
        shell: bash
        run: |
          grep -n -C 8 'public_order_combined_vehicle' src/missionchief-command-nexus.user.js > COMBINED_CONTEXT.txt || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add COMBINED_CONTEXT.txt
          git commit -m 'Record legacy bundled-profile references'
          git push origin HEAD:${{ github.head_ref }}
