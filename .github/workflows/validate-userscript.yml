name: Validate userscript
# Includes mission-definition trained-personnel, diagnostic export, dispatch-correction, memory lifecycle/recycle, Missing-on-mission authority and single-pass update coverage.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/validate-userscript.mjs'
      - 'scripts/check-ios-compatibility.mjs'
      - 'scripts/check-runtime-hardening.mjs'
      - 'scripts/check-police-irv-fallback.mjs'
      - 'scripts/check-ios-unit-finder-selection.mjs'
      - 'scripts/check-ios-mission-requirements-source.mjs'
      - 'scripts/check-iphone-mission-ui.mjs'
      - 'scripts/check-open-issues-batch.mjs'
      - 'scripts/check-missing-requirements-priority.mjs'
      - 'scripts/check-missing-on-mission-authority.mjs'
      - 'scripts/check-mission-update-single-pass.mjs'
      - 'scripts/check-trained-coverage-optimizer.mjs'
      - 'scripts/check-mission-definition-trained-personnel.mjs'
      - 'scripts/check-unit-finder-diagnostic-export.mjs'
      - 'scripts/check-auto-memory-lifecycle.mjs'
      - 'scripts/check-auto-memory-recycle.mjs'
      - 'scripts/check-auto-dispatch-eod-required-personnel.mjs'
      - 'scripts/check-road-rail-rru-mapping.mjs'
      - 'scripts/check-auto-prisoner-cell-gate.mjs'
      - 'scripts/check-fire-engine-update-mapping.mjs'
      - 'scripts/check-saved-position-helper-copy.mjs'
      - 'scripts/check-bulk-trained-register-update.mjs'
      - 'scripts/check-hems-ambulance-eta-priority.mjs'
      - 'scripts/check-police-search-advisor-register.mjs'
      - '.github/workflows/validate-userscript.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/validate-userscript.mjs'
      - 'scripts/check-ios-compatibility.mjs'
      - 'scripts/check-runtime-hardening.mjs'
      - 'scripts/check-police-irv-fallback.mjs'
      - 'scripts/check-ios-unit-finder-selection.mjs'
      - 'scripts/check-ios-mission-requirements-source.mjs'
      - 'scripts/check-iphone-mission-ui.mjs'
      - 'scripts/check-open-issues-batch.mjs'
      - 'scripts/check-missing-requirements-priority.mjs'
      - 'scripts/check-missing-on-mission-authority.mjs'
      - 'scripts/check-mission-update-single-pass.mjs'
      - 'scripts/check-trained-coverage-optimizer.mjs'
      - 'scripts/check-mission-definition-trained-personnel.mjs'
      - 'scripts/check-unit-finder-diagnostic-export.mjs'
      - 'scripts/check-auto-memory-lifecycle.mjs'
      - 'scripts/check-auto-memory-recycle.mjs'
      - 'scripts/check-auto-dispatch-eod-required-personnel.mjs'
      - 'scripts/check-road-rail-rru-mapping.mjs'
      - 'scripts/check-auto-prisoner-cell-gate.mjs'
      - 'scripts/check-fire-engine-update-mapping.mjs'
      - 'scripts/check-saved-position-helper-copy.mjs'
      - 'scripts/check-bulk-trained-register-update.mjs'
      - 'scripts/check-hems-ambulance-eta-priority.mjs'
      - 'scripts/check-police-search-advisor-register.mjs'
      - '.github/workflows/validate-userscript.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-userscript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Userscript validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        run: node --check src/missionchief-command-nexus.user.js

      - name: Validate metadata and Greasy Fork limits
        run: node scripts/validate-userscript.mjs

      - name: Validate iOS Safari compatibility contracts
        run: node scripts/check-ios-compatibility.mjs

      - name: Validate runtime performance and lifecycle contracts
        run: node scripts/check-runtime-hardening.mjs

      - name: Validate normal Police IRV fallback contracts
        run: node scripts/check-police-irv-fallback.mjs

      - name: Validate iOS Safari Unit Finder selection contracts
        run: node scripts/check-ios-unit-finder-selection.mjs

      - name: Validate iOS Safari mission requirement source contracts
        run: node scripts/check-ios-mission-requirements-source.mjs

      - name: Validate iPhone Safari Mission Finder UI contracts
        run: node scripts/check-iphone-mission-ui.mjs

      - name: Validate current open issue batch contracts
        run: node scripts/check-open-issues-batch.mjs

      - name: Validate current missing-requirements priority contracts
        run: node scripts/check-missing-requirements-priority.mjs

      - name: Validate Missing on mission authority
        run: node scripts/check-missing-on-mission-authority.mjs

      - name: Validate Mission Update single-pass selection
        run: node scripts/check-mission-update-single-pass.mjs

      - name: Validate trained-personnel coverage optimiser contracts
        run: node scripts/check-trained-coverage-optimizer.mjs

      - name: Validate mission-definition trained-personnel parsing
        run: node scripts/check-mission-definition-trained-personnel.mjs

      - name: Validate Unit Finder diagnostic export
        run: node scripts/check-unit-finder-diagnostic-export.mjs

      - name: Validate Auto Mode memory lifecycle
        run: node scripts/check-auto-memory-lifecycle.mjs

      - name: Validate Auto Mode memory recycle guard
        run: node scripts/check-auto-memory-recycle.mjs

      - name: Validate Auto Mode EOD and composite personnel corrections
        run: node scripts/check-auto-dispatch-eod-required-personnel.mjs

      - name: Validate Road Rail Unit to RRU mapping
        run: node scripts/check-road-rail-rru-mapping.mjs

      - name: Validate Auto Mode prisoner cell gate
        run: node scripts/check-auto-prisoner-cell-gate.mjs

      - name: Validate Fire Engine Update mapping and Auto Mode helper cleanup
        run: node scripts/check-fire-engine-update-mapping.mjs

      - name: Validate saved-position helper copy removal
        run: node scripts/check-saved-position-helper-copy.mjs

      - name: Validate bulk trained-register, Search Advisor and recovery update
        run: node scripts/check-bulk-trained-register-update.mjs

      - name: Validate HEMS ambulance ETA priority
        run: node scripts/check-hems-ambulance-eta-priority.mjs

      - name: Validate Police Search Advisor register coverage
        run: node scripts/check-police-search-advisor-register.mjs

      - name: Require a version increase when code changes
        if: github.event_name == 'pull_request'
        run: node scripts/validate-userscript.mjs --base-ref "origin/${{ github.base_ref }}"
