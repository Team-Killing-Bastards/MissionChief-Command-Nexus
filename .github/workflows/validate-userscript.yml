name: Inspect selector and personnel-register functions

on:
  pull_request:
    paths:
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  inspect:
    name: Build focused source inspection report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out inspection branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Build focused report
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js')
          lines = source.read_text(encoding='utf-8').splitlines()

          patterns = {
              'ORDINARY POLICE ENGINE': [
                  r'MF_PROTECTED_ORDINARY_IRV_TRAINING_CODES',
                  r'ordinary[^\n]{0,40}IRV',
                  r'IRV[^\n]{0,40}ordinary',
                  r'normal[^\n]{0,40}Police',
                  r'protected[^\n]{0,40}specialist',
                  r'trainedPersonnelRequirements',
                  r'tablePolice(?:Cars?|Officers?)',
              ],
              'TRAINED MISSION REQUIREMENTS': [
                  r'tableLevel1PublicOrderRequired',
                  r'tableLevel2PublicOrderRequired',
                  r'tablePoliceSergeantRequired',
                  r'tablePoliceMedicRequired',
                  r'tablePoliceInspectorRequired',
                  r'police_medic',
                  r'railway_police',
                  r'Railway Police Officer',
                  r'Police Medic',
              ],
              'ATV AND ATC MAPPING': [
                  r'ATV Carrier',
                  r'ATC Carrier',
                  r'ATV',
                  r'Armed Traffic Car',
              ],
              'PERSONNEL REGISTRY ENGINE': [
                  r'PERSONNEL_TRAINING_REGISTRY',
                  r'PersonnelTrainingRegistry',
                  r'personnel.*registry',
                  r'registry.*personnel',
                  r'startPersonnelRun',
                  r'refreshPersonnelStations',
                  r'PERSONNEL_STATE\.action',
                  r'preview',
              ],
          }

          report = []
          report.append('SOURCE FUNCTION INDEX')
          report.append('=====================')

          for title, raw_patterns in patterns.items():
              regexes = [re.compile(p, re.I) for p in raw_patterns]
              hits = [
                  i for i, line in enumerate(lines)
                  if any(rx.search(line) for rx in regexes)
              ]

              report.append(f'\n===== {title} =====')
              for i in hits:
                  report.append(f'{i + 1:05d}: {lines[i]}')

              # Merge 45-line contexts around hits, allowing enough code to see
              # the containing function without producing the full userscript.
              windows = []
              for i in hits:
                  start = max(0, i - 45)
                  end = min(len(lines), i + 46)
                  if windows and start <= windows[-1][1] + 8:
                      windows[-1] = (windows[-1][0], max(windows[-1][1], end))
                  else:
                      windows.append((start, end))

              report.append(f'\nCONTEXT WINDOWS: {len(windows)}')
              for number, (start, end) in enumerate(windows[:30], 1):
                  report.append(f'\n--- {title} context {number}: lines {start + 1}-{end} ---')
                  for line_no in range(start, end):
                      report.append(f'{line_no + 1:05d}: {lines[line_no]}')
              if len(windows) > 30:
                  report.append(f'... {len(windows) - 30} additional windows omitted ...')

          out = Path('docs/inspection-police-personnel-atv-focused.txt')
          out.write_text('\n'.join(report) + '\n', encoding='utf-8')
          PY

      - name: Commit focused report to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/inspection-police-personnel-atv-focused.txt
          if git diff --cached --quiet; then
            echo 'Focused inspection report is unchanged.'
            exit 0
          fi
          git commit -m 'Add focused selector inspection report'
          git push origin "HEAD:${{ github.head_ref }}"
