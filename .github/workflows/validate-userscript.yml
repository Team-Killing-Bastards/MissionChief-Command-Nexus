name: Audit iOS Safari menu

on:
  pull_request:
    paths:
      - 'scripts/audit-ios-menu.py'
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Generate focused audit
        run: python3 scripts/audit-ios-menu.py
      - name: Commit audit reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IOS_MENU_AUDIT.txt IOS_MENU_FUNCTIONS.txt
          git commit -m 'Record iOS Safari menu audit'
          git push origin HEAD:${{ github.head_ref }}
