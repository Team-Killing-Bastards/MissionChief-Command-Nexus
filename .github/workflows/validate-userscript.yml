name: Close resolved issue 30

on:
  pull_request:
    paths:
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: read
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close completed issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close 30 --repo "${GITHUB_REPOSITORY}" --reason completed
