name: Capture v1.0.14 Discord receipt

on:
  pull_request:
    paths:
      - '.github/workflows/validate-userscript.yml'

permissions:
  actions: read
  contents: read

jobs:
  receipt:
    name: Capture exact release receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print verified v1.0.14 receipt only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow repository-quality.yml --event pull_request_target --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          [[ -n "${RUN_ID}" ]]
          CONCLUSION="$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json conclusion --jq '.conclusion')"
          [[ "${CONCLUSION}" == 'success' ]]
          RECEIPT="$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log | grep -E 'Discord webhook target verified|Discord release notification posted for v1\.0\.14' || true)"
          printf '%s\n' "${RECEIPT}"
          grep -q 'Discord release notification posted for v1.0.14: message_id=' <<< "${RECEIPT}"
          grep -q 'channel_id=' <<< "${RECEIPT}"

      - name: Confirm release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET='MissionChief-Command-Nexus-1.0.14.user.js'
          CHECKSUM="${ASSET}.sha256"
          COUNT="$(gh release view v1.0.14 --repo "${GITHUB_REPOSITORY}" --json assets --jq ".assets | map(select(.name == \"${ASSET}\" or .name == \"${CHECKSUM}\")) | unique_by(.name) | length")"
          [[ "${COUNT}" == '2' ]]
          echo 'v1.0.14 release assets confirmed.'
