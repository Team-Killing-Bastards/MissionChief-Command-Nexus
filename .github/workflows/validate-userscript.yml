name: Validate userscript

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/validate-userscript.mjs'
      - '.github/workflows/validate-userscript.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/validate-userscript.mjs'
      - '.github/workflows/validate-userscript.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Userscript validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        run: node --check src/missionchief-command-nexus.user.js

      - name: Validate metadata and Greasy Fork limits
        run: node scripts/validate-userscript.mjs

      - name: Require a version increase when code changes
        if: github.event_name == 'pull_request'
        run: node scripts/validate-userscript.mjs --base-ref "origin/${{ github.base_ref }}"
