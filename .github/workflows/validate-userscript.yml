name: Build v1.0.24 Police Officer alert fix

on:
  pull_request:
    paths:
      - 'scripts/apply-v1.0.24-police-rescue.py'
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply controlled corrective patch
        run: python3 scripts/apply-v1.0.24-police-rescue.py

      - name: Run focused operational regressions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const source = fs.readFileSync('src/missionchief-command-nexus.user.js', 'utf8');

          function extractFunction(name) {
            const marker = `function ${name}(`;
            const start = source.indexOf(marker);
            assert.notStrictEqual(start, -1, `${name} is missing`);
            const paramsStart = source.indexOf('(', start);
            let paramsDepth = 0, quote = '', escaped = false, bodyStart = -1;
            for (let i = paramsStart; i < source.length; i++) {
              const ch = source[i];
              if (quote) {
                if (escaped) escaped = false;
                else if (ch === '\\') escaped = true;
                else if (ch === quote) quote = '';
                continue;
              }
              if (ch === '"' || ch === "'" || ch === '`') { quote = ch; continue; }
              if (ch === '(') paramsDepth++;
              else if (ch === ')' && --paramsDepth === 0) {
                bodyStart = source.indexOf('{', i + 1);
                break;
              }
            }
            assert.notStrictEqual(bodyStart, -1, `${name} body missing`);
            let depth = 0;
            quote = '';
            escaped = false;
            for (let i = bodyStart; i < source.length; i++) {
              const ch = source[i];
              if (quote) {
                if (escaped) escaped = false;
                else if (ch === '\\') escaped = true;
                else if (ch === quote) quote = '';
                continue;
              }
              if (ch === '"' || ch === "'" || ch === '`') { quote = ch; continue; }
              if (ch === '{') depth++;
              else if (ch === '}' && --depth === 0) return source.slice(start, i + 1);
            }
            throw new Error(`Could not extract ${name}`);
          }

          const context = {
            console,
            mfDebugEnabled: false,
            debugLog() {},
            getSarPersonnelVehicleRequirement() { return null; }
          };
          vm.createContext(context);
          vm.runInContext([
            extractFunction('getMissingPersonnelSegment'),
            extractFunction('getNamedPersonnelCount'),
            extractFunction('getPoliceOfficerVehicleRequirement'),
            extractFunction('getSupportedMissingPersonnelRowsFromText')
          ].join('\n'), context);

          for (const [officers, cars] of [[1, 1], [2, 1], [3, 2], [5, 3]]) {
            const rows = context.getSupportedMissingPersonnelRowsFromText(
              `Missing Personnel: ${officers} Police Officers`,
              { silent: true }
            );
            const police = rows.find(row => row.unitName === 'Police Car');
            assert(police, `${officers} Police Officers did not produce Police Car`);
            assert.strictEqual(police.stillNeeded, cars);
            assert.strictEqual(police.personnelPerVehicle, 2);
            assert.strictEqual(police.convertedFromPersonnelRequirement, true);
          }

          const nameFirst = context.getSupportedMissingPersonnelRowsFromText(
            'Missing Personnel: Police Officers x5',
            { silent: true }
          ).find(row => row.unitName === 'Police Car');
          assert(nameFirst);
          assert.strictEqual(nameFirst.stillNeeded, 3);

          const target = vm.runInNewContext(`(${extractFunction('getLiveRequirementDispatchTarget')})`);
          assert.strictEqual(target({ required: 8, stillNeeded: 1, stillNeededText: '1' }), 1);
          assert.strictEqual(target({ required: 8, stillNeeded: 3, stillNeededText: '0-3' }), 3);
          assert.strictEqual(target({ required: 8, stillNeeded: 0, stillNeededText: '?' }), 8);

          assert(/rescue\s+support[\s\S]{0,5000}includes\(\s*['"]83['"]\s*\)/i.test(source), 'type-83 Rescue Support contract missing');
          const allMatching = extractFunction('getAllMatchingVehicleCheckboxes');
          const countSelected = extractFunction('countSelectedMatchingVehicles');
          const findButton = extractFunction('findUnitButton');
          assert(/rescueSupport/i.test(allMatching), 'Rescue Support missing from initial selector');
          assert(/rescueSupport/i.test(countSelected), 'Rescue Support missing from selected counter');
          assert(/rescueSupport/i.test(findButton), 'Rescue Support missing from fallback selector');
          assert(source.includes('UNIT FINDER ARMED PERSONNEL'));
          assert(source.includes("requirementType: 'armed_response_atc_vehicle'"));
          assert(source.includes('RIV or Major Foam Tender'));
          console.log('All focused v1.0.24 regressions passed.');
          NODE

      - name: Restore permanent workflow and remove temporary files
        run: |
          git fetch origin main --force
          git checkout origin/main -- .github/workflows/validate-userscript.yml
          rm -f scripts/apply-v1.0.24-police-rescue.py POLICE_TEST_DIAG.txt

      - name: Validate release candidate
        run: |
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          python3 scripts/check_repository.py
          git diff --check
          grep -q '^// @version      1.0.24$' src/missionchief-command-nexus.user.js
          grep -q 'MODULE 2: MISSION FINDER V10.6.89' src/missionchief-command-nexus.user.js

      - name: Commit validated candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix Missing Personnel Police Officer mapping'
          git push origin HEAD:${{ github.head_ref }}
