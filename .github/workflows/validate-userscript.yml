name: Diagnose v1.0.24 Police Officer conversion

on:
  pull_request:
    paths:
      - 'scripts/apply-v1.0.24-police-rescue.py'
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch and capture exact parser output
        shell: bash
        run: |
          set +e
          python3 scripts/apply-v1.0.24-police-rescue.py > POLICE_TEST_DIAG.txt 2>&1
          patch_status=$?
          echo "patch_status=${patch_status}" >> POLICE_TEST_DIAG.txt
          node <<'NODE' >> POLICE_TEST_DIAG.txt 2>&1
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('src/missionchief-command-nexus.user.js', 'utf8');
          function extractFunction(name) {
            const marker = `function ${name}(`;
            const start = source.indexOf(marker);
            console.log(`${name}_start=${start}`);
            if (start < 0) throw new Error(`${name} missing`);
            const braceStart = source.indexOf('{', start);
            let depth = 0, quote = '', escaped = false;
            for (let i = braceStart; i < source.length; i++) {
              const ch = source[i];
              if (quote) {
                if (escaped) escaped = false;
                else if (ch === '\\') escaped = true;
                else if (ch === quote) quote = '';
                continue;
              }
              if (ch === '"' || ch === "'" || ch === '`') { quote = ch; continue; }
              if (ch === '{') depth++;
              if (ch === '}' && --depth === 0) return source.slice(start, i + 1);
            }
            throw new Error(`${name} unterminated`);
          }
          try {
            const context = {
              console,
              mfDebugEnabled: false,
              debugLog() {},
              getSarPersonnelVehicleRequirement() { return null; }
            };
            vm.createContext(context);
            vm.runInContext([
              extractFunction('getMissingPersonnelSegment'),
              extractFunction('getNamedPersonnelCount'),
              extractFunction('getPoliceOfficerVehicleRequirement'),
              extractFunction('getSupportedMissingPersonnelRowsFromText')
            ].join('\n'), context);
            for (const text of [
              'Missing Personnel: 1 Police Officer',
              'Missing Personnel: 2 Police Officers',
              'Missing Personnel: 3 Police Officers',
              'Missing Personnel: 5 Police Officers',
              'Missing Personnel: Police Officers x5'
            ]) {
              console.log(`INPUT=${text}`);
              console.log(`SEGMENT=${context.getMissingPersonnelSegment(text)}`);
              console.log(`COUNT=${context.getNamedPersonnelCount(context.getMissingPersonnelSegment(text), 'police\\s+officer(?:s)?')}`);
              console.log(`ROWS=${JSON.stringify(context.getSupportedMissingPersonnelRowsFromText(text, { silent: true }))}`);
            }
          } catch (error) {
            console.error(error && error.stack ? error.stack : error);
            process.exitCode = 1;
          }
          NODE
          test_status=$?
          echo "test_status=${test_status}" >> POLICE_TEST_DIAG.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add POLICE_TEST_DIAG.txt
          git commit -m 'Record v1.0.24 Police Officer diagnostic'
          git push origin HEAD:${{ github.head_ref }}
