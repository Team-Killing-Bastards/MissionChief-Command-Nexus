name: Diagnose issue 57 patch

on:
  pull_request:
    paths:
      - 'scripts/apply-v1.0.9-issue57.py'
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Capture patch result
        shell: bash
        run: |
          set +e
          python3 scripts/apply-v1.0.9-issue57.py > PATCH_ERROR.txt 2>&1
          status=$?
          echo "exit_status=${status}" >> PATCH_ERROR.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PATCH_ERROR.txt
          git commit -m 'Record issue 57 patch diagnostic'
          git push origin HEAD:${{ github.head_ref }}
