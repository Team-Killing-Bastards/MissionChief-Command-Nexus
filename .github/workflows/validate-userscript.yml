name: Validate userscript

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**/*.mjs'
      - 'project-state.json'
      - 'docs/PROJECT_STATE.md'
      - 'docs/project-state.schema.json'
      - 'docs/decisions/**'
      - 'docs/evidence/**'
      - '.github/workflows/validate-userscript.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**/*.mjs'
      - 'project-state.json'
      - 'docs/PROJECT_STATE.md'
      - 'docs/project-state.schema.json'
      - 'docs/decisions/**'
      - 'docs/evidence/**'
      - '.github/workflows/validate-userscript.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-userscript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Userscript validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate JavaScript syntax
        run: node --check src/missionchief-command-nexus.user.js

      - name: Validate canonical metadata and module versions
        run: node scripts/validate-userscript.mjs

      - name: Validate current project state
        run: node scripts/check-project-state.mjs

      - name: Run complete permanent regression suite
        shell: bash
        run: |
          set -euo pipefail
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done

      - name: Require a version increase when distributable source changes
        if: github.event_name == 'pull_request'
        run: node scripts/validate-userscript.mjs --base-ref "origin/${{ github.base_ref }}"
