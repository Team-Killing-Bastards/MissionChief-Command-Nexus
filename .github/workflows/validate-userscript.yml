name: Validate userscript

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/validate-userscript.mjs'
      - '.github/workflows/validate-userscript.yml'
      - '.automation/**'

permissions:
  contents: write

concurrency:
  group: validate-userscript-v1-0-4-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalise-v1-0-4:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/v1.0.4-auto-load-limited-vehicles'
    name: Finalise v1.0.4 candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Tighten page completion and validate
        shell: bash
        run: |
          set -euo pipefail

          python3 .automation/tighten_v1_0_4_page_completion.py
          rm -rf .automation

          git fetch origin main
          git checkout origin/main -- .github/workflows/validate-userscript.yml

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require confirmed rows before loading next vehicle page"

      - name: Rebase and publish completed candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin HEAD:refs/heads/${{ github.head_ref }}
