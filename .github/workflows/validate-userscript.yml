name: Verify v1.0.5 release publication

on:
  pull_request:
    paths:
      - '.github/workflows/validate-userscript.yml'

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify GitHub, Greasy Fork and Discord release chain
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify latest automatic release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow repository-quality.yml \
              --event pull_request_target \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"

          if [[ -z "${RUN_ID}" ]]; then
            echo 'No automatic merged-PR release workflow run was found.'
            exit 1
          fi

          RUN_JSON="$(
            gh run view "${RUN_ID}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json status,conclusion,url,event,headSha,jobs
          )"

          echo "${RUN_JSON}"

          CONCLUSION="$(jq -r '.conclusion // empty' <<< "${RUN_JSON}")"
          if [[ "${CONCLUSION}" != 'success' ]]; then
            echo "Automatic release workflow ${RUN_ID} concluded ${CONCLUSION:-unknown}."
            exit 1
          fi

          RELEASE_JOB_COUNT="$(
            jq '[.jobs[] | select(.name | contains("Publish, verify and announce canonical release")) | select(.conclusion == "success")] | length' \
              <<< "${RUN_JSON}"
          )"

          DISCORD_STEP_COUNT="$(
            jq '[.jobs[].steps[]? | select(.name == "Verify deployment and notify Discord") | select(.conclusion == "success")] | length' \
              <<< "${RUN_JSON}"
          )"

          if [[ "${RELEASE_JOB_COUNT}" -lt 1 ]]; then
            echo 'The verified release job did not complete successfully.'
            exit 1
          fi

          if [[ "${DISCORD_STEP_COUNT}" -lt 1 ]]; then
            echo 'The Greasy Fork verification and Discord notification step did not complete successfully.'
            exit 1
          fi

          echo "Automatic release run ${RUN_ID} completed, including Greasy Fork verification and Discord notification."

      - name: Verify v1.0.5 release assets and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ASSET='MissionChief-Command-Nexus-1.0.5.user.js'
          CHECKSUM="${ASSET}.sha256"

          RELEASE_JSON="$(
            gh release view v1.0.5 \
              --repo "${GITHUB_REPOSITORY}" \
              --json url,isDraft,isPrerelease,tagName,targetCommitish,assets
          )"

          echo "${RELEASE_JSON}"

          jq -e '.isDraft == false and .isPrerelease == false and .tagName == "v1.0.5"' \
            <<< "${RELEASE_JSON}" >/dev/null

          ASSET_COUNT="$(
            jq --arg asset "${ASSET}" --arg checksum "${CHECKSUM}" \
              '[.assets[].name | select(. == $asset or . == $checksum)] | unique | length' \
              <<< "${RELEASE_JSON}"
          )"

          if [[ "${ASSET_COUNT}" != '2' ]]; then
            echo "Expected both v1.0.5 assets; found ${ASSET_COUNT}."
            exit 1
          fi

          rm -rf release-check
          mkdir release-check
          gh release download v1.0.5 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ASSET}" \
            --pattern "${CHECKSUM}" \
            --dir release-check \
            --clobber

          (
            cd release-check
            sha256sum -c "${CHECKSUM}"
          )

          grep -Fq '// @version      1.0.5' "release-check/${ASSET}"
          echo 'v1.0.5 release assets and SHA-256 verification passed.'
