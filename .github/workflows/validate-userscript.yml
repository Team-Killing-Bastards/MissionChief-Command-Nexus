name: Validate userscript

on:
  pull_request:
    paths:
      - '.github/workflows/validate-userscript.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect-v1-0-4:
    name: Inspect corrected v1.0.4 build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print failed builder tail
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view 29761045455 \
            --repo "${GITHUB_REPOSITORY}" \
            --log-failed | tail -n 100
