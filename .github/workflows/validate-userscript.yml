name: Verify v1.0.15 release publication

on:
  pull_request:
    paths:
      - '.github/workflows/validate-userscript.yml'

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify release, deployment and Discord receipt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify automatic release workflow and receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID=''
          for attempt in $(seq 1 36); do
            RUN_ID="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow repository-quality.yml \
                --event pull_request_target \
                --limit 8 \
                --json databaseId,status,conclusion \
                --jq '[.[] | select(.status == "completed" and .conclusion == "success")][0].databaseId // empty'
            )"
            [[ -n "${RUN_ID}" ]] && break
            sleep 5
          done

          if [[ -z "${RUN_ID}" ]]; then
            echo 'No successful automatic release workflow run was found.'
            exit 1
          fi

          RUN_JSON="$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json status,conclusion,url,event,headSha,jobs)"
          echo "${RUN_JSON}"
          [[ "$(jq -r '.conclusion // empty' <<< "${RUN_JSON}")" == 'success' ]]

          RELEASE_JOB_COUNT="$(
            jq '[.jobs[] | select(.name | contains("Publish, verify and announce canonical release")) | select(.conclusion == "success")] | length' <<< "${RUN_JSON}"
          )"
          [[ "${RELEASE_JOB_COUNT}" -ge 1 ]]

          LOG="$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log)"
          RECEIPT="$(printf '%s\n' "${LOG}" | grep -E 'Discord webhook target verified|Discord release notification posted for v1\.0\.15' || true)"
          printf '%s\n' "${RECEIPT}"
          grep -q 'Discord release notification posted for v1.0.15: message_id=' <<< "${RECEIPT}"
          grep -q 'channel_id=' <<< "${RECEIPT}"

          DEPLOYMENT_STEP_COUNT="$(
            jq '[.jobs[].steps[]? | select((.name | contains("Discord")) or (.name | contains("deployment"))) | select(.conclusion == "success")] | length' <<< "${RUN_JSON}"
          )"
          [[ "${DEPLOYMENT_STEP_COUNT}" -ge 1 ]]

      - name: Verify v1.0.15 assets and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET='MissionChief-Command-Nexus-1.0.15.user.js'
          CHECKSUM="${ASSET}.sha256"

          COUNT="$(
            gh release view v1.0.15 \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq ".assets | map(select(.name == \"${ASSET}\" or .name == \"${CHECKSUM}\")) | unique_by(.name) | length"
          )"
          [[ "${COUNT}" == '2' ]]

          mkdir release-check
          gh release download v1.0.15 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${ASSET}" \
            --pattern "${CHECKSUM}" \
            --dir release-check

          cd release-check
          sha256sum --check "${CHECKSUM}"
          grep -q '^// @version      1.0.15$' "${ASSET}"
          grep -q "const UNIT_VERSION = '3.3.6';" "${ASSET}"
          grep -q "const STATION_VERSION = '1.3.2';" "${ASSET}"
          grep -q "const PERSONNEL_VERSION = '1.3.0';" "${ASSET}"
          echo 'v1.0.15 release assets and checksum verified.'
