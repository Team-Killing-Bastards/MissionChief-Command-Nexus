permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: validate-userscript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Userscript validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        run: node --check src/missionchief-command-nexus.user.js

      - name: Validate metadata and Greasy Fork limits
        run: node scripts/validate-userscript.mjs

      - name: Validate iOS Safari compatibility contracts
        run: node scripts/check-ios-compatibility.mjs

      - name: Validate runtime performance and lifecycle contracts
        run: node scripts/check-runtime-hardening.mjs

      - name: Validate normal Police IRV fallback contracts
        run: node scripts/check-police-irv-fallback.mjs

      - name: Validate iOS Safari Unit Finder selection contracts
        run: node scripts/check-ios-unit-finder-selection.mjs

      - name: Validate iOS Safari mission requirement source contracts
        run: node scripts/check-ios-mission-requirements-source.mjs

      - name: Validate iPhone Safari Mission Finder UI contracts
        run: node scripts/check-iphone-mission-ui.mjs

      - name: Validate current open issue batch contracts
        run: node scripts/check-open-issues-batch.mjs

      - name: Validate current missing-requirements priority contracts
        run: node scripts/check-missing-requirements-priority.mjs

      - name: Validate Missing on mission authority
        run: node scripts/check-missing-on-mission-authority.mjs

      - name: Validate Mission Update single-pass selection
        run: node scripts/check-mission-update-single-pass.mjs

      - name: Validate selected trained-personnel panel
        run: node scripts/check-trained-personnel-panel.mjs

      - name: Validate Issue 215 HazMat to exact OSU mapping
        run: node scripts/check-hazmat-osu-issue-215.mjs

      - name: Validate HazMat Missing Personnel OSU capacity
        run: node scripts/check-hazmat-personnel-osu.mjs

      - name: Validate trained-personnel coverage optimiser contracts
        run: node scripts/check-trained-coverage-optimizer.mjs

      - name: Validate mission-definition trained-personnel parsing
        run: node scripts/check-mission-definition-trained-personnel.mjs

      - name: Validate mission-definition Required Personnel preload
        run: node scripts/check-mission-definition-personnel-preload.mjs

      - name: Validate trained-personnel on-scene authority
        run: node scripts/check-trained-personnel-on-scene-authority-v1080.mjs

      - name: Validate live Missing Personnel panel display
        run: node scripts/check-trained-personnel-live-missing-display-v1081.mjs

      - name: Validate bounded Ally Steal response timing
        run: node scripts/check-ally-steal-response-v1082.mjs

      - name: Validate faster patient and prisoner transport response
        run: node scripts/check-auto-transport-response-v1083.mjs

      - name: Validate complete iOS Safari Personnel Assignment controls
        run: node scripts/check-personnel-assignment-ios-completeness-v1084.mjs

      - name: Validate Unit and Station Naming Dispatch Centre filters
        run: node scripts/check-naming-dispatch-centre-filter-v1085.mjs

      - name: Validate Police Unit Naming native classes
        run: node scripts/check-police-unit-naming-classes-v10105.mjs

      - name: Validate Recovery Unit Naming native classes
        run: node scripts/check-recovery-unit-naming-classes-v10106.mjs

      - name: Validate Road Rail Unit Naming native class
        run: node scripts/check-road-rail-unit-naming-class-v10107.mjs

      - name: Validate Officer response location Station Naming
        run: node scripts/check-officer-station-naming-v10108.mjs

      - name: Validate Station to Unit Naming chain
        run: node scripts/check-station-unit-naming-chain-v10109.mjs

      - name: Validate Station Naming Move Building address fallback
        run: node scripts/check-station-move-address-v10110.mjs

      - name: Validate Dispatch Centre-first naming flow
        run: node scripts/check-naming-dispatch-centre-first-v1086.mjs

      - name: Validate Dispatch Centre refresh parser and retry state
        run: node scripts/check-naming-dispatch-centre-refresh-v1087.mjs

      - name: Validate Dispatch Centre assignment source
        run: node scripts/check-naming-dispatch-centre-assignment-source-v1088.mjs

      - name: Validate resilient Dispatch Centre Retry action
        run: node scripts/check-naming-dispatch-centre-retry-v1089.mjs

      - name: Validate null Dispatch Centre assignment handling
        run: node scripts/check-naming-dispatch-centre-unassigned-seed-v1090.mjs

      - name: Validate profile Dispatch Centre and Service hierarchy
        run: node scripts/check-naming-dispatch-centre-profile-hierarchy-v1091.mjs

      - name: Validate Unit Finder diagnostic export
        run: node scripts/check-unit-finder-diagnostic-export.mjs

      - name: Validate integrated MissionChief Nexus dashboard
        run: node scripts/check-mission-dashboard-v1069.mjs

      - name: Validate Command Nexus visual system
        run: node scripts/check-nexus-visual-system-v1070.mjs

      - name: Validate compact Nexus UI and disclosures
        run: node scripts/check-compact-nexus-ui-v1071.mjs

      - name: Validate attached Vehicle Load drawer
        run: node scripts/check-vehicle-load-drawer-v1072.mjs

      - name: Validate fresh-mission preloaded Vehicle Load requirements
        run: node scripts/check-vehicle-load-preloaded-requirements-v1075.mjs

      - name: Validate high-risk Missing Person Ambulance setting
        run: node scripts/check-high-risk-missing-person-ambulance-v1076.mjs

      - name: Validate normal Stations overview popup ownership
        run: node scripts/check-station-overview-popup-v1077.mjs

      - name: Validate Dispatch Centres Show all middle-click popup
        run: node scripts/check-dispatch-centres-show-all-popup-v1078.mjs

      - name: Validate Dispatch Centres popup-window enforcement
        run: node scripts/check-dispatch-centres-popup-window-v1079.mjs

      - name: Validate top-aligned animated Vehicle drawer and action order
        run: node scripts/check-vehicle-drawer-animation-v1073.mjs

      - name: Validate Auto Mode memory lifecycle
        run: node scripts/check-auto-memory-lifecycle.mjs

      - name: Validate Auto Mode memory recycle guard
        run: node scripts/check-auto-memory-recycle.mjs

      - name: Validate runtime memory maintenance and frame ownership
        run: node scripts/check-runtime-memory-maintenance-v1074.mjs

      - name: Validate deep idle and Auto Mode memory controls
        run: node scripts/check-runtime-memory-deep-dive-v1082.mjs

      - name: Validate Auto Mode EOD and composite personnel corrections
        run: node scripts/check-auto-dispatch-eod-required-personnel.mjs

      - name: Validate Road Rail Unit to RRU mapping
        run: node scripts/check-road-rail-rru-mapping.mjs

      - name: Validate Auto Mode prisoner cell gate
        run: node scripts/check-auto-prisoner-cell-gate.mjs

      - name: Validate Fire Engine Update mapping and Auto Mode helper cleanup
        run: node scripts/check-fire-engine-update-mapping.mjs

      - name: Validate saved-position helper copy removal
        run: node scripts/check-saved-position-helper-copy.mjs

      - name: Validate bulk trained-register, Search Advisor and recovery update
        run: node scripts/check-bulk-trained-register-update.mjs

      - name: Validate HEMS ambulance ETA priority
        run: node scripts/check-hems-ambulance-eta-priority.mjs

      - name: Validate Police Search Advisor register coverage
        run: node scripts/check-police-search-advisor-register.mjs

      - name: Require a version increase when code changes
        if: github.event_name == 'pull_request'
        run: node scripts/validate-userscript.mjs --base-ref "origin/${{ github.base_ref }}"

  build_v1086:
    name: One-shot v1.0.86 builder
    if: github.event_name == 'push' && github.event.head_commit.message == 'Run active v1.0.86 builder'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out v1.0.86 feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/dispatch-centre-first-v1086
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Build and validate v1.0.86
        run: |
          set -euo pipefail
          python3 scripts/build-v1086-dispatch-centre-first.py
          python3 scripts/build-v1086-post.py
          rm -f scripts/build-v1086-dispatch-centre-first.py scripts/build-v1086-post.py scripts/v1086-dispatch-centre-helpers.txt
          node --check src/missionchief-command-nexus.user.js
          for check in scripts/check-*.mjs; do
            echo "Running $check"
            node "$check"
          done
          git diff --check

      - name: Push clean candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Dispatch Centre-first naming flow for v1.0.86'
          git push origin HEAD:fix/dispatch-centre-first-v1086

      - name: Report build success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment 262 --repo "$GITHUB_REPOSITORY" --body
          'v1.0.86 ACTIVE BUILDER PASS: clean candidate pushed after full regression suite.'

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment 262 --repo "$GITHUB_REPOSITORY" --body
          "v1.0.86 ACTIVE BUILDER FAILED: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
