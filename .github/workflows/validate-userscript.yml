name: Diagnose v1.0.5 patch

on:
  pull_request:
    paths:
      - 'scripts/apply-v1.0.5-police-register-atv-fixes.py'
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  diagnose:
    name: Capture deterministic patch failure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Capture patch output without retaining partial changes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p docs
          set +e
          python3 scripts/apply-v1.0.5-police-register-atv-fixes.py > docs/v1.0.5-patch-diagnostic.txt 2>&1
          STATUS=$?
          set -e
          printf '\nexit_status=%s\n' "${STATUS}" >> docs/v1.0.5-patch-diagnostic.txt
          git restore src/missionchief-command-nexus.user.js README.md src/README.md CHANGELOG.md || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v1.0.5-patch-diagnostic.txt
          git commit -m 'Capture v1.0.5 patch diagnostic'
          git push origin "HEAD:${{ github.head_ref }}"
