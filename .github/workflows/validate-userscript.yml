name: Audit issue 57

on:
  pull_request:
    paths:
      - 'scripts/audit-issue57.py'
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Generate focused issue 57 audit
        run: python3 scripts/audit-issue57.py
      - name: Commit audit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ISSUE_57_AUDIT.txt
          git commit -m 'Record issue 57 trained-profile audit'
          git push origin HEAD:${{ github.head_ref }}
