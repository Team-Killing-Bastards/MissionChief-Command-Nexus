name: Inspect police, personnel register and ATV mappings

on:
  pull_request:
    paths:
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect current userscript paths
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Print targeted source contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/missionchief-command-nexus.user.js')
          lines = path.read_text(encoding='utf-8').splitlines()

          groups = {
              'ORDINARY POLICE': [
                  'Police Car', 'Police Cars', 'Police Officer', 'Police Officers',
                  'ordinary police', 'normal police', 'protected specialist'
              ],
              'POLICE MEDIC': [
                  'Police Medic', 'police_medic', 'publicOrderMedic'
              ],
              'RAILWAY POLICE': [
                  'Railway Police Officer', 'railway_police', 'publicOrderLevel1'
              ],
              'ATV / ATC': [
                  'ATV Carrier', 'ATC Carrier', 'ATC carrier', 'atv carrier', 'atc carrier'
              ],
              'PERSONNEL REGISTER UI': [
                  'training registry', 'Training Registry', 'personnel register',
                  'Preview', 'Live', 'registry'
              ],
          }

          for title, terms in groups.items():
              print(f'\n===== {title} =====')
              hits = []
              for idx, line in enumerate(lines):
                  lowered = line.lower()
                  if any(term.lower() in lowered for term in terms):
                      hits.append(idx)

              # Merge nearby windows and keep the output focused.
              windows = []
              for idx in hits:
                  start = max(0, idx - 10)
                  end = min(len(lines), idx + 11)
                  if windows and start <= windows[-1][1] + 3:
                      windows[-1] = (windows[-1][0], max(windows[-1][1], end))
                  else:
                      windows.append((start, end))

              for number, (start, end) in enumerate(windows[:24], 1):
                  print(f'\n--- context {number}: lines {start + 1}-{end} ---')
                  for line_no in range(start, end):
                      print(f'{line_no + 1:05d}: {lines[line_no]}')

              if len(windows) > 24:
                  print(f'... {len(windows) - 24} additional context windows omitted ...')
          PY
