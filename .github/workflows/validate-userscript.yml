name: Read v1.0.15 Discord receipt

on:
  pull_request:
    paths:
      - '.github/workflows/validate-userscript.yml'

permissions:
  actions: read
  contents: read

jobs:
  receipt:
    name: Read verified Discord receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print v1.0.15 receipt only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow repository-quality.yml \
              --event pull_request_target \
              --limit 8 \
              --json databaseId,status,conclusion \
              --jq '[.[] | select(.status == "completed" and .conclusion == "success")][0].databaseId // empty'
          )"
          [[ -n "${RUN_ID}" ]]
          LOG="$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log)"
          RECEIPT="$(printf '%s\n' "${LOG}" | grep 'Discord release notification posted for v1.0.15: message_id=' | tail -n 1)"
          TARGET="$(printf '%s\n' "${LOG}" | grep 'Discord webhook target verified' | tail -n 1)"
          printf '%s\n' "${TARGET}"
          printf '%s\n' "${RECEIPT}"
          grep -q 'message_id=' <<< "${RECEIPT}"
          grep -q 'channel_id=' <<< "${RECEIPT}"
