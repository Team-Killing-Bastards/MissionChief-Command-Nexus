name: Audit current Rescue Support and Police Officer contract

on:
  pull_request:
    paths:
      - 'scripts/audit-live-update-police-officers.py'
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Generate audit
        run: python3 scripts/audit-live-update-police-officers.py
      - name: Commit audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT_RESCUE_POLICE_CONTRACT.txt
          git commit -m 'Record current Rescue Support contract'
          git push origin HEAD:${{ github.head_ref }}
