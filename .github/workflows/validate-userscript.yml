name: Build release delivery receipt

on:
  pull_request:
    paths:
      - 'scripts/apply-release-delivery-receipt.py'
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply receipt patch
        run: python3 scripts/apply-release-delivery-receipt.py
      - name: Restore permanent validation workflow
        run: |
          git fetch origin main --force
          git checkout origin/main -- .github/workflows/validate-userscript.yml
          rm scripts/apply-release-delivery-receipt.py
      - name: Validate automation
        run: |
          node --check scripts/release-notify.mjs
          node --check scripts/publish-release.mjs
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          git diff --check
          grep -q 'Discord delivery receipt' scripts/release-notify.mjs
          grep -q 'Resend release and require Discord delivery receipt' .github/workflows/release-delivery-repair.yml
      - name: Commit validated automation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Require a Discord delivery receipt'
          git push origin HEAD:${{ github.head_ref }}
