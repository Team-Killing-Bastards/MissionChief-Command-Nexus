name: Audit Unit Renamer memory

on:
  pull_request:
    paths:
      - 'scripts/audit-unit-memory.py'
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Generate focused memory audit
        run: python3 scripts/audit-unit-memory.py
      - name: Commit audit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UNIT_MEMORY_AUDIT.txt
          git commit -m 'Record Unit Renamer memory audit'
          git push origin HEAD:${{ github.head_ref }}
