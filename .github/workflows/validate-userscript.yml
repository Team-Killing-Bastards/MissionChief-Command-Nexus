name: Diagnose v1.0.15 iOS menu patch

on:
  pull_request:
    paths:
      - 'scripts/apply-v1.0.15-ios-menu.py'
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Capture patch result
        shell: bash
        run: |
          set +e
          python3 scripts/apply-v1.0.15-ios-menu.py > IOS_PATCH_ERROR.txt 2>&1
          status=$?
          echo "exit_status=${status}" >> IOS_PATCH_ERROR.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IOS_PATCH_ERROR.txt
          git commit -m 'Record iOS menu patch diagnostic'
          git push origin HEAD:${{ github.head_ref }}
