name: Diagnose v1.0.15 validation

on:
  pull_request:
    paths:
      - 'scripts/apply-v1.0.15-ios-menu.py'
      - '.github/workflows/validate-userscript.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Apply candidate and capture validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-v1.0.15-ios-menu.py')
          text = path.read_text(encoding='utf-8')
          old = """    marker = f'    function {name}('
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f'{name}: function start not found')
              if source.find(marker, start + 1) >= 0:
                  raise SystemExit(f'{name}: duplicate function declaration')
              brace = source.find('{', start)
          """
          new = """    marker = f'    function {name}('
              scope_end = source.find('MODULE 2: MISSION FINDER')
              if scope_end < 0:
                  raise SystemExit('Module 2 boundary not found')
              start = source.find(marker, 0, scope_end)
              if start < 0:
                  raise SystemExit(f'{name}: Module 1 function start not found')
              if source.find(marker, start + 1, scope_end) >= 0:
                  raise SystemExit(f'{name}: duplicate Module 1 function declaration')
              brace = source.find('{', start, scope_end)
          """
          if text.count(old) != 1:
              raise SystemExit(f'Patcher scope anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          python3 scripts/apply-v1.0.15-ios-menu.py

          set +e
          {
            echo '=== NODE CHECK ==='
            node --check src/missionchief-command-nexus.user.js
            echo "node_check_exit=$?"
            echo '=== USERSCRIPT VALIDATION ==='
            node scripts/validate-userscript.mjs
            echo "userscript_exit=$?"
            echo '=== VERSION INCREASE ==='
            node scripts/validate-userscript.mjs --base-ref origin/main
            echo "version_exit=$?"
            echo '=== REPOSITORY CHECK ==='
            python3 scripts/check_repository.py
            echo "repository_exit=$?"
            echo '=== DIFF CHECK ==='
            git diff --check
            echo "diff_exit=$?"
          } > IOS_VALIDATION_ERROR.txt 2>&1

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add IOS_VALIDATION_ERROR.txt
          git commit -m 'Record v1.0.15 validation diagnostic'
          git push origin HEAD:${{ github.head_ref }}
