name: Temporary v3.0.42 trained dispatch inspection

on:
  push:
    branches:
      - fix/v3042-auto-trained-personnel-completeness

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip v3042 inspect]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract V3 recoverable stop functions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')

          def scan_balanced(start, open_char, close_char):
              depth = 0
              quote = ''
              escaped = False
              line_comment = False
              block_comment = False
              i = start
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escaped: escaped = False
                      elif ch == '\\': escaped = True
                      elif ch == quote: quote = ''
                      i += 1; continue
                  if ch == '/' and nxt == '/': line_comment = True; i += 2; continue
                  if ch == '/' and nxt == '*': block_comment = True; i += 2; continue
                  if ch in "'\"`": quote = ch; i += 1; continue
                  if ch == open_char: depth += 1
                  elif ch == close_char:
                      depth -= 1
                      if depth == 0: return i
                  i += 1
              return -1

          function_matches = list(re.finditer(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', source))

          def extract(name):
              match = next((item for item in function_matches if item.group(1) == name), None)
              if not match: return f'FUNCTION NOT FOUND: {name}\n'
              paren = source.find('(', match.start())
              paren_end = scan_balanced(paren, '(', ')')
              brace = source.find('{', paren_end)
              body_end = scan_balanced(brace, '{', '}')
              return source[match.start():body_end + 1] + '\n' if body_end >= 0 else f'UNTERMINATED: {name}\n'

          names = [
              'collectAutoStopEvidence',
              'classifyGenericRecoverableAutoStop',
              'registerRecoverableMissionSkip',
              'redirectAfterRecoverableSkip',
              'maybeHandleRecoverableAutoStop',
              'maybeRedirectSkippedMissionBeforeAuto',
              'readV2AutoStopRecord',
              'activeMissionSkipRecords',
              'isMissionTemporarilySkipped',
          ]
          Path('.tmp-v3042-recoverable-stop-functions.txt').write_text(
              '\n\n'.join(f'===== FUNCTION {name} =====\n{extract(name)}' for name in names),
              encoding='utf-8'
          )
          PY

      - name: Commit classification output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-v3042-*.txt
          git commit -m "Extract V3 recoverable stop functions [skip v3042 inspect]"
          git push origin HEAD:fix/v3042-auto-trained-personnel-completeness
