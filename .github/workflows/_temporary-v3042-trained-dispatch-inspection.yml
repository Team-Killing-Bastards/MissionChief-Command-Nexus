name: Temporary v3.0.42 Auto completeness build

on:
  push:
    branches:
      - fix/v3042-auto-trained-personnel-completeness

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v3.0.42 candidate
        run: python3 scripts/_temporary-build-v3042-auto-trained-personnel-completeness.py

      - name: Validate exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-project-state.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          git diff --check
          test ! -e .github/workflows/_temporary-v3042-trained-dispatch-inspection.yml
          test ! -e scripts/_temporary-build-v3042-auto-trained-personnel-completeness.py
          if find . -maxdepth 1 -name '.tmp-v3042-*' -print -quit | grep -q .; then
            echo 'Temporary v3.0.42 inspection files remain.' >&2
            exit 1
          fi

      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retry trained selection and block partial Auto dispatch"
          git push origin HEAD:fix/v3042-auto-trained-personnel-completeness
