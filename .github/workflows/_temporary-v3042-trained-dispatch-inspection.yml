name: Temporary v3.0.42 trained dispatch inspection

on:
  push:
    branches:
      - fix/v3042-auto-trained-personnel-completeness

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip v3042 inspect]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact async and normal functions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')

          def scan_balanced(start, open_char, close_char):
              depth = 0
              quote = ''
              escaped = False
              line_comment = False
              block_comment = False
              i = start
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = ''
                      i += 1
                      continue
                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 2
                      continue
                  if ch == '/' and nxt == '*':
                      block_comment = True
                      i += 2
                      continue
                  if ch in "'\"`":
                      quote = ch
                      i += 1
                      continue
                  if ch == open_char:
                      depth += 1
                  elif ch == close_char:
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              return -1

          def extract_function(name):
              candidates = [
                  source.find(f'    async function {name}('),
                  source.find(f'    function {name}('),
                  source.find(f'async function {name}('),
                  source.find(f'function {name}('),
              ]
              candidates = [value for value in candidates if value >= 0]
              if not candidates:
                  return f'FUNCTION NOT FOUND: {name}\n'
              start = min(candidates)
              paren = source.find('(', start)
              paren_end = scan_balanced(paren, '(', ')')
              if paren_end < 0:
                  return f'PARAMETERS UNTERMINATED: {name}\n'
              brace = source.find('{', paren_end)
              body_end = scan_balanced(brace, '{', '}')
              if body_end < 0:
                  return f'BODY UNTERMINATED: {name}\n'
              return source[start:body_end + 1] + '\n'

          groups = {
              'selection-orchestration': [
                  'handleCombinedLogic',
                  'processRequirementRows',
                  'processVehicles',
                  'selectVehiclesForTrainedPersonnelRequirements',
                  'preparePoliceVehicleSafetyForRows',
                  'ensurePoliceTrainingRegistryReady',
                  'ensureLiveTrainingVerificationPool',
              ],
              'mission-update': [
                  'readMissionUpdateRows',
                  'getExplicitCurrentMissingRequirementRows',
                  'hasExplicitCurrentMissingRequirementRows',
                  'shouldRunPostSelectionMissionUpdate',
                  'handleMissionUpdateUnits',
                  'waitForMissionUpdateBeforeUnitFinder',
              ],
              'dispatch-readiness': [
                  'waitForFastDispatchReadiness',
                  'getCurrentAutoDispatchSelectionState',
                  'isAutoSelectionValidForCurrentMission',
                  'markAutoSelectionCompletedForCurrentMission',
                  'retryAutoSelectionWhenZero',
                  'runAutoModeLoop',
                  'clickDispatchOnly',
                  'clickMissionDispatchByValue',
              ],
              'training-registry': [
                  'readPersonnelTrainingRegistry',
                  'getRegistryEntryForMissionCheckbox',
                  'isAuthoritativeLivePoliceTrainingEntry',
                  'getRegistryTrainingQualifiedCount',
                  'getRemainingTrainedPersonnelRequirements',
                  'countSelectedTrainingVehicles',
                  'verifyTrainingVehicleLive',
                  'refreshTrainingRegistryEntries',
              ],
          }
          for group, names in groups.items():
              content = []
              for name in names:
                  content.append(f'===== FUNCTION {name} =====\n{extract_function(name)}')
              Path(f'.tmp-v3042-exact-{group}.txt').write_text('\n\n'.join(content), encoding='utf-8')
          PY

      - name: Commit exact function output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-v3042-*.txt
          git commit -m "Extract exact async v3.0.42 dispatch functions [skip v3042 inspect]"
          git push origin HEAD:fix/v3042-auto-trained-personnel-completeness
