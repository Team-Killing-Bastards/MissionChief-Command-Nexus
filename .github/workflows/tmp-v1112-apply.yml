name: Temporary v1.1.12 patch and validation

on:
  push:
    branches:
      - release/v1.1.12-multi-device-performance
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.12-multi-device-performance
          fetch-depth: 0
      - name: Apply v1.1.12 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-apply-v1112.py')
          text = path.read_text(encoding='utf-8')
          old = '''        "Command Nexus `1.1.11`",\n        "Command Nexus `1.1.12`",\n        "source README version",'''
          new = '''        "| Command Nexus version | `1.1.11` |",\n        "| Command Nexus version | `1.1.12` |",\n        "source README version",'''
          if old not in text:
              raise SystemExit('temporary source README patch target missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile scripts/tmp-apply-v1112.py
          python3 scripts/tmp-apply-v1112.py
          python3 - <<'PY'
          from pathlib import Path
          replacements = (
              ('1.1.10-upload-lock-hotfix-1', '1.1.12-multi-device-performance-1'),
              (r'1\.1\.10-upload-lock-hotfix-1', r'1\.1\.12-multi-device-performance-1'),
          )
          updated = []
          for path in Path('scripts').glob('check-*.mjs'):
              text = path.read_text(encoding='utf-8')
              revised = text
              for old, new in replacements:
                  revised = revised.replace(old, new)
              if revised == text:
                  continue
              path.write_text(revised, encoding='utf-8')
              updated.append(str(path))
          if not updated:
              raise SystemExit('No permanent backend build regressions were updated')
          print('Updated backend build expectations in:')
          for path in updated:
              print(f'  - {path}')
          PY
      - name: Remove temporary patch carrier
        run: |
          rm -f scripts/tmp-apply-v1112.py
          rm -f .github/workflows/tmp-v1112-apply.yml
      - name: Validate userscript and permanent regressions
        run: |
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
      - name: Validate repository
        run: |
          python3 scripts/check_repository.py
          git diff --check
      - name: Commit permanent v1.1.12 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Release v1.1.12 multi-device logger and performance improvements"
          git push origin HEAD:release/v1.1.12-multi-device-performance
