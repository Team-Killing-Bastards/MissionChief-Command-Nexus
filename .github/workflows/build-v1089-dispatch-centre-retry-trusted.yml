name: Build trusted v1.0.89 Dispatch Centre Retry

on:
  push:
    branches:
      - main
    paths:
      - '.github/build-v1089-dispatch-centre-retry-main.trigger'
  pull_request_target:
    types: [reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: build-trusted-v1089-dispatch-centre-retry
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.number == 278 &&
       github.event.pull_request.head.ref == 'fix/dispatch-centre-retry-v1089' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.actor == 'Martyblyth' &&
       github.event.issue.number == 278 &&
       github.event.comment.body == '/build-v1089-now')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/dispatch-centre-retry-v1089
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build and validate exact v1.0.89 candidate
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          LOG="$(mktemp)"
          (
            set -euo pipefail
            python3 scripts/build-v1089-dispatch-centre-retry.py
            rm -f scripts/build-v1089-dispatch-centre-retry.py
            rm -f .github/build-v1089-dispatch-centre-retry.trigger
            rm -f .github/workflows/build-v1089-dispatch-centre-retry.yml

            node --check src/missionchief-command-nexus.user.js
            node scripts/validate-userscript.mjs
            for check in scripts/check-*.mjs; do
              echo "Running $check"
              node "$check"
            done
            python3 scripts/check_repository.py
            git diff --check

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'Fix Retry Dispatch Centres interaction in v1.0.89'
            git push origin HEAD:fix/dispatch-centre-retry-v1089
          ) >"${LOG}" 2>&1
          STATUS=$?
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          tail -n 160 "${LOG}" > /tmp/v1089-tail.log
          cat "${LOG}"
          exit 0

      - name: Report failure
        if: steps.build.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'Trusted v1.0.89 Dispatch Centre Retry builder failed. Production is unchanged.'
            echo
            echo '```text'
            cat /tmp/v1089-tail.log
            echo '```'
          } > /tmp/v1089-comment.md
          gh pr comment 278 --repo "$GITHUB_REPOSITORY" --body-file /tmp/v1089-comment.md
          exit 1

      - name: Report clean candidate
        if: steps.build.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          gh pr comment 278 --repo "$GITHUB_REPOSITORY" --body "Trusted v1.0.89 candidate built and pushed at ${sha}. JavaScript syntax, userscript metadata/size, every permanent regression, repository integrity and whitespace validation passed; temporary branch builder files were removed."
