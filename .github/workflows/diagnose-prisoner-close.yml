name: Diagnose prisoner release lightbox close

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-prisoner-release-lightbox-close'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-prisoner-release-lightbox-close
          fetch-depth: 0
          show-progress: false

      - name: Collect current prisoner close context
        run: python3 .diagnostics/collect-prisoner-close-context.py

      - name: Commit diagnostic context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add .diagnostics/prisoner-close-context.txt
          if git diff --cached --quiet; then
            echo 'Diagnostic context already current.'
            exit 0
          fi
          git commit -m 'Capture prisoner release close context'
          git push origin HEAD:agent/fix-prisoner-release-lightbox-close
