name: Extract dispatch logger audit context

on:
  push:
    branches:
      - fix/logger-dispatch-path-audit
    paths:
      - .github/workflows/extract-dispatch-audit.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/logger-dispatch-path-audit
          fetch-depth: 0

      - name: Extract dispatch and logger functions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/missionchief-command-nexus.user.js')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines()

          def extract_function(start):
              brace = source.find('{', start)
              if brace < 0:
                  return None
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(source):
                  ch = source[i]
                  nxt = source[i + 1] if i + 1 < len(source) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 2
                      continue
                  if ch == '/' and nxt == '*':
                      block_comment = True
                      i += 2
                      continue
                  if ch in ('"', "'", '`'):
                      quote = ch
                      i += 1
                      continue
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return source[start:i + 1]
                  i += 1
              return None

          tokens = [
              "createMissionLoggerEvent('dispatch'",
              'createMissionLoggerEvent("dispatch"',
              'Native MissionChief dispatch control clicked',
              'recordMissionLogger',
              'mission_alarm_btn',
              'alarm_button',
              'dispatchMode',
              'auto-share',
              'auto-not-ready',
              'ally-steal',
              'allySteal',
              'Ally Steal',
              'mfAutoMode',
              'dispatchMission',
              'sendVehicles',
              'send_and_share',
              'alarmButton'
          ]

          functions = []
          pattern = re.compile(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z0-9_$]+)\s*\(')
          for match in pattern.finditer(source):
              body = extract_function(match.start())
              if not body:
                  continue
              matched = [token for token in tokens if token in body]
              if matched:
                  functions.append((match.group(1), matched, match.start(), body))

          out = []
          for name, matched, start, body in functions:
              line = source.count('\n', 0, start) + 1
              out.append(f'### FUNCTION {name} @ line {line}')
              out.append('TOKENS: ' + ', '.join(matched))
              out.append(body)

          out.append('### RAW TOKEN CONTEXTS')
          for token in tokens:
              positions = [m.start() for m in re.finditer(re.escape(token), source)]
              out.append(f'## {token} ({len(positions)} matches)')
              for pos in positions[:30]:
                  line = source.count('\n', 0, pos) + 1
                  lo = max(0, line - 7)
                  hi = min(len(lines), line + 7)
                  out.append(f'-- around line {line} --')
                  out.extend(f'{idx + 1:06d}: {lines[idx]}' for idx in range(lo, hi))

          Path('dispatch-audit-snapshot.txt').write_text(
              '\n\n'.join(out) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Commit snapshot and remove extractor
        shell: bash
        run: |
          rm .github/workflows/extract-dispatch-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract dispatch logger audit context"
          git push origin HEAD:fix/logger-dispatch-path-audit
