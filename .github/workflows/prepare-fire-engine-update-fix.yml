name: Prepare Fire Engine Update fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fire-engine-update-type-guard-ui-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/fire-engine-update-type-guard-ui-cleanup
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Fire Engine Update fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .diagnostics/apply-fire-engine-update-fix.py
          rm -f .diagnostics/apply-fire-engine-update-fix.py

      - name: Capture complete validation result
        shell: bash
        run: |
          set +e
          mkdir -p .diagnostics
          status=0
          {
            set -x
            node --check src/missionchief-command-nexus.user.js || status=$?
            if [ "${status}" = '0' ]; then node scripts/validate-userscript.mjs || status=$?; fi
            if [ "${status}" = '0' ]; then python3 scripts/check_repository.py || status=$?; fi
            if [ "${status}" = '0' ]; then
              for check in scripts/check-*.mjs; do
                echo "Running ${check}"
                node "${check}" || { status=$?; break; }
              done
            fi
            if [ "${status}" = '0' ]; then test ! -e src/personnel-register-tools.user.js || status=$?; fi
            if [ "${status}" = '0' ]; then grep -Fq '// @version      1.0.44' src/missionchief-command-nexus.user.js || status=$?; fi
            if [ "${status}" = '0' ]; then grep -Fq ' * MODULE 2: MISSION FINDER V10.6.108' src/missionchief-command-nexus.user.js || status=$?; fi
            if [ "${status}" = '0' ]; then grep -Fq 'function isFireEngineVehicleCheckbox(' src/missionchief-command-nexus.user.js || status=$?; fi
            if [ "${status}" = '0' ]; then grep -Fq 'removeAutoModeQueueHelperCopy();' src/missionchief-command-nexus.user.js || status=$?; fi
            if [ "${status}" = '0' ]; then git diff --check || status=$?; fi
            echo "FINAL_STATUS=${status}"
          } > .diagnostics/fire-engine-validation.log 2>&1
          echo "${status}" > .diagnostics/fire-engine-validation.status
          cat .diagnostics/fire-engine-validation.log
          exit 0

      - name: Commit failed validation receipt
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat .diagnostics/fire-engine-validation.status)"
          if [ "${status}" = '0' ]; then
            exit 0
          fi
          {
            printf 'status=%s\n\n' "${status}"
            cat .diagnostics/fire-engine-validation.log
          } > .diagnostics/fire-engine-validation-trigger.txt
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add .diagnostics/fire-engine-validation-trigger.txt
          git commit -m 'Record Fire Engine validation failure'
          git push origin HEAD:agent/fire-engine-update-type-guard-ui-cleanup

      - name: Require successful validation
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat .diagnostics/fire-engine-validation.status)"
          if [ "${status}" != '0' ]; then
            echo "Candidate validation failed with status ${status}."
            exit "${status}"
          fi
          rm -f .diagnostics/fire-engine-validation.log .diagnostics/fire-engine-validation.status
          rm -f .diagnostics/fire-engine-validation-trigger.txt

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Candidate already current.'
            exit 0
          fi
          git commit -m 'Restrict Fire Engine updates and clean Auto Mode copy'
          git push origin HEAD:agent/fire-engine-update-type-guard-ui-cleanup
