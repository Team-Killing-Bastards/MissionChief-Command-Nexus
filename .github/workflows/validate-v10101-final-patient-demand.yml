name: Validate final v1.0.101 Ambulance Officer candidate

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    name: Complete v1.0.101 regression sweep
    if: >-
      github.event.pull_request.head.ref == 'feature/ambulance-officer-threshold-v10101' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v6
        with:
          ref: feature/ambulance-officer-threshold-v10101
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate complete candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' src/missionchief-command-nexus.user.js | head -n1 | xargs)" = "1.0.101"
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs

          # Older functional regressions pin historical release metadata. Align
          # only those assertions in this disposable checkout so the complete
          # live-contract suite can execute against the current candidate.
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = [
              (r'// @version\s+\d+\.\d+\.\d+', '// @version      1.0.101'),
              (r'MISSION FINDER V10\.6\.\d+', 'MISSION FINDER V10.6.150'),
              (r'Mission Finder V10\.6\.\d+', 'Mission Finder V10.6.150'),
              (r"UNIT_VERSION = '3\.3\.\d+'", "UNIT_VERSION = '3.3.20'"),
              (r"STATION_VERSION = '1\.3\.\d+'", "STATION_VERSION = '1.3.14'"),
              (r"PERSONNEL_VERSION = '1\.3\.\d+'", "PERSONNEL_VERSION = '1.3.9'"),
          ]

          for path in Path('scripts').glob('check-*.mjs'):
              text = path.read_text(encoding='utf-8')
              for pattern, replacement in replacements:
                  text = re.sub(pattern, replacement, text)
              path.write_text(text, encoding='utf-8')
          PY

          failures=()
          for check in scripts/check-*.mjs; do
            echo "Running $check"
            if ! node "$check"; then
              failures+=("$check")
            fi
          done

          if (( ${#failures[@]} )); then
            printf 'Failed regressions:\n'
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

          python3 scripts/check_repository.py
          git diff --check
