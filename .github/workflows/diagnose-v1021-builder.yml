name: Inspect current mergeRequirementRows

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/run-v1021-fire-crossref'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          show-progress: false

      - name: Post live mergeRequirementRows section
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          start = source.find('    function mergeRequirementRows(')
          if start < 0:
              raise SystemExit('mergeRequirementRows was not found')
          next_function = source.find('\n    function ', start + 20)
          if next_function < 0:
              next_function = min(len(source), start + 12000)
          section = source[start:next_function]
          Path('/tmp/mergeRequirementRows.txt').write_text(section, encoding='utf-8')
          PY

          {
            echo 'Current `mergeRequirementRows` section:'
            echo '```javascript'
            cat /tmp/mergeRequirementRows.txt
            echo '```'
          } > /tmp/mergeRequirementRows-comment.md
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/mergeRequirementRows-comment.md
