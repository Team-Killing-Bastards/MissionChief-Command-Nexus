name: Prepare Road Rail Unit mapping

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: road-rail-rru-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/map-road-rail-unit-to-rru'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/map-road-rail-unit-to-rru
          fetch-depth: 0
          show-progress: false

      - name: Capture Road Rail and RRU source contexts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          lines = source.splitlines()
          patterns = [
              re.compile(r'road\s*rail', re.I),
              re.compile(r'\bRRU\b', re.I),
              re.compile(r'rail.*unit', re.I),
          ]

          matches = []
          for index, line in enumerate(lines, 1):
              if any(pattern.search(line) for pattern in patterns):
                  matches.append(index)

          output = [f'Found {len(matches)} matching line(s).']
          seen_ranges = set()
          for index in matches:
              start = max(1, index - 12)
              end = min(len(lines), index + 12)
              key = (start, end)
              if key in seen_ranges:
                  continue
              seen_ranges.add(key)
              output.append(f'\n===== {start}-{end} (match {index}) =====')
              for number in range(start, end + 1):
                  output.append(f'{number}: {lines[number - 1]}')

          if not matches:
              raise SystemExit('No Road Rail or RRU source context found.')

          Path('.diagnostics/road-rail-context.txt').write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

      - name: Commit captured context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add .diagnostics/road-rail-context.txt
          if git diff --cached --quiet; then
            echo 'Context already captured.'
            exit 0
          fi
          git commit -m 'Capture Road Rail Unit mapping context'
          git push origin HEAD:agent/map-road-rail-unit-to-rru
