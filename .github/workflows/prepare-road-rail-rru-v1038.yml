name: Prepare Road Rail Unit mapping

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: road-rail-rru-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/map-road-rail-unit-to-rru'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/map-road-rail-unit-to-rru
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Road Rail Unit mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 .diagnostics/apply-road-rail-rru.py
          rm -f .diagnostics/apply-road-rail-rru.py
          rm -f .diagnostics/road-rail-rru.txt
          rm -f .diagnostics/road-rail-context.txt

      - name: Validate complete release candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          git diff --check

      - name: Commit validated mapping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Map plural Road Rail Unit alerts to RRU'
          git push origin HEAD:agent/map-road-rail-unit-to-rru
