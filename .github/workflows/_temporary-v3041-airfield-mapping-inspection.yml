name: Temporary v3.0.41 Airfield command mapping build

on:
  push:
    branches:
      - fix/v3041-airfield-command-mapping

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v3.0.41 candidate
        run: python3 scripts/_temporary-build-v3041-airfield-command-mapping.py

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-project-state.mjs
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Map standalone Airfield Firefighting Command Vehicles"
          git push origin HEAD:fix/v3041-airfield-command-mapping
