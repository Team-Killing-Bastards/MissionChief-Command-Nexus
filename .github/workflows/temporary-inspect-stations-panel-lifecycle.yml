name: Inspect Stations panel lifecycle

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/temporary-inspect-stations-panel-lifecycle.yml'

permissions:
  actions: read

jobs:
  inspect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ios-stations-only-tools-menu'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print exact lifecycle blocks from prior inspection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/89257965659/logs" \
            > /tmp/lifecycle.log

          echo '===== IDENTIFIERS ====='
          awk '/===== IDENTIFIERS =====/{show=1; next} /===== STATION SCREEN DETECTION =====/{show=0} show' /tmp/lifecycle.log

          echo '===== STATION SCREEN DETECTION ====='
          awk '/===== STATION SCREEN DETECTION =====/{show=1; next} /===== PANEL CREATION AND SINGLE INSTANCE =====/{show=0} show' /tmp/lifecycle.log

          echo '===== PANEL CREATION AND SINGLE INSTANCE ====='
          awk '/===== PANEL CREATION AND SINGLE INSTANCE =====/{show=1; next} /===== LOADER \/ OBSERVER TAIL =====/{show=0} show' /tmp/lifecycle.log

          echo '===== LOADER / OBSERVER TAIL ====='
          awk '/===== LOADER \/ OBSERVER TAIL =====/{show=1; next} show' /tmp/lifecycle.log | head -n 160
