name: Inspect Stations panel lifecycle

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/temporary-inspect-stations-panel-lifecycle.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ios-stations-only-tools-menu'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact issue branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Export exact lifecycle blocks
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='src/missionchief-command-nexus.user.js'
          {
            echo '===== SHARED DISCOVERY AND SINGLE PANEL GUARD ====='
            nl -ba "$SOURCE" | sed -n '1110,1435p'
            echo '===== INITIALISATION AND STATION DETECTION ====='
            nl -ba "$SOURCE" | sed -n '1500,1645p'
            echo '===== PANEL FINALISATION ====='
            nl -ba "$SOURCE" | sed -n '2390,2445p'
          } > lifecycle-blocks.txt

      - name: Upload lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-95-lifecycle-blocks
          path: lifecycle-blocks.txt
          if-no-files-found: error
          retention-days: 2
