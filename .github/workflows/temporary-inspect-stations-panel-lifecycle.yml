name: Inspect Stations panel lifecycle

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/temporary-inspect-stations-panel-lifecycle.yml'

permissions:
  actions: read

jobs:
  inspect:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ios-stations-only-tools-menu'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Print exact lifecycle functions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/jobs/89257965659/logs" \
            > /tmp/lifecycle.log

          print_context() {
            pattern="$1"
            label="$2"
            before="$3"
            after="$4"
            line="$(grep -n "$pattern" /tmp/lifecycle.log | tail -n 1 | cut -d: -f1)"
            echo "===== ${label} ====="
            sed -n "$((line-before)),$((line+after))p" /tmp/lifecycle.log
          }

          print_context 'function ensureSingleNamingToolsPanel' 'SINGLE PANEL FUNCTIONS' 8 70
          print_context 'function isStationOverviewScreen' 'STATION SCREEN AND LOADER' 35 70
