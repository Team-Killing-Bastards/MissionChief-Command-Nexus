name: Apply issue 95 Stations-only panel fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/temporary-inspect-stations-panel-lifecycle.yml'
      - 'automation/issue-95/**'
      - 'src/missionchief-command-nexus.user.js'
      - 'scripts/check-ios-compatibility.mjs'
      - 'README.md'
      - 'src/README.md'
      - 'CHANGELOG.md'

permissions:
  contents: write

concurrency:
  group: issue-95-stations-only-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ios-stations-only-tools-menu'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact issue branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply v1.0.21 lifecycle correction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force

          EXPECTED_MAIN='9967506d9b1a68396c7337305d38f9d6720b8c72'
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          if [[ "${ACTUAL_MAIN}" != "${EXPECTED_MAIN}" ]]; then
            echo "main moved from ${EXPECTED_MAIN} to ${ACTUAL_MAIN}; refusing to apply against stale source"
            exit 1
          fi

          node scripts/prepare-release.mjs \
            --version '1.0.21' \
            --notes $'Limit the iOS Safari Resource Administration panel to the visible personal Stations list.\nHide the panel immediately on Map, Missions, Chat and Radio while preserving collapse and drag state.\nReject generic or hidden map building nodes as Stations-screen evidence and add permanent lifecycle regression checks.'

          python3 automation/issue-95/apply.py
          git rm automation/issue-95/apply.py
          git rm .github/workflows/temporary-inspect-stations-panel-lifecycle.yml

      - name: Run complete validation
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node --check scripts/check-ios-compatibility.mjs
          node --check scripts/prepare-release.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          python3 scripts/check_repository.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          expected = {
              'Command Nexus version': '// @version      1.0.21',
              'Unit Naming version': "const UNIT_VERSION = '3.3.8';",
              'visibility synchroniser': 'function syncNamingToolsPanelVisibility(',
              'off-page hidden state': 'panel.hidden = !shouldShow;',
              'singleton lifecycle guard': 'NAMING_TOOLS_PANEL_GUARD_INSTALLED',
              'visible-list proof': 'responsiveList.getClientRects().length > 0',
              'navigation click recovery': "document.addEventListener('click', handleNavigationClick, true);",
          }
          missing = [label for label, token in expected.items() if token not in source]
          if missing:
              raise SystemExit('Missing issue #95 contracts: ' + ', '.join(missing))

          detector_start = source.index('function isStationOverviewScreen()')
          detector_end = source.index('\n    function init()', detector_start)
          detector = source[detector_start:detector_end]
          if '[data-building-id]' in detector or '[id^="building_"]' in detector:
              raise SystemExit('Generic map building selectors remain in Stations-screen detection')

          initialiser_start = source.index('function tryInitialise()')
          initialiser_end = source.index('\n        if (tryInitialise()) return;', initialiser_start)
          initialiser = source[initialiser_start:initialiser_end]
          if initialiser.index('isStationOverviewScreen()') > initialiser.index('ensureSingleNamingToolsPanel()'):
              raise SystemExit('Existing panel is still accepted before Stations-screen state')

          print('Issue #95 focused lifecycle contracts passed.')
          PY

      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes remain to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Scope iOS Resource Administration panel to Stations'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
