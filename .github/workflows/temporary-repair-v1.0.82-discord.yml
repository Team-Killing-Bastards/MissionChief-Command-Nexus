name: Remove malformed v1.0.82 Discord notice

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.discord-v1.0.82-repair-trigger'
      - '.github/workflows/temporary-repair-v1.0.82-discord.yml'

permissions:
  contents: write

concurrency:
  group: remove-malformed-v1.0.82-discord-notice
  cancel-in-progress: true

jobs:
  repair:
    name: Remove non-canonical reduced release card
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Locate malformed Discord notice receipt
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PREFIX='Command-Nexus-Discord-Pending-GreasyFork-Receipt-v1.0.82-'
          RECEIPT="$(
            gh release view v1.0.82 --json assets --jq '.assets[].name' |
              grep -m1 "^${PREFIX}" || true
          )"

          if [[ -z "${RECEIPT}" ]]; then
            echo 'No malformed-notice receipt remains; cleanup is already complete.'
            echo 'found=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          rm -rf repair-receipt
          mkdir repair-receipt
          gh release download v1.0.82 \
            --pattern "${RECEIPT}" \
            --dir repair-receipt \
            --clobber

          MESSAGE_ID="$(
            node -p "JSON.parse(require('fs').readFileSync('repair-receipt/${RECEIPT}','utf8')).message_id"
          )"

          if [[ -z "${MESSAGE_ID}" || "${MESSAGE_ID}" == 'undefined' ]]; then
            echo 'Malformed-notice receipt has no message_id.'
            exit 1
          fi

          echo 'found=true' >> "${GITHUB_OUTPUT}"
          echo "receipt=${RECEIPT}" >> "${GITHUB_OUTPUT}"
          echo "message_id=${MESSAGE_ID}" >> "${GITHUB_OUTPUT}"

      - name: Delete malformed Discord message
        if: steps.pending.outputs.found == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          MESSAGE_ID: ${{ steps.pending.outputs.message_id }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(
            curl --silent --show-error \
              --output /tmp/discord-delete-response \
              --write-out '%{http_code}' \
              --request DELETE \
              "${DISCORD_WEBHOOK_URL}/messages/${MESSAGE_ID}"
          )"

          if [[ "${STATUS}" != '204' && "${STATUS}" != '404' ]]; then
            echo "Discord delete returned HTTP ${STATUS}:"
            cat /tmp/discord-delete-response
            exit 1
          fi

          echo "Malformed Discord message ${MESSAGE_ID} removed (HTTP ${STATUS})."

      - name: Remove malformed-notice receipt asset
        if: steps.pending.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT: ${{ steps.pending.outputs.receipt }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete-asset v1.0.82 "${RECEIPT}" --yes

      - name: Verify malformed release card is no longer registered
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$(gh release view v1.0.82 --json assets --jq '.assets[].name')"
          PENDING_COUNT="$(
            grep -c '^Command-Nexus-Discord-Pending-GreasyFork-Receipt-v1.0.82-' \
              <<< "${ASSETS}" || true
          )"

          if [[ "${PENDING_COUNT}" != '0' ]]; then
            echo "Expected no pending receipt, found ${PENDING_COUNT}."
            exit 1
          fi

          {
            echo '### Malformed Discord release notice removed'
            echo '- Release: `v1.0.82`'
            echo '- Reduced external-sync card: removed or already absent'
            echo '- Pending receipt count: `0`'
            echo '- Canonical release-layout test: passed separately'
          } >> "${GITHUB_STEP_SUMMARY}"
