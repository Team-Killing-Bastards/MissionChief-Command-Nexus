name: Inspect HazMat personnel routing

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  inspect:
    name: Extract HazMat trained-personnel source
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/hazmat-personnel-osu-v1064'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          show-progress: false

      - name: Print relevant source contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/missionchief-command-nexus.user.js')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines()

          print('=== HAZMAT CONTEXTS ===')
          seen = set()
          for match in re.finditer(r'hazmat', source, re.I):
              line_no = source.count('\n', 0, match.start()) + 1
              bucket = line_no // 10
              if bucket in seen:
                  continue
              seen.add(bucket)
              start = max(1, line_no - 7)
              end = min(len(lines), line_no + 10)
              print(f'--- lines {start}-{end} ---')
              for number in range(start, end + 1):
                  print(f'{number:06d}: {lines[number - 1]}')

          def extract_function(name):
              signature = f'function {name}('
              start = source.find(signature)
              if start < 0:
                  print(f'=== MISSING FUNCTION {name} ===')
                  return
              brace = source.find('{', start)
              depth = 0
              quote = ''
              escaped = False
              index = brace
              while index < len(source):
                  ch = source[index]
                  nxt = source[index + 1] if index + 1 < len(source) else ''
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = ''
                      index += 1
                      continue
                  if ch in ('"', "'", '`'):
                      quote = ch
                      index += 1
                      continue
                  if ch == '/' and nxt == '/':
                      end = source.find('\n', index + 2)
                      index = len(source) if end < 0 else end + 1
                      continue
                  if ch == '/' and nxt == '*':
                      end = source.find('*/', index + 2)
                      index = len(source) if end < 0 else end + 2
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          block = source[start:index + 1]
                          start_line = source.count('\n', 0, start) + 1
                          print(f'=== FUNCTION {name} line {start_line} ===')
                          print(block)
                          return
                  index += 1
              print(f'=== UNTERMINATED FUNCTION {name} ===')

          for function_name in (
              'getTrainedPersonnelRequirementsFromFreeText',
              'getSupportedTrainedPersonnelRequirementsFromText',
              'normalisePublicOrderTrainedRequirements',
              'getTrainingRequirementVehicleCapacity',
              'getPreferredTrainedVehicleCountForRequirement',
              'getRemainingTrainedPersonnelRequirements',
              'selectVehiclesForTrainedPersonnelRequirements',
          ):
              extract_function(function_name)

          pattern_start = source.find('const MF_TRAINED_PERSONNEL_PATTERNS =')
          pattern_end = source.find('\n\n    let mfKeepPanelPosition', pattern_start)
          if pattern_start >= 0 and pattern_end > pattern_start:
              print('=== TRAINED PERSONNEL PATTERN BLOCK ===')
              print(source[pattern_start:pattern_end])
          else:
              print('=== TRAINED PERSONNEL PATTERN BLOCK NOT FOUND ===')
          PY
