name: Diagnose Search Advisor register

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-police-search-advisor-register'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-police-search-advisor-register
          fetch-depth: 0
          show-progress: false

      - name: Collect Search Advisor register context
        run: |
          python3 .diagnostics/collect-search-advisor-register-context.py
          python3 .diagnostics/collect-search-advisor-exact.py

      - name: Commit diagnostic context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add .diagnostics/search-advisor-register-context.txt .diagnostics/search-advisor-exact-context.txt
          if git diff --cached --quiet; then
            echo 'Diagnostic context already current.'
            exit 0
          fi
          git commit -m 'Capture Search Advisor register context'
          git push origin HEAD:agent/fix-police-search-advisor-register
