name: Repository quality

on:
  push:
    branches:
      - main
  pull_request:
  pull_request_target:
    types:
      - closed
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN TEMP V1056 DIAGNOSTIC EXPORT
  build-v1056:
    name: Build Unit Finder diagnostic export v1.0.56
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'release/apply-v1056') ||
      (github.event_name == 'push' &&
       github.ref_name == 'main' &&
       contains(github.event.head_commit.message, 'Run v1.0.56 diagnostic export')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.number == 203 &&
       contains(github.event.comment.body, '/run-v1056-diagnostic-export'))
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply diagnostic export feature
        run: python3 scripts/apply-unit-finder-diagnostic-export-v1056.py

      - name: Validate complete release candidate
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for test in scripts/check-*.mjs; do
            echo "Running ${test}"
            node "$test"
          done
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit validated product release
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Add Unit Finder diagnostic export'
          git push origin HEAD:refs/heads/main

      - name: Report v1.0.56 builder result
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: gh pr comment 203 --repo "$GITHUB_REPOSITORY" --body "v1.0.56 diagnostic export builder completed with status: ${JOB_STATUS}."

  publish-v1056:
    name: Publish and verify v1.0.56
    needs: build-v1056
    if: needs.build-v1056.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.56
      release_notes: Add exportable Unit Finder and Mission Update requirement and selection diagnostics.
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
  # END TEMP V1056 DIAGNOSTIC EXPORT

  integrity:
    name: Repository integrity
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compile repository checker
        run: python3 -m py_compile scripts/check_repository.py

      - name: Run repository checks
        run: python3 scripts/check_repository.py

      - name: Validate single-delivery Discord release notifications
        run: node scripts/check-release-notification-single-delivery.mjs

  release-state:
    name: Detect unpublished canonical version
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref != 'release/apply-v1056') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.release_state.outputs.should_publish }}
      release_tag: ${{ steps.release_state.outputs.release_tag }}
      script_version: ${{ steps.release_state.outputs.script_version }}

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate source and inspect release state
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main --tags --force
          git checkout -B main origin/main

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py

          SCRIPT_VERSION="$(node scripts/validate-userscript.mjs --print-version)"
          RELEASE_TAG="v${SCRIPT_VERSION}"
          ASSET="MissionChief-Command-Nexus-${SCRIPT_VERSION}.user.js"
          CHECKSUM="${ASSET}.sha256"

          if ! grep -Fq "## [${SCRIPT_VERSION}]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a release section for ${SCRIPT_VERSION}."
            exit 1
          fi

          SHOULD_PUBLISH=true
          REASON="release or verified assets are missing"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            ASSET_COUNT="$(
              gh release view "${RELEASE_TAG}" \
                --json assets \
                --jq ".assets | map(select(.name == \"${ASSET}\" or .name == \"${CHECKSUM}\")) | unique_by(.name) | length"
            )"

            if [[ "${ASSET_COUNT}" == "2" ]]; then
              SHOULD_PUBLISH=false
              REASON="GitHub Release and both verified assets already exist"
            else
              REASON="GitHub Release exists but one or more verified assets are missing"
            fi
          elif git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            REASON="release tag exists but the GitHub Release is incomplete or missing"
          fi

          echo "should_publish=${SHOULD_PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "script_version=${SCRIPT_VERSION}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Automatic release decision"
            echo "- Version: \`${SCRIPT_VERSION}\`"
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Publish required: \`${SHOULD_PUBLISH}\`"
            echo "- Reason: ${REASON}"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-release:
    name: Publish, verify and announce canonical release
    needs: release-state
    if: needs.release-state.outputs.should_publish == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: ${{ needs.release-state.outputs.release_tag }}
      release_notes: Automatic verified release after merge to main.
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
