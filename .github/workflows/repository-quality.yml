name: Repository quality

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  pull_request_target:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Repository integrity
    if: >-
      github.event_name != 'pull_request_target' &&
      !(github.event_name == 'pull_request' && github.event.action == 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compile repository checker
        run: python3 -m py_compile scripts/check_repository.py

      - name: Run repository checks
        run: python3 scripts/check_repository.py

  build-v1021-fire-crossref:
    name: Build and validate v1.0.21 Fire cross-reference
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' ||
       github.event.action == 'synchronize' ||
       github.event.action == 'reopened') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/run-v1021-fire-crossref'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply reviewed v1.0.21 transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/apply-v1.0.21-fire-crossref.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit('Embedded v1.0.21 builder start marker was not found')
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit('Embedded v1.0.21 builder end marker was not found')

          builder = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow[start:end].splitlines()
          ) + '\n'

          stale_call = "source = replace_once(source, merge_anchor, merge_replacement, 'Firefighter count application')"
          if builder.count(stale_call) != 1:
              raise SystemExit('Stale Firefighter count application call was not found exactly once')
          builder = builder.replace(
              stale_call,
              "# Firefighter count application is applied below against the current mergeRequirementRows structure.",
              1
          )

          exec(
              compile(
                  builder,
                  '<v1.0.21-fire-crossref-builder>',
                  'exec'
              ),
              {'__name__': '__main__'}
          )

          source_path = Path('src/missionchief-command-nexus.user.js')
          source = source_path.read_text(encoding='utf-8')
          old = '''            const amount =
                Math.max(
                    0,
                    parseInt(
                        row?.stillNeeded,
                        10
                    ) ||
                    0
                );

            if (amount <= 0) {
                return;
            }

            const mappedName =
                resolveUnitName(
                    row.unitName
                );
'''
          new = '''            const mappedName =
                resolveUnitName(
                    row.unitName
                );

            const amount =
                normaliseVehicleRequirementCount(
                    row.unitName,
                    mappedName,
                    row?.stillNeeded
                );

            if (amount <= 0) {
                return;
            }
'''
          if source.count(old) != 1:
              raise SystemExit(
                  'Current mergeRequirementRows count block matched '
                  + str(source.count(old))
                  + ' times, expected 1'
              )
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8', newline='\n')

          quality_path = Path('.github/workflows/repository-quality.yml')
          quality = quality_path.read_text(encoding='utf-8')
          quality = quality.replace(
              "  pull_request:\n    types:\n      - opened\n      - synchronize\n      - reopened\n      - closed\n",
              "  pull_request:\n",
              1
          )
          quality = quality.replace(
              "    if: >-\n      github.event_name != 'pull_request_target' &&\n      !(github.event_name == 'pull_request' && github.event.action == 'closed')\n",
              "    if: github.event_name != 'pull_request_target'\n",
              1
          )
          block_start = quality.find('\n  build-v1021-fire-crossref:')
          block_end = quality.find('\n  release-state:', block_start)
          if block_start < 0 or block_end < 0:
              raise SystemExit('Temporary v1.0.21 repository-quality job could not be removed')
          quality = quality[:block_start] + quality[block_end:]
          quality_path.write_text(quality, encoding='utf-8', newline='\n')
          PY

          git rm -f --ignore-unmatch .github/workflows/apply-v1.0.21-fire-crossref.yml
          git rm -f --ignore-unmatch .github/workflows/dispatch-v1021-command.yml
          git rm -f --ignore-unmatch .github/workflows/diagnose-v1021-builder.yml
          git rm -f --ignore-unmatch .github/workflows/apply-v1021-direct-fixed.yml
          git rm -f --ignore-unmatch .github/workflows/apply-v1021-current-merge.yml
          git rm -f --ignore-unmatch .github/workflows/v1021-dispatch-marker.yml
          git rm -f --ignore-unmatch .release/v1.0.21.trigger
          git rm -f --ignore-unmatch .release/v1.0.21.command-ready
          git rm -f --ignore-unmatch .release/v1.0.21.registration
          git rm -f --ignore-unmatch .release/v1.0.21.finalizer-note

      - name: Validate complete v1.0.21 build
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          python3 scripts/check_repository.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          required = {
              'version': '// @version      1.0.21',
              'Mission Finder': ' * MODULE 2: MISSION FINDER V10.6.86',
              'Firefighter alias': '        "Firefighter": "Rescue Pump",',
              'Firefighters alias': '        "Firefighters": "Rescue Pump",',
              'Car Recovery alias': '        "Car Recovery": "Flatbed Recovery Vehicle",',
              'RIV/MFT alias': '        "RIV or Major Foam Tender": "RIV",',
              'Firefighter conversion helper': 'function normaliseVehicleRequirementCount(',
              'Firefighter conversion call': '''normaliseVehicleRequirementCount(
                    row.unitName,
                    mappedName,
                    row?.stillNeeded''',
              'RIV/MFT fallback': 'function isRivOrMajorFoamTenderRequirement(',
              'Major Foam Tender matcher': 'function isMajorFoamTenderVehicleCheckbox(',
              'Major Foam Tender type': ".includes(\n                '75'",
          }
          missing = [name for name, token in required.items() if token not in source]
          if missing:
              raise SystemExit('Missing v1.0.21 contracts: ' + ', '.join(missing))

          expected = {
              1: 1,
              9: 1,
              10: 2,
              18: 2,
              19: 3,
              27: 3,
              28: 4
          }
          actual = {count: (count + 8) // 9 for count in expected}
          if actual != expected:
              raise SystemExit(
                  'Firefighter 9-per-pump regression failed: '
                  + repr(actual)
              )

          if '        "RIVs or Major Foam Tenders": "Major Foam Tender",' in source:
              raise SystemExit('Legacy Major Foam Tender-first mapping remains')

          if not all(
              token in source
              for token in (
                  'isRivVehicleCheckbox(',
                  'rivMatches.length >',
                  'isMajorFoamTenderVehicleCheckbox('
              )
          ):
              raise SystemExit('RIV-first fallback contracts are incomplete')

          print('Focused v1.0.21 Fire cross-reference validation passed.')
          PY

      - name: Commit and push validated v1.0.21
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TRIGGER_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Add Fire cross-reference mappings'
          git push origin HEAD:main
          gh pr close "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --comment 'v1.0.21 Fire cross-reference mappings validated and pushed to main.' || true
          git push origin --delete "${TRIGGER_BRANCH}" || true

  release-state:
    name: Detect unpublished canonical version
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.release_state.outputs.should_publish }}
      release_tag: ${{ steps.release_state.outputs.release_tag }}
      script_version: ${{ steps.release_state.outputs.script_version }}

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate source and inspect release state
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main --tags --force
          git checkout -B main origin/main

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py

          SCRIPT_VERSION="$(node scripts/validate-userscript.mjs --print-version)"
          RELEASE_TAG="v${SCRIPT_VERSION}"
          ASSET="MissionChief-Command-Nexus-${SCRIPT_VERSION}.user.js"
          CHECKSUM="${ASSET}.sha256"

          if ! grep -Fq "## [${SCRIPT_VERSION}]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a release section for ${SCRIPT_VERSION}."
            exit 1
          fi

          SHOULD_PUBLISH=true
          REASON="release or verified assets are missing"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            ASSET_COUNT="$(
              gh release view "${RELEASE_TAG}" \
                --json assets \
                --jq ".assets | map(select(.name == \"${ASSET}\" or .name == \"${CHECKSUM}\")) | unique_by(.name) | length"
            )"

            if [[ "${ASSET_COUNT}" == "2" ]]; then
              SHOULD_PUBLISH=false
              REASON="GitHub Release and both verified assets already exist"
            else
              REASON="GitHub Release exists but one or more verified assets are missing"
            fi
          elif git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            REASON="release tag exists but the GitHub Release is incomplete or missing"
          fi

          echo "should_publish=${SHOULD_PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "script_version=${SCRIPT_VERSION}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Automatic release decision"
            echo "- Version: \`${SCRIPT_VERSION}\`"
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Publish required: \`${SHOULD_PUBLISH}\`"
            echo "- Reason: ${REASON}"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-release:
    name: Publish, verify and announce canonical release
    needs: release-state
    if: needs.release-state.outputs.should_publish == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: ${{ needs.release-state.outputs.release_tag }}
      release_notes: Automatic verified release after merge to main.
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
