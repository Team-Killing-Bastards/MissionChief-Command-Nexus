name: Repository quality

on:
  push:
    branches:
      - main
  pull_request:
  pull_request_target:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Repository integrity
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compile repository checker
        run: python3 -m py_compile scripts/check_repository.py

      - name: Run repository checks
        run: python3 scripts/check_repository.py

  build-v1020:
    name: Build and validate Road Rail Unit v1.0.20
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.number == 91 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/v1.0.20-road-rail-unit'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published_commit: ${{ steps.commit.outputs.published_commit }}

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply Marty’s staged Road Rail Unit patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          source_path = Path('src/missionchief-command-nexus.user.js')
          source = source_path.read_text(encoding='utf-8')
          source = replace_once(source, '// @version      1.0.19', '// @version      1.0.20', 'userscript version')
          source = replace_once(source, ' * MODULE 2: MISSION FINDER V10.6.84', ' * MODULE 2: MISSION FINDER V10.6.85', 'Mission Finder version')

          release_anchor = '    // V10.6.84: the exact mission wording "Fire, rescue or aerial appliance"\n'
          release_note = (
              '    // V10.6.85: Fire cross-reference now maps the exact "Road Rail Unit"\n'
              '    // wording to the established RRU route.\n'
          )
          source = replace_once(source, release_anchor, release_note + release_anchor, 'Mission Finder release note')

          alias = '        "Road Rail Unit": "RRU",\n'
          alias_anchor = '        "Fire, rescue or aerial appliance": "Rescue Pump",\n'
          source = replace_once(source, alias_anchor, alias_anchor + alias, 'Road Rail Unit alias')
          if source.count(alias) != 1:
              raise SystemExit(f'Road Rail Unit alias count was {source.count(alias)}, expected 1')

          source_path.write_text(source, encoding='utf-8', newline='\n')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          release = '''## [1.0.20] - 2026-07-23

          ### Fixed

          - Added the exact Fire cross-reference `Road Rail Unit` → `RRU`.

          ### Verified

          - Police Medic personnel counts continue to use two `police_medic`-trained personnel per exact type-8 IRV: 1 → 1 IRV, 2 → 1 IRV and 3 → 2 IRVs.

          ### Changed

          - Mission Finder increased from `V10.6.84` to `V10.6.85`.

          '''
          release = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in release.splitlines()
          ) + '\n'
          changelog = replace_once(changelog, '## [1.0.19] - 2026-07-22', release + '## [1.0.19] - 2026-07-22', 'changelog release')
          changelog_path.write_text(changelog, encoding='utf-8', newline='\n')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = replace_once(readme, '**Current version:** `1.0.19` · **Mission Finder engine:** `V10.6.84`', '**Current version:** `1.0.20` · **Mission Finder engine:** `V10.6.85`', 'README version')
          readme = replace_once(readme, '[**v1.0.19**](#current-v1019-behaviour)', '[**v1.0.20**](#current-v1020-behaviour)', 'README navigation')
          readme = replace_once(readme, '## Current v1.0.19 behaviour', '## Current v1.0.20 behaviour', 'README heading')
          bullet_anchor = '- `Fire, rescue or aerial appliance` requirements map to `Rescue Pump`.\n'
          readme = replace_once(readme, bullet_anchor, bullet_anchor + '- `Road Rail Unit` requirements map to `RRU`.\n', 'README RRU bullet')
          readme_path.write_text(readme, encoding='utf-8', newline='\n')

          source_readme_path = Path('src/README.md')
          source_readme = source_readme_path.read_text(encoding='utf-8')
          source_readme = replace_once(source_readme, '| Command Nexus version | `1.0.19` |', '| Command Nexus version | `1.0.20` |', 'source README version')
          source_readme = replace_once(source_readme, '| Mission Finder baseline | `V10.6.84` |', '| Mission Finder baseline | `V10.6.85` |', 'source README Mission Finder')
          source_readme_path.write_text(source_readme, encoding='utf-8', newline='\n')
          PY

          git rm -f .github/workflows/manual-road-rail-unit-v1020.yml
          git rm -f .release/v1.0.20.trigger
          git show HEAD^:.github/workflows/repository-quality.yml > .github/workflows/repository-quality.yml

      - name: Run complete release validation
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref HEAD^
          node scripts/check-ios-compatibility.mjs
          python3 scripts/check_repository.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/missionchief-command-nexus.user.js').read_text(encoding='utf-8')
          expected = {
              'version': '// @version      1.0.20',
              'Mission Finder': ' * MODULE 2: MISSION FINDER V10.6.85',
              'Road Rail Unit alias': '        "Road Rail Unit": "RRU",',
          }
          missing = [name for name, token in expected.items() if token not in source]
          if missing:
              raise SystemExit('Missing v1.0.20 contracts: ' + ', '.join(missing))
          if source.count('        "Road Rail Unit": "RRU",') != 1:
              raise SystemExit('Road Rail Unit alias must exist exactly once')
          print('Focused v1.0.20 Road Rail Unit contracts passed.')
          PY

      - name: Commit validated v1.0.20 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Map Road Rail Unit to RRU'
          git push origin HEAD:main
          echo "published_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  release-state:
    name: Detect unpublished canonical version
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.release_state.outputs.should_publish }}
      release_tag: ${{ steps.release_state.outputs.release_tag }}
      script_version: ${{ steps.release_state.outputs.script_version }}

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate source and inspect release state
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main --tags --force
          git checkout -B main origin/main

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py

          SCRIPT_VERSION="$(node scripts/validate-userscript.mjs --print-version)"
          RELEASE_TAG="v${SCRIPT_VERSION}"
          ASSET="MissionChief-Command-Nexus-${SCRIPT_VERSION}.user.js"
          CHECKSUM="${ASSET}.sha256"

          if ! grep -Fq "## [${SCRIPT_VERSION}]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a release section for ${SCRIPT_VERSION}."
            exit 1
          fi

          SHOULD_PUBLISH=true
          REASON="release or verified assets are missing"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            ASSET_COUNT="$(
              gh release view "${RELEASE_TAG}" \
                --json assets \
                --jq ".assets | map(select(.name == \"${ASSET}\" or .name == \"${CHECKSUM}\")) | unique_by(.name) | length"
            )"

            if [[ "${ASSET_COUNT}" == "2" ]]; then
              SHOULD_PUBLISH=false
              REASON="GitHub Release and both verified assets already exist"
            else
              REASON="GitHub Release exists but one or more verified assets are missing"
            fi
          elif git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            REASON="release tag exists but the GitHub Release is incomplete or missing"
          fi

          echo "should_publish=${SHOULD_PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "script_version=${SCRIPT_VERSION}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Automatic release decision"
            echo "- Version: \`${SCRIPT_VERSION}\`"
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Publish required: \`${SHOULD_PUBLISH}\`"
            echo "- Reason: ${REASON}"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-release:
    name: Publish, verify and announce canonical release
    needs: release-state
    if: needs.release-state.outputs.should_publish == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: ${{ needs.release-state.outputs.release_tag }}
      release_notes: Automatic verified release after merge to main.
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

  publish-v1020:
    name: Publish, verify and announce v1.0.20
    needs: build-v1020
    if: needs.build-v1020.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: v1.0.20
      release_notes: Road Rail Unit now maps to the established RRU route.
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
