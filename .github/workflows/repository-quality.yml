name: Repository quality
# Merged PRs are the trusted publication hinge; main pushes and manual dispatch remain recovery paths.

on:
  push:
    branches:
      - main
  pull_request:
  pull_request_target:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Repository integrity
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compile repository checker
        run: python3 -m py_compile scripts/check_repository.py

      - name: Run repository checks
        run: python3 scripts/check_repository.py

      - name: Validate single-delivery Discord release notifications
        run: node scripts/check-release-notification-single-delivery.mjs

      - name: Validate automatic live release reconciliation
        run: node scripts/check-release-auto-publish.mjs

  release-state:
    name: Detect unpublished canonical version
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true) ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.release_state.outputs.should_publish }}
      release_tag: ${{ steps.release_state.outputs.release_tag }}
      script_version: ${{ steps.release_state.outputs.script_version }}

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate source and inspect release state
        id: release_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main --tags --force
          git checkout -B main origin/main

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py

          SCRIPT_VERSION="$(node scripts/validate-userscript.mjs --print-version)"
          RELEASE_TAG="v${SCRIPT_VERSION}"
          ASSET="MissionChief-Command-Nexus-${SCRIPT_VERSION}.user.js"
          CHECKSUM="${ASSET}.sha256"
          DISCORD_RECEIPT_PREFIX="Command-Nexus-Discord-Receipt-${RELEASE_TAG}-"

          if ! grep -Fq "## [${SCRIPT_VERSION}]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a release section for ${SCRIPT_VERSION}."
            exit 1
          fi

          SHOULD_PUBLISH=true
          REASON="release, verified assets or Discord delivery receipt are missing"
          ASSET_COUNT=0
          DISCORD_RECEIPT_COUNT=0

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            ASSET_COUNT="$(
              gh release view "${RELEASE_TAG}" \
                --json assets \
                --jq ".assets | map(select(.name == \"${ASSET}\" or .name == \"${CHECKSUM}\")) | unique_by(.name) | length"
            )"
            DISCORD_RECEIPT_COUNT="$(
              gh release view "${RELEASE_TAG}" \
                --json assets \
                --jq ".assets | map(select(.name | startswith(\"${DISCORD_RECEIPT_PREFIX}\"))) | length"
            )"

            if [[ "${ASSET_COUNT}" == "2" && "${DISCORD_RECEIPT_COUNT}" -ge 1 ]]; then
              SHOULD_PUBLISH=false
              REASON="GitHub Release, both verified assets and the Discord delivery receipt already exist"
            elif [[ "${ASSET_COUNT}" == "2" ]]; then
              REASON="GitHub assets exist but the verified Discord delivery receipt is missing"
            else
              REASON="GitHub Release exists but one or more verified assets are missing"
            fi
          elif git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            REASON="release tag exists but the GitHub Release is incomplete or missing"
          fi

          echo "should_publish=${SHOULD_PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "script_version=${SCRIPT_VERSION}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Automatic release decision"
            echo "- Version: \`${SCRIPT_VERSION}\`"
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Verified GitHub assets: \`${ASSET_COUNT}/2\`"
            echo "- Discord delivery receipts: \`${DISCORD_RECEIPT_COUNT}\`"
            echo "- Publish required: \`${SHOULD_PUBLISH}\`"
            echo "- Reason: ${REASON}"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-release:
    name: Publish, verify and announce canonical release
    needs: release-state
    if: needs.release-state.outputs.should_publish == 'true'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      operation: publish-release
      release_tag: ${{ needs.release-state.outputs.release_tag }}
      release_notes: Automatic verified release after trusted repository event.
    secrets:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

  build-v1090:
    name: Build v1.0.90 Dispatch Centre seed candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 282 &&
      github.event.pull_request.head.ref == 'fix/dispatch-centre-unassigned-seed-v1090' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/dispatch-centre-unassigned-seed-v1090
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build, validate and clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          python3 scripts/build-v1090-dispatch-centre-seed.py
          python3 scripts/patch-v1090-v1089-regression.py
          rm -f scripts/build-v1090-dispatch-centre-seed.py
          rm -f scripts/patch-v1090-v1089-regression.py
          git checkout origin/main -- .github/workflows/repository-quality.yml

          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do
            echo "Running $check"
            node "$check"
          done
          python3 scripts/check_repository.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Dispatch Centre seed discovery in v1.0.90'
          git push origin HEAD:fix/dispatch-centre-unassigned-seed-v1090
