name: Temporary verify v1.0.3 release

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  actions: read
  contents: read

jobs:
  verify-release:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/trigger-publish-v1.0.3'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for canonical release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow release.yml \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"

            if [[ -n "${RUN_ID}" ]]; then
              STATUS="$(gh run view "${RUN_ID}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json status \
                --jq '.status')"

              if [[ "${STATUS}" == "completed" ]]; then
                break
              fi
            fi

            sleep 10
          done

          if [[ -z "${RUN_ID}" ]]; then
            echo "No workflow_dispatch release run was found."
            exit 1
          fi

          gh run view "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json databaseId,name,event,status,conclusion,url,headSha,createdAt,updatedAt

          CONCLUSION="$(gh run view "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json conclusion \
            --jq '.conclusion')"

          if [[ "${CONCLUSION}" != "success" ]]; then
            echo "Canonical release workflow concluded: ${CONCLUSION}"
            exit 1
          fi

      - name: Verify v1.0.3 release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view v1.0.3 \
            --repo "${GITHUB_REPOSITORY}" \
            --json url,name,tagName,isDraft,isPrerelease,publishedAt,assets

          ASSETS="$(gh release view v1.0.3 \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name')"

          grep -Fxq 'MissionChief-Command-Nexus-1.0.3.user.js' <<<"${ASSETS}"
          grep -Fxq 'MissionChief-Command-Nexus-1.0.3.user.js.sha256' <<<"${ASSETS}"
