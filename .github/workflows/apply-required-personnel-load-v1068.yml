name: Build v1.0.68 Required Personnel load fix

on:
  push:
    branches:
      - fix/required-personnel-load-v1068

permissions:
  contents: write

concurrency:
  group: build-required-personnel-load-v1068
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/required-personnel-load-v1068
          fetch-depth: 0
      - name: Apply cross-table load fix
        run: python3 .github/builders/apply-required-personnel-load-v1068.py
      - name: Validate userscript syntax and metadata
        run: |
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
      - name: Validate Required Personnel loading
        run: |
          node scripts/check-mission-definition-personnel-preload.mjs
          node scripts/check-mission-definition-trained-personnel.mjs
          node scripts/check-initial-trained-personnel-authority.mjs
          node scripts/check-trained-personnel-panel.mjs
          node scripts/check-trained-coverage-optimizer.mjs
          node scripts/check-mission-update-single-pass.mjs
          node scripts/check-ios-mission-requirements-source.mjs
      - name: Validate repository integrity
        run: python3 scripts/check_repository.py
      - name: Commit product changes when needed
        shell: bash
        run: |
          set -euo pipefail
          git add src/missionchief-command-nexus.user.js README.md src/README.md CHANGELOG.md scripts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Read Required Personnel from Other information table'
          git push origin HEAD:fix/required-personnel-load-v1068
