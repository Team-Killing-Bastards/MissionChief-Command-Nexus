name: Apply Rescue Pump mapping hotfix

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and validate v1.0.19
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temporary-map-fire-rescue-aerial-hotfix.py
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          node scripts/check-ios-compatibility.mjs
          python3 scripts/check_repository.py
          git diff --check

      - name: Commit validated hotfix to main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git rm -f \
            .github/workflows/map-fire-rescue-aerial-hotfix.yml \
            scripts/temporary-map-fire-rescue-aerial-hotfix.py
          git add CHANGELOG.md README.md src/README.md src/missionchief-command-nexus.user.js
          git commit -m 'Map fire rescue aerial requirement to Rescue Pump'
          git push origin HEAD:main

          gh pr close 83 \
            --repo "${GITHUB_REPOSITORY}" \
            --comment 'Superseded by the validated direct-main v1.0.19 hotfix.' || true
