name: Prepare saved-position helper removal

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/remove-saved-position-helper-text'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: agent/remove-saved-position-helper-text
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove saved-position helper text
        shell: bash
        run: |
          set -euo pipefail
          python3 .diagnostics/apply-remove-saved-position-helper.py
          rm -f .diagnostics/apply-remove-saved-position-helper.py

      - name: Validate complete Command Nexus candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          python3 scripts/check_repository.py
          for check in scripts/check-*.mjs; do
            echo "Running ${check}"
            node "${check}"
          done
          test ! -e src/personnel-register-tools.user.js
          grep -Fq '// @version      1.0.45' src/missionchief-command-nexus.user.js
          grep -Fq ' * MODULE 2: MISSION FINDER V10.6.109' src/missionchief-command-nexus.user.js
          grep -Fq 'Keep my saved panel position' src/missionchief-command-nexus.user.js
          ! grep -Fq 'Off = centre on every mission. On = remember where you drag it.' src/missionchief-command-nexus.user.js
          git diff --check

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Candidate already current.'
            exit 0
          fi
          git commit -m 'Remove saved-position helper text'
          git push origin HEAD:agent/remove-saved-position-helper-text
