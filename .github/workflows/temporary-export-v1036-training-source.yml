name: Build validated v1.0.36 training coverage optimiser

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-v1.0.36-training-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    name: Apply and validate trained-personnel optimiser
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/training-coverage-optimizer'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run exact v1.0.36 builder from the same-repository branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_BRANCH}" --force
          git show "origin/${HEAD_BRANCH}:scripts/run-v1036-builder.sh" > /tmp/run-v1036-builder.sh
          chmod +x /tmp/run-v1036-builder.sh
          /tmp/run-v1036-builder.sh
