name: Launch v1.0.24 release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: launch-v1.0.24-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag clean v1.0.24 source
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/normal-irv-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Create immutable v1.0.24 tag from clean parent
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          LAUNCHER_SHA="$(git rev-parse HEAD)"
          RELEASE_SHA="$(git rev-parse HEAD^)"
          CHANGED_FILES="$(git diff --name-only "${RELEASE_SHA}" "${LAUNCHER_SHA}")"

          if [[ "${CHANGED_FILES}" != '.github/workflows/release-v1024-launcher.yml' ]]; then
            echo 'The launcher commit is not isolated from the clean release source.'
            echo "Changed files: ${CHANGED_FILES}"
            exit 1
          fi

          RELEASE_VERSION="$(
            git show "${RELEASE_SHA}:src/missionchief-command-nexus.user.js" |
              sed -n 's#^//[[:space:]]*@version[[:space:]]*##p' |
              head -n 1 |
              xargs
          )"

          if [[ "${RELEASE_VERSION}" != '1.0.24' ]]; then
            echo "Expected clean parent version 1.0.24; found ${RELEASE_VERSION}."
            exit 1
          fi

          if git show-ref --tags --verify --quiet refs/tags/v1.0.24; then
            EXISTING_SHA="$(git rev-list -n 1 v1.0.24)"
            if [[ "${EXISTING_SHA}" != "${RELEASE_SHA}" ]]; then
              echo "Existing v1.0.24 tag points to ${EXISTING_SHA}, expected ${RELEASE_SHA}."
              exit 1
            fi
          else
            git config user.name MartyBlyth
            git config user.email 32400596+Martyblyth@users.noreply.github.com
            git tag -a v1.0.24 "${RELEASE_SHA}" \
              -m 'MissionChief Command Nexus 1.0.24'
            git push origin refs/tags/v1.0.24
          fi

          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "Tagged clean v1.0.24 source commit \`${RELEASE_SHA}\`. The permanent GitHub, Greasy Fork and Discord release workflow is now running."
