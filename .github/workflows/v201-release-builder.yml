name: Build V2.0.1 release branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v201-release-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out clean main before builder commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.before }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Prepare normal V2.0.1 release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          node scripts/prepare-release.mjs \
            --version 2.0.1 \
            --notes "Publication recovery for the clean V2 baseline. No MissionChief runtime behaviour changes; this creates a normal canonical userscript version update so Greasy Fork can synchronize V2."

      - name: Prove runtime parity with V2.0.0
        shell: bash
        run: |
          set -euo pipefail
          git show v2.0.0:src/missionchief-command-nexus.user.js > /tmp/v200.user.js
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const oldSource = await readFile('/tmp/v200.user.js', 'utf8');
          const newSource = await readFile('src/missionchief-command-nexus.user.js', 'utf8');
          const versionPattern = /^(\/\/\s*@version\s+)\S+(\s*)$/m;
          if (!oldSource.match(versionPattern)?.[0]?.includes('2.0.0')) throw new Error('v2.0.0 source version missing');
          if (!newSource.match(versionPattern)?.[0]?.includes('2.0.1')) throw new Error('prepared source is not v2.0.1');
          const scrub = (text) => text.replace(versionPattern, '$1<VERSION>$2');
          if (scrub(oldSource) !== scrub(newSource)) throw new Error('Runtime differs from v2.0.0 beyond @version');
          console.log('Runtime parity passed: only @version changed in canonical userscript.');
          NODE

      - name: Validate candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for check in scripts/check-*.mjs; do node "$check"; done
          python3 scripts/check_repository.py
          git diff --check

      - name: Push conventional release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release/v2.0.1
          git add src/missionchief-command-nexus.user.js README.md src/README.md CHANGELOG.md
          git commit -m "Prepare v2.0.1"
          git push --force origin HEAD:refs/heads/release/v2.0.1
