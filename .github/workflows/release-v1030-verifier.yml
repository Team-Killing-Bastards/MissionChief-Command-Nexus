# Triggered after workflow registration.
name: Verify v1.0.30 release delivery

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1030-verifier.yml'

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: verify-v1.0.30-release-delivery
  cancel-in-progress: false

jobs:
  verify:
    name: Verify GitHub Greasy Fork and Discord
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Verify complete v1.0.30 delivery
        env:
          GH_TOKEN: ${{ github.token }}
          GREASYFORK_INSTALL_URL: ${{ vars.GREASYFORK_INSTALL_URL }}
          RELEASE_TAG: v1.0.30
          PR_NUMBER: '131'
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${GREASYFORK_INSTALL_URL}" ]] || {
            echo 'GREASYFORK_INSTALL_URL is not configured.'
            exit 1
          }

          RUN_ID=''
          RUN_URL=''
          RUN_STATUS=''
          RUN_CONCLUSION=''

          for attempt in $(seq 1 100); do
            RUN_JSON="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/release-v1030-launcher.yml/runs?per_page=20"
            )"
            RUN_ROW="$(
              jq -c \
                '.workflow_runs | sort_by(.created_at) | reverse | .[0] // empty' \
                <<< "${RUN_JSON}"
            )"

            if [[ -n "${RUN_ROW}" ]]; then
              RUN_ID="$(jq -r '.id' <<< "${RUN_ROW}")"
              RUN_URL="$(jq -r '.html_url' <<< "${RUN_ROW}")"
              RUN_STATUS="$(jq -r '.status' <<< "${RUN_ROW}")"
              RUN_CONCLUSION="$(jq -r '.conclusion // empty' <<< "${RUN_ROW}")"
              [[ "${RUN_STATUS}" == 'completed' ]] && break
            fi

            sleep 15
          done

          [[ -n "${RUN_ID}" ]] || {
            echo 'No v1.0.30 launcher workflow run was found.'
            exit 1
          }
          [[ "${RUN_STATUS}" == 'completed' ]] || {
            echo "Launcher workflow ${RUN_ID} did not finish in time."
            exit 1
          }
          [[ "${RUN_CONCLUSION}" == 'success' ]] || {
            echo "Launcher workflow ${RUN_ID} concluded ${RUN_CONCLUSION:-unknown}."
            exit 1
          }

          JOBS_JSON="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100"
          )"

          RELEASE_JOB="$(
            jq -c \
              '.jobs[] |
               select(.name | contains("Package, reconcile, verify and announce userscript release"))' \
              <<< "${JOBS_JSON}"
          )"
          [[ -n "${RELEASE_JOB}" ]] || {
            echo 'Permanent release job was not found.'
            exit 1
          }
          [[ "$(jq -r '.conclusion' <<< "${RELEASE_JOB}")" == 'success' ]] || {
            echo 'Permanent release job did not succeed.'
            exit 1
          }

          DISCORD_STEP="$(
            jq -r \
              '.steps[] |
               select(.name == "Verify deployment and notify Discord") |
               .conclusion // empty' <<< "${RELEASE_JOB}"
          )"
          [[ "${DISCORD_STEP}" == 'success' ]] || {
            echo "Discord/deployment step was ${DISCORD_STEP:-missing}."
            exit 1
          }

          RELEASE_JSON="$(
            gh release view "${RELEASE_TAG}" \
              --json url,isDraft,isPrerelease,assets,tagName,targetCommitish
          )"
          RELEASE_URL="$(jq -r '.url' <<< "${RELEASE_JSON}")"
          [[ "$(jq -r '.isDraft' <<< "${RELEASE_JSON}")" == 'false' ]]
          [[ "$(jq -r '.isPrerelease' <<< "${RELEASE_JSON}")" == 'false' ]]

          ASSET='MissionChief-Command-Nexus-1.0.30.user.js'
          CHECKSUM_ASSET="${ASSET}.sha256"
          for required_asset in "${ASSET}" "${CHECKSUM_ASSET}"; do
            jq -e --arg name "${required_asset}" \
              '.assets[] | select(.name == $name)' \
              <<< "${RELEASE_JSON}" >/dev/null
          done

          rm -rf /tmp/v1030-release-check
          mkdir -p /tmp/v1030-release-check
          gh release download "${RELEASE_TAG}" \
            --pattern "${ASSET}" \
            --pattern "${CHECKSUM_ASSET}" \
            --dir /tmp/v1030-release-check \
            --clobber
          (
            cd /tmp/v1030-release-check
            sha256sum -c "${CHECKSUM_ASSET}"
          )

          git show "${RELEASE_TAG}:src/missionchief-command-nexus.user.js" \
            > /tmp/v1030-expected.user.js
          cmp --silent \
            /tmp/v1030-expected.user.js \
            "/tmp/v1030-release-check/${ASSET}"

          URL_SEPARATOR='?'
          [[ "${GREASYFORK_INSTALL_URL}" == *'?'* ]] && URL_SEPARATOR='&'
          GREASY_OK='false'

          for attempt in $(seq 1 60); do
            CACHE_BUSTER="$(date +%s)-${attempt}"
            CHECK_URL="${GREASYFORK_INSTALL_URL}${URL_SEPARATOR}mc_release_check=${CACHE_BUSTER}"

            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 2 \
              --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "${CHECK_URL}" \
              -o /tmp/v1030-greasy.user.js; then
              if cmp --silent \
                /tmp/v1030-expected.user.js \
                /tmp/v1030-greasy.user.js; then
                GREASY_OK='true'
                break
              fi
            fi

            sleep 15
          done

          [[ "${GREASY_OK}" == 'true' ]] || {
            echo 'Greasy Fork did not reach exact v1.0.30 source parity in time.'
            exit 1
          }

          RELEASE_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
          CHECKSUM="$(sha256sum /tmp/v1030-expected.user.js | awk '{print $1}')"

          cat > /tmp/v1030-release-receipt.md <<EOF
          ## v1.0.30 release verified

          - GitHub release: published and final
          - GitHub assets: userscript and SHA-256 verified
          - Greasy Fork: exact v1.0.30 source parity confirmed
          - Discord: deployment notification step succeeded
          - Release workflow: ${RUN_URL}
          - Release page: ${RELEASE_URL}
          - Source commit: \`${RELEASE_SHA}\`
          - SHA-256: \`${CHECKSUM}\`
          EOF

          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/v1030-release-receipt.md
