name: Apply live trained personnel display v1.0.81

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.v1081-apply-trigger'
      - '.github/builders/apply-live-trained-personnel-display-v1081.py'
      - '.github/builders/fix-live-trained-personnel-regressions-v1081.py'
      - '.github/workflows/apply-live-trained-personnel-display-v1081.yml'
  push:
    branches:
      - fix/trained-personnel-live-missing-v1081
    paths:
      - '.v1081-apply-trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/trained-personnel-live-missing-v1081
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply live Missing Personnel display
        run: python3 .github/builders/apply-live-trained-personnel-display-v1081.py
      - name: Align on-scene authority regression
        run: python3 .github/builders/fix-live-trained-personnel-regressions-v1081.py
      - name: Validate complete candidate
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node scripts/validate-userscript.mjs
          for test in scripts/check-*.mjs; do
            echo "Running ${test}"
            node "$test"
          done
          python3 scripts/check_repository.py
          git diff --check
      - name: Commit validated permanent changes
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add src/missionchief-command-nexus.user.js README.md src/README.md CHANGELOG.md scripts/check-*.mjs
          git commit -m 'Display live Missing Personnel in Trained Personnel panel v1.0.81'
          git push origin HEAD:fix/trained-personnel-live-missing-v1081
