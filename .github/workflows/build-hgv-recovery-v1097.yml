name: Build HGV Recovery v1.0.97

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-hgv-recovery-v1097.mjs'
      - '.github/workflows/build-hgv-recovery-v1097.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build v1.0.97 hotfix
        run: node scripts/build-hgv-recovery-v1097.mjs
      - name: Validate generated userscript syntax
        run: node --check src/missionchief-command-nexus.user.js
      - name: Run v1.0.97 HGV regression
        run: node scripts/check-hgv-recovery-v1097.mjs
      - name: Run userscript validator
        run: node scripts/validate-userscript.mjs
      - name: Show generated diff
        run: git diff --check && git diff --stat && git diff -- src/missionchief-command-nexus.user.js scripts/check-hgv-recovery-v1097.mjs scripts/check-towing-recovery-crossref-v1096.mjs README.md CHANGELOG.md
      - name: Commit generated hotfix
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/missionchief-command-nexus.user.js scripts/check-hgv-recovery-v1097.mjs scripts/check-towing-recovery-crossref-v1096.mjs README.md CHANGELOG.md
          git commit -m 'Fix shared towing matcher and route HGV recovery'
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
