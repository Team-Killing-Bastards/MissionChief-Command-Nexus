name: Build validated v1.0.30 open issues batch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-v1.0.30-open-issues-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    name: Apply and validate all six issue fixes
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-open-issues-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          show-progress: false

      - name: Reconstruct and verify pending patch
        id: detect
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_B64_SHA256: 04cccfd5a3ac4b8daf392dad1f1818ee7074df30a2a3ee52ffee4371075da6ce
          EXPECTED_PATCH_SHA256: 296d639b5ebc1bb2a83c23842303fec9dcddbec6222b892ee1056e67db9f5dc2
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_BRANCH}" --force

          PART_PREFIX='.diagnostics/v1.0.30-open-issues.patch.gz.b64.part-'
          if ! git cat-file -e "origin/${HEAD_BRANCH}:${PART_PREFIX}00" 2>/dev/null; then
            echo 'apply=false' >> "${GITHUB_OUTPUT}"
            echo 'Validated source has already replaced the diagnostic branch.'
            exit 0
          fi

          : > /tmp/v1030.patch.gz.b64
          for suffix in 00 01 02 03 04; do
            git show "origin/${HEAD_BRANCH}:${PART_PREFIX}${suffix}" >> /tmp/v1030.patch.gz.b64
          done

          echo "${EXPECTED_B64_SHA256}  /tmp/v1030.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/v1030.patch.gz.b64 | gzip --decompress > /tmp/v1030.patch
          echo "${EXPECTED_PATCH_SHA256}  /tmp/v1030.patch" | sha256sum --check
          echo 'apply=true' >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        if: steps.detect.outputs.apply == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply exact v1.0.30 patch
        if: steps.detect.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/v1030.patch
          git apply /tmp/v1030.patch
          git diff --check

      - name: Validate complete repository
        if: steps.detect.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check src/missionchief-command-nexus.user.js
          node --check scripts/check-open-issues-batch.mjs
          node scripts/validate-userscript.mjs
          node scripts/validate-userscript.mjs --base-ref origin/main
          node scripts/check-ios-compatibility.mjs
          node scripts/check-runtime-hardening.mjs
          node scripts/check-police-irv-fallback.mjs
          node scripts/check-ios-unit-finder-selection.mjs
          node scripts/check-ios-mission-requirements-source.mjs
          node scripts/check-iphone-mission-ui.mjs
          node scripts/check-open-issues-batch.mjs
          python3 scripts/check_repository.py
          git diff --check

      - name: Replace diagnostic branch with validated source
        if: steps.detect.outputs.apply == 'true'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name MartyBlyth
          git config user.email 32400596+Martyblyth@users.noreply.github.com
          git add -A
          git commit -m 'Fix current MissionChief issues batch'
          git push --force origin "HEAD:refs/heads/${HEAD_BRANCH}"
          COMMIT_SHA="$(git rev-parse HEAD)"
          gh pr comment "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "v1.0.30 source commit \`${COMMIT_SHA}\` passed the complete repository validation suite."
