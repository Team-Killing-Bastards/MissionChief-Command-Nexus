name: Bug report
description: Report a reproducible defect in MissionChief Command Nexus
title: "[Bug]: "
labels:
  - bug
assignees:
  - MartyBlyth
body:
  - type: markdown
    attributes:
      value: |
        Report one reproducible problem. Remove account IDs, tokens, webhook URLs, private alliance information and personal data before submitting. For sensitive security issues, use the private security policy instead.

  - type: input
    id: version
    attributes:
      label: Command Nexus version and commit
      description: Enter the userscript version and, for development builds, the commit SHA.
      placeholder: e.g. 1.0.1 / abc1234
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: MissionChief domain
      options:
        - www.missionchief.co.uk
        - police.missionchief.co.uk
        - Other or unknown
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser, operating system and userscript manager
      placeholder: e.g. Chrome 150, Windows 11, Tampermonkey 5.x
    validations:
      required: true

  - type: textarea
    id: other_scripts
    attributes:
      label: Other enabled userscripts
      description: List scripts that may interact with the same mission, vehicle or interface elements. State whether the defect remains with unrelated scripts disabled.
      placeholder: Script name and version, or None
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Potential impact
      options:
        - Display or documentation only
        - Selection is incorrect but nothing was submitted
        - Could dispatch or submit the wrong mission action
        - Could rename, assign or modify the wrong resource
        - Could corrupt or lose stored settings or training data
        - Performance, duplicate UI or background-work growth
        - Unknown
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Affected workflow
      description: Identify the mission, station, vehicle, training profile, automation mode, queue or transport workflow involved.
    validations:
      required: true

  - type: textarea
    id: starting_state
    attributes:
      label: Starting state
      description: Record relevant selected vehicles, patient count, stored-data/migration state, active automation and whether legacy scripts were disabled.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide exact numbered steps that reproduce the problem on the smallest safe scope.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: stop_recovery
    attributes:
      label: Stop, recovery and repeatability
      description: State whether Stop worked, whether reloading changed the result, whether the action repeated, and how you recovered safely.

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Add console output, screenshots, mission requirement rows or other evidence. Remove private information first.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Validation
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed private account, alliance, token, webhook and session information.
          required: true
        - label: Both legacy standalone scripts were disabled while testing Command Nexus.
          required: true
        - label: I tested with unrelated userscripts disabled where practical.
          required: false
        - label: I did not repeat a potentially destructive test beyond the minimum needed to reproduce it.
          required: true
